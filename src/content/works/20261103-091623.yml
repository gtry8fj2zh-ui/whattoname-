      今天早些时候，Monika打来电话。
      ——我有钱了。我买了一个大房子，大家都能住进来。
      我回了她一句“嗯”——我不知道她在想些什么，如果她有钱了，她怎么不先做点别的什么事情，比如给Dorli买点东西，或者拿这笔钱来把她积压的专辑都发出去？后来她又滔滔不绝地说了些什么，不过我没听进去。我家里的座机是象牙色的，摆在面向街道的通透明亮钢架窗户前，打电话时就能透过它看见窗外的街道，我很喜欢。所以在Monika喋喋不休地讲着她的计划时，我只是用手指在电话线圈中不断地穿梭着，看着窗外街道上来往的人群发呆。
      “所以——”Monika激动的演说终于停了下来，在电流声的滋滋作响中我回过了神。我一边拉上窗帘一边想着该怎么应付她，毕竟我根本不知道她想要我说什么。
      “你有钱了？”——所以这是我经过我再三的思虑后说出的话，又或者只是我的大脑犯了懒罢了工，才会说出这种不经过大脑的话。
      然后Monika诡异地安静了好一会，才接连强调了好几句她有钱了——还是她会有钱的？我没听清，总之这次我终于听清了她问的问题。她问我想要一个什么样的房间。
      “房间？”我反问，这真是一个奇怪的问题，我有自己的房子啊，和Wolfgang，要再去想象我还会和别人有另一个房子似乎是很奇怪的，即使对方是我自己的妹妹，我们曾经一起有过另一个房子，“我有自己的房间。”
      “我知道，我是说，你现在还会有另一个房间，你想要什么样的？”Monika说得很慢，我几乎能想象她在电话另一头边说话边微微向前俯身的样子，就像我们小时候把家里的留声机撞倒被母亲问责时她放缓了语气告诉我们这个行为有多不得体一样。
      “我是说，”我也不自觉放缓了声音，“我已经有一个房子了，你不用这么做。”
      “我不明白。”听着她的声音我莫名感到烦躁——大概是因为我也不明白吧。Wolfgang马上就要回家了——又或者他今天有他的法学聚会，我不记得他有没有来过消息了。
      “Evi呢？”问这句话的时候我已经放弃了站在窗前——天知道这通电话还要持续多久，但我也没有坐在椅子上，而是就地坐了下来。没关系的，我安慰自己，我昨天才打扫了卫生，这地板并不脏。
      “她说她要住在一楼离车库最近的房间，这样方便她开车接送任何要离开或者回来的人——你知道的，她的新驾照。”
      我笑了：“她小时候也老喜欢躲在一楼的储藏室里，你还记得吗？”然后我不记得Monika回了什么，只记得接下来自己突然之间的滔滔不绝。
      我告诉Monika昨天晚上我梦见自己变成了一个孩子。我在我家里的双人大床上醒来，却以为我正在老家母亲的房间里。我翻身下床，看见床头柜上摆放的家居杂志和时尚杂志，我便更确定了。但是我没有听到留声机里放的舞曲，也找不到她们两个。
      在梦里，我只是一直在这个房子里游荡，走着走着，我突然觉得很高兴，于是便跑了起来。然后Eva从客厅的窗户外朝我招手，我立马打开窗子翻了出去，碰倒了橱柜上的留声机。梦里的街道上只有我们三个人。她们两个牵着我的手不停地迎着刺眼的阳光跑啊跑，我突然觉得有什么东西从我身体里掉了出来，但我回过头去看时，身后只有白纱一样的阳光，风吹过就荡起湖水一样的波纹。
      但我们没有往回走，仍然不知疲倦地奔跑着。我说我们身后应该有个东西吧。Monika问我是什么东西，是风筝吗？Eva则说是我总是带着的布娃娃吧。我摇头，说我不知道是什么东西，但感觉身体好像轻了很多。
      那就不管了吧。这样想着，这个梦就结束了。我怀疑听筒对面的Monika已经睡着了，或者更过分的——她已经悄无声息地把电话挂断了。不过好在她在我质问之前就出了声。她反问我然后呢。
      “然后梦结束了，我醒了。”我耐着性子重复道。我又开始往手指上缠电话线，用脚尖把窗帘踢开一个缝，看着已经开始落下的太阳——这就是为什么我喜欢这个窗户。
      “好吧，但在我知道你想要一个什么样的房间之前我是不会挂断这个电话的。你现在住的房间怎么样？”
      “照搬还有什么意思？”我也不知道我当时说这句话是什么意思，但在我意识到我脱口而出了什么之后，我忙说，“好吧好吧，我想要一个普通的房间就好，好吗Monikind？”
      “普通的房间？”
      我迟疑了一下，才说：“普通的房间，有一扇普通的窗户，普通的朝向，普通的墙壁和天花板。普通就好。”
      “可是Helga，我不明白什么样的才是普通。”
      我更不明白她为什么非得问得这么清楚。
      不过什么样的才是普通？像我这样的普通人所能拥有的——这样的念头出现在我的脑海中。像三口之家，在丈夫下班后和他共进晚餐这样普通的生活一样的，普通。
      “呃，Helga？你还在听吗？也许你应该去吃晚饭了。”
      我耸耸肩，即使Monika并不能看到这个动作，但这只是我掩饰不自在的习惯性动作。“Dorli还好吗？”也许Monika的意思是她也要去吃晚饭了，但我那时没有放她去。
      “她很好，刚刚吃了玉米糊。”Monika的声音柔和下来。
      我含糊地回应着，不知道自己为什么要提到她。我接着问Monika自己想要一个什么样的房间。她告诉我她想要在顶楼的房间，还要带一个露台，落地窗的朝向要……床的尺寸要……地板的纹样要选……天花板要……她又开始喋喋不休，而我一个字也没听进去。然后她问我：“不如就按你老家的房间里那样，怎样？”
      “老家的房子？”
      “就那样布置，我记得你不是挺喜欢它的吗？小时候你还花了不少时间布置它呢。”
      我几乎是下意识地否决了这个提议。“可是现在早就已经不流行那样的房间了。而且，这样不会太敷衍吗？”我这样解释，然后在Monika继续追问之前挂断了电话。
      那是太阳已经完全落下去了，我没有在打电话前打开电灯，所以在挂断电话之后整个房子里唯一的亮光只有从窗帘的一点点缝隙中透进来的街道上的灯光。我拿出冰箱里的肉丸加热，在等待加热的间隙开始烤土豆，而我脑海里的想法就像平时做家务时哼的歌一样流出来。
      我的房间要在二楼的最外面，只用一个明亮箱式窗就足够，我喜欢布艺的单人床，摆在窗边，我不在乎地板的纹样，反正我会在我的房间里铺上一个柔软的长毛地毯，尽管母亲会向我抱怨这并不好清理，天花板要足够高，四米吧，我想。
      然后我将给Wolfgang的那份肉丸和土豆和我吃了一半的晚饭随手放好，像我在昨晚梦里做的那样在空旷又安静的房间里漫无目的地走着。我还是没有开灯，又为我的小家剩下一笔可贵的电费。然后我越走越快，快到几乎要飞了起来，我想起来小时候我和Nika和Evi聊我们的未来，我告诉她们我要住进什么样的房子里，我会学会什么菜式，我的丈夫，我的爱情和婚姻，我的孩子。她们说我想得太细了，我则反驳她们想得太不仔细了。然后我们一起躺倒在午休时没人的舞蹈教室地板上，就像我现在独自躺在这间房子的地板上。
