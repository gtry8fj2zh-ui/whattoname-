summary: 我说苦难孕育优美的文字。他说我真是个三流作家。
chapters:
  - body: |-
      序
      亚历山大·维克托罗维奇·阿伯特请求我为他的这本手记写一篇序。
      我说可是我根本就不知道该怎么写呀。他却说这都不要紧，只要我留下些文字就好了，实在没头绪的话，就这样写：亚历山大·维克托罗维奇·阿伯特请求我为他写一篇序。
      总之，我已经到此一游了，想来已经完成了大作家交与我的任务。
      其实老实说，这本手记应该叫“阿伯特和库里克手记”才对，原因是显而易见的——您接下来要看到的那些文字是属于我们两人的。
      我与萨莎相识在柬埔寨的一场独自旅行中。那时我正坐在某一棵有着巨大根系的卡波克树下写生，在这绞杀榕的荫蔽下，热带午后难捱的热气也变得宁静了许多，就连虫鸟的嘈杂声都仿佛无法触及我的耳畔。我惯常地很享受这种时刻——直到我发现在我一直信手描绘着的金合欢边多了一个人，他正用一双有着孩童般天真的大眼睛看向我。我也眯起眼睛回望过去，因为我分不清梳在他头顶的是阳光还是他的金发。然后他快步向我走来。真有趣，当洒在他头顶的阳光被树荫遮去之后，他柔软的头发就变得像夜晚的湖水一样了。他告诉我他正在写一本手记，希望我不会感到冒犯。
      那时的我大概还没从这突然的变故中反应过来，大脑凝固宛如这炎热潮湿季节中缓慢蠕动的空气。“我为什么会感到冒犯？”我问他。他眨了眨眼，从皮肤里渗出的汗珠由着一种并不明显的兴奋抖擞着颤颤巍巍地融进空气里。
      他说：“因为您将会成为这本手记中不可缺少的一部分。”
      我也眨了眨眼，抛出一个没有意义的反问——是吗？——然后继续低头用铅笔在素描本上扫着那株金合欢，使它变成了您在这本手记的封面所见到的那株金合欢的样子。

      库里克
      写于1999年12月

      01
      我租了一辆自行车，在这闷热的异国漫无目的地闲逛着。我正要去见我亲爱的伊柳沙，我不知道他在哪里，所以我打算在这自行车上骑遍这暹粒市。
      我们相识于昨天，不知道是否会在今天和往后的日子中相见。我们只是两个在这离乡千里之外的异域猝然相遇的同乡人，依着对方身上即使在这暑气蒸腾的热带也无法完全消散的凛冽寒气辨认出来。我们互通了名字，这就是我所知道的全部。而现在我要靠着这全部来赴这场并未约定好的会面。
      伊柳沙会在哪儿呢？
      我经过一个手工集市，各色的手工艺品和纹饰各异的布匹，展台下铺着的镶着金丝的深色丝绒步和挂在门头写着各式花体字的告示板，都一齐暴露在苍白的日色下。在白得单调的天光之下，地面上这些艳丽的颜色显得十分吵闹。伊柳沙会在这里吗？
      我在路边锁好车，拐进这条头顶着藤条彩旗的小巷。我信步在其中穿行着，耳边时不时传来几声摊主或热情或随意的吆喝声，时而隔着橱窗看着室内陈列的高棉雕饰，时而盘玩着街边小铺上的串珠。
      我一边迎着烈日向前走，一边想着伊柳沙来过这里吗？他会怎样来这呢？诚然，我对他的了解只有名字、和我相仿的国籍、和对于他职业的猜测。但我仍然饶有兴致地在脑海中一遍遍推演着那个画家可能的行为轨迹。他也许会带着他那小巧的素描本，坐在某一处受阴凉庇护的长椅上，眯着眼睛在本子上工笔描下那些工艺品的样子。也许会有热心的摊主用口音浓重的英语向他展示自己跟前的陶瓷摆件，蓝色绿色黄色的象形瓷器在阳光下盈盈地在他面前一闪又一闪。他也许会抿着嘴拒绝，又或是慌乱地摆手？说不定他会乖巧地付钱呢，他看上去像是那种害怕麻烦缠上自己的人。
      这样想着，我扭头回应了摊主的叫卖声，从展台上挑拣出一个和伊柳沙一样躲在阴影下的翠蓝色小象，将它带在了自己身上。
      但是显然伊柳沙并不在这里，于是我只得又一次启程了。
      我骑着自行车在街上飞驰，经过了一个又一个按摩馆。也许这样的室内会受到伊柳沙的偏爱吗？但这个念头只在我的脑海中闪过一瞬便像戳破了的肥皂泡一样很快消散了。我想象不出那个总爱绷着脸的伊柳沙乖顺地趴在那些织着几何花纹的床单上放松身体任由那些轻巧有力的手松松这块肌肉拉拉那块筋骨的样子。事实上，我想象不出那个伊柳沙任何放松身体的样子。他是一具西伯利亚的坚冰冻土塑出来的身子，好像即使触碰到他人温热的掌心也无法被融化、变得柔软——即使我知道他当然会，但我一想到要触碰他，就感觉像一块干冰被扔在了空气里，滋滋作响着往外泻云吐雾。
      伊柳沙不会在这里。风在我耳边猎猎作响的时候这样告诉我。我的大脑像我此刻踩着自行车踏板顺着一个小小的下坡一样向着某个方向狂奔着，跑过热带城市灼热得像铸铁锅的柏油路、淌过远处雪山脚下清冽的泉水、登上云层之上的山巅、跳进南极冰川之下的大洋中……我的大脑这样不知疲惫地跑遍了每一个角落，终于惊喜地叫嚷起来，对我自己说，我真是个蠢货，伊柳沙还应当在我们昨天见面的那个地方呀——吴哥窟的某棵榕树下。
      那么我应该现在就去那儿找他，但我的大脑不知又跑到哪个迷宫中去了，它使我的手把着车把一扭，我绕了个远路。我经过了一个公园，便开始想象那树荫下的长椅上坐着伊柳沙，正一边用一块红白格子布的手帕擦着汗，一边不动声色地看着来来往往的人群。我经过了一个冰淇淋店，便想象在那被风雨侵蚀掉原本鲜艳色彩的砖红门头下，伊柳沙正一点点地将冰淇淋抿化在唇间，他会吃什么味道的雪糕呢？香草或是巧克力这种太过腻口的口味看上去不会得他青睐，也许他会选择清凉的香茅柠檬吗？我经过了一个公共巴士站台，一两排掉了漆的铁质长椅像冒出土的蘑菇挤在同样掉了漆、显得有些老旧的遮阳挡雨板下可怜的一小块阴影中。即使这样，我还是能感觉到在经过它们时，我身边拂过一阵热浪。伊柳沙大概是不会坐在那上面的，也许他会在难得的阴影下躲避这一时过于热烈的阳光，一边反复确认手中反复的交通笔记，一边时不时抬头以确保不错过下一班车。
      伊柳沙，伊柳沙，伊柳沙……
      我现在明白我的大脑的用意了，在它带着我的身体几乎骑过整个暹粒市之后，我横冲直撞地一路往北骑向那神妙的建筑群。现在我满脑子都是伊柳沙——他画画的样子、伸出舌头舔去嘴角残留的食物残渣的样子、用手帕擦去汗珠的样子、站着的样子、坐着的样子、笑着的样子、严肃的样子……如今整个城市都是这个来自遥远国度的外乡人的身影，即使这些身影不过是我虚幻的想象——然而我的想象却像一头巨大的大象，缓慢又不容置喙地用自己的鼻子将面前的食物卷进嘴中，如今它像气球一样涨大了，摇摇晃晃飘飘然游荡在空中，只需针刺便会爆炸，而现在我要去找到那根针。
      我的“针”安静地坐在吴哥窟深处的女王宫前。我脚步虚浮地向他走去——我该怎样控制住自己的激动？我要戳破这一切的虚幻。
      嗨，我听见自己这样说。库里克先生——我这样称呼他，即便我吵嚷跳脱的大脑已经毫无礼貌地用“伊柳沙”叫了他整整一天。
      伊柳沙从那些繁复的红砂浮雕中转过头来，我注意到他没有带昨天那本素描本。
      您上哪儿去了？太阳快要落下去了，阿伯特先生。您怎么现在才来？他问我的语气像是有一块木板压在他舌头上，让我想起小时候在诊所看病时医生总是用来压住我舌根的那两根棉签。
      我去找我的写作灵感了。我耸肩对他说，您知道的，我是个作家。
      您看上去倒像是去受苦了。他反唇相讥。
      我大剌剌地抬起手臂，用宽大的袖子将脸上的汗抹掉。有些汗珠因此滚进我的眼睛里，搅起一阵刺痛，于是我又用力搓了搓眼睛，试图把所有的痛觉从中挤出去。
      您需要手帕吗？伊柳沙问。
      我摆摆手，抬起头来面向太阳的方向重新睁开眼睛，寄希望于让灼热的日光蒸发掉那些汗水和它们带来的痛苦。但现实是我分不清是光线的烧灼让我的眼睛更痛了，还是薄于西山的夕阳根本就不起作用。我还是接过了他已经递出来的手帕——红白格子布，我低声嘟囔。
      什么？
      什么都没有。我一边抻开那方手帕轻轻摁压在我眼睛上边说。我只是说，苦难孕育优美的文字。
      他轻哧了一声，声音从我脚边的台阶上传来，朝向和我正望着的相同的方向——是的，我正在那片柔软的手帕后像偷窥似的望向远处变换着的光影。我能想象桔红色的云彩在经过这红色白色的方块之后变成了我面前愈发深重的红色，太阳在我面前落下了，伊柳沙在我脚边笑着说我真是个三流作家。

      02
      你知道吗？也许你应该上我家坐坐，萨沙。
      在我们已经亲密到能够以“萨沙”、“伊柳沙”相称之后的某一天，他突然这样对我说。
      你家？我反问。
      我住的地方。伊柳沙棕色的眼睛认真地看着我，纠正说。
      我移开正摊开盖在我面上的手记本，逆着太阳光线朝上看去。伊柳沙依然是我刚躺下时那副模样，铅笔在素描本上沙沙扫过，时而抬眼看看面前倒塌的浮雕砖块，时而低眉监督着自己手上的动作，就好像他从来没有发出过那句邀请一样。我从他腿上坐起来，从他铜墙铁壁一般的姿势中找出一个破口，从他肩颈间的缝隙处探出脖子，看他画本上的内容。伊柳沙警觉地扭过头来，我们的呼吸都融在一起。
      他眨了眨眼，呼出的湿热气体黏在我脸侧。上我那儿去吧，萨沙，就现在。他再一次说。
      现在？离落日还有一会儿呢。我说。我从来没见过伊柳沙在太阳落下前离开过这里。
      是的，没错。就是现在。伊柳沙站起身来开始收拾他的画具——其实他带的东西少得可怜，几乎只有一个马扎、一把今天还没来得及撑开的阳伞、几支铅笔、一个橡皮、和一本十六开的小画本。但是他的动作却很慢，一会抓起这把伞，一会又放下它把马扎夹在肩下。他一边慢腾腾地收拾着，一边居高临下地看着仍坐在地上的我，问我，是走、还是不走。
      我抬头看他，即使接近正午时分的刺眼的阳光落在他的背后，让躲在他身下的我只看得到一片黑影。但我抬头看他，不知道哪只眼睛看到了他绷紧的嘴角和微皱的眉头。
      我立马从地上站起来，拍拍屁股上的灰，从他的身下跳出来，让我得以看清楚他深色的眼睛和亚麻色的发丝上结出的汗珠。
      走，当然走！我对他说。
      于是他一手夹着阳伞，一肩挎着装着那小本子和铅笔的墨绿色帆布包，还匀出一只手来抓住我的手腕，带着我在这座城市的大街小巷里穿行。深灰色的沥青路面本是冷色，却因着它反射的白茫茫的日光变成了火热的一片海，我和伊柳沙就像赤脚行走在沙漠上的人一样用脚尖飞快地掠过这有些粗粝的滚烫路面——像用脚在路面上弹琴一样。我笑了起来。牵着我的手引我踩下下一个音符的伊柳沙一边熟练地躲避着飞驰而来的摩托车一边回头问我在笑什么。于是我将我关于我们的步伐的比喻告诉他。他转过头去，带着我从横冲直撞的车流中飞奔向对岸，亚麻色的头发在空中绽开一朵花。在发丝旋转之际，他的声音穿过车水马龙，不知怎的，明明是朝前的大喊，却拐了个弯来到了在他身后的我的耳畔。
      我倒觉得更像踩水坑。他说。
      而等到我们穿过一道道窄巷长街，推开一扇扇油漆斑驳的门，不知走了多少级楼梯终于抵达伊柳沙口中“他的家”之后，屋外竟像应和了伊柳沙的话一样真的下起了瓢泼大雨。我惊讶地看着他，问他，他不会是守护东南亚的雨神吧？伊柳沙没礼貌地朝我翻了个白眼，走到窗边将窗台上的绿植搬到屋内的桌子上，然后用力合上窗棂，动作娴熟得像是一个在此久居的人。
      你在这儿住了很久了吗？我问。直到这时，我才意识到我们从来没有问过对方这个问题，或者是“你为什么跑到柬埔寨来？”、或是“你在这儿做什么？”这类总是被在异乡刚刚相识的人们挂在嘴头的问题。即使我们已经一起渡过了漫长的日子——在这些漫长的日子里我们已经可以自然地用自己的手去牵对方的手、邀请对方上自己的房间里待着、不以全名或是姓氏相称，但我们都从未提起过这些问题，就好像我们不约而同地跨过了一条河流，仿佛它从未存在过。但也许因为地球是个球形，我们终于还是又遇见了这条河，于是这次我这样问。
      不过当后来的某一天我向伊柳沙提出我这个想法时，伊柳沙思索良久，然后有些郑重地说，他觉得这并不是同一条河流。如果在见面的第一天我就那样问他，一定不会得到后来的这种答案。——那你那时会怎样回答呢？我问。他又眯起眼睛，陷入思考中，然后摇了摇头说他不知道，也许只是敷衍的“来这里画画”之类的回答。
      总之，话说回来——在噼里啪啦的雨声下，我第一次来到了伊柳沙在暹粒的居住地，我问他：你在这儿住了很久了吗？
      伊柳沙正坐在桌子边的布艺沙发上仔细打理着他刚从雨下收回来的那株盆栽。他从他的盆栽上分出点神来，想了片刻说，两个月吧，算很久吗？
      我摇摇头，我也不知道怎样才算得上是“很久”。于是我又在毫不示弱的雨声下问他，他在这儿做什么？
      然后他好像是终于放弃了摆弄那株看似细弱但显然没有受到这突如其来的大雨影响的绿植，告诉我他在辞职前一直与一个科普系列丛书有着合作关系。“大概就是我给他们的文字配插图”——他这样解释。后来那家公司找到了另一个要价更低的插画师，希望能够以此压低他原本的薪资。伊柳沙拒绝了，于是他就来到了这里。
      等下，什么叫“于是”你就来到了这里？我不得不打断他的叙述，以保证我没有错过任何一条信息。
      伊柳沙的语气变得有些不耐烦了起来，我猜是因为窗外的雨声太过于嘈杂，但他还是向我解释说，他不想为了一个职位和别人争得头破血流——“这样看起来很掉价”，于是他辞职了。当时他正在准备吴哥窟部分的插图，便一拍脑门决定干脆来实地看看，这老家伙到底是什么样子。于是他每一天都往那儿钻，他要画遍所有那些松塔型高耸着的塔楼、所有倒塌的碎石砖块、所有生动的浮雕、所有冒出地面的绿芽和所有垂下巨膀的榕树……他要画下所有。
      那你呢？你来这儿做什么？伊柳沙反过来问我。
      谁知道呢？我说。也许是来找你吧。
      伊柳沙一听便沉下脸来，拍开我正伸去碰那绿叶子的手，皱着眉眼见就要有将我赶出门去淋雨的架势。我忙矮下身子赔笑说，我是个没名气也没能力的作家，没有只见着图片就生动地用文字描绘出一个地方的能力，所以我要在柬埔寨写下一个柬埔寨的故事。
      是个什么样的故事？他问。
      我摇头，说那只是一个烂俗的爱情故事。两位主角相遇在某棵树下，最后又分别在一场雨中。
      听起来和我们很像。伊柳沙发出哧哧的笑声，边笑边伸出两根手指颇优雅轻快地从面前靛青色的陶瓷盘子中拾起一粒饱满的葡萄，轻掷入口中。他的手指掠过盘边翠蓝的波纹式样花纹就像水鸟的羽翼掠过湖面，我看得有些入了迷，以至于都忘了回话。
      等我回过神来，屋外的雨声已经小了不少，伊柳沙温暖的棕色眼睛在柔和下来的雨声中定定地望向我，带着一些说不清道不明的情绪。我的目光扫到立在房间角落的黑白格子长柄伞，但我们都不约而同地忽略了这物件的存在，默契地对此避而不谈。
      雨还没停呢。他说——我注意到他嘴角还漾着葡萄清甜黏腻的汁水，又或者只是葡萄的香气太有侵略性，迷惑了我的大脑？
      时间如此漫长啊。说着，我从葡萄串上摘下一粒紧实青涩的在指尖把玩。
      伊柳沙眉毛一挑，轻巧地从我手间夺过那粒果实，顺手便将其放入自己口中。我被他突如其来的举动惊得僵在原地。我们可以这样将对方握过的食物如此自然地放入自己的口中吗？我们可以这样将那可爱的果实表面也许沾染上的我身体的气息也一起卷入自己的体内吗？我们可以这样在异国的雨天、当雨水将整个城市冲刷成乌有只剩下这一方藏身之处时、当雨水也似乎要将我们淹没时、像这样平静地取走那在我手中淌过千万条掌心的河流的绿莹莹的葡萄，用你的舌齿将它的汁水挤压，充盈你的整个口腔吗？伊柳沙，我们可以吗？
      那就闭上眼睛吧。伊柳沙突然说——依然带着葡萄的清香。
      闭上眼睛，将目光从现实中移开一会儿。做一个怠工的看守吧，不要时时刻刻都如此警觉地监管着你面前这巨大的时间沙漏。只消一会儿，萨沙，你漫长的时光便会被偷走。
      于是他拉上了房间的电灯，原本颜色跳脱的房间一瞬之间便变成了巨大雨幕般的灰白色。我却不肯依他所说乖顺地闭上眼睛，他也如此，我便明白我们之中没有任何一人愿意放任那漫长的时间不翼而飞。
      伊柳沙，我突然开口，嗓音沙哑犹如在沙漠中行走多时的可怜人，我可以将您叫作伊柳什卡吗？我可以吗？
      说完，我突然闭上了眼睛，不知道偷偷溜走的时间是否有看在我曾经是个如此恪尽职守的守卫者的份上，依然排着队好好地一个个走在离我而去的路上，又或许它们大喊着“这烦人的家伙总算放过我们啦，大家快跑吧！”便一溜烟地跑走了。但不知道流过了多少时间之后、也不知道天空流过了多少雨水之后，窗外的雨似乎终于停了，即使传来数声响彻天际的鸟鸣声，我也觉得身边仿佛万籁俱寂。与此同时，在我紧闭的眼睛之上，一双柔软的唇轻轻扫过了，在那里留下一个濡着葡萄香气的浅痕。
      我睁开眼睛，伊柳沙坐在我面前的桌子上，原先摆放着葡萄的瓷盘被推到了一遍，在桌子上留下一串晶莹的水渍。
      我又伸手摘下一颗葡萄，直接放入口中，粗暴地将它在我口中撕裂，甜腻的汁水冲击着我的口腔，果肉在囫囵中不明不白地被吞食入腹，我迫不及待地探身向前，将伊柳什卡拽入我葡萄味的吻中。

      03
      在我离开柬埔寨的前一天傍晚，我约伊柳沙在离他住处不远的一家冰饮店中见面，打算将我先前在本地集市中买下的那一匹蓝色陶瓷象送给他。我选了一个正对玻璃店门的位子，面前的第四个冰淇淋碗已经见底。草莓、香草、优格、巧克力——我看着已经被淌得黏腻腻的五颜六色的塑料碗，莫名觉得有些反胃。下一个选什么呢？我含着塑料勺抬起头，正思索着，便看见那位有着柔软亚麻色头发的伊柳沙推开玻璃门，前来赴约了。彼时门外的落日余晖还未散尽，给他镀上了一层橙粉色的柔光。
      他径直走向冰柜，往冰柜最边上指了指，过不多时，便拖着一碗浅黄白色的冰淇淋朝我走来。
      选了什么口味的？我问他。
      柠檬。伊柳沙用塑料小勺将软塌的冰淇淋尖部剜起，送入口中。嗯，还有香茅的味道呢。他发出有些惊喜的感叹。他又连着尝了好几口，才想起来对面还坐着一个我。于是他一边挖下一块递给我一边问：萨申卡，你找我什么事？
      我撑着桌子俯身向前，衔住那柄泛着寒气和柠檬香味的透明勺子，等着上面盛着的冰淇淋慢慢被我含化成一滩粘稠的液体。等它们悉数流尽了、勺尖只剩下无味的凉意，我才依依不舍地将身子撤走，告诉他，我明天早晨太阳一升起就要乘火车往内陆走，去泰国。
      嗯，是吗。伊柳沙不动声色地拧转手腕撤回那把塑料小勺，埋头不断地用它翻拌着剩下的一大半冰淇淋。我看着他的动作，直到那可怜的小东西在他撒气式的举动中几乎要失去它保有的那一份使它区别于这初夏的炎热傍晚的怡人凉意、几乎要变成一滩泥水时，我终于咽下方才一直堵在我喉口的涩意，挤出一声可悲的鼻音，无意义如同汪洋里的一滴水。它就这样消散在空气中了，这凝重得仿佛融化的冰淇淋液一般的空气中。它本来就如此沉重，因着即将到来的雨季让它的每一阵浮动都抖露出风雨欲来的警告；而如今它又带着别样的沉重了，因着我的话，它又染上了别离的厚重。
      一时之间我们似乎都被这突然降临的离别气氛压得喘不过气来，于是我艰难地挣脱出这份压抑，故作轻松地挥挥手，指了指柠檬味旁边有着更浓重黄色的冰桶，让店员端上了第五份冰淇淋——芒果味的，我迫不及待地挖上一口，热带水果极具侵略性的甜香便占领了我的口腔，冲上我的大脑。在冷意的侵袭下，我终于从空气的钳制下挣脱了出来。
      嘿，伊柳什卡，想听一个故事吗？我从芒果冰淇淋中抬起头来，强颜欢笑——我从未如那时一般对这个词语有着这样深刻的理解。“强颜欢笑”，我真想舍弃这份做作或体面，为什么要强颜欢笑，在你几乎想抱着世界痛哭流涕的时候？我相信伊柳沙已经从我并不高明的表演中看出来我正在流着泪了。既然如此，我又为何要在这里故作轻松？天啊，我简直想将我们面前的这张桌子摔个粉碎，躺在他的腿上，环抱住他的腰，直到火车发车前的最后一阵鸣笛声响起。
      伊柳沙没有回话，我便当他默许了我讲述这个无厘头的故事：有一个在沙漠上行走了很久的人，他看见一张白纸后，就开枪自杀了。
      为什么？他困惑地眨着眼问我。
      因为这张纸是他自己曾经留下来的记号，在走了很久之后又看到它说明自己又绕回原路了。那个人就想着自己永远也走不出这沙漠了吧，于是便开枪自杀了。
      可是那只是一张纸，也许是被风运到了别处呢？或是沙漠里有很多张纸呢？伊柳沙不赞同地皱着眉说。
      也许那张纸被固定在了一块石头下？一株仙人掌上？我耸耸肩，又咽下一口已经有些融化掉的冰淇淋，说，又或许确认那是不是同一张纸、是不是又回到了原点对那个人来说不重要？他只是需要那么一张纸来让他结束掉一切。
      伊柳沙不说话了，用一种审视又警惕的眼神定定地盯着我，过了许久，才嗤笑着说，萨沙，你这样干巴巴地讲故事没有读者会爱看的。——强颜欢笑，这个词又一次像鬼魅一样闯进了我们两人之间。
      我满不在乎地摇了摇头，对他的玩笑话不置可否，转而问他打算画到什么时候。
      他倒是不假思索地回答了：画完，或是画到不想再画了。
      我点点头，不知道我还能说什么。我摸了摸静悄悄躺在我的帆布袋里还未被送出去的那尊小象。店内的冷气打在我的手上，在手上激出一层凉凉的薄汗，让那小东西原本温润的触感也变得紧涩起来。接着，不远处柜台上的鸟屋状时钟的门打开，一只有着鲜艳羽毛的鸟探出头来，高亢地叫了两三声。
      这家店到点打烊了。伊柳沙向我解释说，那时正是夜里十一点。那么，我想是到了告别的时候了，萨申卡。他站起来，头埋得低低的，似乎被他身前桌面上那如今已融化成一抔小小的浅淡明黄色湖泊给吸了进去。我隔着帆布袋缓缓用手勾勒那小象的轮廓，不知怎的又被那沉闷的空气给压得说不出话来、也做不出动作来。当我写下这些文字时我才反应过来，也许当时被那些一簇簇小小的冰淇淋湖泊吸进去的人是我自己——直到伊柳沙转过身去时我才如梦初醒一般清醒过来。跟着他跑到了街边的路灯下。
      夜晚的暹粒有着一种让人不敢置信的怡人。即使失去了明亮而残酷的日照，温和的黑夜中仍然漂浮着一种近乎鬼影的东西，一边向你庆祝凉爽的黑夜的到来，一边在你耳旁低语暑气仍未散去，下一个天明即将来临。
      伊柳沙在我身前，走向下一个路灯，我认出那是回他公寓的路，于是我小心翼翼地掏出准备好的告别礼物，将它抱在怀里。然而在走到最后一盏路灯下时，伊柳沙不再走了。他转过身来，散发着橙黄色的灰扑扑光线的灯光下，他细长的眼睫毛在他的脸上划下尖锐细长的阴影，让我想起曾经在课本上见过的钟乳石的样子。我看不清他的表情，也看不见他暖棕色的眼睛。
      我看了看怀中的小象，突然有一种干了坏事被抓包的心虚感，于是我忙伸手将它递上前去。临别礼物，我说。
      他似乎微微瞪大了双眼，因为我看见那睫毛投下的阴影向上翘了翘。他一边接过那小东西——我怀疑它都几乎要被我不肯停止往外冒的凉汗给浸软了，一边低声嘟哝说，应该是他来准备礼物才对，他在这里待得久，如今又是我要离开……他开口，我才发现他哭了。于是我屏住了呼吸盯着他，等着看他的眼泪滴穿那些黑乎乎的阴影，流到光亮下。
      伊柳沙，今晚别回去了。鬼使神差，我突然说，大概是因为不想错过他的眼泪。别让你的眼睛离开我。你一旦转过身，你一旦将你的目光从我身上移开，你一旦回到那个温馨的小屋，你一旦闭上双眼，时间就会从我们两人之间流走。在今夜为我作一副像吧，伊柳什卡，我用这尊翠蓝蓝的小象做我的报酬，或是更多的，我用我们之间的时间作为报酬，请你在今夜、在这灯光下，为我画一幅画像。
      然后伊柳沙笑了，我从未见过他笑成那样，以至于周围的一切空气都受这笑声激励一般像春天破土的嫩芽一般抖动了起来。他小心地将那尊小象放置在路灯下，又从他的某个口袋中掏出一个皱巴巴的线圈本和一根已经被用得只剩下一根中指那样长的铅笔，一边两只手抓住我的肩膀，将我拖到灯光下一个合适的角度。
      我该摆一个什么样的姿势？我问
      随您的便，不太难受就好。伊柳沙回头支好他的小马扎，说。
      我耸了耸肩，盘腿直接坐到了地上，告诉他自己准备好了。
      见状，伊柳沙也干脆地撤掉了自己的马扎，坐到地上，刷刷地翻过好几页纸，才似乎终于找到了一张合适的。他坐在光线的外围，只有面庞被堪堪扫上了一些暖橙色的光亮。他低头时，光线便短暂地停留在他的发顶，他的头顶便在那几分钟内变成了一汪流动着金棕色光泽的蜜糖湖泊；他抬头看向我时，他的睫毛投下的阴影便又一次将他的五官拉得细长，我便努力地辨认黑暗中他的表情。如果他哭，他深邃的眼窝是否会映出未成熟的玫瑰的颜色？他的泪水是否会濡湿他的睫毛，下起一场足以将人困在避难所中无法前行的雨？如果他笑，他苍白的面颊又是否会鼓起那可爱的小丘？他的唇角和眼皮又会怎样地颤动？
      我昏昏沉沉地想着，思绪似乎已经从面前的光亮下跑到了异想天开的国度，又似乎始终在这里面打转，让我想起小时候自己用塑料杯反扣住的蚊子。就这样不知过了多久，远处的山林里传来一声鸟鸣，空气里的冷冽告诉我即将要日出了，已经暗下去的、即将要被日光取代的灯光下，伊柳沙告诉我，他画完了。我接过他递上来的那皱巴巴的笔记本，正打算将那一页撕下来时，他按住我的手。
      这一个本子都送给你，你的离别礼物。他有些僵硬地说。
      这里面有什么？我好奇地问。
      没什么，只是我刚来这儿时做的一些笔记，记住车站的位置和公交线路之类的东西而已。总之我现在不需要它了。
      可是我也不再需要它了。我笑着说。
      不，你当然需要。你要用它记住这儿，记住我。伊柳沙不由分说地将那笔记本拍进我怀里。再说了，你还需要它告诉你去车站的路。说着，伊柳沙翻开一页，指着上面纵横交错的线条中的某一条，告诉我，只要沿着这条路一直往东走，走到第三个路口处左拐，便是火车站了。
      于是我接过那过分简单画就的地图，仔细辨认着那些铅灰色的线条和眼前的沥青路面的对应关系，在他的目送中骑着那辆自行车头也不回地向车站奔去，我又开始想象在他的目光中我的背影的样子。
      我会就这样摇摇晃晃地骑进刚刚破晓的天色中，渐渐消失在那条似乎永远延伸下去直到遥远的天际的大路上。我会消融在这异国湿热浓重的空气中，变成巨榕的一根笔直粗壮的藤蔓、又或是巨榕脚下的一株毫不起眼的小草。我会消失在这个世界上，就像那在沙漠中看见白纸而自杀的人一样。我的身体会被滚烫的沙砾掩埋，像长出根系一般将我往地下拖拽，最后变成又一摊小小的沙漠。
      不知道骑了多远，我终于在要转弯离开那条笔直的道路之时回过头去。太阳已经升起来了，街边到处都是人，伊柳沙站得笔直的身影在路的尽头一动不动地看着我，怀里抱着那只陶瓷小象。我看见他从他那紧绷的脸上努力挤出来的微笑，朝他挥了挥手，然后他的身影像被风吹散的沙堆一样，消失在我的视野中。
