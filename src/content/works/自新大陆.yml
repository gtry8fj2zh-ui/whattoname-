title: 自新大陆
author: /
cp:
  - 邮钢
updated: 2026-10-04
summary: 如果你自重洋之外的新大陆向我挥手，我会看见。
chapters:
  - body: |-
      小泉直美第三次拒绝掉同学提出的周五晚上酒吧聚会的邀请，转身步伐匆匆地朝反方向走去。她从包里掏出一团耳机，囫囵揪出两头一尾，对准手机的圆形孔洞和耳朵，一边用指甲齐整的手指一点点辗过卷曲的泛着油污的耳机线，一边按下了手机上的播放键。

      “欸？这周也要打工吗？太辛苦了吧？”受到拒绝的同学露出一个有些失望的神情，对着还没走远的直美的背影说。

      直美终于放弃了纠结那团始终缠绕在一起的胶线，顿住脚略微思考了半刻，只回过头去向身后仍聚在一起的女生们扔下一句“算是吧”和“晚点见”，便头也不回地朝车站跑去——她要赶上那趟在七点前到达横滨的列车，这样的话她还有时间在去找笹塚莲之前想办法填饱肚子，而现在已经将近六点了。

      尽管在和父亲团聚后，直美便再也没有在学校里见过那个家伙了，但学校毕竟只是她生活中的冰山一角。如果要她自己说的话，她的绝大部分生活都被五十岚老师工作室里那架黑色的钢琴所占据了，也因此她和承载了自己年幼时期青涩情愫的那个人一直多多少少保持着友好得体的联系——尽管小泉直美本人会毫不留情地将那份得不到回应的单恋称为自己的“黑历史”就是了。

      已经顺利登上列车的直美掏出手机再一次确认了笹塚莲发来的信息，清晰的地址和时间、多年的来往却仍褪不掉的有些生疏的礼貌措辞。直美摁灭手机屏幕，扭头看着车窗外疾驰而过的景色，长长呼出一口气。

      ——直美，大学还习惯吗？

      ——很抱歉打扰你。我和一些朋友组建了一个业余的室内乐团。我们打算在下个月的音乐节上演奏德沃夏克第九交响曲*的第四乐章，但我们的指挥这段时间实在没办法抽出时间来。如果直美方便过来听一下的话，我诚恳地向你保证大家都一定会十分感激的。

      ——如果你愿意来的话，我可以请你吃饭作为报酬。不是打白工哦。😊

      请饭吃对直美来说不是一个很有吸引力的报酬，离开了从小生活的城市来到东京也让她有些难以适应，但她还是一口答应了下来。于是她便在开学一个月后坐上了回家的列车。她也说不上来是因为自己对笹塚莲还心怀恋意还是只是单纯地想家，她不希望是这二者中的任何一个——毕竟前者听起来太恶心；后者的话，她太愧疚。她请了兼职和周末家教的假，在往返的列车票上花了将近一千日元，这全部都只是为了自己幼稚的恋家？想到这里她暗自下定决心，至少要在小少爷那里要回足够抵过这些钱的酬劳。

      那天上午横滨下了一场纷纷扬扬的春雪，等到天色渐晚时，未化的白雪仍然一团一簇地散落在街道上。

      小泉直美在踏出列车的那一刻裹紧了自己脖子上的围巾，流淌在缠结着的耳机里的音流却因为这摩擦一瞬间在她耳内炸出一道噼啪声。直美吓了一跳，疏于防范的口鼻便在那一刻吸入了故乡凛冽的凉意。她暗骂了一声，有些气急败坏地扯下耳机。这下充斥她耳畔的就只剩下积雪被踩在脚下的嘎吱嘎吱声和空气中隐约的沙沙声了。直美一边默默将那些不成曲调的单音编排成一串有些滑稽的音符，一边在脑子里算着手中便利店袋子里食物的价格，盘算着让罪魁祸首报销。这样想着，她走进了三天前就被那家伙发过来的写字楼里。

      “好久不见了，莲。但我还以为你会选一个更气派一点的地方呢，”直美环视了一圈她面前将将容纳下这支小乐团的房间，翘起嘴角忍不住尖刻地说，“至少像我们学校的排练厅吧。”

      笹塚莲拎着他的小提琴——他上中学后就放弃钢琴转投弦乐了，在经过了一番尝试后最终选择了小提琴，他走到她身边，露出得体的笑容，故意忽略掉直美语气中隐隐的夸耀，向她简要地介绍了这个乐团的情况。

      嘁。直美夸张地翻了个白眼，手指下意识地将脑后的低马尾扫到胸前：“那你们先完整来一遍让我听听看吧。”她的余光瞥到身边的人被她逗笑的样子，想起大学刚开学时其他人刚刚知道自己在福利院生活过时夹杂着怜悯和好奇的神情。

      「其实没有你们想的那么糟糕啦」，那时的直美连忙说，「你看，在福利院的话就可以一直和同龄人在一起啊，这不是比一直和家长一起生活要好多了？而且我在那里面有很多朋友哦。」

      「这么一说也是啦。那你们现在还有联络吗？」

      当时自己是怎么回答的来着？直美的视线落到房间虚空中的某一点，悠哉地想，好像是类似「当然了」这样会让自己心虚的话。这当然也说不上是假话，她有小野鸭之家的座机号码和地址，也有钝器和贫乏她们家里的电话号码和地址，后来有了个人手机之后几个人又很快相通了个人号码和line。在相当长的一段时间内她们四个互通书信和电话的频率简直和她们仍在小野鸭之家里时不相上下，但不知道从什么时候开始，她们向对方倾泻自己的新生活的频率慢慢减少了，最后连收到来自对方的问候或简短的信件居然都变成了会让她意外的事情。

      “直美？”笹塚的声音将她拉回现实，不用他多说直美便明白过来。她走到房间前部的中央，看着所有乐手灼灼的目光，浅浅吸了一口气，抬起双手有力地挥下——

      最后一个音符落下，拥挤的排练室内细细密密地爬上了乐手们有些紧张的呼吸声。“怎样？”笹塚问。

      “你们想达到哪种水平？”直美偏了偏头，稍稍眯起了她的眼睛。

      “直接说你想说的就可以。”

      直美闻言，缓缓松开了刚刚一直紧抿着的嘴唇。“不太对，”她摇摇头说，“技巧还说得过去，但是你们的情感呢？”她看着乐手们有些困惑的神情，继续往下说：“比如说，你们想象一下，你远渡重洋，怀揣着对故土的留恋和对即将开始的新生活的热情来到了一片你从来没有涉足过的全新的土地——虽然是仍然空无一物的、但也是全新的生活、全新的土地！面前的一切都让你觉得如此新奇、生机勃勃，尽管你有时依然会在想到过去、想到故乡，即使迷茫，但你的身体里有种不可遏制的能量，它告诉你已经准备好在这里大干一场了！怎样？有感觉了吗？”

      直美睁开眼睛——这时她才意识到自己不知道什么时候闭上了它们、并且沉浸在了自己的描述中，而面前的乐手们却仍然面露难色。直美有些泄气地耷下肩膀，嘴巴张开又合上，试图找出更加合适的方法。

      就在两方都有些僵持不下的时候，笹塚突然开口打破沉默，说：“也许我们可以试试自己找找感觉，说不定哪一秒就顿悟了呢。直美，今天辛苦你了。”他从座位上站起身朝她鞠了个躬。

      直美轻吐了口气，出于肌肉记忆一般做了礼节性的回复后就走出了排练室。走到写字楼外时已经是晚上的十点了。她一边随意走进了一家便利店一边摸索着摁开了自己的手机——刚刚她就感觉到它在自己的衣兜里“嗡嗡”地响了两声。她上滑解锁开屏幕，一个红点醒目地打在一个许久没有浮上来过的群聊对话框后。

      ——钢美！！

      ——你回横滨了吗？！！

      -

      储物柜在某一天下午应着门铃声推开小野鸭之家的门的时候，意料之中地听到了邮箱刻意克制着但仍然显得有些急迫的跑下楼梯的声音。这个时间里会光顾这幢独栋房舍的人很少，邮差算是一个。没等他将写着“邮箱”的几张信封挑出来，已经长到只比他矮一个头的邮箱便一把抓走了所有的信。她的手指在信件间灵巧地穿梭着，眼睛飞快地扫过一张张信封，很快从那一叠中挑挑拣拣出三张来。

      “这封是贫乏的，”她垂着眼睛将一封信纸上的内容大致扫描了一遍，头也不抬地对身边安静地坐着的储物柜说，“她说她考上了戏剧专门学校，嘁，我早就告诉过她没问题的，全世界大概只有她一个人会觉得那学校不想要她……呜啊，这是什么？”信纸交叠处掉下来一张照片，戴着眼镜的短发女生在秋千上开怀地笑着冲照片外的人比耶，她的脚边是用黑色水笔张牙舞爪地签上的几个假名，从故作艺术的字迹和已经被晕擦开的笔画中依稀能看出“ボンビ（贫乏）”几个字。

      邮箱看着那张签名照小小地翻了个白眼，将它和仔细叠好的信纸都重新塞回信封里，在桌子上放好。储物柜被女孩生动的表情逗得笑了起来，他的指尖缓缓摩擦着他面前的一个简朴的浅色信封，安静地看邮箱拆开了下一个信封：“然后是钝器，她顺利地收到了心理学专业的录取通知书，但她还在犹豫要不要去，她还在担心这会给川岛夫妇添麻烦。啧，真是的。她都在那里待了快十年了，怎么还是这样。你说，不会是他俩其实对钝器不好吧？”邮箱从信纸上抬起头来，转身问身边的人。储物柜摇了摇头。

      “也是，她要是过得不好肯定会告诉我们的，对吧？好啦，还有最后一个——”邮箱将钝器的信收好和先前贫乏的那份放在一起，然后她的视线转向面前桌子上仅剩的那个四四方方的淡粉色信封。她轻轻拈起那只信封的一个角来，薄得像是里面什么都没装一样。钢美一直都是她们四个中最不爱写信的一个，而在她们有了自己的手机之后，来自她的信件就更少了，几乎只能在节日的贺卡上能看见她的字迹。她总是更喜欢那些有声音的方式，面对面、电话、语音，总之不是写信。

      「总之写信就是很怪啊，只能看到你们说的话却听不到你们的声音。」邮箱想起她刚离开小野鸭之家的时候，有一次听见听筒对面的钢美这样说。

      她想象着那边钢美瘪下嘴唇来的样子，将缠绕在自己食指上的电话线圈松解下来，再细细地捻过虬结的电话线。「你听不到吗？我明明看着你们写下来的字就能在脑子里面听到你们的声音啊。难道说，是因为钢美根本没记住我们的声音所以才想不起来吧？」她坏心眼地笑了。

      「喂，邮箱你真过分！想象出来的和真正听到的当然不一样啊！再说了，写一次信就要写三遍，真的、真的、真的写得手好累啊——这可是未来的钢琴演奏家的手啊——」电话那边传来她夸张的哀嚎声。

      她笑出声来，掐着嗓子撅起屁股来造作地说：「那‘未来的钢琴演奏家’，我能不能请求您多给我们这群平民一点您珍贵的签名呢？」

      「那你们可得好好保存下来，等我出名了说不定能换不少钱呢。」

      然后对面沉默了好一会。「怎么了？」邮箱问。

      「没什么。只是我在想，要是我们还生活在一起就好了。」

      「你在说什么呢？」邮箱笑着说，却感觉喉咙里不上不下地哽着一个硬块，连带着她的声音都有些发抖，她希望这样细小的颤动在经过电流的失真后没有传到钢美敏锐的耳朵里。「你难道不是一直都想和你爸爸一起生活吗？而且你要是回来的话，魔王一定会杀了你的。」

      「我知道的啦，我不是那个意思。我只是……」她听到她轻轻叹了口气，她又下意识地捻动那团乱糟糟的电话线圈，好像这样就能摸到正在里面流淌着的钢美的声音。「好吧，我得去写作业了，我先挂了？」

      邮箱轻轻嗯了一声，但听筒放回底座的咔哒声和对面挂线后的嘟嘟声来得比她的声音还要快，她不知道钢美有没有听到。

      好吧，回忆结束，总之钢美不喜欢写信，所以邮箱想里面大概只放了一张小小的便签纸。她小心地揭开给信封封口的贴纸，露出里面薄薄一张信纸。“果然。”她哼笑了一声，将那枚轻飘飘的纸抽出来，定定地盯着它。过了几秒，她才爆发出一阵大笑，将写了字的那一面展示给身边的储物柜。

      “收、到、东、京、音、大、的、录、取、通、知、了。”邮箱一字一顿地念道，然后转身摸出口袋中的手机翻出四人的聊天群组在屏幕上敲敲打打。等她再次抬起头时，却发现本来摊开在面前的钢美的信已经被储物柜默默地收好和另外两封信放在了一起，取而代之的是安静地躺在桌面上的一个素白色信封。

      她只消瞟一眼便知道那是什么，那上面收件人的地方工工整整地写着她的大名，信封背面还用醒目的烫金印着某所大学的校徽。邮箱烦躁地收起手机，将那封信推到一边去，嘟囔着：“我真的不确定。”储物柜重新将那个信封推回她面前，长刘海下的眼睛投来的目光让她更加烦躁了。

      她将脸埋到手心里，从喉咙深处发出一声闷重的怒吼：“只是因为魔王太难糊弄了我才去参加这个学校的考试的，我根本就不知道我以后想干什么，就稍微放过我一下好吗？”说着，她抓过那三封来自朋友们的信，像下来时一样“咚咚咚”地大步走回了自己的房间。尽管这个房间除了她之外再没有别人了，但她还是三步并作两步爬上了自己一直以来睡着的靠窗的上铺，掏出裤子口袋里的手机，将自己砸进松软的床铺中。被扔在枕头边的手机震了一下，屏幕上赫然显示出钢美发来的信息：

      ——邮箱呢？你打算怎么样？

      -

      身边的高脚凳被拉开时，直美正被关东煮里的竹轮烫得龇牙咧嘴。她斜瞟了一眼来人，放下手里的竹筷，一边吸着气一边口齿含混地说：“你们结束啦？后来的排练怎么样？”

      笹塚莲耸耸肩：“感觉还是和之前一样，没什么进展。”

      “抱歉，我是不是不应该那样说的？”直美漫无目的地用筷子戳着纸杯里的食物，说，“其实对于业余乐团来说你们已经很好了，真的，我不应该说那样苛刻的话的。”身边的人不说话了，直美又咽下一口竹轮，扭头看着笹塚将笑不笑的奇怪表情，有些没好气地问：“干嘛？你这个表情是什么意思？”

      他噗嗤一下笑出声来，过了好一会才摆摆手说：“没什么，只是我在想直美真的变了呢。我还记得之前你可是会毫不留情地指出我的演奏的感情‘完全不对’，还指责我这样是‘浪费了时间亵渎了音乐’呢。”

      直美的气势一下子消了下去，不好意思地捂住因羞耻而涨红的脸：“你别说了……”

      “啊，而且我被你说哭了之后你好像也完全没有感到抱歉呢。”

      “我当时明明也有和你道歉吧？虽然，是在几天之后……”

      笹塚又忍不住大笑起来，笑得上半身都伏在了横放在他腿上的琴盒上。等他重新坐直身子、平稳下来气息之后，他扭过头看着还在和关东煮交战的直美说：“看来直美已经来到‘新大陆’了呢。”

      “其实说到底，也只是另一片大陆而已。”直美神色不明地说。

      “你最近还和小野鸭之家的各位有联系吗？”

      直美将剩下的竹轮全部塞进嘴里，有些意外地皱起眉，朝旁边的人投去一个怀疑的目光：“喂，你不会还没对邮箱死心吧？她早就已经很明确地拒绝过你了吧？”在他们六年级毕业典礼的那天，笹塚莲向邮箱表白了——或者说，他的表白还没出口就失败了。扎着高马尾的女孩一看他紧张犹豫的样子就猜到了他打算说的话，于是在他说出口之前就有些不耐烦地严辞拒绝了。这件事还是几年之后直美才从笹塚口中得知的。「‘拜托聪明一点吧，你不是知道钢美喜欢你吗？所以我绝对不会喜欢你的’，她当时是这么跟我说的。」

      “你现在又不喜欢我了，所以这道禁忌应该也不在了吧？”笹塚看着直美逐渐变得狰狞的脸，忙举起两只手说，“我开玩笑的！我只是想知道她们最近都怎么样了而已，我们小学毕业后就没见过面了。”

      “钝器去大学了，学的是心理学专业；贫乏考上了戏剧专门学校——啊对了，她还在你们刚刚排练的那个写字楼里的一个戏剧补习班里做兼职呢，她刚刚还看到我了；然后邮箱的话，我也不太清楚，她应该是打算gap一年？现在在到处找义工做，说是还不确定以后有什么打算。我就只知道这么多了。”直美的视线凝滞在面前纸杯里浅棕色的关东煮汤上。慢慢冷却下来的汤汁表面渐渐泛上来几颗金黄色的浮油，在纸杯里慢悠悠地晃来晃去。

      她没来由地觉得很烦躁。一旁的笹塚还在贴心地问她今晚有没有去处，这个时间回远离市中心的家会不会不太方便云云。“需不需要我——”

      直美啧了一声，收好自己的东西跳下便利店的高脚凳，一边朝门口走去一边头也不回地说：“不用了，我自己就可以。”五分钟过后，正独自一人在横滨将近半夜十二点的街头漫无目的地游荡的她才发现这句话其实是一句谎话，因为她不知道自己在往哪里去，这不是回家的方向，但她感觉自己正在穿过的街道给她一种奇异的熟悉感。即使是她从小生活着的城市，直美也很少见过它在凌晨时分的样子，离开小野鸭之家之后，她便很少在路灯都暗下来的时候上街了。

      她希望自己能找回之前那种宛如“自动驾驶”一样的状态，因为现在她实在不知道该怎么走了。这让她想起弹奏那些练习过无数次的曲子时的样子，从坐上琴凳那一刻起一切就都可以全部被托付给肌肉记忆，她好像不存在于现实中的任何角落里，音乐是自然地从那些琴键里流淌出来的，而她是像那乐声一样飘荡在空气中的难以触及的。

      啊，对了——这是像那些曲子一样的她曾经走过无数次的小路。直美福至心灵地转身、扭头，果不其然看见了那个立在自己面前用歪歪扭扭的字迹写着“小野鸭之家”的木牌。她有多少年没有来过这边了？尽管她离开的时候也和其他孩子们保证要经常联系，但包括她之内的所有人都忙于适应、投入新的生活，她几乎没再回来过。眼前的木牌比她记忆里的要破旧了许多，即使在夜色下，也能看见木牌上的字迹新旧不一，大概是被风雨冲刷掉色后又被人重新填上的。

      不过这个简陋的木牌能存活这么久已经是个奇迹了就是了。直美伸出手想摸摸那老家伙饱经风霜的立杆，却被从一旁伸出的另一只手一把拍掉。“小心一点，这上面可全都是木刺，”直美猛地转过头来，不知什么时候来到身边的女孩勾了勾绑在高马尾上的橡皮筋，在月光下挑了挑眉毛，勾起一边嘴角说，“哟，好久不见，大钢琴家。”

      “你怎么这个点还在外面？魔王知道吗？”直美借着微弱的月光上下扫视了一遍邮箱穿戴整齐的大衣和外出的衣物，显然她不是刚从室内出来的。

      邮箱抱起胳膊，抬起下巴反问：“钢美你不也是？”

      “不想说算了。”钢美翻了个白眼，转身往回走。

      “等下！这么晚了你要去哪里？”邮箱有些急切地抓住她的胳膊，等她看见钢美在月色下泛出水意的埋怨的眼睛时，她下意识地松开了紧紧抓着她的手，将两只手都举到胸前，又像投降又像安抚。“好了好了，我告诉你还不行吗，”她有些心虚地抿了抿嘴唇，视线斜向下钉在面前钢美的脚尖上，过了一会才像是破罐破摔了似的抬起头来，盯着对面人的眼睛慢悠悠地说，“其实，我在等你。贫乏不是说你在横滨吗，我就想着说你会不会想要过来。”

      钢美眨了眨眼，觉得自己身体里仿佛有龙卷风入境。她摇摇头，张开的嘴唇努力想要在混乱的大脑中找出一些能说出口的话：“那如果我不来呢？难不成你要在外面等一晚上吗？你忘了吗，我和爸爸在这座城市的另一边有一个家的啊……说得好像我一定会过来一样……”

      邮箱看着面前有些语无伦次的女孩，忍不住笑出了声。她不由分说地拉住钢美的手腕将她往那幢在夜晚下显得有些阴森的独栋房屋里领，边走边扭过头对她说：“心灵感应？大概这种东西，或者说是直觉吗？总之我就是觉得你会来啦。再说了，你这不是来了吗？”

      -

      在福利院里又来了一个会弹钢琴的女孩的那一年，冰娃娃的社会活动让小野鸭之家出了名，由此引来了不少大发善心的资助者和各种各样的捐赠品，那架已经落了灰的电子琴就是其中之一。

      刚放学回来的邮箱在门口听到琴声时先是一愣，抬了抬脚想要跑上楼去，却发现那双已经被穿得松松垮垮的运动鞋像扒在自己脚上一样怎么都脱不下来，最后她干脆放弃了，将书包一甩就地坐在玄关的台阶上，拖着下巴听楼上传来的断断续续的琴声。

      “怎么就在这里坐着？”一阵拐杖敲在木地板上的“咚咚”声过后，听起来有些不耐烦的中年男声在她背后响起。邮箱翻了个白眼，没有理会他，仍然一动不动地坐着，耳朵隐约往她身后的楼道伸了伸，但钢琴的声音不知道什么时候已经停了下来。“啧，真麻烦。记得来吃饭。”接着拐杖和沉重的脚步声拐了个弯，走回了楼上。

      后来在那天的晚饭饭桌上，魔王向她和其他孩子们介绍了那个新来的女孩：“这孩子的父母借了高利贷还不起，正在逃亡中，现在没办法照看这孩子，所以就先送过来了。”

      “下午的时候就是她在弹琴？”邮箱将视线从正坐得端正的女孩向上移到正站在她身后的人身上。魔王把手搭在那女孩身后的椅背上，定定地看着坐在另一张餐桌上此时正有些怨怼地看着他的邮箱，他在想她是否发现了自己语气中的不善。他刚打算开口，身前的女孩便低下头来，小声说：“对不起……我很久没看到钢琴了，所以看到活动室里有的时候我就擅自去弹了几首……真的十分抱歉……”

      魔王看着谈话的走向，颇有些头疼地抓了抓头发，不经意间又咂了咂嘴：“你不用道歉，活动室里的东西都是你们可以自由使用的，只要别在该睡觉的时候弹琴就可以。”他给了邮箱一个生气的瞪视，然后小心地撑着桌子边缘矮下身子来，看着面前有些害怕的女孩安抚地说。

      “哦？听起来像是又来了一个‘曾经的大小姐’？”邮箱无视了那个眼神里的警告意味，扯了扯橡皮筋上的红塑料球，在说最后几个字时还特意扯着嗓子发出滑稽的声音。

      “喂！你今天怎么回事？”魔王用拐杖敲了敲地板，看着邮箱不服气的表情，最后留下一句“再让我发现你们有矛盾就都给我去提水桶”便拄着拐杖离开了饭厅。

      切。邮箱在他转身后朝他的方向翻了个白眼，然后就不再抬起头，只是恶狠狠地搅着面前的咖喱饭，一口接着一口往嘴里送。等她端着空盘子绕到那个女孩身后的水槽里时，她突然开口，用还是微微颤抖着的声音说：“那个，我不是什么大小姐，只是我家里之前是开琴行的，所以会弹一点而已。”

      “啊，是吗？”邮箱一边往海绵上挤洗洁精一边干巴巴地说，然后整个饭厅便只剩下水流的哗哗作响。等水声停下来，邮箱将洗干净的餐具放到沥水架上后，在转身离开饭厅前又扭头看了一眼还坐在座位上的女孩，下巴朝水槽的地方扬了扬，说：“钢琴，吃完饭记得自己洗碗。”

      “‘钢琴’？”

      “对，以后你在这里就叫这个名字了，”邮箱靠在门框上说，“顺带一提，我是邮箱。”

      那天晚些时候，领到新名字的钢琴在经过摆着座机的房间时再一次听到了邮箱叫这个名字，起初她还以为是在叫自己，过了半秒才反应过来她是在和电话听筒对面的人说话。

      邮箱很少主动打电话到已经离开小野鸭之家的朋友们的家里去，尤其是钢美。如果说钝器和贫乏的时间日程表她还能有一些把握，那么她对钢美什么时候有时间接电话就是几乎一无所知了，有时候她会在五十岚老师的工作室待到很晚才回家，有时电话打过去时她又可能在赶落下的作业。总之，打过去对面却接不起来的次数多了，她便不那么愿意打了。而且退一步讲，大家的新生活都在紧锣密鼓地进行着，就算她们是好朋友这样突然地接到来自福利院的电话大概也会有点不知所措的吧？毕竟小野鸭之家一直以来的宗旨不就是“不要沉浸在悲惨的过去里”吗？所以渐渐的，她就很少给她们打去电话了。

      不过今天不知怎的她给自己开了例外，当她回过神来时，自己的身体已经被潜意识带到了座机前，敲下了那一串她熟记着的但鲜少拨下的号码。而当听筒的嘟嘟声响过两三声后，几乎可以被称作是奇迹般的，她听到了钢美的声音：“邮箱？是你吗？”

      邮箱这才将刚刚一直紧绷着的肩膀放松下来，在她回过神后电话接通前的这段时间，她一直在想如果对面是小泉先生应该怎么办。“怎么了？你怎么不说话？”邮箱这才低低笑了一声，轻轻摇摇头说：“还记得我之前写信和你说不知道哪个大款往小野鸭之家捐了一架电子琴吗？今天我听到有人弹它了，是完整的曲子哦。”

      “欸，终于又来新孩子了？弹得怎么样？虽然不用你说我也知道肯定没有我好，不过也不知道你的太鼓耳朵能不能听出好坏就是了。”听筒对面传来的钢美的声音显得有些漫不经心。

      “真敢说，”邮箱哼了一声，换了一边耳朵放听筒，“不过确实没有你弹得好听就是了。”

      “嗯哼，算你有品味。”在接下来的好几秒之内，流淌在两条电话线之间的只有两人平稳的呼吸声。过了一会，邮箱才听到对面传来布料和木质家具摩擦的声音，她想大概是钢美坐在了地板上，然后从另一边传来的有些干涩的声音说：“……那我想小野鸭之家要有‘二代钢美’了？”

      “不，”邮箱的否认几乎是在听见问题的那一刻就脱口而出了，“钢美只有你一个啦。”

      “你这么说弹珠和二代弹珠会生气吗？”钢美一边咯咯笑着一边说。

      邮箱翻了个白眼：“那你要这么说的话我以后把你叫回钢琴也可以。这样她就可以是二代钢琴了，你满意了？”在对面女孩嬉笑着的“才不要”的声音中，邮箱想起了她刚来福利院时的样子。那天下午小学放学时，她跑遍了整个教学楼才在音乐教室里找到了正弹得入神的钢美。一曲结束，她才从那架黑洞洞的钢琴后走出来，对吓了一跳的人说：「你既然这么喜欢钢琴，那就叫你钢琴好了。」扎着精致的侧马尾的女孩低着头死死地盯着面前黑白分明的琴键不说话。没收到回应的邮箱也不恼，只是转过身朝门口走去。

      「回去了，你要是一会迷路了的话可别怪我。」她往前走了几步才发现身后的人并没有跟上来，于是她转过身来，试探着叫了面前仍然没有抬起头的女孩：「钢琴？」

      「我不叫钢琴，」她终于站了起来，和邮箱对上了视线，「我有名字，我叫——」

      邮箱轻嗤了一声，一边心想着又来了，一边打断她的话，扬起头说：「你已经被你爸爸妈妈抛弃了，你还不懂吗？记住那些抛弃你的人给你取的名字有什么用？记住过去那些没用的东西除了让你难过和葬送掉你被好人家收养的未来之外什么用都没有。」

      「你才是什么都不懂。」那女孩猛地往前走了几步，将自己的脸贴到对方脸跟前，两个人的鼻子几乎要撞在一起。但在这样的距离下，邮箱才看清对方因愤怒瞪圆的大眼睛里盈满了晶莹的泪水。「你什么都不懂，」她带着些哭腔尖声说，「我爸爸是出于无奈才把我送过来的，他是因为想让我继续弹钢琴才把我送过来的！」

      「就算你这样说他也是抛弃了——」

      「他没有！你根本就不知道。不要总是这幅好像你知道所有事情的样子。」邮箱睁大了眼睛。她从出生起就在这所福利院里，自诩了解这个世界的一切运行逻辑：从不接受自己被抛弃，相信父母会回来接自己，到最后终于放弃了无谓的希望，开始接受“现实”摆出宠物店里的宠物的模样精明地计算怎么讨收养家庭的欢心。所以一开始她想这个新来的女孩肯定也不会是例外。因为她总是知道所有的事情，她有这个自信——直到这一次之前。

      她看着面前那个眼泪流了满脸的人，不知道从脑海里哪个角落传来的声音不断重复着女孩的那句“你什么都不知道”，那声音几乎要把她淹没了。她有些艰难地开口说：「如果你不想要外号，我们直接叫你名字也可以。」说着，她将自己的手帕塞进面前无法停止抽泣的女孩手里。

      那个女孩却摇摇头推开邮箱伸出的手，咬住嘴唇抬起头颇有些凶狠地撇掉眼角残留的眼泪。「'钢美'。我以后叫这个名字。」她猛地吸了吸鼻子，坚定地说。

      -

      “呐邮箱，”钢美紧紧抓着邮箱的胳膊，两人一起摸索着墙壁小心地穿行在没开灯的走廊上，她将身子紧紧贴在跟前的人身上，压低了声音说，“带我去看看那架电子琴吧。”

      “哈？”走在前面的人猛地回过头，在钢美的嘘声下重新压低声音，皱眉问，“现在吗？这可是凌晨一点！要是把大家都吵醒了的话魔王会杀了我们的！”

      钢美翻了个白眼：“我可没说要弹吧——”

      “你看到它还能忍得住？”邮箱抱起胳膊。

      “——而且魔王不会杀了我们的，你几岁了？”钢美站直身子，眯起眼睛回望过去。

      邮箱看着那双眼睛叹了口气，转身继续拉着钢美往前走：“是啊，是啊，他不会杀了我们的，他只会把我们大骂一通，还不如直接杀了我们。”

      “那不是很好吗？就像回到小时候一样。”

      尽管看不见，但邮箱能感觉到身后的人正因憋笑而轻轻颤抖着。她在一扇半掩着的门前偏过头去用眼尾的余光看着神色有些疑惑的钢美：“你想吗？回到之前的样子？”

      钢美困惑地皱起眉毛来，不确定面前的人在想些什么：“这种事情就算想也是没办法吧。”

      “也是。”邮箱轻声说着推开了那扇门，轻车熟路地按下灯的开关后将门关上，在暖黄色的灯光下，摆在房间角落的是那架小巧的电子琴。钢美的目光几乎是在灯亮起那一刻就定在了它身上。她快步朝那个角落走去，却在中途被另一个物件吸引去了注意力。

      她蹲下身子抽出角落旁的书架上的一盘碟片，抬头看着还站在门口处的邮箱说：“这家伙还在啊？邮箱你还记得它吗？我们当时一起在学校的音乐教室里听的。”

      邮箱也顺势就地坐下，看着她手上那张有着黑白封面的光盘，点了点头。那天放学后她毫不意外地又一次在钢琴教室里找到了钢美，但与之前不同的是，她并没有坐在钢琴前，而是蹲在教室前的电脑下，不知道在干些什么。看见邮箱进来，她便朝门的那边招了招手，然后两人一人搬了一把椅子挤在小小的电脑屏幕前看着黑白画面里的人演奏着各种各样的乐器。“当然记得啊，你当时问我怎么样，然后我说小提琴的琴弓像纪录片里看到的花园鳗。”

      想起以前的事情，钢美笑得躺进了邮箱怀里，她举着那张碟片逆着光细细端详了好一会，才说：“我不是在群组里说我这次回来是因为莲临时叫我来给他们的乐团做指挥吗……喂，别用那种眼神盯着我！我早就不喜欢他了好吗！”她猛地坐直身子，佯装恼怒地瞪着邮箱脸上调笑的表情，直到她投降似的举起双手，钢美才重新躺回去，继续说：“他们准备的就是这首曲子，《自新大陆》的第四乐章。”

      “那他们怎么样？”

      “怎么说呢……你还记得我和你一起听的时候是怎么说的吗？我说我不理解那些缠绵的乐段。如果我面前就是那片新大陆，我会毫不犹豫地跳上去，不会对过去有任何留恋。我不想再看到记忆里那些听到我想要弹钢琴而面露难色的脸，或是那些知道我们在福利院里生活而变得恶心的表情，”邮箱点点头，不知道该说什么，“我觉得他们就像我那时的想法。因为没有想清楚什么是‘新大陆’所以也不理解什么是‘旧大陆’，所以用这种随意的心态来看待自己的现在和过去。”

      “那现在呢？”

      躺在她腿弯中的钢美歪了歪头，思索了一会才说：“现在的我大概已经理解了，因为我已经站在了‘新大陆’的土地上。我有时会觉得有些茫然，好像即使我的身体在新的世界，仍然有一半的我被留在了那个旧的世界上。人们大多只认识某一半的我——新的、或旧的。”

      “那，”邮箱垂眼看着露出苦涩笑容的钢美，缓缓张开嘴从她发紧的喉咙中挤出一点沙哑的声音说，“咳，那你要不要试着在你的‘新大陆’上朝我挥挥手？”

      “什么嘛，你这算什么建议？”钢美又笑起来，但这次声音显然更加轻快。

      “如果我看见了的话，我就会向你挥回去啊，”面对她的取笑邮箱不满地梗住脖子皱起眉，好像在责备她连这么简单的道理都想不明白，但随即她好像也发觉了这个说法的滑稽，气势渐渐消弱了下去，“就是，这样的话，也许你能想起来一点以前的事情啊……虽然，好像也没什么用吧……”

      钢美盯着她因刻意回避视线而别开的脸，突然笑出声来。“你干嘛？小声点啦！”邮箱连忙伸手捂住她的嘴，弯下腰压低了声音说。

      “抱歉抱歉，我不是故意的。我只是在想邮箱也变了啊。你之前会说‘以前的事情什么的根本不重要’的，”钢美无辜地耸了耸肩，背靠着墙坐起来，突然问，“你现在怎么样？”

      邮箱起身拿来几个靠枕垫在两人腰后，眼神直直地望向虚空中的某一点，长长呼出一口气，说：“和我跟你们说过的一样，有时做义工打发时间，有时就什么都不干。我其实还挺羡慕你们都有自己想做的事的。如果问我想要做什么的话，我居然只能想到之前和你们一起挑选收养家庭的日子。我是不是活得太空虚了一点？呐，钢美，我可能要变成小野鸭之家的幽灵了。”

      钢美看着身边的人投来的幽幽的眼神，又忍不住笑起来，笑完后她才轻轻吸了口气：“真糟糕，我不知道该和你说什么。啊对了，邮箱，你帮我个忙吧。”

      “什么？”邮箱扬起头看着已经已经站起来的钢美。

      站着的人理了理衣服袖子，走到电子琴边坐下，回过头盯着邮箱，一脸理所当然地说：“我想弹琴，所以麻烦幽灵大人帮我放一下哨吧？”

      -

      一个月后邮箱拿着钢美寄来的信坐上了去往东京的电车，在东京音大的演奏厅里再一次听到了那天晚上钢美弹过的那首曲子。后来她才想起来，其实早在她们第一次在音乐教室里看光碟的那个下午她就听过这首曲子了，那时她问钢美它叫什么名字，钢美回答她说这是光碟上那支交响曲的第二乐章。「《念故乡》，它叫这个名字。」她面对着钢琴一动不动，坐在她身后的邮箱看不清她的表情。「它果然还是不那么适合钢琴吧？对故乡的眷恋还是得用管弦才更悠扬缠绵啊。」当时的邮箱耸耸肩，说：「‘念故乡’也不用非得是缠绵的吧？何况你几分钟前还说你绝对不会留恋过去呢。」

      而现在，当她终于站在了新世界的土地上时，她却开始望向过去的世界了。不知道这样和像她一样仍然停留在原地相比起来哪个更好一点。这样想着，邮箱坐在了观众席的最后一排，从包里掏出那张信纸再次读了一遍。其实来自钢美的信依旧很短，只是写了这次演奏会的时间和地点，再加上几句那天晚上她没说出口的话。她看着舞台上的钢美简单朝观众席致意后坐上琴凳，抬手落下第一个音符。她在信上说，她其实很少在弹钢琴的时候想到别人、或者说想到任何事，但这首曲子是例外。因为她总是会在演奏的时候想到她。

      「所以说，邮箱，」她看着信纸上的字迹脑海中浮现出钢美有些自大的语气，「如果暂时不知道该做什么的话，不如先好好在岸边看着我吧，等我回头的时候，我会找到你，然后朝你挥手的。也许某一天我就会发现你已经开着快艇找到了另一片大陆呢。」

      舞台上一曲终了，邮箱将信纸收回包里，隔着几十排观众席看着钢美走到台前鞠躬、收下捧花，然后提着裙摆缓缓走到台侧。在她即将隐入后台的阴影中前，邮箱跨过几十米的距离看见钢美闪着光的眼睛看向她，空出来的那只手在她胸前朝她挥了两下。


      *又称《自新大陆》
