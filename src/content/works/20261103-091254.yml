title: 荷尔拜因恋爱咨询所
author: /
cp:
  - SIX the Musical
updated: 2026-01-29
summary: 在汉斯·荷尔拜因靠售卖画像赚到足够多的钱之后，他终于决定搬离那间他曾经钟爱的陈旧画室，并将其送给他的老友们——六位（自称）有着丰富恋爱经历以及感悟的歌唱艺术家，作为她们咨询所的地址，但代价是这间咨询所要以他的名字来命名。
chapters:
  - body: |-
      Day 1
      /看见内心/
      我反复比对着手里印着华丽花体字的传单上被六种鲜亮颜色的夸张标语挡得只能看清轮廓的木门和眼前朴素掉漆，脆弱得仿佛难以承受我礼节性的敲击的木门和门上歪歪扭扭地钉着的掉漆长钉以及用细麻绳拽着的轻飘飘的门牌号，难以想象这些家具是怎么从那么多场战争和自然灾害和不管是什么可能夺走它性命的东西中抢过一条命颤颤巍巍地存活到今天的。
      但无论如何，我还是伸出手轻轻敲了那扇门三下，像我母亲一直以来不厌其烦地教导我的那样，尽管我其实并不能确认这是否就是传单上的地址。幸运的是，那扇饱经风霜的木门并没有因我的礼貌而遭受灭顶之灾。
      很快就有人来开了门。她穿着姜黄色及脚丝绸长裙，除了胸下低调但精致的白色镶钻系带之外全身再没有其他装饰。她打开门，目光先是扫过我手里的传单，然后对我露出一个得体的笑——就是那种我母亲看到会恨不得把这种弧度复制到我脸上的那种完美的满分得体微笑，一边把我领进门，一边说：“欢迎来到荷尔拜因恋爱咨询所，我是阿拉贡的凯瑟琳，叫我凯瑟琳就可以。”
      我跟在她身后，环顾这个我将要诉说我的情感密事的房间。入户房间的正中央是一张和那传单上一样披着花花绿绿的六种颜色的桌布的桌子，我注意到从桌布长长的穗子下露出四条有着复古雕花的深棕色桌腿，端庄典雅得和这间各种颜色都闹哄哄的房间有些不搭。我不禁有些好奇桌布被揭开之后的桌面会是什么样的。房间很空旷，除了那张桌子和散落的几把椅子之外几乎没有其他家具，墙纸是浓重的黑紫色，只能从墙角和天花板处一些不起眼的卷边判断出它年头的久远，又或是主人的不耐心。但是在房间的东南角，有一扇紧闭的房门，里面时不时还会传来一群女孩们说笑的声音。
      凯瑟琳注意到我望向那扇门的视线，皱了皱眉，小声嘟囔了句“不好意思”便走到门边，敲了三下门框。从墙的那边传来一声调笑式的“非常抱歉”。即便凯瑟琳转身回到桌边的时候已经重新将表情整理好了，但我依然注意到她在听到那句听起来不是很抱歉的道歉声时翻了一个小小的白眼。
       
      “女士，请问您今天具体想咨询一些什么问题呢？”凯瑟琳绕到桌子靠墙的那一面，拉开椅子坐下，然后伸手示意我在她对面的黑紫色折叠椅上坐下，那把椅子除了颜色以外和我们学校礼堂里摆着的那些一模一样，甚至包括扶手和屁股垫上那些掉下来的碎海绵屑。
      “嗯，其实我也不是很确定……”我有些难为情地说，想起曾经某次和旁人倾诉烦恼时对方有些不耐烦的“所以你的问题是什么”和“所以你想怎么样”，担心她也同样会因我的糊涂和迷茫将我赶出去。
      “没关系的，女士，那么我们就单纯的聊聊天也可以。倾诉烦恼、讲述故事，这些都是咨询的一种，问题的发现可以是开始，也可以是结束，或者也可以不是这场咨询里的必要过程，您不必为此感到烦恼，”我抬头，看见她脸上仍然挂着让人感到宽慰的笑容，并且不知什么时候她的手边出现了一个摊开的本子，她快速地在空白的页面上写好日期，然后抬头继续问我，“不过在此之前，我可以知道该如何称呼您吗？或者您觉得直接称呼‘女士’就可以？”
      “非常感谢您的理解，我觉得直接称呼我为‘女士’就很好。”
      “好的女士，我们咨询的费用为每小时25英镑，就跟您手里的传单上写着的一样。这场咨询的开始与结束都由您决定。”说着，她低头拨开桌布，拉开桌子下方的抽屉取出了一个黄色的沙漏。
      我看着她面上令人宽慰的笑容，深吸一口气，张开嘴。这时，我才发现她身前的桌布和她的长裙以及正通过狭小的缝隙缓缓落下的沙子一样，也是太阳一样的金黄色。

      其实非常简单，不过是那种老土的自己身上背负了与其他人的婚约而又爱上了仇人家的孩子的老土爱情故事而已。
      直到讲完这个干巴巴的故事我才将目光从桌布上挪开，抬起头来。凯瑟琳正用右手撑着下巴，毫不回避地直直地看向我。她的眼神锐利，让我想起家里说一不二的父亲。想到这，我禁不住缩了缩脖子——我还记得上次家族里的其他孩子们违抗他时他的反应。
      但我很快就意识到了她并不是我父亲那样的人，我看出来她很快注意到了我的紧张，眨了眨眼，转瞬间便切换成了一个更为柔和的眼神。
      “女士，也许这个问题会有些冒昧，但我认为这是必要的，”她语速很慢，一边说一边目不转睛地看着我，我不自觉地抿起嘴，点了点头，她才继续说下去，“我想知道，您能确定您爱着那位‘罗密欧’吗？而不是将他视为一种逃离家族权威对命运的掌控的手段？”
      我愣住了。这是我在被夹杂着喜悦、迷茫、愤怒、无助的情感洪流所冲击的这段时间里对没有考虑过的。于是我又开始不由自主地做一些会让母亲和礼仪老师不满的事情了——低头，绞手，皱眉，以及让气氛保持令人尴尬的沉默。
      她继续说：“其实人们的感情并不总是文艺作品中展示出来的那样纯粹的——如果真的是的话，那些作品也就不会一直赞美这种纯粹了。纯粹的爱是稀有的，但这也并不代表只有纯粹的感情才是高贵的。事实上，人们的感情总是夹杂着其他东西，源于自身的渴求与欲望无穷无尽，如果人们只是一味地逃避面对这些‘杂质’，也许可以在一段时间里欺骗自己，但这对于漫长的人生来说是本末倒置的。”
      如果是在家里，我估计已经紧张到把整个人都缩起来了。但此时我面前的凯瑟琳女士有这样的魔力，能够让我放松地把我真实的困惑和思虑展现出来。
      于是在不知道过了多久，我终于决定不能把我的零用钱都花在思考这个问题上之后，抬起头询问我能否回去思考这个问题，过一段时间再给出答复。
      她很轻很轻地出了一口气，而她面上的神情并非不耐烦，而是一种近乎“宠溺”的笑容，让我想起总是在我小心翼翼抱怨家里的安排时用指尖轻刮我的鼻子的我的奶娘。
      “女士，您还很年轻，我应该留给您更多的时间以及空间去思考这个复杂的问题的。今天一下子问出口是我欠考虑了，我向您道歉。”身着姜黄长裙的女士欠了欠身，又重新坐直了身子，正色说道，“不过我认为，不管结果如何，了解自己内心的过程终归是一场有趣的探险。”她的语气诚恳得像是她自己也曾经有过一段一模一样的探索经历。
      她耸耸肩，难得露出一个有些狡黠的笑来。我若有所思地点点头。窗外的阳光不知从什么时候开始已经变得有些昏黄了，在经过了几轮的对话以及一段宁静的沉默之后，我告诉凯瑟琳这次的咨询可以结束了。
      “我想我需要好好想想今天的这些问题了，”我一边收拾东西，一边说，“今天非常感谢您。”
      凯瑟琳合上笔记本，拿出一个计算器，飞快地按下几个按键后，将它转了个弯推到我面前：“您不用客气。这是这次咨询的费用，请您确认一下。”
      我付完款，她送我到门口，合上门之前用小时候长辈哄我睡觉时念故事书的语气温柔地笑着对我说：“希望您有一场不错的经历。”

      Day 2
      /主动出击！！/
      我再一次面对那扇门时仅仅是一天之后。我说不清当时再次站在门前的我是什么样的心情，感觉像平静地走入一潭湖水。也许是亲切又敏锐的凯瑟琳给了我这样的感受。这样想着，我敲响了门。
      然而前来应门的并不是凯瑟琳。
      那位陌生的女士绑了两个低丸子头，看似不经意卷出的发尾和散落的碎发实则经过了细致的打理。似乎是看出了我的迟疑，那位女士一边把我迎进门，一边语气轻快地向我解释：“我是今天的负责人，你可以叫我安。”
      “凯瑟琳——啊，就是昨天的那位，已经和我们说过你的情况啦，”她笑眯眯地绕到桌子靠里的一侧坐下——我注意到今天她面前的桌布是绿色的，与此同时，我还隐隐发觉她的声音有些熟悉，她一一取出沙漏和笔记本，摆好放在桌面上，双手撑着下巴，笑盈盈地看着我继续说，“相信您也已经了解咨询的流程了。那么就让我们开始吧，‘朱丽叶’女士？”
      我疑惑地皱了皱眉——昨天我并没有透露我的名字，但我很快反应过来她语气中的打趣，想来凯瑟琳也告诉了她我那酷似莎士比亚笔下的戏剧的爱情故事，以及我昨天确实是这么称呼他的——“罗密欧”。
      “抱歉女士，只是一个玩笑，”安见我皱眉，很快地收起了手，端坐好向我道歉，“如果您不喜欢，我就不再这样称呼您了。”
      我忙摆摆手表示我并没有介意，只是一开始没有反应过来。说完，对面穿着浅绿色T恤短袖的女士瞬间看起来松了一口气。
      “天呐，太好了，”她回头朝东南角那个房间看了一眼，然后迅速做了个鬼脸，小声说，“要是我再把客人气走，凯瑟琳非好好把我收拾一顿不可。”
      我听来觉得有趣，便笑着追问那位给人感觉又温和有礼又聪慧的凯瑟琳女士会如何“收拾”她呢？
      安摇头晃脑地装作沉思了好一会，没有绑紧的缀在后脑勺的两个丸子随着她的动作一颤一颤，然后招呼我凑近点，用手捂着嘴，故作神秘状对我说：“也许好几天不给我吃她做的乳酪司康。”
      然后她便笑得仰挂在椅背上，我也终于想起了我曾经在哪里听到过这样的声音——来自昨天咨询前从那东南角的房间里传来的听上去毫无歉意的道歉声。

      “好吧，女士，如果我们都做好了准备开始工作的话，就请拨动这个沙漏。”说着，安揉了揉刚刚笑得有些僵硬了的玫瑰色的脸颊，将她手边那枚绿色的沙漏推到桌子中央，两人都能轻松够到的位置。
      我伸出手轻轻转动面前的沙漏，翠绿色的沙子便一点点落下。安两手一合，发出一声轻快的响声。我顺着声音的源头将目光从沙漏上移到她脸上。她合十的双手抵着鼻梁，笑着说：“那我们今天就正式开始啦。”
      说着，她哗啦啦地翻开笔记本，看看前面凯瑟琳做的笔记，写下今天的日期，边写边说：“对啦，昨天凯瑟琳问你的那个问题，你想好了吗？”话音和笔尖划过纸张的声音一同停下，安转了个笔花，抬起右手手腕撑在脸颊上，看着我问。
      我下意识咬了咬嘴皮，不确定自己的答案是否足够得体。
      安看出了我的犹疑，摆摆手，说：“亲爱的，不用为此紧张。我们不过是聊聊天，您大可以想到什么说什么。”
      我看着她鼓励和殷切的眼神，开始思索是否是这种对八卦和别人的心理密事的好奇让她在这一行做到了现在。虽然我没有如她所言想到什么说什么——否则我就要脱口而出我方才的怀疑了，不过我还是很坦诚地将我的“课后作业”的结果做了汇报：“我不知道，女士。”
      安有些意外地挑了挑眉，歪歪头示意我继续说下去。
      “我也说不上来我对他是否是纯粹的爱，又或是……利用？我试图想象如果没有那个婚约和父亲对我命运的那些安排我是否还会爱上他，但是，坦白讲我无法想象那样的场景。也许如果是那样的话，现实就不再会是这样了吧？我还为此感到抱歉吗？我无法坚定地说不管身处哪一个宇宙我都会同样地爱他。”
      我抿了抿嘴，看向坐在桌子另一边的人。安了然地点点头，坐得端正了一些，露出一个浅浅的笑——我好像从被她迎进门到现在才第一次见到她这副认真又亲切的样子，正色说：“您不必为此感到困惑，情感本就是复杂又难以条分缕析的。凯瑟琳问出这个问题的初衷也并非责备那些不纯粹的爱——事实上这个世界上又能有多少爱是绝对纯粹的呢？而只是让您思考这个问题，看清楚自己而已。”
      我若有所思地点点头。
      “退一步来讲，即使您刚刚说不能确定在不同的情况下是否还会像现在这样爱他，但至少能确定您现在是爱着他的，不是吗？”安眨了眨眼，继续说，“诚实说来，我认为纠结感情的成分是非常没意义的。人们总是说如果，可是现实就是现实，现实里没有如果。”
      我看着对面说得有些忘我的安，不知道该说什么。注意到正在冷却的气氛，安像突然回了神一样，再次双手合十地躬身笑着向我道歉。
      “天呐，太抱歉了。不敢想象我居然就我自己的浅薄的见解侃侃而谈了这么久。真心希望您不会因此取消后面四天的咨询，我保证我的合伙人们——接下来你会见到的几位女士，不会像我这样想一出是一出。”
      “我并没有介意，女士。我只是在思考您刚刚说的话。我认为它们很有道理。”我诚实地说。
      然而安只是笑着摆摆手，重新从人生哲学回到我的情感议题上来，用高扬的音调询问我和“罗密欧”感情的进展。
      “噢，呃，我想人们一般把这种状态称作‘暧昧’？”事实上，我们自从在刚过去的那个周末在一位共友举办的派对上见了一面互相通了姓名和联系方式之外，还没有任何其他的交流——甚至我们两人都没有迈出在社交媒体上和对方打招呼那一步！
      安听完我的描述，问我喜欢这种模糊的感觉吗。“像爱上一个幻影”，她这样形容。我迟疑了一会，点点头又摇摇头。沐浴在新生的爱情中让我兴奋，但我想我不能一直这样，像她所说的——和一个“幻影”相恋。
      “那您又是为什么一直都不做出任何举动呢？”她把身子往前探了点，稍稍压低了上目线抬眉看我，我怀疑这位经验丰富的女士心里其实早已有了答案。
      我盯着她额前垂下来的黑棕色碎发——我惊讶地发现我像在一个平常的咖啡店和好朋友们聊天一样放松，一边斟酌词句一边缓缓说：“我想，是因为现在太美好了。我有些害怕我的轻举妄动会破坏这样的，呃，如痴如醉？醉生梦死？即使它们只是幻影。我不确定我应该怎样做。”我耸耸肩。
      安重新把身子靠在了椅背上，说：“我了解这样的感受和担忧。人们总是在这样美好得不像现实的感受里患得患失。但是女士，您现在爱的是一个幻影，而您想要了解关于他的更多，想要触摸他的身体、了解他的思虑——”
      我忍不住打断她：“但如果接触之后发现真实的那个他让人难以忍受怎么办？”
      “如果？”安看着我，笑着反问，我意识到自己说了什么，有些不好意思地缩了回去，但安只是耐心地继续说，“女士，当您勇敢地去触碰现实，这些如果便也不复存在了。并且，去了解一个人不会是什么很轻易的事情。去做吧，如果您发现想要了解他的心情盖过了您对未知的恐惧的话。”
      “以及最后一个小建议，”安眨着眼睛轻快地对我说，“如果实在感到紧张的话，不妨这样想：这只是一个选择罢了。不过是一个选择。”
      “祝您好运”——我再次离开那间房间时，安这样对我说。
       
      Day 3
      /请坚定。/
      我再次站到那扇破旧的木门前，带着这段关系新的进展和由此而来的新的疑虑，抬手第三次敲响了面前的门，隐隐地开始期待这次的咨询会给我带来怎样的启发。
      门开了，站在房间里的是一位气场柔和的金发女人。她身着一条垂顺的珍珠白长裙，屋内的灯光打在她身上，我仿佛看见了月光下的喷泉上的女神石像。因而我愣在了原地，直到对方先开了口，我才反应过来。
      “您好，女士。我是今天的负责人，我是简·西摩，您直接叫我简就可以。”
      我点了点头，看着她像前两位女士一样，依次从深蓝色桌布遮盖下的抽屉里取出笔记本和沙漏——我注意到今天的桌子上预先摆好了两杯红茶和一盒雪白的方糖。
      她注意到我的眼神，笑着解释说：“我们刚买的新茶杯，想着得摆出来用用才行。但是不知道您爱喝什么茶，擅自给您盛了红茶，需要换掉吗？”
      我连忙表示红茶就可以，不用太麻烦。
      她了然地点点头，翻看笔记本，说：“我想您应该已经了解我们的流程了——我们按时收费，每小时25英镑，开始和结束都由您说了算。”
      “那么，没有问题的话，”她抬起头，将盛满深蓝得近黑的沙漏推到我面前，然后收回手，平静且温和地看向我，说，“我们今天开始吧？”
      我转动了沙漏。

      “先说说您取得的进展如何？我记得昨天安给了您‘主动出击’的建议。”
      “呃，我添加了他的社交媒体账号……”我舔了舔嘴唇，不自觉地绞着手指，抬头看见简的微笑，抿了抿嘴继续说，“嗯，然后我们简单寒暄了几句……”
      我又把头低了下去，我又想起昨天安用打趣的语气称呼我们为“罗密欧与朱丽叶”，但我此刻无法不因此感到羞愧，因为显然我并没有那古老的爱情经典中的主人公们所拥有的勇气。
      “就是这样。”我呼出一口气，有些自暴自弃地说，脑海里不由自主地开始涌现旁人失望的表情——连我自己都无法想象，在经历了这么多鼓励和帮助之后我的状况还是如此一筹莫展。
      但下一刻，我的手被虚虚握住了。我的视线顺着那双手往上，简的脸上丝毫找不出方才我在脑中编排出的失望神情。她还是微笑着，轻轻拍了拍我的手，然后像流水一样抽回她的手，重新坐好。
      “女士，您大可以抬起头来，因为您真的很勇敢。”
      我有些惊讶地抬起头，简向我眨了眨眼，继续说：“人们总是向往那些经典戏剧中的角色的浪漫——当然，我也不是说这不值得被向往，我只是想说，很多时候，也许是人们对这个故事都太过于熟悉了，所以他们都忘记了那些角色也是人，而只是把他们抽象成了一个符号或是某种象征，也因此人们也忘了他们所付出的代价是如何高昂，擅自将他们的行为简化成了口号，并以此来评判身处现实中的人们——”
      我讶异于她话语中流露出的些微不满，以及眉头间一瞬的隆起。她喝了口水，耸了耸肩继续说：“我认为这是过分傲慢的。”
      “所以您也没有必要因此而责怪自己不够勇敢，毕竟只有您才知道迈出那一步有多艰难不是吗？人在评判他人时总是先入为主地带入自己的经验，但是每个人都是不一样的呀。所以请不要再预设那些局外人对您的行为的评价了，至少请坚定地跟从您的心声。”
      我迎上她诚恳的眼神，想起了夏天里那些坐在窗台上一边吹着风一边看着月亮发呆的晴朗夜晚，身心都放松下来，告诉她我的担忧。
      “我可能还是不确定，为了爱情，值得吗？”
      坐在对面的金发女士沉思了一会，将头发重新别在耳后，说：“您还没有和您的家里人说过这件事吗？”
      我摇了摇头：“毕竟，这本来也是八字还没一撇的事情……”
      “我不只是在说您和那位‘罗密欧’的事，女士。您不想要接受婚约的事，也没有说吗？”
      我又摇了摇头，看着对方询问的眼神，不知道该说什么。为什么没有和家里的人说过呢？这个问题对我来说陌生得就像一颗光年之外的星星——与我分处两个世界。我突然意识到“与家人倾诉”这个选项从来没有出现在我的脑海里过。我不禁开始想象如果我这样做了会得到什么样的后果：母亲的无视，父亲的愤怒和训斥，同辈们的不理解和议论……我没办法把我的所有都交付这样的结果——我这样告诉她。
      “我不信任他们。”
      房间里沉默了好一会。就在我以为她要和我曾经遇到过的很多人一样开始措辞劝诫我试着依靠家庭时，我听见她叹了口气。
      我没有抬头，她的声音从我看不见的地方淌过：“‘家人’真是我们一生都难以完全解决的课题，不是吗？虽然社会极力地在人们心中给家庭树立成了一个温暖的港湾的形象，现实却总那么不尽如人意吧。我不了解您的家庭情况，想来也没有资格对您的家务事妄下评论，方才是我唐突了，我向您道歉。”
      我摆摆手，做了个鬼脸，说：“您不用为此道歉，这完全没有冒犯到我。不如说，我还挺希望有一个机会能这样尽情地谈论他们呢。”
      “那么我很荣幸我得到了这个机会，”简眨了眨眼，我注意到她之前一直有些紧绷的肩头也放松了下来，“我想我们这儿的其他几位女士也不会关注到这个方面的，毕竟我是我们当中唯一一位有孩子的。”
      我先是意外地瞪大了眼睛，但随即脑海里便浮现了简照顾孩子的场面，我相信她一定会是一位合格的母亲。我向她坦言在我小时候，我经常希望我能有一位像她这样的母亲。
      她歪了歪头，等着我继续往下说。我端起茶杯，抿了口茶水，混着和口腔肌肉的酸涩感一起分泌出来的口水咽下去，笑了笑，说：“我的那位母亲总是对我视而不见。我曾经尝试过和她诉说我的感受，但她一直很冷漠……我并不因此记恨她，只是我时常在想如果我有另一位母亲——您这样的、就像故事中那些愿意关爱自己的孩子的母亲，那该有多好。”
      简笑了，说：“我有时反而觉得我太过于干涉孩子自己的生活了，还时常觉得自己是不是控制欲太强了很糟糕呢。”
      “不过不管怎样，”她拿起茶匙搅了搅茶水，眼睛仍看向我，说，“我都希望您能够有一个支撑，家人、朋友，都可以。您就当这是一个母亲的过分担忧吧，但我不希望您在这场感情中做一个孤胆英雌——就像朱丽叶那样。我们应该有足够的手段去避免那样悲剧的出现了，不是吗？”
      “可是我现在可以和你们倾诉，这不算是一个支撑吗？”我不明白地皱起了眉。
      简摇了摇头，说：“不，女士，这还不够。我们并不能总是在您身边，也不够了解您的情况。甚至说，我们只是一群靠着自己的生活经验来高高在上地提供一些极端个人化的很难称得上‘建议’的建议的人。”
      “可是我身边似乎并没有这样能够成为我的支撑的人……”我舔了舔嘴唇，继续说，“况且，我也担心如果我身边有这样一个人的话，我就不能像您之前说的那样坚定自己了。”
      “您不用担心这个，亲爱的，”简露出一个鼓励的笑，“只要时刻记住倾听您自己的声音，不要让它被那些来自他者的洪流所淹没。我明白试着去相信别人很难，但我还是希望您能去试一下。”
      我看着简诚恳的眼神和她轻轻搭在我手上的手，心想这是否也是她第一次这么强势地期望别人做一件事，艰难地点了点头。

      Day 4
      /你就是女王，自信放光芒！/
      我第四次来到咨询所的时候，我面对的不再是那扇破旧的门。不过很遗憾，它并不是像我无数次幻想过的那样被折磨到终于退休了，而只是被打开了。我站在那个光秃秃的门框前，因习惯而提起的手腕愣在胸前，直到一个身形高大的女士含笑站在我面前将我迎进门，我才反应过来。
      她随性地鞠了个躬，自顾自开始说：“她们都不爱开门，可能是因为喜欢听那老家伙呻吟的声音吧——”里间传来一阵不满的抗议声，我跟前的女士状似无辜地朝我挤了挤眉眼，耸了耸肩继续说：“总之我还挺喜欢把门开着的，毕竟，您瞧那可怜的老东西，想来经不住那么多敲打和推拉开关了。啊不过等咨询开始之后我会关上门的，这个您不用担心。”
      我点了点头，熟练地拉开椅子坐下。
      她起身关上那扇吱吱呀呀的门，又坐回来把东西摆好，然后有些严肃地和我说：“对了，简托我来帮她和您道声歉。”
      我疑惑地看着她。“她说她昨天的态度有些太强硬了，还说她似乎从来没有这样激动过，她自己也不知道这是怎么一回事。昨天您走后她反省了很久，十分担心您会因此产生心理负担。”还没透露姓名的女士有些无奈地复述着她过分替别人着想的同事的话，边说边从手边的笔筒中抽出一支笔拿在手里把玩。
      我有些受宠若惊地摇了摇头，赶忙说：“我完全没有因为简女士的建议而感到不舒服。不如说，她的建议让我感到茅塞顿开呢。若不是她那么坚定地劝说我，我……我可能就会迷失在这段关系中了。总之，我真的十分感谢她的帮助。我刚刚说的，也请您务必转告给简女士。”虽然我想她在里间应该能够知道客厅中发生的一切。
      留着利落斜切短发的女士眯了眯眼，笑着说：“我也是这么想的。简她总是太焦虑了，明明大家都爱她。哦对了，我是不是还没做自我介绍？我也叫安，克里维斯的安。和您前几天见到的安是同一个名字，如果您不介意的话同样这样叫我就可以。”
      “好吧，安，那么，我想我们今天可以开始了。”
      安轻推沙漏，交叠好双手，挺直脊背，朝我点点头示意我开始。

      “呃，首先，我的进展，对吧？”我深吸一口气，“我们两个在一起了。”
      安意外地挑了挑眉：“噢，这真是……好吧，我们都没想到进展能够这么快。看来你们两个都对这份爱情渴望很久了，是吗？也许你可以讲讲这个过程？”
      “其实也没什么过程。我昨天离开之后，像简建议的那样，先和我原定的未婚夫挑明了我的心意。然后，非常幸运的，他似乎对此并不介意。当晚，我就和我的父母说明了我的意向——”
      我拿起茶杯抿了口茶，继续说：“总之，经过了一些艰难的说服吧，但最终他们妥协了。不得不说，这真的让我感到放松多了，最终结果也比我想象得要好得多。然后我立马约了他，到一个公园里。在那里，我们同时表白了。”
      安放下茶杯，杯底和杯碟相碰发出清脆的响声：“听上去很顺利。”
      “是的，我是说，呃，这听起来真的很顺利不是吗？”我低头看着茶杯中自己的倒影，支吾着说，“好吧，我知道这个担忧可能会看起来很蠢很矫情，但是——我离开他之后，总是在想，我和他相处时的一切都不像我自己本来的样子……这样真的好吗？”
      坐得端正的安抿嘴沉思了一会，随后有些不解地问我为什么会这么想。
      我不自觉地卷着发丝，感觉像回到了第一次走进这间房间时的样子，紧张地咽下一口唾沫，抿了抿嘴，不知道该怎么解释心中的那份异样。
      “女士，我想也许我能够一定程度上理解您这种心情。”
      我有些讶异地抬起头，毕竟从我见到这位女士开始，我就从没有设想过她会像我一样被困在这些别扭的感情中。面前的安仍一动不动地叠手端坐着，尽管她面上并没有带着明显的笑意，我却能够从她没有明显起伏的语句中听出几分安慰，我也因此重新放松下来。
      “也许您能感觉出来，我是那种在独处时倾向于保持安静和冷静的人，但是，当我和其他人在一起时——”安顿了顿，稍稍往屋内那扇紧闭的房门处偏了偏头，边耸肩边露出一个无奈的笑，我顺着她偏头的方向望去，有一瞬间，我以为我有过那扇门看见了门后坐姿各异的其他女士们。安耐心地等我收回目光，才继续说：“好吧，就是和她们在一起的时候，我却是很兴致高涨的。”
      “一开始的时候，我有时候在结束聚会回到独处之后不自觉地反思自己：我和她们待在一起的时候会太过了吗？”
      我听着她的叙述，缓缓点了点头，感觉我心中某种无法言说的情绪的面纱正在一点点被剥落：“后来呢？”
      安看着我，在这次咨询中第一次将身体的重心从正中移到了身体的左侧，将上半身全部压在椅子的左扶手上。尽管放松了姿态，她的坐姿也并不显得轻率。
      “后来，我自己想通了。我之所以担心自己会看起来太过是因为我怀疑我不是真心的，我担心我是为了迎合她们之间的氛围才戴上了这样的社交面具。我害怕我会因此厌恶自己的虚伪和这段关系，也担心如果这种事败露了的话，她们不再会和我联系。但我现在百分百确定，我那样做是真心的。”
      “并且——”安的眼神飞快地朝里间瞟了瞟，“现在我相信我，也相信她们。不过我得承认，这实在是有点难办，不是吗？”她露出一个轻松的笑，似乎是在试图用它来抚平我眉心的褶皱。
      我揉了揉眉心，不确定地问：“那如果我永远无法确定我是不是真心的，我就要一直受这种担忧的困扰吗？我觉得我似乎并不是很擅长探索自己……”
      安喝了口茶，说：“我确实有一个更直接的办法，虽然要完成它也并不轻松，不过，好吧，它至少听起来很简单。那就是——永远相信自己，永远不要习惯性地责怪自己。不管身处于怎样的一段关系之中，都不要忘记你首先是你自己，而非是'他的恋爱对象'，或其他人的谁。”
      “我想我不是很明白，我很抱……”
      “您不需要为您的不理解而感到抱歉，”安果断却并不严厉地打断了我的话，我不禁开始不合时宜地揣测，她是否也曾经在无数次自己自责的时候对自己说过一样的话，“虽然也许您很快就会亲身体会这一点，但我还是想现在告诉您：在一段人际关系中，一切都是由关系的双方沟通构建的——一切美好，一切矛盾。因此，也就没有什么歉意是您需要独自承担的。”
      我犹疑地点了点头，在感到身体比今天刚迈入房间时轻松了不少的同时，还感到身体里有一股温暖的力量正在蔓延。

      那天，我最后离开房间时仍在想那位说话利落张扬的女士所说的对我仍有些晦涩的语句：一段关系是由两个独立的“人”所构成的。
       
      Day 5
      /甜蜜的爱～/
      “下午好，女士！您今天看来气色真不错！”——我再次推开那扇门时，迎接我的是一个听来大概和我年龄相仿的声音。我边关上门边循声望去，看见门边的岛台旁靠着一位扎着高马尾的女士，她正在将刚热好还冒着热气的牛奶倒进红茶里——我注意到她手上的茶具正是前几天简用过的。注意到我的视线，她解释说：“每次简买了什么新东西，都总要让我们多用用多用用。”
      “她只是不想被我们说她只是因为好看就买了这些小东西，”她从茶杯中分出一些视线朝我挤挤眉毛，耸耸肩，凑近了对我用气声说，“尽管大家都明白就是这么一回事。”
      我被她的动作逗笑了，以至于接过她递到我怀里那杯暖手的奶茶时差点因为没有及时平复下来而将奶茶洒出去。扎高马尾的女士低头轻呷了一口满到杯沿的热茶，然后像在阳光下打盹的猫一样满足地眯起眼，过了一会儿才回过头来对我说：“用新茶具确实会让人心情变好，是不是？”
      说完，她舔了舔嘴唇，仰头将杯子里剩下的奶茶一饮而尽，然后将茶杯轻轻放回岛台上，捋了捋她深棕色的长发，朝我走来，拍拍我的肩膀，眨了眨眼，有些不好意思地说：“工作的时候喝奶茶的话我会走神的，所以我就先喝完啦。因为我没想到您今天这么快就来了，而我不大接受煮好后又放凉了的牛奶，抱歉啦。”然后接过我手里小心翼翼端着的杯子，放到今天铺了亮粉色桌布的桌子上——老实说，这颜色没有周三的深蓝色桌布那么搭配，帮我拉开椅子后绕到对面坐好。
      熟悉的笔记本、笔和沙漏……好像一切都已经准备妥当了，她有些兴奋地合手，发出一声清脆的拍掌声，对我说：“那么，我们今天开始吧？请原谅我的兴奋，我大概确实像安她们说的那样没什么见识。”
      然后我们两个同时意识到了有什么事情不太对——我正要开口，却突然发现自己不知道该如何称呼这位年轻的女士。她一拍脑门，低声哀嚎了一声，向我道歉：“女士，我真的非常、非常抱歉。你瞧，因为每次的客人大概遇见安她们的时候问题就被解决了——或者是被她们逾矩的举动（她又朝我调皮地转了转眼珠）赶走了，所以我已经很久没有和客人们聊过天了。请原谅我的冒失，并且请相信在我后面的那位凯瑟琳是一位十分值得您拜访的女性。”
      老实说，虽然她从头到尾没有提她口中的“安”是哪位，但我自动将她与周二的那位对上了号。但是除此之外……
      “您是说，这儿还有另一位凯瑟琳？”
      我对面的女士又露出那副调皮的神色，对我说：“是的，事实上，还有两位。我也叫凯瑟琳。”
      “好吧，这位年轻莽撞的凯瑟琳，我想我们今天可以开始了。”我抱着一丝好奇看着面前刚把她柔顺的长发尽数拨到胸前的凯瑟琳，推动了沙漏。

      也许是方才的谈笑让我放松，又或许是凯瑟琳和我相仿的年龄让我感到亲切，我少见地主动聊了起来，我告诉她昨天我们去河边的公园约会，他问我喜欢喝什么样的咖啡，我又问他喜欢看什么样的书……我滔滔不绝地说着诸如此类流水账般的乏味话语。当我终于意识到这一点并不禁为此感到有些抱歉时，我看到桌子对面的女士正用右手撑着脸颊，饶有兴致地听着。随即我意识到在我的讲述中穿插的各种短小但富有热情的回应正是来自于她。
      “然后呢？发生什么了吗？”注意到我停了下来，凯瑟琳收起手，歪头问道。
      我摇摇头，说：“不不不，那天一切都很顺利。我们逛了公园、聊了天、一起吃了下午茶、对彼此都有了更深的了解……尽管我发现我们之间并不是完全一致的，但我仍然觉得能够和他交流、能够了解他的想法是愉快的。我觉得那次约会甚至可以说是完美的。”
      “嗯，听起来真是不错！我一直非常希望有一天可以充当一位甜蜜的爱情故事的倾听者。”凯瑟琳高兴地转了转手中的笔，狡黠地眨了眨眼，继续说，“不过，您今天来应该也不只是为了这个吧？”
      我有些诧异地愣住了。她继续说：“您瞧，您语气中的——呃，该怎么说，可以说是一种叹惋吗？总之，这种情绪像是无孔不入的老鼠，随时随地准备好了在您的讲述中冒头。”
      我抿了抿嘴，似乎是出于本能地想把正如凯瑟琳所说的那份正不断在我心里冒泡上浮的“叹惋”重新压下去。但最终我还是没有这么做，我迟疑地点了点头，说：“我想，这也许确实是一种‘叹惋’。我总是止不住地想如果我们最后分开了……天呐，这听起来一定很傻，不是吗？我是说，我们待在一起的时候总是很快乐，但……我实在是不知道为什么。”
      “这可真是一份太甜蜜了的爱啊，”凯瑟琳轻轻叹了口气，颇同情地看着我，耸耸肩说，“人人都说着‘要活在当下，不要去想那些太遥远的事情’。可事实是我们并不知道那个存在于我们不好的想象中的未来什么时候会来，所以我们只能提心吊胆地试图每天都做好迎接它的准备，以免被出其不意地击倒——当然，就我个人的经验而言，这些努力都是徒劳。”
      我深有同感地点了点头：“我总觉得我生命中总有一个声音无时无刻不在提醒我不要太过于为未来焦虑，但……我真的做不到，至少我现在真的没办法不去想那些。”
      凯瑟琳对上我求助的眼神，低头沉思了一会，才对我说：“好吧，这只是我非常个人的建议和做法，可能不是很适合您……虽然这听上去有点消极，但我发觉这样想会让我更好受一点——那就是相比于告诉自己‘活在当下’，你得告诉自己‘去感受’。虽然在有些语境中这两者的意思相差不大，但我觉得后者听来更容易执行一些。”
      “去感受？”
      “是的，去感受。感受你在这段感情中各种愉悦、痛苦，包括你的焦虑、惋惜……去感受这些情绪和情感，体会它们在你心里流动的时刻，然后你也许会发现自己在这种体会中平静了下来——至少这是我个人的经验所得。”
      我边点头边端起茶杯抿了一口已经凉下来的奶茶，她继续说：“之前有人在我困惑时说如果放任自己的焦虑不管，会浪费这些带给我快乐的时光。但是，我得说我并不是很喜欢这种说法，这反而会让我觉得更有压力。而且，会让我觉得感到焦虑是一件应该被责备的事——”
      她做了个鬼脸，说：“这真的很无辜。我倒觉得‘焦虑’不应该处于和现实对立的位置上，它不也是出于现实而发的吗？坦白讲，您会因为担心这段关系的结束而感到焦虑，不也是因为在这之中您感受到了太多的爱吗？这些甜蜜的爱让人流连忘返，可天底下却没有不散的筵席。我想，当人们想到这些的时候都难免对未来感到焦虑和恐惧吧。”
      我注意到她的眼神中流露出一丝怀念的神情，一时不知道该怎么去回应她的话，过了一会，才不确定地问：“我可以知道您是什么时候和这种情绪和解的吗？”
      她短暂地愣了一会，露出我在山川间漂流时在同船的人脸上见到过的沉醉的表情，几秒后她才像从“山川”间回过神来一样，笑着说：“‘和解’，我喜欢这个词！我的这个过程应该花了很久，甚至我现在也不好说是否能确定已经完全和它和解了。但是我向您保证，这会是一个愉快的过程。”
       
      Day 6
      /亲爱的，这不会是终点/
      我不知道我是出于怎样的心态再次敲响了那扇门，我的亲密关系目前为止没有出现任何问题，但不知不觉间我还是来到了那扇门前，所以也许我只是想来见一见最后这一位凯瑟琳——或是什么其他的，我不清楚。我意识到当我走向这间房间时我的脑子总是不清楚，就像它向我施了什么引诱人们走进去的魔法一样，连带着脑子里心底里隐约的显而易见的那些问题都跟着一起一个一个往外蹦。
      但事实上我在门后见到她的那一刻我就明白我今天为什么会来了。门框里正握着门把手的女士将泛着些红调的棕色短发拨到耳后，侧身将我迎进门。我坐在那个熟悉的座位上，看着她熟练地为我端来茶具和柠檬水，在脑内悄悄把前几天那位凯瑟琳将自己忘记介绍名字的粗心归因于在她前面值班的同事们的话语判断为甩锅——因为很明显，这最后一位凯瑟琳对工作内容十分熟悉。
      不过，就算我就此向她提出控诉，她大概也会机灵地为自己找到借口的。比如说“她以前的工作就是这些内容所以她当然对此很熟悉啦”之类的。想到这里，我不由得笑了。短发的凯瑟琳此时刚好完成了准备工作，隔着一张桌子在我的对面坐下，好奇地问我想到什么了笑得这么开心。
      我摆摆手，说：“上次那位年轻的凯瑟琳告诉我，您是一位非常出色的女士，让我就算没有什么问题了也要抽空造访。”
      凯瑟琳听言，有些不好意思地捂住脸，用难以置信的语气问：“她真是这么说的？”
      然后我仿佛听到里间传来一声不满的抗议，不难想象出被告状的女士正在委屈地反驳自己绝对没有这么说过，至少后半句没有。我耸了耸肩，过了几秒，我面前的人才放下挡在脸上的手，露出一个令人放松的笑，问我：“所以，您今天是否真的有问题呢？”
      “其实进来之前，我确实不知道今天为什么要过来，”她听到这个回答，微微挑了挑一边的眉毛，我继续说，“但老实说，见到您之后我就明白为什么了。不过我不清楚这是否合规，您会不会介意……”
      她点了点头，鼓励我继续往下说：“我想知道，您的——或者说您们的故事。”
      凯瑟琳有些意外地“噢”了一声，过了半晌，才不自觉地边揉下巴边说：“我们的故事？您是指我们的那些爱情故事吗？我的话，完全不介意。但是其他几位的，请原谅，我可能要先征得一下她们的同意才行。”于是她在我的感谢声中拿出从刚刚开始就震动不停的手机，只略略扫一眼便将它重新收起来，告诉我她的同伴们也很乐意由她代劳“忠诚”地分享她们的故事。

      “从哪里开始说起比较好呢？”凯瑟琳用笔抵着下巴，抿着嘴思考了一会，才继续说：“我们曾经和同一个人谈过一场有些糟糕的恋爱——有人被羞辱；有人被欺骗；有人被伤害；有人差点失去了自己珍视的东西；有人被迫接受了自己计划之外的东西……倒不如说我们每个人都或多或少地经历了这些吧。”
      我有些难以置信地睁大了眼睛：“同一个人？”
      凯瑟琳眨了眨眼睛，轻笑一声，说：“是的，甚至几乎可以说是同一时间段内。不过，那时的我们并不知道另外五位女士的存在。我是在一个联谊派对上见到他的——非常经典的‘钓鱼’场所，可不是吗？他向我搭讪，然后我们就很快地确认关系了。大家基本上都是这样：在某个地方遇到，然后发现自己和他很投机，于是就这样进入一段关系中了。不过，在这方面，我大概是比较幸运的一个。因为我在陷得更深之前意识到了一些不对劲的地方——”说到这里，她捋了捋头发，轻轻拿起面前的茶杯，喝了一口又轻轻放下——我几乎没听见杯底和杯盘碰撞的声音。
      “我发现除了我之外，他还在和其他女士约会。当我在某一天向他提起这件事的时候，他像发了狂一样开始贬低我。”自我走进房间以来一直挂在她脸上的得体的笑容在讲到这里时减退了几分，但与之相反的是她语气中从始自终的距离感和平和，仿佛她刚刚所说的都并非自己曾经的遭遇。她耸了耸肩，继续说下去：“是不是蛮有意思的？明明是自己做错的事，被指出来的时候却可以这样攻击可以说是‘受害者’的我。不过，不管怎样，我当时就和他分手了。只是，当时我脑子里冒出了另一个念头——”
      “您去找了和他约会的其他女士？”我忍不住插嘴问。
      凯瑟琳点了点头：“我想办法联系上了她——也就是简，然后她告诉我她其实也发现了那个男的同时也出轨了另一个女孩。但是因为她那时还在留恋他们在一起时那些令人愉快的时刻，她一直没有下定决心和他分手。但她后来告诉我，其实在知道我当时的来意的那一刻她就决定要分手了。她说，有时候在一段关系中就像在一个蛋壳里。外面的人一敲就碎了，但是在里面的人却始终身处黑漆漆的空间中，觉得待着不动是最安全的。”
      “简发现的那个女孩是我们之中最年轻的一位，也就是您上次见过的那位凯瑟琳。她当时刚毕业，是一个摇滚乐队的主唱。我们找到她的时候，她告诉我虽然她不知道那个男的是否有出轨其他人，但她知道她的上一任是谁——事实上，一开始就是那个女孩让凯瑟琳认识了他，她们之前是同一所大学里的同学。”
      说到这里，凯瑟琳歪了歪头，似乎是在尽力回忆当时的场景：“当时那个女孩的反应让我印象很深刻，她几乎是在我们简单说明了之后就直接拿出手机，果断地打电话分手了，就像她早就知道会是这样一回事一样。后来她带着我们和安——她的大学学姐，见了面，就是您第二天见到的那位安。”
      “大概是在见面前凯瑟琳就和她介绍过了我们，我们一见面她就很热情地告诉我们在她还和我们共同的前任在一起的时候，她就发现自己被当成了第三者——不过现在看来这个数字可能不只是‘三’了，”凯瑟琳笑了笑，继续说，“安说有一天有一个陌生的女士给她打了电话，电话中的那位女士非常‘没有礼貌’地——我得先声明一句，这就是安当时充满戏剧性的原话，我绝没有半点添油加醋，宣告自己的‘正统地位’，并且要求她和那个男的分手。那时她一挂断这通电话就去质问他了。结果她像我一样被臭骂了一顿，然后离开了他。”
      “‘如果你们需要的话，我可以帮你们联系那位颇有威严的女士。’安当时笑着这样和我们说，而这也是为什么我们联系上了最后一位凯瑟琳。不过，当我们见到她的时候，她并不像安向我们描述的那样高傲。她当时平静地告诉我们自己已经恢复单身了，并且不想再和任何有关那段糟心的感情有关的事情扯上关系。”
      凯瑟琳注意到茶杯空了，重新将桌面上的两只茶杯重新斟满柠檬水，然后小心地端起喝了一口，才继续说：“到后面我们渐渐熟起来了之后，才知道在我们这群人中，她是和那个男的纠缠最久的。他们两个人是相亲认识的，双方的家长也希望他们两个能在一起。所以与其说是因为感情，可能更多的是一种莫名其妙的‘责任感’在困住她吧。”
      “另一位安则是自己来找我们的——我想也许那时候我们的动静已经有点大了，总之她不知道从什么地方听到了这个消息，和我们见了面。她也是在一次联谊会上见到他的，并且在那之后他们还出去约会过两三次。但每次他都会借机攻击她的性格、喜好，甚至长相，于是没过多久她就在各个社交平台上把他拉黑了。后来我们一对时间线，发现他在和安约会的同一时间段，也在和简交往。”
      “你们聚在一起之后，干了什么呢？我真希望你们有恶狠狠地惩罚那个糟糕的人。”我皱了皱眉，急切地问。
      “我们是有想过一些‘恶狠狠地惩罚’的方式，”凯瑟琳忍俊不禁，“比如把他关进什么地方一人扇几巴掌再踹几脚这种——不过，很遗憾，我们没有。最后，我们只是聚在一起，‘恶狠狠地’把他做过的事情发到了网络上。”
      “然后呢？没有了吗？”
      凯瑟琳耸耸肩，摊开手，环视我们正置身于的空荡荡的房间，说：“当然有然后。然后我们‘恶狠狠地’从那荒谬的经历中吸取了教训，走到了现在你面前我们的样子。”

      等到桌面的黑色沙漏快要漏完时，我们也结束了这一次的对话。凯瑟琳将我送到门口，在她向我挥手关上门的那一刻，我猛地转身拉住门把手，有些恳切地问：“以后我还能来吗？即使我没有遇到什么值得探讨的问题？即使只是这样聊聊天？”
      凯瑟琳被我突如其来的转身惊得微微瞪大了眼睛，过了一会才笑着说：“当然可以，即使您的这段感情结束了您都可以过来，只要您的人生还在继续。”
