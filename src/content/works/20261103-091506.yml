title: 她杀了我
author: /
cp:
  - Chansaw
updated: 2026-02-22
summary: Heather·Chandler出席过两次葬礼。
chapters:
  - body: |-
      好吧，我死了。这真是意料之外——

       
      情理之中。Heather·Chandler 看着脚边自己死状狼狈的尸体以及尸体旁同样看起来有些狼狈的Veronica和她的那个小甜心JD自然而然地接了一句。

      随即她疑惑地想自己怎么会想到要接这个词，就好像这是一句什么约定俗成的咒语一样，就像冬去春来一样自然。然后她想起来某次考试结束之后，她从Veronica写满字的文学答卷上扣出了这么几个字。当时她还对此嗤之以鼻，说这不过是一个普通得像废话的特点罢了，居然还值得被人铭记。

      如果让那群书呆子答这道题，他们大概会说：一方面，Heather·Chandler的死亡是意料之外，因为她没有料到自己会死于装满清洁剂的醒酒汤；另一方面，Heather·Chandler的死亡同时也是情理之中的，因为她是Veronica·Sawyer最大的敌人。Heather对自己脑子里冒出来的场景翻了个白眼，她还说我是她最大的朋友呢，这又是什么“情理”？

      不过不管怎样，Heather意识到这样的结局对她来说确实是“情理之中”。

      自从她在厕所看到她的第一眼，她就知道，这个女孩“可以”杀了她。至于是她觉得Veronica有这个能力，还是她认可了Veronica有摆弄她的身体的豁免权，她并没有分得那么清楚。毕竟，作为一个活力四射的高中生，死亡还是离她太远了，所以她也很快就把这个念头抛到脑后了。直到变成了一个不再活力四射的永恒高中生鬼魂，她才重新开始捡起这个奇怪的念头——Heather·Chandler怎么会同意别人摆弄她自己的身体？

      所以，一切都是从哪里开始走偏的？


      她想起有一次跟着父母参加家里不知道哪个亲戚的葬礼。葬礼上一个个穿着黑压压板正服饰的男男女女像食堂里排队打饭的学生一个接一个走到她父母身边，翻来覆去地说着那些状似悲伤的话语——什么“通往极乐”啦、“灵魂安息”啦、“离苦得乐”之类云云。Heather强忍住翻白眼和无聊得打哈欠的冲动，一边在面上跟着所有其他黑压压的人一样拙劣地摆出内敛悲痛的神态，一边在心里默默嘀咕着这群故作深沉的大人，嘲笑他们对这个世界毫无还手之力，只能自欺欺人将无趣的“安息”称作“极乐”。

      可能是报应吧。此刻正一刻也无法安息地飘在半空中的Heather的亡魂想起几个月前自己不屑一顾的想法时面无表情地想。

      还无需面对死后世界的Heather正无所顾忌地在心里鄙夷着葬礼的无趣。于是她溜到一个没有其他人注意的角落处，在一众手机联系人列表中鬼使神差地挑中了那个最朴素的“vs”——她甚至没有大写首字母，这让她现在回想起来有些哭笑不得。

      对方几乎是在响铃的一瞬间就接通了电话。

      “我给你发个地址，现在过来，”Heather毫无耐心地打断了Veronica那些礼节性的寒暄，听筒另一边的人不知用怎样的一种发声方式嗯嗯啊啊了半天，她才在对方看不到的地方犯了个白眼，打断了电流滋滋啦啦送来的“发生什么了”，简短地补充道，“有派对。”临挂电话前还不忘命令对方一句十分钟之内到。她知道Veronica的家离这里不算远。

      后来她还真的在计时器分位数打成10的那一刻赶到了，穿着她一贯的那件蓝色波点内衬西装和裙边卷到能隐约露出大腿根的短裙，而几分钟前喊她过来的人此刻站在她面前，身上是Veronica从未见她穿过的黑得人发晕的西装套装，连标志性的红色发圈都少见地没有出现。

      Veronica讶异地盯着她身上板正——即使她注意到衬衫的扣子和下摆都并没有被整理成和这套套装相符的庄重模样——的衣服，在由跑动引起的喘气声的间隙说：“噢，我想，我忘了你和我说过这次的dress code是——是什么？”

      Heather被她的话语逗笑，一把拽下身上颜色浓重得像默哀的外套系在腰上，又近乎蛮横地扯开衬衫袖口的扣子，将亮白的衬衫袖子往上卷，说：“没有dress code，不过你迟到了，派对已经结束了。”

      身穿亮色短裙的人注意到她黑色外套胸口别着的白得刺目的不知名花，心里对面前人口中所述的“派对”的真实情况有了猜测。一时之间，她有些拿不准该如何回应这个恶劣的玩笑。Veronica下意识擦了擦自己的鼻尖，扭过头，看着不远处的草坪问：“这是谁的——”

      “我允许你问这些了吗？”Heather高声打断她的问句，伸出手捏住Veronica的下巴，将她偏开的头掰正。那时葬礼已经结束了，天色也早已暗下来，她们都不太看得清对方的表情。但Veronica不难想象出金发女孩面上的怒气，Heather也能从手上平和的呼吸和暗色中模糊的线条看出对方的平静。她们两人大概在这时便早已习惯这种关系了——Heather用时不时宣泄的怒气来维护自己的地位，Veronica也不会像一开始时那样对所有斥责都诚惶诚恐，而是学着像另外两位Heathers一样只是回到“原位”。

      她耸耸肩，不再说话，也没有挣脱掉那只一直拖在自己下巴上的手。

      也许是傍晚的风吹得有点凉了，Heather松开手，解开系在腰上的外套囫囵穿好，先前随意塞进胸口口袋的白花也随着这一阵和轻柔小心搭不上边的动作掉在了地上。

      “给我过来。”Heather穿好外套转身就走，不容置喙的声音被风和二人之间拉大的空间扯得也虚幻了不少，虚幻到Veronica几乎要怀疑是不是自己幻听了。也许是鬼魂在对我说话——她甚至有一瞬这样想。不过她只因此犹豫了一秒便快步跟了上去，因为那天晚上的风确实是有些让人发凉了。Veronica搓了搓裸露在外的大腿，不露声色地将自己的外套扯得紧了些。

      她们二人之间其实很少有像那天一样的沉默，多数时候另外两位Heathers都会是话题的开启者，Veronica则会在合适的时候短暂地附和几声，或是加入女孩们张狂的大笑声中；有时是Heather随心所欲地发号施令……

      总之，Veronica在跟在Heather身后的时候突然发现她和她之间从来没有过这样的安静，仿佛置身于真空之中——不过紧接着她意识到这种诗意化的表达在她们的关系中是十分格格不入的。她们之间并不是那种能用柔软的语言来描述的关系。

      就在Veronica还在思考应该怎样更好地形容这份安静时，它就被打破了。

      “你有没有想过你的葬礼？”Heather站定，扭头问，Veronica抬起头，只能看见她被夜色模糊掉的轮廓和风中尖锐的金发，像她的声音一样。没等她回答，金发的女孩自顾自说了下去：“我没有想过，一次都没有，连‘死亡’这个词都一次也没有想过。”

      “呃……我有想过那么几次，但也就是些有什么人会来有什么人会哭或有什么人因为比我早死所以来不了了之类的。”

      Heather嗤笑一声：“真无聊。”

      Veronica站在一边干笑了两声，没有接话。她这时才发现不知什么时候Heather已经把她带到了一个小山丘的顶端，站在上面可以看到城市里蜿蜒的公路和星星点点的路灯。

      也许她打算在这里杀了我然后抛尸，怪不得她没有叫别人——Veronica看着一边不知道在想什么的人的身影，脑子里突然冒出来这样的想法。当然，那时的她不可能把这个当真，即使Heather刚刚经历了一场葬礼，她们仍然是远离“死亡”的高中生。

      “喂，”Heather招牌式的居高临下的使唤声又送到她耳边，“你想像中的你的葬礼上，我在干什么？”

      Veronica耸耸肩：“不知道。我还没在认识你之后想过这个。”

      “那就现在想。”

      Veronica使劲闭上眼，但还没等她得出一个模糊的答案她就感觉自己的手腕被紧紧拽住了。“我要回去了，今晚太冷了。”Heather边拉着她往山坡下走边说。

      但Veronica几乎是在那一瞬间就挣开了握着她手腕的手。她们二人都被她不知从何而来的脾气怔住了。Heather眼睛一眯就要开始训斥。Veronica见状，忙僵着嗓子开始解释：“呃……我觉得不冷，我再吹会风，你先回去吧。”

      Heather挑了挑眉，面容虽不清不楚地淹在黑夜里，却能让另一个人清晰地想象到自己今后在学校里的处境。

      想到这，她不禁打了个寒战，其实那天晚上真的很冷。

      大概是Heather念在她姿态放低得及时，那晚之后她们在学校里的关系一如往常——除了她对包括Veronica在内的所有人变得更加刻薄了之外。

      等到现在，Heather已经变成了一个鬼魂，并因此不用去想自己会怎么参加Veronica的葬礼之后，她已经在想起那天晚上的时候咒骂包括自己在内的全世界上万遍了，不过主要是除开自己的那部份世界。

      因为见到了小时候送给过自己仓鼠的阿姨，她才会带Veronica走到在被她浇水虐待死掉之后又因姗姗来迟且来势汹涌的愧疚和恐惧偷偷埋下那可怜的小东西的山丘上；因为那个愚蠢的碍事的小白花和不管什么冗余的葬礼礼节，她才会发起那场无聊的对话；因为那天晚上的风太吵了，街边的路灯太刺眼了；因为山丘上新打的除虫药味道太大了，教堂里的唱诗班那天格外的吵……因为全世界，她突然就找到了那个突然发现笼子中停止挣扎的仓鼠的自己。她记得那时的她像突然被从羊水中拽出来一样，好像任何一点声音、任何一个气味都可以杀死自己，就像自己刚刚对那只仓鼠做过的一样。


      不过也许她还是可以参加Veronica的葬礼，毕竟谁说以鬼魂的身份参加不是参加呢？不过她也不知道自己什么时候会消散，所以她要是能尽快死掉就好了，她还挺想看看她的葬礼的，没准还能在她葬礼上见到同样变成鬼魂的她自己呢，到那个时候她一定要问清楚她曾经想像中的自己的葬礼是什么样子。

      不过在那之前，Heather先出席了自己的葬礼，几乎和上一次那个葬礼一样无聊。不过好处是，她可以看见平时身边那些端着面皮的蠢蛋痛哭流涕的样子。老实说，还蛮爽的，她现在理解那些喜欢想象自己葬礼场景的人了，谁不喜欢看别人毫不体面的放声痛哭呢？想到这，Heather飘在空中大笑了起来，尖锐的笑声却像投进深潭的石头，没有任何她所习惯的一呼百应。于是她第一次感觉到自己真的死掉了，死亡的世界正如自己无数次鄙视过的一样无趣。她退到房间的最后面，远远地看着面前黑压压的沉寂的人群，淹死仓鼠时包裹她周身的羊水此时又向她袭来。

      活人堆又喧闹了起来。他们在说些什么？Heather感觉自己的耳朵被粘稠的液体堵住，什么都听不清。但她大概明白是因为Veronica伪造的那个充满恶趣味的遗书——她写的时候，她就在旁边。

      “你是真的觉得我会这样写遗书吗？”Heather当时“切”了一声，飘在Veronica身后的空中低头，边看边问。

      Veronica没有停下——她当然也不会因为听不见的来自鬼魂的话语声而停下，但Heather听见她小声的嘟哝：“你大概不会为此感到满意……但我向你保证，它会很有意思。”

      简直像惩罚。Heather看着人们用恶心的语气激动地说着“遗书”里的那些慷慨的捐款或不被看见的自我面无表情地想。如果不是因为自己是鬼魂，想来早就已经吐得满地都是了。这样想着，她扭头寻找着一切的罪魁祸首——那时她正打算悄悄从葬礼现场溜走。Heather一挑眉便跟了上去。Veronica径直往家的方向走了，边走边将胸前别着的假白花胸针扯了下来，用力地将廉价的人造花瓣一片一片撕扯下来，攒在手里。等走到家门口，花瓣也都被扯掉了，她回头将光秃秃的胸针和一手的假花瓣一起用力甩出去，金属制的别针落在了看不见的地方，绢布质地的花瓣在空中转悠了一会，不疾不徐地落在离门口半米远的地方。不过Veronica没看到这些，她在扔完之后就头也不回地进门了，就像害怕她回头就会发现一个完好无损地假白花胸针会安静地出现在门口她刚刚踩过的地垫上一样。


      “我数三个数，然后，你就给我出现。否则——”

      Heather疑惑又诧异地扭过头，看见Veronica仍然维持着她坐下以来的姿势——右手托腮，看向窗外。

      “一——”

      切，不会是想她那个小男友想得精神失常了吧。她不屑地翻了个白眼，一脚跨上Veronica面前的桌子，坐到桌子前的窗台上，学着对面人的动作将右手架在腿上，撑起下巴回望过去。

      “二——”

      我的天，这是不是看起来太蠢了点？她根本看不到我。Heather有些懊恼地皱了皱眉，正调整姿势和角度来欣赏对方回过神来愿望落空之后的蠢样，却在活动了身体之后发现预想中的第三个数迟迟没有出现。

      “算了，这次就先放过你吧。”

      她没有作声，走到桌子边沿坐下、躺倒，没有温度也没有实体的手顺势搭在活人弯曲的右肘窝处。窗外的光线太过于刺眼，她闭上了眼睛。不知道过了多久，Heather才隐隐感觉到周围的空气像摁压淤青时的阵痛一样抽动了一瞬。她睁开眼睛，Veronica还是那个姿势，一动不动，像一尊石像一样无趣——除了此时不断从她眼眶中涌出的眼泪之外。

      她重新面向Veronica坐起来，手臂撑起身子往前滑，直到她的小腿自然垂落在桌子外沿，和那个滚烫的石像的前胸交叠在一起，她的下巴也顺势贴上她的头顶。对于死人来说过分热辣的眼泪不断地落到她的大腿上，然后穿过她的身子，落到地上。

      我到底为什么要跟着她啊，一动不动的，好无聊。Heather啧了一声，这样想着，翻了个白眼。正当她打算直接跳下桌子径直穿过Veronica的身体离开时，对方的动作终于有了变化。她感觉有一支热河正缓缓地流经她的身体。她低下头，看见Veronica正在俯身亲吻她搭在桌子边沿的左手腕上的手表——她给她的那个手表。她的鼻尖轻轻贴在桌面上，整张脸埋在Heather的大腿根部，从活人的鼻中缓缓流出的热气也悠悠然氤氲在了鬼魂久未温热过的身体中。

      她愣了一下，跳下桌子，走到正坐着的人的身后，俯下身，轻轻咬上了她面前那根温热的拇指。
