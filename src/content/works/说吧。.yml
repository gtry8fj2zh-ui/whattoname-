      “你觉得，‘被误解是表达者的宿命’吗？”

      马克思从自己的午餐三明治上掀起眼皮，瞥了一眼不打一声招呼就在长椅的另一段坐下的人。他慢条斯理地把嘴里的食物咽下去，说：“我不知道你最近迷上了哲学？”

      苏菲耸耸肩，一边从背包里拿出餐盒一边说：“前一阵子哲学课上老师给我们放了这个辩论赛的一段视频，昨天上彩绘课的时候我突然又想到了这句话。你看啊，解读别人的作品的时候不同的人不是总都会有不同的看法吗？大家都是从自己的角度去理解别人的，而世界上不可能会有完全相同的两个人，就像世界上不会有完全相同的两片叶子，那岂不是说明不可能会有人完全理解另一个人？”

      马克思扭头看了一眼正叼着面包片比对着手上不知从哪里捡来的两片树叶的苏菲，将最后一点三明治塞进嘴里，含混地说：“也许是吧。顺带一说，我希望你有随身携带消毒湿巾，否则那两片树叶上的微生物进到你身体里去可有你受的了，更不用说可能还有各种物理和化学污染物残留。”

      “哇哦，简直像是瑞娜在跟我说话。”苏菲丝毫不恼对方语气中的嘲讽，满不在乎地倾倒手掌任那两片叶子在空中悠悠飘落，然后在她直接用手拿上面包片的时候清楚地看见了马克思眼中的嫌弃。她笑着接过他从长椅另一端抛过来的酒精湿巾，一边擦着手一边说：“说起来，瑞娜呢？我可是听小班说他昨天撞见了你们两个在约会。”

      马克思耸耸肩，脸上有些不耐烦的表情像在质疑这个问题的必要性：“她一下课就去实验室了。她不是一直这样吗？只要一个实验完成得不够完美就完全无暇思考其他问题。”

      苏菲偏过头去看着对面莫名有些紧绷的人，揶揄地挑了挑眉：“你知道你这话听起来很像独守空房的怨夫吗？你们吵架了？”

      他下意识想辩解，半张开口却不知道该说些什么。他们吵架了吗？他回想起他们上午见面时的场景，还没有完全苏醒过来的学校里只有偶尔传来的山雀的叫声和操场上运动社团晨练的哨声。马克思在经过体育馆时和队友打了个招呼便随手丢下自己肩上的运动背包，径直朝实验室走去——他知道她一定会在那里，尽管他们并没有约好，但她总会在那里的，尤其是在昨天他们刚刚做了一个失败的实验之后。

      -

      他果不其然在实验室外透过窗户看见了瑞娜的背影。她将自己香槟色的头发扎成一束一丝不苟的低马尾，正伏案细细观察着什么。他小心翼翼地将手和脸贴在洁净的窗户上，不禁连呼吸也放轻了，透亮的窗户上甚至不曾留下任何凝结水气的痕迹。马克思自己也不知道为什么他不忍心进去打扰那份专注，他们曾经有过很多次这样的清晨，他通常会轻手轻脚地打开门，在她伸出手的前一秒就默契地递上她需要的实验用品。独自沉浸在实验中的瑞娜很安静，只有偶尔皱起的细眉、在某一瞬间流露出喜悦的红眼睛或是她不经意间抽动的嘴角可以泄露她此时的心情。

      而马克思断不会放过这些细琐的神情变化。他惯于站在她身边默默地注视着她的一举一动，但当他的视角从近旁变换到隔着一层玻璃的远处时，他突然犹豫了。也许是她身上的实验服太白，以至于在某一刻他甚至觉得她也是这实验室里的一部分。

      “啪”。马克思回过神来便发现自己面前隔着一面玻璃和蒙蒙雾气的是瑞娜紧锁着眉头的脸，不知道什么时候她已经将马尾辫解了下来，纯黑色的粗皮筋别扭地缠绕在她指间。“你在这里做什么？我都结束了，你为什么不进来？”她从里面推开窗户，一边拉下口罩一边说。

      “呃……我——”

      “嘿，马克思，我就知道你在这里，”一只手拍上马克思肩头，他扭过头去，身后站着的是抱着他的运动背包的手球队的队友，他将背包塞进马克思怀里，用开玩笑的语气说，“晨练已经结束了，下午请至少让我们看见你的人影而不是你孤单的背包，好吗？”说完，他轻轻捶了捶马克思的胸口，又朝他身后的瑞娜点点头当作简单的致意便转身离去了。

      那个早晨之后的场景在马克思的脑子里像蒙了晨雾一般朦胧，他记得他们一起在沉默中走在去往教室的走廊上，一切都像是暴风雨前低沉压抑的天空，除了蒙蒙的灰色一无所有。

      当他们走到她的教室门口时，他世界的寂静终于被打破——瑞娜沉重的叹气声刺入他的耳膜。他有些无措地抬起头来，在看到她那双闪烁着不知名的情绪的红眼睛时，他的手指不自觉地攥紧了背包肩带。

      “我不知道你在想什么。”

      马克思几乎没见过瑞娜流露出这样的神情。她垂着眼睛，嘴唇抿成一条扭曲的细线，脖颈耿直紧绷一如她的话语。“我不知道你在想什么。”她重复说，只是这次的语气要无力了许多，话尾的音节甚至要化成飘渺的气音。

      她将头扭到一边去盯着教室外的储物柜，深深吸了一口气继续说：“其实你可以不用来的。”

      “什么？”

      瑞娜不自在地绞着垂落在她脸侧的碎发，仍然回避着马克思困惑的视线：“我是说，你看，我们现在已经在一起了，你不用再像以前那样一直陪着我待在实验室里了。我知道比起做实验你肯定更不想错过手球队的训练……”她没有抬头看到马克思渐渐沉下去的脸色，继续说：“我当然也不想让你为难，我听说你们马上要比赛了吧？你想做什么都——”

      “你到底在说什么？”马克思终于忍不住猛地上前抓住对方的手腕，打断了她未尽的话语。瑞娜抬起头来，有些无辜地看着他紧皱的眉头，连呼吸都稍稍一滞。一时间，在两人细微的空隙之间流动的只有他们渐趋一致的呼吸声。

      但这份宁静并没有持续太久。下一刻瑞娜就发出一声恼极的冷笑。她往后退了半步抱起手臂，嘴角扭曲着，紧紧盯着马克思同样愤懑的脸，说：“我不明白你到底在装什么？当时你已经说得很清楚了，你对实验没有兴趣，我也没有强迫你一定要过来，你为什么……为什么要这样做呢？”说着，她的声音越来越高，原本高昂着的头却渐渐地低了下去。马克思半抬起手想抚上瑞娜随着抽气声而起伏的肩头，她却没有给他这个机会，最后扔下一个复杂的眼神和一句喃喃的质问便转身走进了教室。

      -

      “当时，她问我‘你为什么总要让我看起来像一个罪人呢？’”

      “不是吧？你到底做了什么才让瑞娜说出这种话的？恋爱真是恐怖啊……”

      苏菲和马克思一同转过头去，便看见班正半蹲着把胳膊架在椅背上，做了个夸张的动作笑着对两人说。

      苏菲耸了耸肩，不轻不重地叹了口气，随即像突然想起来什么一样说：“不说他俩了，小班，你听过‘被误解是表达者的宿命’这句话吗？”

      班歪了歪头，眼珠从头顶的树枝到身下的树荫转了一圈，他才缓缓开口说：“我觉得，比起‘宿命’，‘被误解’更像是一个结果吧？虽然这个结果大概是必然的，但我总是觉得不能把它等同于‘宿命’。”

      “可是宿命不就是必然的结果吗？”马克思问。

      “是这么说啦，但你们不觉得‘宿命’这个词是具有悲情色彩的吗？”班摊开两只手，一边在空中比划着一边说，“但‘结果’的话，就只是一个客观的结果而已，就像我们做的实验。”

      “你觉得‘被误解’不是悲情的吗？”苏菲眨了眨眼，不自觉地把身子往前倾了些。她余光瞟到身边的马克思也不动声色地做了同样的举动。

      班轻轻笑了一声。他挠了挠头，有些不好意思地开口说：“或者说我不希望它是悲情的。我刚开始学琴的时候也想过这样的问题。我那时想如果我想表达的内容不能通过我的琴声完整地传达给听众的话，这样做还有意义吗？但是我当时只困惑了半天。”

      “为什么？”马克思有些急切地问。

      “因为接下来我要拉琴了，”他耸耸肩，视线飘向两人身后树林深处的某一点，沉浸在了自己的回忆中，“当我握住琴弓的那一刻我就不再怀疑了，因为我知道我想拉琴。”他闭上眼，再次睁开时他浅蓝色的眼睛回到了他的朋友们身上，坚定地说：“我之所以要拉琴不是想要被理解，只是因为我想拉琴，我心里有好多东西要顺着我的琴声倾泻而出。我相信对其他类型的表达来说，大概也是这样的。”

      马克思愣了一刻，但很快又叹了口气，有些沮丧地矮下身子，把下半张脸都埋在椅背后：“可我还是希望能被人理解……”

      “啧，这是当然，”一只手拍上他的后背，马克思有些诧异地抬起头，看见苏菲不知道什么时候已经站了起来，正微微皱着眉有些不耐烦地低头看着他说，“小班也不是在说他觉得应该完全不在乎别人的看法，对吧？”

      班抬头看看苏菲，又看着面前被椅背遮挡去半张脸的人，点了点头，温和地笑着说：“我甚至觉得我每一次都是抱着被完全理解的期望去表达的，毕竟人可是社会动物嘛。有时我想，也许是这份期望让这些总是被误解的表达有意义。”

      “如果有话要说的话，还是说出来比较好吧？”苏菲看着长椅上低着头不知道在想些什么的马克思，将声音放得轻了些：“如果因为害怕被别人误解就回避表达的话，自己也会憋得很难受吧？”

      马克思抿起嘴，用手指缓缓擦过裤子的接缝处，像是在下定什么决心。时间还很漫长，树叶在空中游荡了五六圈才落到地面上，他还可以好好想想他要说些什么。他要向瑞娜道歉，他要告诉她她不需要为他的选择而自责，他要说他其实越来越喜欢实验了，最重要的，他要告诉她他爱她。怎样的爱呢？大概就像岩浆流经大地，留下狰狞的疤痕，或是树叶留恋托举着自己的那阵风，或是乐声缠绵融在了空气里——

      “你们原来在这里！”不远处传来的声音打断了马克思的思绪，他倏地一下站起身，在看到正朝这边跑来的人影时不自觉加快了呼吸。瑞娜的脑后还扎着马尾辫，看上去像是直接从实验室里跑到了户外，尽管她的脸颊因奔跑而涨得通红，眼睛里却闪着激动的光。她不等气喘匀便急不可耐地宣布：“我知道昨天的实验问题出在哪里了，你们快过来！”

      “瑞娜，比起这个……”瑞娜停下急匆匆走向实验室的步伐和对实验的讲解，回头看见苏菲正拿着手帕跟在几步之外。她见她停了下来，紧跑几步将手帕递到她手中：“你太着急了，先休息一下吧，而且不把汗擦干很容易生病的。”

      瑞娜挑起一边眉毛，细细按着额头上渗出的汗珠，看着班也终于走上前来。他朝苏菲眨了下眼，意味深长地看向瑞娜，接着苏菲的话话往下说：“比起那个实验，还有另一件——”

      “你们俩这眼神盯得我发毛。”瑞娜眯起眼睛，看着面前显然在谋划什么的两人幽幽说。而苏菲和班却只是无辜地耸了耸肩，安静地让到了一边去。

      瑞娜丝毫不意外地看着出现在视野中的人，只是仍然用那张手帕轻轻抚过已经擦过无数遍的脸颊，如果仔细看的话也许能看见她轻轻颤抖的之间和手帕下泛红的面颊。

      马克思感觉自己的脸在对方的注视下越来越烫，他咬紧嘴唇，等待一阵风吹过。终于，在数不清的呼吸交叠之后，他感受到了一阵凉意略过自己身侧，他深吸一口气，张开嘴——。

      -


      班：……所以我们这个实验是算成功了吗？

      苏菲：……算是吧，就是马克思说得实在是太烂了。
