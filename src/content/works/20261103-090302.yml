title: 祝好梦
author: /
cp:
  - 元与均棋
updated: 2025-06-03
chapters:
  - body: |-
      在他三十九岁那年，郑棋元离开了他待了十年的公司和一个高薪的职务，来到了位于这个城市他鲜少踏足的另一端的一所高中里担任心理辅导员。
      其实不管是什么样的工作都无所谓，心理辅导员这样的闲职还是琐事一堆的行政人员什么的都无所谓，郑棋元只是需要从原来的工作环境里逃离片刻，至于时间是长还是短，再说吧。所以当之前大学时的师姐说她正在任职的高中这几个月有点缺人手，问他愿不愿意来顶几个月的班时，他毫不犹豫地答应了。
       
      郑棋元交接完手头上的工作拎包搬入那间有些狭小的独立办公室那天是十二月里的一个雪天。
      下雪对于他一个将近四十岁的北方人来说没有什么特别的，也不是什么值得特别庆祝的事，只是窗外传来的学生大喊着“下雪啦”之类的话语的声音还是让他短暂地停下了手上收拾桌子的动作，直起身看向了窗外。
      郑棋元是一个习惯于给自己的行动做预期的人，从自己会从一份工作里得到什么，到他透过窗子会看见什么样的雪景。这种预期让他的生活很少偏离轨道。他也不认为这种生活是无趣的，毕竟他容许误差的发生，甚至在大多数时候乐于接受误差给他带来的挑战。但他认为此时此刻所看见的，也许已经远远超出了“误差”这个词所能描述的情况了——
      他看见了一个人。
      准确来说，那应该不是一个人。
      “下雪了喔。”郑棋元听见那个“人”说。
      听声音应该是南方人，估计还没成年。郑棋元边想着边绕过桌子走到窗边出声问：“你叫什么名字？”
      那个“人”猛地回过头，一副受了惊吓的样子反问：“你，看得到我？”
      “之前来的人都看不到你吗？”
      他摇摇头，又点点头，过了一会才说他自己也不知道。
      想来也是，这本就是一间闲置的房间，即使有人来也不会待很久，注意不到的话也是正常的吧，郑棋元这样想着，没有继续追问下去，只是有点好笑地反问：“那你为什么会觉得我看不到你？”
      那个“人”有点沮丧地坐在纸箱子上，低头边抠手边说：“那小说电影电视剧里不都这样吗。”
      郑棋元耸了耸肩，低下头继续开始摆弄他的办公桌。房间里另一个会动的东西却不安分了，开始在房间里飘来飘去，还时不时发出几声感叹。忙活了大约有五六分钟，他才停下来，定在桌子前盯着郑棋元，后者此时正饶有兴致地转着屁股下的电脑椅，笑着回望过去，双方都没有说话。
      最终，是“站”着的那一位先撑不住了，吸了口气之后有些委屈地开口说：“你和我讲讲话呀，我好不容易才有机会和别人讲话。”一边说还一边低头摆弄着手指，等他再抬头看向郑棋元时，发现他用手托着脸，正笑眼弯弯地看着他，慢吞吞地温声说：“好吧，那先和我说说你的名字吧。”
      “徐均朔。朔望的朔，均嘛，就是‘皆’的那个均。”
      郑棋元微微张开嘴若有所思地点了点头，说：“希望你的每一天都是朔日的意思？”
      “算是吧，我出生那天是那个月的朔日。按阳历来算的话是十二月十一号。”徐均朔摸了摸脖子，转过头看向窗外。雪已经停了，外面只剩下灰白色的一片。过了一会他突然想到什么似的，扭过头来张牙舞爪地对着郑棋元说：“我说你这个人好狡猾啊，我连我什么时候出生都告诉你了，你连你名字都没说。你在这纯套我话呢。”
      郑棋元被小鬼突然的动作惊得挺起背来，半晌才反应过来，笑了笑，回答说：“那认识一下吧，小孩儿，我叫郑棋元。”本想止住的话头被“小孩儿”瞪得有些发狠的眼睛颤巍巍着又无奈地长出来：“棋盘的棋，元月的元。生日的话是九月十一日。这样够了吗小朋友？”
      “说谁小朋友呢，我可是鬼！没准我比你还大呢。”
      “行吧小鬼，那请问你做了几年的鬼了？”
      方才还在房间里到处看看这个动动那个（不过当然，他碰不到）的人影安静下来，思索了好一阵才慢慢说，他也不知道，他闭上眼睛的时候明明是一个春天，但是再睁开眼睛却就是在这里了，窗外飘着雪花。
      “现在是十二月吧，”徐均朔蹲在地上，盯着一个纸箱子说，“我刚刚看到了你桌子上的日历。”
      郑棋元点开手机屏幕，锁屏上的电子时钟上方用略小一点的字体摆放着的数字昭示着这一天的日期。他只扫了一眼便默不作声地反手把手机屏幕朝下扣在桌面上，然后站起身，走到仍低头看着纸箱的那个人的身后。
      “那你现在、那年你是几岁？”他也蹲下来，注视着徐均朔半透明的侧脸轻声问。
      “嗐，”徐均朔轻笑一声，说，“哪有什么那年今年。那年我十七岁，今年我也是十七岁。”以后都会是十七岁。
      郑棋元不说话了，也不做其他动作，空气好像又凝固了。徐均朔想这个小小的办公室空间里的空气怎么会这么容易被凝固，厚重到连他一个鬼魂都觉得喘不过气来，郑棋元不会觉得难受的吗？他从破旧的纸箱里回过头来，和郑棋元的眼神撞了个满怀。那一瞬间他莫名其妙地感到一阵心虚。
      鬼魂不应该因为活人感到心虚，至少在十七岁的徐均朔的认知里是这样的。通常来说分处生死两个世界里的人相遇时，总该是由活人来承担像是心虚这种负面情绪，而死人只需要负责扮演那个冷淡的角色就好了，没有哀乐，也不受喜怒的折磨——总觉得应该这样才合情理啊，毕竟他都已经死了，如果还要受情绪的折磨，那不是太不公平了吗？但话又说回来，也许就是因为他是死去的那个人，他才会这样情绪化。
      一个人死了就只是死了，文艺作品里因死亡而产生的顿悟或是磨练那一类的东西，从来没有发生在他身上过。
      想到这里，徐均朔不禁有点委屈，也许生者的世界本就不是为他这种人设计的。他习惯性地皱了皱鼻子，尽管鼻涕并没有流出来。也许是因为他已经学会怎么不让感情从面上流出来，也许只是因为鬼魂的身体里没有鼻涕和眼泪，但他还是在他接下来说的话里听到了熟悉的鼻音：“对不起。”
      “你为什么要对不起？”郑棋元不解。他站起来，习惯性地伸出手就要抓着徐均朔的胳膊把他也拉起来，却在手穿过鬼魂半透明的身形时恍然，兀自站起身后，轻轻叹了口气，继续说，“本来我都要和你道歉了，我问的话让你想起了不好的事，结果倒是你先说了对不起。”
      徐均朔也跟着站起来，直愣愣地朝郑棋元那个方向泛泛看去，没有回话。
      他不应该道歉吗？他没有源头而涌起的心虚到底是因为什么？他那样佯装洒脱的回话是真心实意的吗？
      他真的释怀了吗？
      没有吧。
      “因为我想，我做了很多事情，只是为了让你能可怜我。”——脑海中的徐均朔会就这样平静地说出他早已得到的道歉的理由，但现实中的徐均朔做不到。
      如果他做得到，也许他就不会是现在这个被别扭的情绪缠绕住的鬼魂徐均朔了。
      他张了张嘴，想说些什么，却只有混杂了灰尘气味的气流从他嘴里、他的整个身子里穿过。
      郑棋元没得到回答也不着急，换了个放松点的姿势另起了个话头，问：“那你还记得你是怎么死的吗？”
      徐均朔点了点头，回答说：“跳楼吧。”
      郑棋元没有接话。徐均朔知道他在等什么。当人们问出“你是怎么死的”这个问题的时候，他们往往并不是为了得到类似于“跳楼”、“上吊”、“卧轨”诸如此类浮于表面的回答。他们想要得到的是关于死者的一切——你为什么想死，以此为开口撬开血肉筋骨的包裹，窥见灵魂的每一个角落。人类就是会有这样那样的窥私欲，却又总是因为“道德”的束缚让他们不愿意表露出来自己的欲望，所以才诞生了这么多的言外之意。郑棋元这样的人尤为如此。徐均朔明白这点，即便他们只接触了两三个小时，他已经对他是一个怎样的人有了模糊的判断——中年精英男性，对这个世界的规则和玩法烂熟于心。
      这大概也是徐均朔不愿意继续往下说的原因——郑棋元也会像他生命中的其他长辈一样，谴责他选择自杀的幼稚。
      但也许还有另一个原因，那就是徐均朔发现自己也不知道要怎么回答“为什么选择自杀”这个问题。一切都好像很顺其自然，在合适的时间做了合适的事，又或者是合适的事发生在了合适的时间？总之没什么特别的，事情就这样发生了。
      于是他耸了耸肩，没有再说话。
      郑棋元看出他的抗拒，也没有接着追问，只是随手拿起桌上的花名册开始翻阅。
      这时，办公室虚掩着的门被敲响，在郑棋元的允诺声响起后被轻轻推开。门后是一位四五十岁左右的穿着灰色套装的教师。
      “郑老师好，高三（3）班正在上班会课，您可以现在去一下班上，学生们可能需要认识一下新来的老师。”
      郑棋元一边答应着“我收拾收拾就去”，一边在没看完的册子上做了个记号，从刚收拾好的桌面上抓了支笔就起身往外走。等他走到门口了他才发现徐均朔从刚刚那位老师进门开始就没有一点动静，一直像傻了一样站在原地。
      不知道出于什么原因，郑棋元朝仍在发呆的徐均朔小幅度地招了招手，他似乎此时才回过神来，快步跟上前去。
      简单的自我介绍之后，郑棋元就回到了办公室。尽管此时离下班时间还有将近一个小时，他也刚在班上表明过作为他们班的心理辅导员，班上的同学有任何心理疏导的需要都可以在上班时间内在这个办公室找到他，他还是从学生们无一例外低头写作业的动作中预感到他今天的工作大概已经完成了。
      他又拿起那本没看完的手册，盯着做了标记的那一页沉思了几秒，然后回头很有默契地和正在默默看着他的徐均朔对上了眼神。
      “小鬼，你是这个学校的学生吧？要不要陪我在学校里转转？”
      “你不怕同学们来找你找不到吗？而且这样别人看起来会很奇怪哎，他们好像都看不到我。”徐均朔别开视线，低头搓弄着衣角说。
      “不怕。”说着，郑棋元合上手册站起身，径自往走廊走去。徐均朔似乎还没反应过来，仍站在原地愣愣地犹豫着要不要跟上去时，一股莫名的力量把他推到了郑棋元的身边。
      两个人对彼此之间骤然拉近的距离都感到十分的意外。郑棋元低头沉思了片刻，才斟酌着说：“看起来，你似乎没有办法离开我了？”
      徐均朔显然也没有料到事情的走向，仍木木地低着头，不作回应。
      “那你知道这是怎么回事吗？”
      面前的鬼像犯了错的好学生一样，把嘴巴抿成一条僵直的线，眼神盯着郑棋元脚底黑得实实在在的影子，摇摇头又点点头。过了好一会才出声说：“我不太了解原理，但我可能已经有一些想法了。”
      “关于？”郑棋元一动不动地盯着他，看起来倒真的像是一个正在训斥学生的老师。只是他不确定，那些老师们在训斥学生的时候心情是否像他现在这样说不清道不明。说白了，他和眼前这个“粘人鬼”除了无辜的被鬼缠上的人和缠着人的鬼之外没有任何关系，他甚至还应该为此感到烦躁。但郑棋元清楚地知道，此刻萦绕在他心头的情绪绝非烦躁，也不是与之相似的其他负面情绪。有点像他研究生时期跟着导师隔着一面单向玻璃墙看着墙那边的研究对象，按照导师的要求记笔记。但是似乎又不一样。他不知道如果此时徐均朔抬头会撞进自己怎样的眼神里。又或是，他不想知道。已然活过了小半的人生，郑棋元早就明白他是无法骗过自己的，所以他选择逃避——不继续深究。他同样也明白这样的逃避像天边颤颤巍巍的风筝，轻易就会坠毁。他甚至有种预感，不用等到今天结束他就会被迫面对那些他现在逃避着的，那些他不想接受的。所幸徐均朔最后也没有抬头，风筝仍然颤颤地飘着。
      “关于，关于为什么是你。”
      郑棋元没有回头看跟在身后的那只小鬼魂，只是边点头边发出一声轻哼来作为回应。
       
      临近傍晚的学校丝毫没有公益广告中的学校的那种生机与活力，将白天的学校里的那些嘈杂声音剥下之后，更是显得死气沉沉。
      徐均朔作为一个鬼魂都觉得这样的氛围让他的脊背有些发凉。即便如此，他还是兢兢业业地带着郑棋元介绍学校里的各种建筑。这是一号教学楼，那是二号教学楼，教学楼后面是新建的图书馆；那边那片是生活区，食堂旁边就是宿舍，宿舍旁边是洗衣房和小卖部……徐均朔用这样简短的语句干巴巴地向郑棋元说明每一个灰溜溜的尖锐的四方形建筑的名称和方位，没过多久他们就晃到了学校的最深处。
      他们面前是一栋被围栏围住的灰头土脸的矮楼，约莫三四层高的样子。郑棋元扭头看向身边的徐均朔，等着那句简短的介绍。但那句介绍并没有到来，取代它的是一个没头没尾的问题：“郑老师，你为什么会突然来这里任职呢？”
      郑棋元愣了一下，像是回敬方才那些过于简短的介绍一样，同样简单地回答：“想换换心情。”
      “那，为什么是这儿呢？您之前来过吗？”徐均朔放缓语速，转过身来看着郑棋元说。
      为什么是这份工作呢？为什么是这儿呢？是因为师姐来找他顶班。是这样的吗？如果师姐不来找他，他还会换工作换心情吗？他只是想换换心情吗？还是，想来这所学校？郑棋元不自觉地屏住呼吸。
      “郑老师，我曾经见过您，就在这里。我想起来了，您还记得吗？”
      郑棋元仍然有些茫然地摇了摇头，等着徐均朔继续说下去。
       
      他说，那是那一年初春的某一天，和现在差不多的时辰，太阳已经落下去了，一年中晚霞最为热烈的时候还没来临，所以那时的天空昏沉又无趣。已经是放学的时候了，学校里的死寂也和现在一样，让人害怕。这栋楼曾经是旧图书馆。当时新的图书馆刚建好，旧馆中的有些书还在整理，有时他会跑进去，躲在堆放着一叠叠书的书架中间，他也不清楚为什么要这样做，可能只是这种阴暗、破旧、鲜有人至的空间能够满足他的猎奇心理，或是给他安全感。他不知道，总之他有些幼稚地将其视为一个秘密基地一样的地方。
      “然后，那一天我待得有些太晚了，”徐均朔毫不顾忌地靠着那栋建筑门前的围栏坐在地上，低头摆弄着手指说，“出来的时候，天已经快要全黑下去了。然后这个时候，你好像就站在这里，和现在一样。”
       
      /郑棋元在临近下班的时候接到了师姐发来的短信，让他来她任职的中学一趟，找份资料，再顺便聊聊天之类的。等他们办好了所有事情，天边只剩下一分血红色的残阳了，余下的九分都是阴沉沉的墨蓝色。从师姐的办公室所在的大楼的后门走出来，就是那个废弃的旧图书馆。
      当时已经放学了，学校里不应该有学生逗留才对。所以郑棋元在看到走出旧图书馆的徐均朔时被吓了一跳。那位学生似乎也没想到会迎面碰上一位老师，过了一会才低了低头，说：“老师好。”
      郑棋元见状，忙摆摆手，告诉对方自己并不是这所学校的老师。
      “那您为什么会在这里？”徐均朔偏了偏头，有些不解地说，随即似乎是意识到这样问的不妥，忙说，“啊不好意思，您不用回答我的，这有点冒犯了吧，实在是不好意思。”
      郑棋元觉得这孩子怪可爱的，笑了笑说：“不会冒犯。我是来找你们学校领导取资料的，我们实验室和你们学校有一些合作。”
      “做研究啊，好厉害哎。”
      当时的天光已经完全暗下来了，郑棋元望进那个孩子的眼里，却没有看见和他说话语气一致的向往，心里觉得有些奇怪，问他为什么这么晚了还在学校里。
      徐均朔笑着和他说自己本来打算找个地方休息一下的，结果睡过头了，现在就打算回家了。然后没等郑棋元回复，抱着怀里的书包从他身旁绕过跑走了。/
       
      “其实那个时候已经不太想继续下去了吧。嗯，也没有什么别的原因，只是好像看不到出路了。”徐均朔低头轻轻用手扫过水泥地上的纹理，平静地说。
      “所以，你当时又回到这里了吗，在和我打完招呼之后？”
      徐均朔没有说话，只是点了点头，在地上躺下。此时天已全黑了，鬼魂银白色的身影在黑夜里显得更为明显。
      “然后你就从这里——”
      “郑老师，”徐均朔打断郑棋元的话，说，“你是我死之前见过的最后一个人。你还记得你当时和我说了什么吗？”
      徐均朔没有扭头看郑棋元，仍然直直地朝天上看去，郑棋元顺着他的视线朝上看，看见在老旧的图书馆的顶楼有一个露台，徐均朔就这样躺在那个露台下，好像在等待一个从上面一跃而下的身体。然后他听见徐均朔的声音从地上飘进他耳朵里：“你当时和我说，祝我好梦。”
      “郑老师，你是为了我才回这所学校的。”
      他低下头，看见徐均朔半透明的银白色身体在月色中飘飘忽忽，几乎要变成了一缕烟。
      “今天是你的生日。”郑棋元努力克制住他声音里的酸涩说。
      “是吗，”徐均朔仍然一动不动地朝上面看着，郑棋元也不确定他在看什么了，也许是那个露台，也许是今晚的月亮，也许他只是看着，夜晚的风吹来，郑棋元感觉徐均朔的身影像几缕烟雾，马上要被吹散了，但他只是笑了笑，说，“那，祝我生日快乐吧。”
      “生日快乐。”说完，郑棋元低下头，四周只剩下他一个人。
       
