updated: 2026-06-05
summary: 很久之后，连克利切自己都忘记了，雷古勒斯在岩洞里时，不止让他带回了一个挂坠盒，还有一小块他的灵魂。
chapters:
  - title: 正文
    body: |-
      西里斯睁开眼时发现自己正坐在一个长椅上，旁边是结了冰的喷泉，头顶是除了明亮得诡异的月亮之外一无所有的黑夜，眼前是格里莫广场上随处可见的老式建筑，拉开它们之间某道虚无的缝隙就是他亲爱的家。


      是这里。

       
      他来过这里——这个梦。在很多很多年以前，在他进阿兹卡班之前，在哈利出生之前。

      可是有什么地方不对。

      西里斯看着右手边长椅上的空位，它好像正时刻在他脑海里叫嚣着什么的缺席，好像在多年前的那个梦里，这里还有个人——一个会用恼人的傲慢声音说话的人。

       
      “看来你还记得我啊——”

       
      西里斯眼前的建筑裂开一条缝，一个人形的黑影和他曾经熟悉的傲慢声音从里面走出来、走向他。

       
      “——真是不容易。”

       
      他突然觉得自己应该抽出魔杖给对面那人一个门牙赛大棒，他不知道自己为什么会想这样做，明明他还不清楚那人是谁、也还没搞懂他所带来的这种诡异的熟悉感源自于何处，像一些奇怪的肌肉记忆。肌肉记忆，这个想法让他感到有点安心，也许是因为这代表着过去的某些事还没变。但是，见鬼，什么时候西里斯·布莱克会因为一成不变的乏味过去而感到安心了？也许他最终还是老了，变成那种成天只会念叨虚幻的来自往日的美好时光的无聊家伙，那些他曾经不顾一切想逃离的人。

      还没等他想到一个答案，那个傲慢的声音就停在了他的面前，和那双铁灰色的眼睛一起钻进他的大脑——

       
      “看来你脑子里关于我的记忆真是臭到连摄魂怪都嫌弃——”

       
      “好久不见，我的哥哥。”

      -
       
      下一秒那双似笑非笑的眼睛化成暗灰色的潮水退去，只剩下暗沉的河床——他房间的天花板。

      他醒了，现在是白天。这很好，因为他不知道他还能不能继续和那个人共处在一片黑暗中。

      其实根本没什么好怕的，他也不知道自己在抗拒什么。毕竟，那个人早就死了不是吗？害怕一个死人听起来可不是很英勇，尤其是这还是在自己的梦里。

      可是，见鬼的，我居然梦见了雷古勒斯·布莱克，在发生了所有的一切之后，在过去了这么多年之后。西里斯躺在床上，盯着天花板有些愤懑地想。也许我也死了，而这一切只是死者无聊的狂欢。

      真该死。我当然还活着。看来摄魂怪和魔法部那群家伙的追捕把我的大脑搞得一团糟。我还活着。尽管很多人都死了。

      很多人——叉子和莉莉、麦金农……啊，当然了，还有我那亲爱的一家子。哈，真是讽刺，这么多人都死了，而我还活着——躺在这里，空气充满肺部再被吐出；躺在这里，让红色的窗帘被日光照得发黑；一动不动地躺在这里，因为刚刚梦见了另一个死人。

      “雷古勒斯·阿克图勒斯·布莱克。”西里斯哑声念着，讶异于他的口腔对这些复杂音节的熟悉程度。

      然后好友的声音在门边响起：“西里斯？”他扭过头，看见莱姆斯一脸担忧地站在门口。

      “梅林，你什么时候进来的？”他边坐直边嘟囔。

      “在你盯着天花板发呆时的某一秒，”莱姆斯翻了个白眼，走到床边看着他说，“好吧，擅自打开了你房间的门，我很抱歉。但你得原谅我，这真的有点吓人。我以为你被带走了。”

      也许是的。那个讨厌的梦把我的心不知道带到哪里去了。

      “没什么，只是一个讨厌的梦。”

      “那看来是一个能让你想起你弟弟的讨厌的梦了。”

      西里斯坐起身，刚睡醒还混沌着的大脑有些搞不清楚有人脸上紧绷的神色因何而来。

      “月亮脸……”

      “早餐放在桌子上了，”莱姆斯转身就走，临到门口时脚步顿了顿，回头说，“那个，也许你还没发现，但你的右手好像抓着‘他’。”

      随后门锁的咔嗒声响起。

      -
       
      莱姆斯是对的。

      他这时才发现自己手中厚重的绿色布料——它曾属于那个阴森的家族挂毯。

      曾经。是的，曾经——它现在属于我。

      西里斯拉开窗帘，光线箭矢一般争先恐后地涌进房间。它们想把我杀了，他像潜水的人一样把头埋进阳光里。可是它们会失败的，因为我的水性向来不差。

      他低头看着那块挂毯布，布料上的人脸了无生机地瞪着眼，看向他。了无生机，但不是现在挂毯上那个扎眼的白色骷髅头，虽然现在西里斯也说不准他更希望看到哪一个样子。它还是雷古勒斯三岁时的样子，只是不再像它曾被挂起时那样被一股诡异的富有生命力的魔法所环绕——二三十年前一个刚学会切割咒的男孩在给自己胞弟的炫耀声中笨拙地把这块布料割了下来。不过没过多久他就后悔了，因为他感觉到那块原本活着的布料在被他割下的那一瞬死去了。

      他把他杀了。

      然后他怔坐在挂毯前的地板上，看着上面苍劲有力的树枝因疼痛和愤怒抖动，新的绿色丝线从断面伸出来，他眼前又出现了一个雷古勒斯。

      我不该这样做。

      他看着手中空洞地睁着眼的雷古勒斯，小声说：“我让你被他们抛下了。对不起。”

      他们就这样重新做了一个你。

      但最后他还是把那块布料悄悄塞进雷古勒斯手里。

      然而它现在又回到了我手里，好吧，而我甚至不记得我是什么时候、在哪里拿到它的。看来你和那个小混蛋的鬼魂一样阴魂不散，对不对？西里斯把挂毯布举到阳光前，厚重的墨绿色布料在他脸上投下一块歪歪扭扭的多边形阴影。

      他一直觉得他弟弟得多晒点太阳。

      啊，但他好像讨厌水。西里斯有些迟钝地想起来。

      -
       
      西里斯走到餐桌边时，等待他的是凉掉的培根以及和培根一样冷着脸的莱姆斯·卢平。

      他一边低头把那块挂毯布推到好友面前一边说：“我昨晚梦见雷古勒斯了。”

      莱姆斯毫不意外地挑了挑眉毛，给冷掉的培根施了个加热咒。

      “因为这块布？”

      “呃，对。我想是一种灵魂魔法，你知道的，他总是痴迷于这些东西。你看这上面——”小混蛋，都死透了还要缠着你哥不放是不是。

      他听见莱姆斯轻轻吸了一口气，他把目光从培根上移开，意料之中地和那张藏在阴影下显得阴森的空洞的眼神对视，而直视着莱姆斯的那一面上赫然是两个暗红色的花体单词——

      Find Me。

      -
       
      莱姆斯觉得今晚的西里斯有点不一样。

      不，是很不一样。

      和前天晚上的他不一样，和十七年前的他不一样。和任何一个和他在床上翻云覆雨过的他都不一样。
      是哪里不一样呢？西里斯平时做起爱来像疯狗，像疯狗在标记领地；可此时的西里斯，尽管依然像疯狗，却像是在呼吸。

      发疯的狗是怎么呼吸的？他问压在自己身上的人。

      阿尼马格斯形态为狗的人没有停下手上的动作，囫囵地喘着气说人怎么呼吸它们就怎么呼吸。吸气——呼气——就是这样。然后西里斯的阴茎在某一次随着身体喘息的起伏中抽离出来，又迅速插进他的喉口，肆意地汲取他喉间的氧气。

      莱姆斯很少在床上见到这样的西里斯，也许在其他地方见过，那种像是霍格沃茨的密道之类黑得透不进一点光的地方。他感觉他要被嘴里肿胀温热的阳具憋死了，可是这样的感觉——哈，被精液淹死——该死地棒。

      唯一不棒的是他居然在这会有点分神地想问西里斯他在上的是谁。但他没有问出口，有多少的可能性他不会得到指代自己的答案？也许是百分之一百。

      “西里斯，你真操蛋的是个性爱艺术家。”莱姆斯·卢平躺在满是黏糊糊的精液的床上，在一片漆黑中对着天花板瞪着眼睛小声说，像在泥沼里等死的飞蛾。

      -
       
      “性爱艺术家”。

      曾经有一个人也这样说过他。

      那个人长得和他有点像——黑头发、灰眼睛——不过这都是别人说的，要是让西里斯自己说，他会坚决地摇头，然后反问“那个臭小子看起来阴沉得要死，怎么能和我比”。旁人听后只会耸耸肩打趣着离开，因为没有人会否认那人的阴柔刻板，而会用他向西里斯打趣的人也不会去纠结后者的答非所问。西里斯很多时候都觉得挺没意思的，毕竟这些人的目的只是要借他的那句话来支撑自己心中对于别人扁平的刻板想象罢了。他们想要的只是一个被画在纸板上的人形轮廓——他的也好、那个人的也好。

      不过反正不管怎么做，自己的一举一动都只是在加深别人的刻板印象罢了，别人总有办法把我歪曲成他们想要的样子。

      人总是那么固执，这会让他们错过很多东西。这个道理西里斯后来才明白。

      然后人们就会说：“西里斯嘛，你们知道的，就是这样……”

      而那个人呢？阴郁、刻板、严肃、不苟言笑……别人眼里的他就是这个样子，所以他们自然也就无法想象出雷古勒斯浑身赤裸着躺在床上用能捻出我俩的体液的声音低声告诉我我是个操蛋的性爱艺术家时有多性感。为他们感到遗憾，但这是那些人为自己的刻板和匮乏的想象力所付出的代价。

      西里斯想起偶尔在霍格沃茨走廊上听到的那些叽叽喳喳地讨论着刚结束的魁地奇训练或比赛的声音，那些声音绘声绘色地描绘着扫帚上的那个人又完成了怎样的技巧动作，也许还会加上几句对他面庞的克制的赞美，而紧接着的就是——“看上去性冷淡的小布莱克”。

      所以说，刻板印象害人啊——当他在通向塔楼的某个楼梯上像往常一样给出那个无聊的回答之后听到一声从画像后传来的熟悉的笑声时，他这样有些幸灾乐祸地想——比如说，他们就永远无法知道他们口中“性冷淡的小布莱克”和“充满情趣的密道”该如何被联系起来。

      西里斯把耳朵贴近那副画像，恶劣地对着画像上穿着得体的男巫吹了口气。看见那个男巫面露嫌恶地往反方向挪步后，他满意地笑出了声。然后意料之中地，他听见隔着厚厚的石壁和冰凉的画框传来一个有些失真的声音——
       
      “我在这里，哥哥。”

      -
       
      “所以你当年为什么总是不愿意承认我和你长得像？”

      当西里斯再次睁开眼时，发现自己坐在正对着格里莫广场十一号和十三号中间的那条长椅上，长椅的另一边坐着一个十八九岁模样的男孩。那人此时正撑着脸看向他——和他如出一辙的黑头发、灰眼睛。在刺眼的月光下，西里斯甚至有那么好几秒觉得那个人就是自己，好吧，感谢这根本没有任何照明度可言的月光。

      西里斯轻嗤了一声说：“因为，我们两个本来就不像啊。”

      忽略掉身边那人一脸的“我才不信你真是这么想的”的表情，西里斯继续说：“不管是单纯的五官还是什么其他的，都不像。”

      说真的，这个雷古勒斯真的不明白为什么他会这么说吗？两人之间的空气又回到诡异的安静状态下后西里斯忍不住这样想。虽然他对那些处于灰色地带的灵魂魔法兴趣不高，也还没有弄明白这个雷古勒斯是怎么来的，但是感谢永远纯粹永远痴迷于这类邪恶魔法的布莱克家，他还是从他大脑的边边角角搜刮出了一些关于灵魂魔法的知识。

      灵魂抽离、托生者梦什么的，听起来就很邪恶，一想就是那家伙会感兴趣的东西。不过不打一声招呼就入驻别人大脑的霸道做法，什么时候这个软弱的家伙也有几分掌权者的姿态了？大概是多谢了奥赖恩和沃尔布加的教导。所以西里斯才能毫不犹豫地把这些知识的来源全部归咎于那座鬼屋，尽管他已经完全没印象到底是在什么情况下听过这些字眼的了。

      但原生家庭对一个人的影响就是这种狡猾的东西不是吗？你以为你已经逃出去了，族谱上不再有你的名字，但所有人都心知肚明哪一个被烧得黢黑的洞是你，你以为你可以不再活在那个在西里斯眼里不是很配得上“家”这个称呼的家的阴影下，你以为你真的可以从某一天开始活在太阳下直到死去，但实际上当你抬起头时就会发现它仍然在那儿、并且大概率会永远在那儿，而当那庞然大物倒下的那一刻，你也将灰飞烟灭。

      所以有时他真的不知道他和雷古勒斯谁更可悲——一个早就死去了，一个花了十几年才发现自己也不是活的。
       
      “好吧，不管你是怎么想的，我是没有办法知道你脑袋里的想法的，我只是这个梦境的住户，不是你脑袋里的蛔虫，好吗？拜托，别这么看着我，说真的，在你眼里我到底是什么形象？”

      “贱，”西里斯把头扭开，对着正前方的建筑说，不带一点犹豫，他看不见雷古勒斯的表情，但他能想象到对方有些讶异的挑眉和眼神里的困惑与审视，事实上，如果他此时回头，就会看到雷古勒斯脸上的神态和他所想象的并无二致，“就是很贱，明明胆小懦弱害怕承担后果却控制不了自己的野心，什么都不敢，却什么都想做、什么都想要——”

      西里斯发誓自己转头的时候是理智的，但至于俯下身的时候是不是他就不知道了。

      “包括自己的亲哥哥，是不是？”

      一个说不上意料之外的吻。

      雷古勒斯率先从这个吻中抽离出来，趴在西里斯肩头止不住地笑。过了半晌，他才抬起头来，颇有些认真地盯着对方和自己相似的瞳仁说：“你错了，我敢做很多事，包括得到你。”

      然后同样不算意料之外地，他再次把西里斯拉进一个吻中。他们两个人都默契地没有像以前一样用舌头挑逗对方的口腔，只是不停地吮吸着对方的唇瓣。西里斯不合时宜地想起小时候堂姐们给他和雷古勒斯讲过的睡前故事：一个人在爱人死去后的第七个满月将他的遗骨挖了出来，明亮的月光落在洁白的遗骨上仿佛重新生出了血肉，他们在那样的光线中拥吻。

      西里斯在这样的月光下不想深入对方的口腔，他只是贪恋着他肌肤的柔软，不想碰到任何坚硬的东西。

      -
       
      然后梦境结束了，灰色的潮水再度涌来，把他们连同他们嘴边的空气一齐淹没。再次睁眼时仍然只能看见单调的天花板，耳边却似乎还能听见那个人的低语——

       
      “我觉得比起结果来说，找寻的过程总是更有意思的。

       
      “以及——我确实挺贱的，如你所说。”

      -
       
      西里斯不知道自己在犹豫什么。

      显然不是因为房门上那个对他来说有些滑稽的刻薄小木牌。

      他没有理由不进去——因为一些邪恶的灵魂魔法，一个早就死掉的小食死徒每天晚上在梦里和他聊天，听起来很严重不是吗？听着，还有更严重的呢——这个早就死掉了的小食死徒是他亲弟弟，也许在他死掉的前一个晚上他们还在某个地方做过爱——等等，这很严重吗？但是不管怎样他得进去这个房间对不对？因为他得知道这到底是怎么一回事。

      所以见鬼的我又在犹豫什么？

      操，又不是不会开门。不就是转一下门把手，然后往前推，再向前走，能有多难？

      西里斯盯着那扇木门，他很确信这上面并没有什么可以威胁到他安全的陷阱——那个木牌上瘦长的字母不会化成利齿把他撕裂，那扇木门上淡淡的划痕也不会变成漩涡把他拉入地狱。这只是雷古勒斯的房间而已，仅此而已。况且还是雷古勒斯自己让他进去看看的。

      有什么好犹豫的，来吧。

      西里斯用力握紧面前的门把手——

      -
       
      “怎么样？”

      好吧，和前几天梦里别无二致的单调的场景，意料之中。

      “什么怎么样？”西里斯反问。

      “那个‘房间’，你进去了吧。”

      “明知故问。”

      -
       
      //西里斯并没有推开那扇门——他现在很确定那扇门背后就是一个怪物，一个像黑洞一样会吞掉一切的怪物。而莱姆斯显然比他更清楚这个怪物的存在，因为在他正要往下按门把手的时候，莱姆斯告诉他不要开门。

      “西里斯，他已经死了。”

      对方的声音中带着些警告意味，西里斯却如蒙大赦，一直僵挺着的肩颈也放松了下来。

      不用开。看吧，连明智的月亮脸都说不用开。

      我根本没必要开这扇门。

      死了就是死了，什么都不会再发生了，什么都不会再改变了。//

      -
       
      死了就是死了。眼前这个“雷古勒斯”不过是像走廊上那个疯女人的画像一样无聊的魔法产物。西里斯这样对自己说。

      但既然如此，他又为什么会害怕那扇门？真要命，怎么又绕回去了。那扇门没必要开，记住这个就够了，这才不是在自欺欺人，因为事实本来就如此。

      也许是西里斯沉浸在自己的思绪里实在太久了，以至于当他回过神来时就发现雷古勒斯的表情从饶有兴致变成了一片空白——就像他五年级时在走廊上看见过的所有雷古勒斯，詹姆他们会说他板着脸，但西里斯知道十几分钟后他们会在某个角落见面、拥吻、做爱，两个人都很凶狠，好像下一秒他们就要灰飞烟灭、世界就会崩塌，西里斯很难说在这个毫无美感的过程中他们是否有过爱意，但他们肯定曾有过恨意，想把对方吞进自己体内的恨意。

      他太熟悉这个表情了：“你要在我梦里和我做爱吗？”

      对面那人轻哼了一声，伸出手抓住西里斯的胳膊，而西里斯不确定自己是否看见了他的笑：“我会让你嗨得尽兴的(I'm going to make you high)。”

      下一秒西里斯发现自己正飘在天上，低头就能看见结冰的喷泉、黑压压一片的老房子、那张长凳，还有仍坐在长凳上的自己——依然保持着刚刚的姿势，一只手搭在翘起来的左腿上，脸傻乎乎地朝着右边，看向一片空白。

      好吧，在我不在的这段时间里，这家伙去进修幽默学了吗？西里斯眯眼盯着眼前抓着自己胳膊的人有些不悦地想。

      “虽然比不上你的摩托，但我想你也很久没有飞过了吧。”雷古勒斯松开手，在空中站直，一边低头整理衬衫一边说。

      西里斯稳住身形，俯身把脸凑到雷古勒斯眼前笑着说：“我该感谢你的贴心吗？但可惜了，我前几天才骑巴克比克从南美回伦敦。”

      “巴克比克？”

      “一只鹰头马身有翼兽。上个学年被哈利他们救下来之后我就把他养在12号里了。”

      “哦。”

      “只有‘哦’？”

      雷古勒斯扔过来一个白眼：“我不管之前我在你眼里是什么形象（西里斯：“一个小贱人，我说过了”）——但我现在已经死了。‘死了’，意味着我已经不属于这个世界了，这个世界在我死后所发生的一切，与我无关，我不在乎。所以，随便你吧，反正那已经不是我所在的世界了。”

      -
       
      //“西里斯——”莱姆斯的声音从背后传来，西里斯看着面前被堆放得杂乱无章的金银器皿上映出的模糊不清的人影，感觉莱姆斯的声音像是从四面八方连成一张网把他包裹起来。

      “你想说什么就说吧，别磨磨蹭蹭的”——这是西里斯原本打算说的话，但是他发现他说不出口。声带像浸满了汤汁的干面包，湿湿软软地胀起来，让他差点连呼吸都无以维系。

      真要命。他当然知道莱姆斯想说什么，像很久以前所有人都对他说过的一样——

      “别活在对已逝之人的怀念中。”

      woohooo，猜对了，没有奖励。西里斯在心里给自己拉了一个小礼炮，庆祝自己还是这么了解这个世界的运转机制。//

      -
       
      “好吧。”西里斯耸耸肩，开始抱怨冬天里伦敦夜晚的风和眼前抱着胳膊的雷古勒斯。

      然后又是一段沉默的飞行。

      最后还是雷古勒斯先没沉住气开了口：“你没什么想问的吗？”

      当然有。事实上，西里斯想问的问题实在太多了，导致他根本不知道从何问起。不过鉴于雷古勒斯这么问了，西里斯也就无所谓提问的逻辑性，随意抓了一个在他脑子里飞得最张扬的问题了——

      “我不在这里的时候，你在哪？”

      这个问题显然在雷古勒斯的意料之外。他扭头看了一眼身边的西里斯，那人此时正蹲在地上漫不经心地看着身下结冰的河流。过了几分钟，他才慢悠悠地开口说：“看来，你真的没进去啊。答案可都在那里面摆着呢。”

      “所有的吗？”

      雷古勒斯低下头，他的灰眼睛对上另一双灰眼睛——尽管那双被遮挡在长发后的眼睛近乎融在了夜色里：“所有的。”

      过了很久都没有人再说话，原本站着的人索性也坐下来，眼神晦暗不明地向某个方向延伸——其实不管是哪个方向都是一样的一团漆黑，只是雷古勒斯实在太清楚那里有什么。

      西里斯从前总说他像只猫，从某种角度上来说也确实如此，比如他和猫的夜视能力都不差，就像他能分辨出几乎要融在夜色里的西里斯的灰色眼珠，就像他能看见藏匿在远处黑暗中的孤岛上嶙峋的岩洞。

      雷古勒斯之前从来没想过这个梦的空间能延伸到这里。虽然也有可能只是因为这个空间把他人生中的重要节点拼在一起了而已。不过这里的岩洞湖底会有他的尸体吗？理论上来说应该是的，但如果是这样的话在这同一个空间里存在两个雷古勒斯不会出问题吗？还是说那里会以其他的形态出现？

      西里斯不在这里的时候，自己在哪？他发现自己根本没有办法回答这个问题，因为只有当西里斯在这里的时候，他才存在。而如果西里斯要离开，永远地离开这里，所有的问题都将不会再有答案。而雷古勒斯甚至能遇见到那样的日子已经不远了——西里斯已经陪了他太久了。

      -
       
      “你在看什么？”西里斯突然问，语气平淡得甚至让人听不出这是一个问句。

      “没什么。只是发呆而已。”

      “切，你这算什么回答啊。”

      “这也不是你本来打算问的问题吧。”

      对方停顿了几秒才开口：“你是怎么死的？”

      一个丝毫不会令人意外的问题，所以你一定早就准备好了回答吧。

      “我说过了，答案都在……”

      “我想听你自己说。”

      雷古勒斯怔愣了几秒，才拍拍身上莫须有的灰尘站起来向坐着的人伸出手：“好吧，我带你去。”
       
      西里斯拉上雷古勒斯的手的时候才发现对方脸上是他看不懂的笑，他身后的黑夜像被撕开了一道张牙舞爪的口子。

      -
       
      西里斯本来以为在飞向那个目的地的途中他能看见很多东西，比如其他贵族的庄园，比如布莱克家在法国的老房子，比如霍格沃茨城堡，比如在前往某个地方中转时他们曾瞥到过一眼的麻瓜集市……但这些都没有，身下只有一片漆黑。

      最后他们降落在一片卵石滩上。

      是错觉吗？西里斯居然觉得原本黑得近乎虚无的天空变得有些亮了。

      还以为这里永远是黑不拉几的一片呢。西里斯刚想开口嘲讽对方，扭头就发现雷古勒斯已经坐了下来，正盯着水面发呆，看不清表情。

      察觉到看向他的视线，坐着的人也抬头看向西里斯，拍了拍他身边的空地，示意西里斯坐下：“太阳要出来了。”

      西里斯这才看清楚他脸上的表情。他很久没有在雷古勒斯脸上见过这样的表情了——虽然他也很久没见过雷古勒斯的脸了——那种每次自己从家里偷跑出去之后打开家门被不知道从哪里扑上来的雷古勒斯脸上的表情，那时他会一边摸索西里斯身上所有的口袋一边仰起脸问他有没有给自己带礼物。

      天空的颜色很快开始变了，变成红色、黄色、蓝色，黑色被吞掉了，从这个梦境里逃离。然后猝不及防地，西里斯感觉自己被拽着胳膊扔进了水里，空气变成冰凉的湖水，除了眼前的雷古勒斯他什么也看不到。而那个人此时正抓着西里斯的双臂把他往湖底推。他眼前又是一片乌黑浑浊的水，什么都看不见，只能大概感觉到另一个人的身形，模糊的轮廓在细碎的水流中几乎要变成两个人。

      “看清了吗？他就是这么死的。”隐约间西里斯听见一个声音低声说，然后他和那个声音的主人在不断的下沉中交换一个潮湿黏腻的吻。

      -
       
      西里斯再一次面对挂着他弟弟滑稽笔迹的木牌的门时没有犹豫。

      明明正是夏天，他却觉得这间房间里格外的冷，冷得像十几年前的某个冬天——是哪个冬天来着，西里斯突然觉得雷古勒斯加入食死徒也不全是他的错，毕竟从一开始属于他的小弟弟的这间房间就没选好，住在这里的人怎么可能保持头脑清醒，看吧，他自己只是在这间房间里待了一会，就记不清事情了。

      所以，是哪个冬天来着？

      西里斯躺倒在床上，开始疑惑为什么这张床上会有那个已经死去十几年的人的气味。

      那个冬天的空气里好像也充斥着这样的味道——啊，不对，到底是这就是雷古勒斯的味道，还是他把这种味道命名成“雷古勒斯”，西里斯已经分不清了，总之那应该是一个到处都是雷古勒斯的冬天。

      那我们应该是在做爱了。在没有暖炉的冬天里做爱？好吧，听起来非常像我俩不是吗？

      西里斯闭上眼睛，脑子里还是一片模糊，不过他当然也没指望这段记忆会像小说里写的那样“潮水一般涌进来”，事实上他很怀疑这段记忆的大部分也许已经被他喂给某个摄魂怪了。

      不过，也许过一段时间就想起来了。记忆这种东西，不就是喜欢在人们声势浩大地寻找它们的时候躲藏起来，又在它们变得无足轻重的时候张牙舞爪地降临吗？

      所以也许等一会就好了，等他假装自己早已不在意而骗过大脑的时候，它就会出现了。

      于是西里斯从床上坐起来，重新开始在这间房间里翻找。

      等到这间房间里所有的抽屉都被打开，伦敦难得一见的太阳已经把这里照得像罗马的夏天一样了，西里斯也终于停了下来，在他最后抽开的一个暗格上是一张泛黄的纸——是布莱克家族唯一的小儿子的讣告。

      他也收到过一份这个来着。在那个很多年前的冬天。

      西里斯得承认他前面想错了，记忆有时候也会被某些东西牵扯出来，只是在这种时候它们总会有些不情不愿。

      -
       
      要西里斯完全回忆起那天发生了什么是不可能的，他只记得一份从天而降的讣告，然后他走出家门，走着走着就开始跑起来了，然后两条腿变成四条腿，他就这样一路从伦敦郊区的某个麻瓜村庄跑到格里莫广场，然后稀里糊涂地闯进了12号——他本来以为在自己被除名后这里就不再对他开放了。

      或许是跑累了，他记得自己没过多久就睡着了。睡着了，做梦了，梦见了雷古勒斯坐在结冰的喷泉旁仰头对着他笑，一如既往地欠操。

      回忆的最后他们两个人赤裸着躺在结了冰的水面，西里斯从冰面看见自己的脸时差点把他误认成雷古勒斯。
       
      所以这就是他所能记起来的全部了。剩下的部分不知道去了哪里，可能进了阿兹卡班里某只摄魂怪的肚子吧，虽然他也不确定这是否能算作“美好的回忆”。不过这几天西里斯确实发现他好像丢失了不少与雷古勒斯有关的回忆，他几乎要记不起他们去霍格沃茨上学之前的事情了。

      不知道是承认那些记忆都是“美好的回忆”还是承认自己已经离青春越来越远更让人恶心。算了，还是责怪那群没品味的监狱看守吧。别什么东西都吃啊。难吃的就吐回来还给我好了。西里斯这样想着，随手翻了翻刚从手边的抽屉里拿出来的笔记本。

      和其他任何一本从这间房间里翻出来的笔记本一样，这本笔记本上也密密麻麻地写满了对某种魔法的研究笔记。

      这是最后一本。

      书呆子，你一定是故意的吧，你知道我才没耐心从这些让人眼花缭乱的字母里找你。

      -
       
      有些锈蚀的门锁转动的声音在这个阴湿的房间里一点都不违和，但与这声音一起到来的门外的亮光就显得不怎么相配了。

      “月亮脸，”他听见自己这样说，“今晚就把它烧掉吧，只用再给我五分钟。”

      当他把脸从地上的手稿上移向门外晃眼的白光时，他诧异地想这间鬼屋居然能容忍这么多的光。

      -
       
      西里斯很高兴在他又一次见到雷古勒斯的时候在后者脸上看见了名为惊讶的表情。

      “我还以为你不会再来了。”

      “差不多，这是最后一次了。”

      “好吧，”坐在月光下的人耸了耸肩，“那么，你终于进去了？”

      西里斯翻了个白眼：“进去了，结果发现布莱克教授给我布置了几十万字的说明文阅读题。”

      对方愣了一下，但随即又恢复到原先的表情，语气里是熟悉的嘲讽：“我猜你一定是一个字都没看。所以，你来干嘛的？如果不是为了那小东西的机密的话。”

      西里斯低头沉默了一会，然后走到雷古勒斯面前，蹲下来直视着他慢慢说：“我来向你告别。”

      紧接着红色的火光从遥远的天边蔓延而来，西里斯在面前的人因错愕而微微瞪大的双眼的注视下消失在梦境中。最后一刻他看见他十八岁的弟弟在一片和他不相称的红色中边摇头边笑得无奈，好像在说：直到最后你还是没找到我。
  - title: 被整理好放在格里莫广场12号某个角落的一叠旧羊皮纸
    body: |-
       /嗨，你们好，我不是很想介绍我是谁，这让我有点尴尬——因为我现在简直是在对着一群也许永远不会出现的家伙写信。

      不知道过了多久这叠纸才会被人发现，如果永远都没有被人发现的话，那人类退化得还是有点过头了。开玩笑的。不过应该会有人发现的吧，家里每过那么几代总会出现西里斯那样的家伙。也有可能魔法部凤凰社之类的人会来这里吧，搜查之类的。

      总之，我还是不希望我正在向一个不存在的人写信，否则这真的显得我有点蠢了。

      如果你已经阅读完了前面几叠纸上面的实验记录，那么你就应该能知道我做了一个“类魂器”——是的，它的灵感来源于那个邪恶且丑陋的魂器，但我向你保证，它会比那好得多。在我十三四岁的某一天，我在某一本书上读到了有关魂器的介绍，于是我开始思考死后的事。我是一个对死亡抱有敬畏心的人，并且我对此引以为傲，也因此我坚信我不会在死去之后仍然贪生。但是，请原谅我仍然抱怀着一些对仍活在世上的人的执念吧，那时的我想要是能在我死后也不让他好过的话，那可就太赞了。

      于是我制作了它，在精神纬度上复制了一个我储存在里面，以保证在我死后他仍然，或者说通过此才能（？），逃不出我——或者说，那个我。听起来有点邪恶吗？但我相信他心甘情愿。

      它其实有一个比较正式的名字，事实上，是我刚刚才想好的，我叫它“梦魂”。寄存在这里面的精神空间，可以在制作者——也就是精神空间的主人死后通过一些手段侵入某个特定的人的梦里——非常无害。

      至于是什么手段，大概就是一些灵魂索引之类的东西吧，你可以试试在对方做爱做晕头的时候偷偷给你的ta系上，只是玩笑，抱歉。

      然后再细节的问题我就回答不了了，因为我也不知道，住在那个精神空间里的人其实并不是我。

      其实我也不知道我为什么要写下来，可能是因为觉得有点不甘心吧，不甘心自己着手的研究最终是这样的一个半吊子。所以——如果我选中的那个对象没有一把火把我的小挂毯布烧掉的话（这句话成真的概率不超过百分之十），去找到它吧。然后请想办法告诉里面的人，你们的研究结果。/
