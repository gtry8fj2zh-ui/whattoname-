title: 一千零一夜
author: /
updated: 2026-11-03
summary: ——那么就在今夜举杯吧。潘多拉在每一个夜晚都想这样说。
chapters:
  - body: |-
      “告诉我，埃文，这就是你上午跟我们说的‘过夜的好地方’？”雷古勒斯低头看看脚底下的简陋木筏，又抬头眼神空白地看着站在面前一脸得意的埃文，干巴巴地说。梅林，这灼热的阳光能不能停止哪怕一秒在他的后勃颈上燃烧？他已经开始想念自己在斯莱特林阴凉的地下室里舒适的床铺了。
      “你应该提醒我带上克里斯的，”潘多拉面露惋惜地说，“她看到有这样的阳光会很兴奋的。”
      “你的克里斯只有看到肥美的苍蝇的时候才会兴奋，”雷古勒斯抱起了胳膊，站在一边幽声说，“并且一般来说，我们不会把‘在晚上体验白天’称为‘过夜’。”
      “得了，”埃文面上的激动不减，侧过身用胳膊肘顶了顶雷古勒斯，眨眨眼说，“找个地方度过夜晚就叫‘过夜’。别那么扫兴雷吉，你看巴蒂，他已经被这个赞透的地方惊傻了，是不是？”说完，他还伸手戳了戳巴蒂的脸颊。而巴蒂从一开始就静止如塑像的身体终于像摁下开关一样动了起来。
      他难以置信地矮下身子捧起一抔水，撒到空中，又摸摸木筏上风水侵蚀的痕迹：“这个房间真是赞透了啊！这儿的魔法原理是什么？这些都是实际存在着的吗？还是只是它影响了我们的认知，让我们以为它们存在？”但显然他的动作有些太大了——木筏在浅水区摇摆了起来，腥咸的海水溅上来，浸湿了他们四人的鞋子。“罪魁祸首”顶着雷古勒斯责怪的目光，不好意思地缩了缩脖子，看着另外三人说：“抱歉雷，我对你鞋子的遭遇感到很遗憾……我不是故意的，我只是太兴奋了！但是你们难道不兴奋吗？还是说，难道你们早就知道这个地方？”
      潘多拉耸耸肩：“我有一次在经过这里的时候迷路了，然后就发现了这个地方。”
      “之前我求助学校里的小精灵的时候，它们告诉我可以来这儿，”雷古勒斯边往鞋子上施干燥咒边说，“不过我还以为大家都知道这个呢，因为我记得我之前在图书馆里哪本书上读到过关于它的介绍……”
      “好吧，我则是上个假期才从家里的哥哥姐姐那儿听来的。”
      “而你们居然现在才告诉我？难以置信！”巴蒂瞪大了眼睛，不断控诉着好友的“背叛”。
      “这可不是什么秘密，如果你读过——”
      “《霍格沃茨的创始人们及其秘辛》？还是任何一本有着这样的拗口名字还厚得能砸死鹰头马身有翼兽兼带强效催眠魔咒的精装硬皮书？拜托雷，这种东西除了你就只有写下它们的人会看过了。我相信就连宾斯教授那么无聊的家伙都不会想要去翻开它们的。”巴蒂站起身，翻了个白眼，打断他说。
      埃文站在一旁深有同感地点了点头。雷古勒斯撇撇嘴，正要发作，话头却被潘多拉劫去：“好吧埃文，现在该告诉我们这个木筏会往哪开了，对吧？”
      埃文挠了挠头——“看吧，他不知道，真有趣，”雷古勒斯抱着手臂讥笑着说，“不敢相信我还为此特意去调整了我的夜巡安排！”，巴蒂毫不在意地脱下鞋卷起裤脚，在木筏边坐下，把腿浸到水里：“我们亲爱的斯莱特林级长大人，别那么像一个贱兮兮的小怨夫。承认吧，你爱我们！”——他看着潘多拉一言不发地走到船尾，蹲下身在沙滩上翻拣贝壳，耸了耸肩，说：“我提的要求是‘一个能让我们划船划到早上的房间’。”
      “那么至少这个房间知道我们会去哪。”潘多拉转过身，把用校袍兜起来的一大捧贝壳在木筏上放好，兴致颇高地举起船桨。
      巴蒂见状，也抓起桨柄想把它举起来，船桨却在层层沙砾之下纹丝不动：“那我们出——嘿，这东西怎么这么重？”
      潘多拉挥了挥魔杖，船桨一跃而起，“嗙”的一声砸在看起来并不是很结实的木筏上。可怜的木头们几乎要散架了。“不知道这些看起来能被鞋跟碾碎的绳子是怎么撑过刚刚那一击的。”埃文在检查完木筏还能正常使用之后如释重负地说。
      “它们当然可以，”潘多拉一边梳理着刚刚被飞起的木筏铲到自己头发上的沙粒一边欢快地说，“你刚刚不是说了？这是一个能‘划船划到早上’的房间，而显然现在还没到早上。”
      “你可别告诉我你是故意的。”雷古勒斯刚从那声巨响中回过神来，正不耐烦地清理粘在自己身上的沙子。在他目光所及之外，潘多拉朝巴蒂做了个鬼脸，将一只船桨塞到他怀里后自己拿起了另一只船桨。巴蒂从她毫无规律的挤眉弄眼中会过意来，瞥了眼仍苦于整理着装的另外两人，将船桨抵在岸边用力一推——
      “出发！”
      巴蒂看着站在船头的两人边踉跄边投来愠怒的眼神，得意地笑了：“绅士们，请坐稳扶好以免跌落——或者你们跌落也可以，我还挺好奇水下面有什么。”
      “如果你们看到绿乌贼的话帮我抓一只上来，我的神奇生物论文还差这一段，”潘多拉在船的另一边不动声色地说——好像别人看不出来她在憋笑似的，她又摇了摇船桨，才歪了歪头咯咯笑着补充道，“请？谢谢？绅士们。”
      “鉴于这只是一个让我们划船的房间，而不是什么‘让我们抓绿乌贼抓到早上的房间’，我想这下面是不会有你需要的东西的，潘。”雷古勒斯走到船尾坐好，施了个加速魔法，又在埃文“用魔法就不算是我们自己划的船了”的抗议声中翻了个白眼将其撤掉，边嘟哝着自己第二天一大早还有其他事要干边背对其他人躺下来。
      潘多拉将自己的校袍从那一大叠贝壳下抽出来，盖在雷古勒斯面上。贝壳哗啦啦地撒了一地，还有几颗沿着木头之间的缝隙滚进了水里。潘多拉看着还在不断晃荡的贝壳堆，轻飘飘地说：“好吧，那真是遗憾。”
      “那我们来讲故事吧！总不能真的只是划船划到早上吧？”埃文突然回过头来说。
      “我还以为你觉得可以呢。”雷古勒斯的声音隔着浸了贝壳咸腥气味的校袍从船尾传来。
      “总之，我们来讲故事吧！”
      “或许，在那之前，你会想先来试试划船吗？”巴蒂回头看了眼正饶有兴致坐在雷古勒斯头顶不断戳戳这里挠挠那里地骚扰雷古勒斯的埃文——后者最终在前者忍无可忍的“埃文那是我的鼻孔”的怒吼声中终于停了下来——边喘气边说。
      “各位巫师们，我们不如干脆施个小魔法，让船桨自己划起来呢？”雷古勒斯突然坐起来说。
      刚接过巴蒂手中的船桨和划船工作五分钟的埃文显然放弃了几小时前自己那套对于人力手工划船的坚持，涨红了脸表示赞成。
      “嘿，这不公平！”刚歇息下来的巴蒂的脸颊和埃文的一样红，只不过是更疲惫也更愤怒的那种红色：“我划了将近——不知道多少个小时，而潘现在还在划。这显然不公平！”
      巴蒂看向满脸不以为意的潘多拉，眨了眨眼在空气中发出希望她表达不满的讯号，后者则回以他一个缓慢的眨眼和神秘的微笑。过了几秒钟，她才抬起手，露出手臂内侧藏在袖口处的魔杖和离开人手后仍在不知疲倦地划动的船桨，惋惜地说：“我很抱歉，巴蒂。”
      “真不错，现在三对一——噢，我是说，我很遗憾，伙计。”埃文拍拍巴蒂的肩膀，正打算施咒，魔杖却猛地被方才还因“被背叛”的震惊而呆坐在地上的人抢去。
      “你们猜怎么着？现在是三对一的‘不公平’，还得加上在这个晚上第二次的‘被你们背叛’！”巴蒂没有搭理埃文“把魔杖还给我”的叫嚷声，将另外两人的魔杖也一并收缴起来，走到船头，颇为满意地看着船尾三人不悦的神情，扬了扬头说，“现在，你们三个换着划，我监督你们。”
      雷古勒斯低头看看被从自己的魔杖尖发出的咒语塞到自己手中的船桨，又抬头看看趾高气扬地站在船头的巴蒂，扯了扯嘴角，对埃文和潘多拉说：“其实我们完全可以不划啊。巴蒂又不能逼着我们做这些。只要像这样把桨放进水里——”
      “喂！我听得到！”
      “你不会想对我们用那些咒语的，对吧？”雷古勒斯看向不远处有些气急败坏的巴蒂，突然语气平板地反问道。片刻前还手舞足蹈的人这会却突然安静下来，眯起眼睛回看过去，无声地质问他说出这句话的用意。
      “好了，我们不会那样做的，”潘多拉没有理会两人之间突如其来的暗流涌动，将手伸到水里搅动起水花，耸耸肩说，“我们不应该对你这么不公平。”
      埃文则看看这边又看看那边，长舒一口气般的拾起船桨，狡黠地朝正在船头站着的人眨了眨眼：“听您差遣。可别让我们浪费了这个晚上。”
      “好吧，那么现在——”巴蒂重新活泼起来，意味深长地看了看仍低头研究着怀里的船桨的雷古勒斯，“雷，你去埃文那里和潘一起划船。然后——”
      然后他挥了挥魔杖，咧开了嘴说：“埃文，你来给我们讲一个故事吧。”
      雷古勒斯面上不情不愿地被咒语托着送到了船边，身体却听话地跟着潘多拉的动作一下一下地动了起来。与之相反的是满脸兴奋的埃文：“哈！我就说讲故事是一个好主意吧！那我现在可以开始了吗？”
      “小心点，”雷古勒斯看着跃跃欲试的埃文皱了皱眉，“别把自己弄到水里去了。当然，也别把我们弄到水里去。”
      “他不会的。记得吗？这是一个——”
      “划船划到早上的房间。感谢提醒。”
      “当然了，我也不介意你试一下，我和巴蒂都很想知道这个房间会为了保障这个要求而做出什么事情。”潘多拉偏了偏头说。
      “真是感人的精神，但是抱歉了，我介意。尤其在没有魔杖给我施干燥咒的情况下。”
      埃文清了清嗓子，抢在潘多拉回呛过去之前接过话头，窜到另外三人面前，弓起身子，皱皱鼻子露出一个有些邪恶的笑容，故作神秘地压低声音说：“好了！女士男士们，请安静下来，因为我的故事，就要开始了。”
      “呃，他知道在大白天下讲鬼故事是不会吓到我们的，对吧？”雷古勒斯一脸无奈地扭头看着另外两人问。巴蒂耸了耸肩，潘多拉则有些期待地说：“谁知道呢？”

       “传说，在远古的四巨头时代，禁林里有一种恐怖的怪物。牠有蛇一样的身子，身上满是鹰一样的羽毛，四只爪子是狮掌的模样，屁股上则长着獾的尾巴……”
      雷古勒斯欲言又止地张开嘴又合上，重复了几次之后他显然放弃了忍耐，撇了撇嘴说：
      ——巴蒂，你要不给他一个照明咒吧。他那副假装手里有油灯的样子真是太蠢了。
      ——别打断我的叙事节奏，你这个小混蛋！
      埃文白了他一眼，又清了清嗓子，继续说：“传说中，这个怪物会幻化成人的样子，引诱误入禁林的学生。等学生们走到了禁林深处，牠就会——”他故作高深地停了下来，稍稍矮下身子凑近了另外三人。
      巴蒂被他突然的动作吓了一跳，扯了扯衣领，扭头看着坐在身边的另外两人，幽幽地问：
      ——你们有没有觉得风变大了？
      ——他也许有在白天讲鬼故事的天赋。
      雷古勒斯耸了耸肩，不动声色地将自己缩紧了些。
      ——也许是这个地方有讲鬼故事的天赋。
      潘多拉打了一个小小的寒颤，环顾四周，平静得诡异的水面上除了这只小木筏什么都没有。
      “——嗷的一下把那个学生吃掉！”埃文看着同伴们的反应，唰地直起身子张开手臂。他瞪大了眼睛，假装自己就是那个怪兽，就像所有逗小孩玩的大人曾经做过的一样。
      “哇哦，这真是，”巴蒂看着仍维持着唬人动作的埃文，眨了好几下眼才憋出一句话，“真是十分令人印象深刻。”
      “实在是无聊的故事。”雷古勒斯一边干巴巴地说，一边发出几声讥讽的鼓掌声。
      “这个故事也许还没结束呢，是吗？”
      埃文泄气地将动作收敛起来，重新在木筏上坐好，说：“当然，潘说得对。你们两个总是打扰我！我还没讲完呢！那个怪物抓到学生之后，牠会先把学生的衣服扒下来，再剥下学生的皮——”
      “这样，牠下次就能化性成这个学生的样子，穿上那个学生的衣服——”
      ——我想他还是需要一个照明咒。
      雷古勒斯看着重新弓起身子压低声音和眉眼的埃文，平板地说。
      ——然后呢？
      埃文飞快地朝潘多拉眨了眨眼睛，算是他在保证自己的“叙事节奏”不被破坏的前提下对这个相对善良的女孩表达的感谢：“然后，牠会趁那个学生还清醒的时候，变成那个学生的样子——”
      “强迫学生看着自己，从脚到头，一口，一口地吃干抹净！”埃文摆出狰狞的表情，环视了另外三人的神色，得意地说：“怎样？这是一个好故事吧？”
      “我还是坚持我刚刚的看法，”雷古勒斯显然没有顾及自己刚从短暂的惊吓中缓过来的呼吸和略显苍白的面色，努力用毫无波澜的声音说，“无聊的故事。”
      埃文只是不屑地将一分钟前因幅度过大的动作而落到面前的碎发吹到脑后，抱起手臂歪头说：“那让我听听你的故事？”
      雷古勒斯抿了抿嘴，迟疑了一会才抬了抬下巴，说：“我的故事绝对比你的要好！”
      “你根本没准备好故事吧？”埃文讥笑着回呛过去。
      雷古勒斯将船桨猛地往下一探，扭过身去就要反唇相讥：“你不怕我没准备好讲出来的故事也比你刚刚经过深思熟虑讲的要好？再说——”
      “停下！”巴蒂一边躲闪着溅上来的水花，一边大声打断两人之间的争吵，“也许你们忘了，我们这里有一位能安排你们的工作的人——那就是我！”
      雷古勒斯看着巴蒂被水打湿的裤脚和得意洋洋的神情，小声嘀咕着“真抱歉，我还真忘了这回事”。
      巴蒂摆出一副宽容的神情，大手一挥将潘多拉的船桨塞进埃文手里，说：“现在，埃文你去划船。”
      潘多拉满意地伸了个懒腰：“好吧男士们，我很荣幸能够成为我们今晚第二个故事的讲述者——”
      “噢不，”巴蒂笑得整张脸都皱在一起，“我要来讲下一个故事。”
      潘多拉面露遗憾地提起眉头，夸张地像要攒起一座山峰。她走到木筏中央坐好：“好吧，那么我想我们准备好了。”
      “从前，有一个以屠龙为终极目标的人。从他出生开始，所有人就对他说：‘你是为屠龙而生的’。”
      ——我想这个故事已经比埃文的要好了。
      ——闭嘴，雷古勒斯。
      雷古勒斯越过潘多拉淡色的长发瞥了一眼坐在另一侧的埃文，心虚地嘬起口腔内侧的软肉，抿了抿嘴，悄悄做了个道歉的嘴形，没有再说话。
      巴蒂看看雷古勒斯又看看埃文，挑了挑眉继续说下去：“直到有一天，他终于具备了屠龙的本领，踏上了寻找恶龙的旅程。”他调整了一下坐姿，将两只腿盘起来，继续说下去：“可是他不管怎么样都找不到那条龙。当时村庄里的人告诉他恶龙有着淬了毒似的绿得发黑的鳞片，只有一条细线和周围充满红血丝的眼白的眼睛，还有尖锐的背刺——”
      ——这个听起来似乎比刚刚那个四学院怪物吓人一些。噢对不起埃文，无意冒犯。
      潘多拉摊开手，咯咯笑着说。
      埃文做了个鬼脸，说：
      ——至少你比雷吉要有礼貌得多。我真不知道他们——
      “有一天，”巴蒂看着雷古勒斯已经为反击准备好的眼神，没等埃文说完，便打断了他的话，提高了声音说，看着三人的注意力重新回到自己身上，满意地接着说下去，“他遇见了一个池塘。就在他决定要在这里洗个澡时，他发现了一个震惊的事情——”
      他将眼睛提得可大，像是要把他的伙伴们都装进去。
      ——也许你的停顿停得太长了，巴蒂。
      雷古勒斯看着已经保持瞪大的眼睛数分钟的巴蒂有些无奈地说。
      潘多拉则颇为佩服和赞赏地将自己的头发拢到脑后，凑上前去盯着面前的蓝眼睛说：
      ——梅林，你的眼睛真有神。顺带一问，你是怎么做到保持这么久的？你用了什么保健魔药吗？
      巴蒂将身子缩回去，摆摆手，仍然拉长了声音说：“他发现——他就是那个恶龙！”
      ——梅林的胡子！然后呢？然后发生了什么？他有没有去报复那些教唆他去杀了恶龙的人？
      埃文兴奋地问。
      “很遗憾，没有，”巴蒂耸了耸肩，只是从他的语气中听不出任何遗憾的意味，“他只是觉得自己真傻，然后就跳进池塘里，把自己的剑扎进了自己的喉咙里。”他眨眨眼，环视着没有对此作出任何反应的三个人，合起手掌发出一声脆响又摊开，把脖子往前伸，疑惑地看着他们，说：“结束了。你们这反应什么意思？”
      “意思是，我也许终于意识到了我们之中不会有任何一个人能成为好的故事讲述者。”雷古勒斯慢吞吞地说。
      “也许我会是的。”潘多拉不以为然地说。
      “嘿！这至少是一个好故事吧？好吧，那么谁想下一个说？”巴蒂有些不忿地鼓起嘴，不等别人做出反应，他便抽走雷古勒斯手中的船桨，说，“下一个你来，雷。我相信你已经准备好了吧？”
      雷古勒斯看着在自己手中待了几个小时的船桨来到了潘多拉的怀里和面露恼人神情的巴蒂，有些气急败坏地说：“说真的，巴蒂，拜托你别那么像任何一个教授——‘亲爱的，来把你学会的东西展示给其他同学看吧’。”
      “那我应该怎么说？‘给我上来讲故事！’？难道你喜欢这种？”巴蒂窃笑着说。
      雷古勒斯没有回话，只是翻了个白眼。灰色的瞳孔重新转回正中间时，他已经被巴蒂的咒语托到了三人面前。他吸了一口气：“好吧。从前有一个——”
      ——无聊的开头。
      埃文坐在一旁挑衅地打断道。
      “从前有一个吸血鬼，”雷古勒斯不悦地瞪了埃文一眼，吸了一口气继续说下去，“他从前一直过着平淡的生活，直到他发现自己爱上了一个人类。”
      ——听上去很糟糕。
      埃文将船桨抱在自己怀里，皱起眉说。
      ——是啊，只不过没有你的打断糟。
      ——我这可是正经的真诚的根据你的故事发展作出的评价！
      ——也就是说你承认之前那句是不正经不真诚的了？
      雷古勒斯看着埃文瞪大的眼睛，满意地翘起一边嘴角，在埃文开口反击前抢着说：“我们的吸血鬼现在爱上了一个人类。那么他该怎么办呢？幸运的是，他的人类是一个无法走出病房的住院病人，所以他只需要在夜深人静的时候在病房里和他的人类见面；但不幸的是，这位病人似乎快要康复了，又似乎永远不会康复了，总之，他在期望——哦不对，应该说渴望，一个走出病房的机会。”
      ——提问。
      潘多拉从划船的动作中空出一只手举了起来。雷古勒斯微微点了点头，她便继续说下去：
      ——那个人类知道他的吸血鬼是吸血鬼吗？
      雷古勒斯摸了摸下巴：“很好的问题，拉文克劳没有分。我认为他是知道的。
      “后来，在夜复一夜的陪伴之后，终于有一天，人类问吸血鬼有没有见过日升日落。
      “吸血鬼告诉人类，太阳像野兽躲避火光一样躲避着他。人类沉默了一会，和吸血鬼说再过几个小时，太阳会升起来，会有一个人来推他到外面去看日出。
      “于是那天晚上，吸血鬼在病床前等到日出前五分钟才走。而他也再没有来过这间病房。”
      ——结束了？无聊的故事。
      埃文打了个夸张的哈欠，在拖长了的尾音里说：“如果我是那个吸血鬼，我就在发现我爱上那个人类之后就把他也变成吸血鬼。不过当然了，如果我是他的话，我就不会爱上那个人类。”
      “真可惜，你不是，”潘多拉没有看过来，目光落在不知道哪滴水上，耸耸肩说，“顺带一提，真是无聊的故事，雷。”
      “以及我同意你的说法，”巴蒂默默举起一只手说，“我们之中没有人能讲好一个故事。”
      “喂！我还没讲呢！”潘多拉恼怒地将船桨撂到木筏上，愤愤不平地说。说着，她便自顾自地走到船头，将还没反应过来的雷古勒斯拽到船边她方才坐过的位置，清了清嗓子，示意所有人坐好后，自己也盘腿坐了下来。
      “很好，那么，我就开始了？在一个遥远的山地里，生活着一条龙。”
      ——我们终于迎来了有别于“从前”或是“传说”的开头。
      巴蒂忍不住插话道。
      潘多拉眨了眨眼，愉快地说：
      ——我很高兴有人注意到了我的巧思。
      “它曾经拥有世界上最好的红宝石——不过这个应该是它自封的——并将其视作与它的生命同等重要的宝物。不过——”潘多拉戏剧性地长叹了一口气，吊高了自己的声调，摇头晃脑地接着说，“事与愿违。有一天它发现自己总是随身携带的红宝石不见了。也许是它的鳞片长大了，曾经可以刚好卡进鳞片间隙的红宝石掉了出去。”
      埃文哀嚎了一声，捂着眼睛说：
      ——我想它一定难受得要死了吧？
      潘多拉微微昂了昂头：“它难受得要死了。但从小它的长辈就教导它：‘龙是强大的生物，是不能难过的’。然后它就问：‘那如果我失去了这辈子对我最重要的东西也不能难过吗？’。那位长辈当时严厉地告诉它，失去的东西是不可能回来的，所以因此而难过不是一个强大的生物应该做的。
      “于是它一遍又一遍地告诉自己：‘失去的就是失去的，失去的不可能再回来了’。可是它仍然无法控制自己去为那枚红宝石难过——”
      ——真是可怜的家伙。
      ——你们两个居然在为故事中的一条龙难过，真不可思议。
      雷古勒斯扭头，难以置信地说。
      潘多拉吹了声口哨，得意地说：
      ——这也许能说明我就是我们四个中讲故事讲得更好的那一个。
      雷古勒斯耸耸肩，问道：
      ——好吧，然后那条可怜的龙怎么样了？
      “后来，它就自杀了——”
      ——看来我们对自杀的故事情有独钟啊，伙伴们。顺带一提，我故事里那位吸血鬼后来在某一天清晨突发奇想去看了日出，然后灰飞烟灭了。
      雷古勒斯耸耸肩，语气轻松得就好像他杀过几百个人。
      “那条可怜的龙自杀了，它飞到很高的天上，然后收起了翅膀从上面摔了下来。它掉到地上的时候，发现它眼前躺着那枚曾经丢失的红宝石。”
      “又或许不是那枚呢？”巴蒂冷不丁地插嘴问。
      潘多拉满不在乎地耸耸肩：“也许呢？总之它在死前认为那就是它丢失的那个宝物。不过我想如果我有晚辈的话，我会和他们说：丢失的东西最终会回到我们身边的。至少这听起来让人感觉很好，不是吗？”

      “嘿，我想说这句话很久了，有没有人想尝尝这海水？如果巴蒂愿意的话，我们还可以把这对贝壳变成杯子，”潘多拉看着面前三位已经有些昏昏欲睡的男士，指了指身后说，“在我们到达目的地之前。”
      他们三人顿时将已经开始变得混沌的脑袋从支撑着它们的手上移开，伸长了脖子超前望去。在不远处的海面上是一扇悬浮着的木门，和几个小时前在深夜走廊上浮现的那扇门相差无几。
      “好吧，我已经见到了你们赎罪的诚意，现在——”
      埃文一把揽过巴蒂的肩膀：“得了，别学他们说那些啰里八嗦的讨人厌的官话了！快把我的宝贝魔杖还给我！”
      “——现在，我将这些交还给你们，希望你们今后也能延续今夜的优——”
      雷古勒斯和潘多拉一接过魔杖就抖抖手腕将木筏上所剩无几的贝壳变成了四个高脚杯，埃文则负责在每一个高脚杯里斟满腥咸的海水。
      木筏稳稳地停在了悬浮的门前，他们四个高举起高脚杯。杯壁碰撞在一起，发出贝壳撞击的清脆声响——
      ——那么就在今夜举杯吧。
      潘多拉觉得自己像喝醉了一般满脸驼红，酒杯中的海水在碰撞中洒了他们一手臂。
      雷古勒斯一边将自己杯中的海水悉数倒回海里，一边拧开了门把手，下一刻炽热的阳光、海洋、木筏和高脚杯都消失得无影无踪，清晨的朝阳正从走廊东面的透光处一丝一缕地渗进古堡中——
      ——因为下一刻我们的手中将空无一物。
