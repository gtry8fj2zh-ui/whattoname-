title: 药
author: /
cp:
  - 北角北
updated: 2025-07-19
chapters:
  - body: |-
      在一周的七天里，北信介最喜欢周四了。
      每次被问及原因的时候，他都会想起之前去一个寄宿学校例行问诊的时候听见孩子们的讨论：周一周二是最痛苦的日子；周三到了就说明这周要待在学校的时间已经过半，能看见回家的希望；而周五就是回家的日子，是最值得庆祝的。这时他扭头笑着问：“那周四呢？”孩子们就愣住了，面面相觑，过了好一会才说：“那周四就是‘即将回家日’，可以小小庆祝一下。”
      对于北信介这样的中医馆学徒来说，他的每一天都是近乎一模一样的来往于出租屋和中医馆之间，并不存在像那些孩子一样要在学校度过一周只有周末才能回到家的烦恼，也就不需要在周四“小小庆祝”周末的到来。但他喜欢周四，只是因为这是一个几乎被除了他以外的所有人忘掉的日子，对那些人来说这只是一个被淹没在前半周的痛苦疲惫和后半周的放松之下不起眼的24小时。
      北信介喜欢沉浸在这种被人们的麻木堆起来的日子里，就像独自生活在没有人能发现入口的桃花源，即使他只是像在任何一个其他日子里一样打扫医馆、帮老师照料庭院。
       
      不过后来有一天北信介发现有一个人站在桃花源入口的地方。
      有些意外。这就是北信介第一次在周四的午后看见站在医馆里的角名伦太郎时全部的想法。鬼使神差地，在他把抓好的药递给面前的青年时，他开口问：“您，也喜欢周四吗？”
      角名接药的动作顿了顿，然后笑着看向北信介说：“不。我讨厌周四。”
      北信介这时才注意到眼前那人的眼睛是好看的烟绿色，让他想起那盆摆在他出租屋窗台上的朝雾草。
      他看着角名提着药离开的背影，觉得自己像身处桃花源里的人看见看见入口而却步的旅人。
       
      今天就是周四，是每周那个清瘦的年轻人复诊拿药的日子。
      北信介知道今天会像之前的每一个普通的周四一样：清晨打理庭院的时候他会想起窗边的朝雾草和那双烟绿色的眼睛；角名摁响门铃的时候他会在庭院打扫落叶，铃声响起十秒后他就会走到门边打开门让它停下；然后他带着角名走到诊室门口，他则回到庭院继续他没做完的工作；大概十五分钟之后角名就会走出来，把处方递到他手里；最后他把抓好的药和处方一并递还给他，再陪他走到门口；关门声响起后他就开始期待下一个周四的到来。
      每一个周四北信介都是这样度过的，所以今天也会是这样——
      是吗？
      北信介已经打扫完庭院了，熟悉的门铃声还没响起。本来坐在诊室里的老师也走出来说：“那孩子今天还没来呢。”
      话音刚落，不知道藏在哪里的老音响里就传来沙哑的钢琴曲，北信介扭头看了眼仍坐在庭院石桌边眯着眼喝茶的老师，快步向门口走去。铁门被吱吱呀呀地拉开后他和门外站着的人之间的距离就只剩下空白的三十厘米。
      “原来这首钢琴曲后面的旋律是这样的啊。下午好，北桑。”角名的声音隔着口罩飘到北信介耳边，带着与他说“讨厌周四”时相似的调笑，可是当北信介抬头看向他的眼睛时却看不到那时的笑意。
      “信介，今天的庭院打扫完了吧，那就进来和我们一起吧。”经过庭院里的石桌时他听见先前一直安静喝茶的老师突然开口说。
      “啊，好的。”北信介忙点头应下，一边跟在老师身后走进诊室一边思索自己回答前的愣神因何而起。
      他不是没有进过诊室，甚至于这才是他平时的工作，只是因为之前角名每次都在他清理庭院的时候来，他才没有旁听过老师给他的诊断而已——不过也许就是因为这个吧，因为这是他第一次看见坐在诊室里老旧木椅上的角名，在此之前他对这个高瘦青年的所有了解都只来自于每周四的那一纸处方单。
      北信介想起角名第一次来医馆那天，他离开之后老师从诊室里走出来背着手面朝着大门站着，他回头问：“老师，那个人是——”
      “信介自己不能从处方单中看出来吗，”老师打断他的话慢悠悠地反问，不等他回话继续说，“不过说起来，这还是信介你第一次主动问起病人的情况呢。”
      “信介是对角名君很感兴趣吗？”记忆里的老人边喝茶边眯眼笑着说。
       
      “所以，角名君这段时间有感觉好一点吗？”
      北信介回过神来时发现自己已经把记录本翻到新的一页写好日期和基本信息了，刚才小小的走神就这样被这些习惯性的动作掩盖过去。
      刚刚居然走神了啊。不过，还好养成了这样的习惯，走神才没有被发现。北信介一边这样想着一边看向面前坐着的人，那人此时正用懒散的点头回应刚刚老中医的问题。
      “上次给的的药，角名君也有在好好吃吧。”
      “啊，是有的。”
      可是这声音和语气听起来倒像是在说“对不起，我没有”呢。坐在桌子另一边的人虽然面上还是像平时一样的没什么表情，但从细长的眼睛里流露出来的情绪却意外地好懂。坐在身旁的老师却似乎没有察觉到这个小小的谎言，还保持着方才和蔼的笑，静静看着他们。他便也没说什么，只是普通地问了些普通的问题——生活习惯规不规律、排泄正不正常之类的，然后普通地在记录本上写下对方的回答。再然后老师站起来接过记录本，绕过桌子走到角名那边给他把脉。
      从这一刻往后的十几分钟都是北信介不用参与的，他只需要坐在桌子的另一边安静地看着、再在十几分钟后接过处方单就好了，他的工作就是这么简单，一直如此，不管桌子的另一头坐的是谁。
      角名伦太郎今天来得有些晚，等到今天的处方单被北信介接过时，太阳光已经可以透过纱质的窗帘和斑驳的窗户斜斜地照进诊室里了。橘黄色的光落在北信介身前，把他眼前所有事物的轮廓都模糊在一片亮色中。
       
      “呐，北桑……”
      角名的声音在安静的药房里响起时，北信介正背对着他拉开墙上的一个抽屉，药材的味道和抓弄药材的声音缠在他有些过长的发尾上，搔得他耳廓发痒。
      “如果我说，我其实没有好好吃药……”
      北信介把抓好的药材逐一打包好递到低着头还在支吾的人面前。他背着光抬起头，又在对上那双眼睛的一瞬移开目光，一边接过装药的纸袋一边慢慢说：“果然还是算了吧。”
      “其实，角名君不说我也知道的，”北信介歪了歪头，在看到角名因错愕而微微睁大的眼睛时露出了一个有些坏心眼的笑，“角名君你其实不是很擅长说谎吧。”
      他没去理会角名有些不自然的动作，仍自顾自地像之前一样跟在他身边朝医馆的门口走去。等他们走到门口时，地上的影子已经被落到同院子里的老树一般高的太阳拉成细长细长的一条了。北信介回头看，感觉两个人影像中午吃的夹生的乌冬面一样笨拙地缠绕在一起。
      他扭过头，看着正要推开铁门的角名，突然说：“虽然也许会有点越界，但还是想问角名君几个问题可以吗？”
      “啊，可以的。”
      明明是长得更高的那一个，在面对我这个学徒的时候却总是像在班主任面前犯了错的小孩子啊，角名君在这方面真的很可爱。北信介这样想着，没忍住笑出了声，过了好一会才顶着对方疑惑的眼神摆了摆手，清了清嗓子，微微抬起头看着他正声问：“为什么？为什么没认真喝药；还有，为什么会想要告诉我？”
      对面好长时间没有应声。
      这种问题果然还是太冒犯了吧，北信介想。
      就在他即将要出声道歉时，角名开口说：“那个，要不我们在这附近走走吧？如果您后面的工作不忙的话。”
      “不忙，”北信介几乎是在对方发出最后一个音节的同时脱口而出，边说边摆弄老旧的门锁，“本来这个时候我也该下班了。”
      “哎，那我这样岂不是让北桑你加班了？这也能同意下来，真是佩服啊。”角名不紧不慢地跟在北信介后面，慢吞吞地说。
      “如果是工作的话也没有办法吧，”北信介抬头看向远处深蓝色的天空，听见从身后传来的拉长了声音的“哎”，顿了一会才说，“不过，其实我没有把陪角名君聊天当成工作。毕竟，也是我先问你那两个问题的嘛。就当是我想更了解角名君一点，可以吗？”
      “北桑你果然是那种做什么事情都会很认真的人吧。好厉害啊——”
      从刚刚开始一直持续着的身后的脚步声在这时停了下来，北信介回头，有些疑惑地看着眼前低着头欲言又止的人，问道：“怎么了吗？”
      角名抓了抓头发，小声说：“也没什么。只是觉得，有点羡慕还有点不可思议罢了。平时家里人总是说为什么不能把事情做好之类的话，我每次都想要是全按他们说的做那我岂不是应该把所有事情都做好吗，怎么会有这样的人？结果居然真的有这样的人啊，还就出现在我面前。”
      “北桑你一定是那种就算是难喝到喝一口都会反胃的药也会眼睛也不眨地喝下去的那种人吧。真好啊——你和你爸妈之间也不会有什么冲突吧。”
      “所以，不好好喝药是因为这个吗？”北信介看着眼前正弯腰翻弄路边的草丛的人问道。
      “你是说因为难喝吗？”他手上的动作顿了一下，随后背过手直起身转头看向他笑着说，“不是的，你也太小看我了吧？从小到大我都喝过多少难喝的药了。”
      “那是因为什——”
      “啊，说起来，我家已经到了。真的很感谢北桑今天愿意陪我聊天。”他身边的路灯已经亮起来了，北信介看见几步之外角名脸上的笑，却看不清他的眼神，于是他又开始想起他房间窗台上摆放着的那盆朝雾草，今晚得给它浇水了。只是这愣神只持续了一秒，因为下一刻那双绿色的眼睛就带着一种北信介看不太懂的情绪出现在灯光下，对他说：“还有，这个送你。下周见。”
      随后那双眼睛再度消失在他视线里，取而代之的是被塞进手心里的一片金黄色银杏叶。北信介忙抬起头，可是人群里已经找不到那个有些驼背的懒散身影了。他也不记得自己有没有说再见。
       
      其实根本就是到了关键时刻却又不敢说了吧，那个家伙。北信介这样想着，把那枚银杏叶放在花盆边轻轻用托盘的边沿压好，然后一手轻轻拨弄开长着细密绒毛的叶片，一手提着浇水壶慢慢转着圈往里浇水。
      南方苦艾（即朝雾草）是很适合在这个城市生活的植物。他记得他来到医馆的第一天，老师将这盆盆栽递给他的时候这样说。当时的北信介刚离开家到外地求学，低头看着怀里矮小却茂盛的植物，莫名觉得那些细长的灰绿色叶片像稻壳细细密密地扎在皮肉里，那时的他还没意识到这股情绪是什么，只是像设定好的程序一般想起曾经在书本上看到的有关这株植物的知识：
      南方苦艾，又称朝雾草、银叶草，属菊科蒿属，耐寒、耐旱、喜光照。
      后来他才在日复一日的平淡生活里慢慢发现，原来那个情绪就是思乡。其实这座城市与他曾经生活过的城市并没有什么特别大的区别，相似的气候、相似的步履匆匆的行人、相似的街巷……老家的庭院里也有一小片灰绿色的朝雾草，深秋时的街道上也会堆满金黄的银杏叶。所以北信介有时不是很能理解为什么思乡这种情绪会一直环绕着他，即使只是像晨雾一样朦胧的一缕。只是在撑伞走进或穿过人群的时候，他还是会不由自主地想起，他小时候，家里的长辈会在雨后带着他轻柔地摸过老家花圃里的植物，在他手指触碰到那些带着细密绒毛和潮湿水汽的叶子时，老人笑着对他说：“小信，这是朝雾草。”
       
      “北桑是本地人吗？”某个周四的下午，角名在接过药包时突然这样问。
      “不是。”
      “唉，这样吗，”他的表情并没有随着略微上扬的语调发生变化，“可是北桑你看起来和这个城市相性很好呢。”
      北信介有些疑惑地歪了歪头，思索了一会说：“是吗？不过，可能是我家乡离这里也不太远的缘故吧。你呢？”
      “我？我不是本地人。”
      这几天的气温突然就降下来了，街道两边只剩下光秃秃的树枝，角名抬头望的时候不禁觉得裸露在他面前的灰白色天空有点刺眼。
      北信介很早之前就发现了他有喜欢仰头走路的习惯。他的身形比常人要高一点，只是由于生病和驼背的缘故，看起来并不很高大，反而有些单薄。所以每次看见他仰着头走路时，北信介都会暗自担心他被哪一阵风吹走，然后被带到地球的另一个角落。
      “呐，北桑，”把手放在铁门上时，角名突然回过头来说，“老医生给你休假吗？我们找一天一起去这附近的游乐园玩吧。”
      “哎？”没有预料到话题的走向，北信介愣了一下，反应过来时发现对方细长的眼睛已经眯成了两道缝，像只狐狸一样地笑了起来。
      “那老东西不给你休假吗？还是说，是北不愿意？”
      为自己辩解的话刚要出口，话头就又被抢走了。
      太狡猾了，分明是故意不想听我的答案吧。北信介这样想着。
      “啊——如果北桑不愿意的话，那就没办法了——”眼前的人拖长了声音说，他别开了头，北信介看不清他脸上的表情，只是觉得对方的话语和卷起落叶的风声一起落在他耳朵里时带了点情绪——是什么情绪呢？失落吗？还是后悔？或者是无奈？他自认不是一个不擅长察言观色的人，甚至有很多人说过他能准确地察觉到别人情绪的变化，但此刻他却拿不准了。
      也许是角度问题，或者是头发挡住了表情。北信介这样想着时，发觉方才那阵风已经停了，角名的脸也转了回来，正对着自己。北信介突然觉得他看起来高了不少，可能是没有驼背了吧，原来他站直之后是这么高的啊。
      “那我就先回去了。刚刚，冒犯到北桑了吧，非常抱歉。那么下……”
      他仍是在笑着，和之前没有任何区别，北信介却觉得他好像要“离开”了——离开哪里？他还没来得及给自己一个答案，就几乎是出于本能地上前抓住角名那只提着药包的手，强硬地打断了他没说完的话：“下周一。”
      似乎被他突如其来的举动搞得有些不知所措，角名没有回答。北信介这才意识到自己的失礼，忙后退一步松开手。要道歉的话语还没出口，就听见对方的笑声。不知是想到了怎样好笑的事情，角名过了好一阵才停下，正声说：“那么就下周一见了。”
      等角名的背影消失在北信介的视线里之后，他才意识到，他刚刚是在害怕角名离开这里——每个医馆的周四。
       
      几天之后的周一是个晴天。
      纵使晴朗，深秋偶尔的劲风也会吹散阳光带来的暖意。北信介紧了紧外套，朝游乐园门口的长椅上坐着的人走去。那人似乎完全没有注意到他的到来，还在低头捣鼓着手机。但等他在那人面前站定正准备叫他时，角名已经飞快地抬起手摁下了手机相机上的快门键。角名边低头翻着刚刚拍下的照片边露出一个有些坏心眼的笑，过了几秒才站起来向北信介问好，也不等他回话就径自拽着他的手走到检票口。
      周一的游乐园里游客不多，除了他们以外就是学龄前的儿童和带着他们来散步的老人。角名逛累了，坐在一个卖棉花糖的推车旁的长椅上，被他推去买棉花糖的北信介回头就看见长手长脚的人缩在长椅上一小块阳光照不到的地方。
      “你得多晒点太阳。”北信介在长椅的另一端坐下，把棉花糖递到角名手里时说。
      角名没有回答他，只是在咬了一口手中的棉花糖之后眯了眯眼，嘴角扯出一个浅淡的笑，过了好一会才没头没尾地说：“北桑你老了以后也会像这些老人家一样带家里的小孩出来散步吗？”
      老了以后的事吗？之前好像从来没有想过啊。北信介没有说话，把头偏向阴影处，小口吮咬着棉花糖的粉红色柔软糖丝。思考之余，他的余光瞥到坐在阴影处的人已经三两下解决掉了手里的棉花糖，正看着前方发呆。
      似乎是注意到从身旁投来的目光，角名换了个姿势，用两只手撑住脸，脸却仍然注视着前面，语气平淡地说：“在我很小很小的时候，可能只有三四岁吧，那时候我还住在老家那边，家里的老人也会像这样带我到附近的游乐场里散步。小时候的事情我都忘得差不多了，就记得当时总是在太阳快落山的时候回家，然后每次这种时候我就会像其他小孩一样要棉花糖吃，要不然，一会要喝掉的药就会太苦了。那个时候，每天父母下班回到家的第一件事就是检查我有没有好好喝药。那个时候我还不懂，现在想想他们应该也挺害怕的，既担心我不肯喝药浪费他们的钱和心血，又害怕我真的喝了药，但仍然一点好转都没有。其实说到底还是太天真了，总是以为一切都会有好转的，很多事不是早点接受少点罪受吗。”
      “啊，自己说了这么多，结果太阳都快落山了啊，”角名站起来，转过身低头看着仍怔坐在长椅上的人说，“北桑今天愿意陪我来游乐园，还听我说了这么多，我真的非常……”
      “那个，角名君，”北信介不知道是什么样的冲动让他打断了对方的话，意识到这个举动的失礼之后他有些抱歉地抿了抿嘴，但还是决定把话说完，“如果愿意的话，能陪我坐日落的那一趟过山车吗？”
      “唉？可以是可以啦。但是像这样打断别人说的话，还真不像北的作风啊。”北信介抬头，看见在一点点往下坠的太阳的前面，角名伦太郎一只手举着手机对准自己，好像在刻意遮挡他脸上因讶异而微微瞪大的双眼和嘴角翘起的有些恶劣的弧度。
       
      其实在这之前北信介一直没有坐过过山车。
      像包括角名伦太郎在内的一部分人的童年一样，北信介也是被家里的老人带大的，在学龄前他也常常被奶奶带到家附近的儿童乐园里散步。这样的活动通常是在午饭后，从中午两三点到下午四五点，从一天里日头最猛的时刻到一天里太阳落下的时刻。
      小小的儿童乐园很快就让他失去了探索欲，除了那个奶奶从来不让他靠近的藏在游乐园深处的大型机械。那时还不识字的北信介相信这就是传说中带来无数尖叫和笑声的“过山车”。
      北信介不是一个多么爱追求刺激的人，但是即使在长大之后他还是偶尔会想起小时候某天在日落时分顺着奶奶的手指往天边看的时候眼前眩目的云霞和从过山车上传来的尖叫声。
      也许从那时起，他就在期待着有一天能在那种疯狂的失重感的包裹下看一次晚霞。
       
      从那辆有些滑稽的儿童过山车上下来时，天已经从橘黄色转向深蓝色了。上午见到的那些老人和小孩不知什么时候已经都离开了，园区里五颜六色的灯在这时亮了起来，却因为空荡，这些吵闹的颜色反倒显得冷清。冷清到角名伦太郎不自觉地调小了说话的音量，生怕打搅了这样的氛围：“刚刚在过山车上看到的晚霞很漂亮呢。”
      北信介点了点头，随即笑着说：“我从小就想看到这样的景象呢。要是奶奶也能和我一起看就好了。”
      “老人家坐不了的吧，这个，”他扭过头，看见角名站在路灯下，盯着蘑菇形状的灯罩里面的灯泡，慢悠悠地说，“北和家人的关系很好吧，离开他们来这里生活会觉得孤单吗？”
      北信介抬头望向对面那人眯成细缝的眼睛，突兀地想到今天得把朝雾草搬到房间里温暖一点的地方，冬天要来了。他听到自己反问对方看上去也是一直一个人，会不会觉得孤单，脑子里却在想奶奶曾经是在用哪只手带着他一次次摸过老宅院子里朝雾草的绒毛。
      角名低下头思索了一会，说：“我没有一个人。我的家人都很关心我。”北信介分不清是暖白色的灯光还是什么东西让他觉得他和平时一样没什么表情的脸看起来有些柔软。
      停顿了一会，他继续说：“北桑之前不是问我那天为什么不好好喝药吗。其实也没什么的，只是那次稍微有点受不了他们看我的眼神了。就是那种，希望我快点好起来的眼神。我真的不明白为什么有人能够一直满怀希望。然后那次我有点失控了，就把药都倒掉了。只是这样而已。”
      “那为什么想要告诉我呢？”北信介问。
      这次角名没有马上回答。他们对视良久，似乎是在确认北信介是否是真心想要一个答案，或者是在通过看向同一双眼睛来找回那一天的回忆，以此来寻找那个冲动举动的源头。
      不知道过了多久，角名才犹豫着开了口：“大概是因为，北桑真的是很认真的人吧，像机器人一样，好像什么都能做得很出色。被你盯着就好像所有的秘密都被看穿了一样，所以就想着干脆就全部都坦白好了。啊真的非常抱歉，擅自这么想对北桑来说会很困扰吧。”
      北信介将对方意味着忐忑的小动作都收入眼底，然后走近两步，认真地说：“角名能对我坦白，我真的很高兴。”
      他突然想到那枚被他压在花盆边的银杏叶，不知道棕黄色的银杏叶和灰绿色的朝雾草放在一起会是怎样的景象。
      面前高个子的年轻人好像因为他刚刚坦率的举动呆住了，细长的眼眶一下子瞪大，落在北信介眼里像开出了花朵的叶片。他不由得觉得对方有些可爱，没有抑制住的情感从眼睛和嘴巴里流淌出来，他听见他说：
       
      “我现在住的家里有一盆朝雾草。角名想去看看吗？”
