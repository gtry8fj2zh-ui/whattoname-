title: 普通且平静的一天。
author: /
cp:
  - 罗朱
  - 帕班
  - 提球
updated: 2025-12-25
summary: 班伏里奥对每一个学年的愿景都是希望能够平静地上学。而这个愿景几乎没有得以实现的时候。
chapters:
  - body: |-
      当班伏里奥在一个普通的下午普通地走在一条普通的走廊上正打算去吃一个普通的下午茶却在拐过一个普通的拐角时迎面撞上茱莉叶时，他明白此前的所有“普通”都即将被打破。也许他就是在这时想好如果这件事被别人发现他应该怎样涕泗横流如泣如诉地向所有人发誓这件事他并不知情的。

      不过果然应该早在去年罗密欧第一眼见到茱莉叶的时候就杜绝后患的。班伏里奥腹诽。

      -

      罗密欧第一次见到茱莉叶是在去年三强争霸赛的开幕式上。

      当时罗密欧和茂丘西奥一红一绿两人正毫不顾忌地往黄色扎堆的赫奇帕奇长桌上挤，喋喋不休地试图说服他们可怜的被迫让自己的耳朵承受火力的朋友班伏里奥半夜一起去城堡里夜游。就在他边疑惑晚宴怎么还没开始边敷衍地点头回应自己的两位好友时，班伏里奥听见礼堂外传来一阵气流声，随即是马蹄踏在草地上的声音。又过了一会，礼堂的门被“砰”地打开，学生们循声转头望去，看见门外端正地站着一群身穿蓝色丝绸服装的学生，领头的是一位身材高大的同样身着考究丝绸长裙的女巨人。

      班伏里奥只瞥了一眼便有些紧张地问身边的两位好友，难道说霍格沃茨和其他魔法学校要开战了吗？茂丘西奥闻言，笑得东倒西歪，栽进了班伏里奥怀里，过了好一会才说这是三强争霸赛啦。

      此时姗姗来迟的校长才敲了敲水晶杯，示意学生们安静下来，朝着那位女巨人欠了欠身，向学生们解释了门外的布斯巴顿和几分钟之后抵达的德姆斯特朗的师生的来意。

      “啊，布斯巴顿！卡普莱特家的人可都在那儿！”仍躺在班伏里奥腿上的茂丘西奥兴奋地说，说着他支起身子，趴在班伏里奥的肩头朝他们身后的过道看去。

      班伏里奥一听见“卡普莱特”几个字就感到一阵头疼，即使过去了这么多年两个家族之间的仇恨已经被稀释到只会在提起对方名字时脱口而出几句无伤大雅的嘲讽了。不，他的头疼并非源于自己的家族，而是来自此时正兴致勃勃地盯着人群中的某一点的茂丘西奥。班伏里奥顺着他的目光望去，果不其然看见了提拔尔特——茂丘西奥念念不忘的来自卡普莱特家族的猫王子。

      他无奈地扭头望向他的另一位伙伴寻求帮助，却发现从刚刚开始就一直很安静的罗密欧丝毫没有理会这边的暗流涌动，而只是愣愣地看着走在马克西姆女士身边正不断地往人群里撒玫瑰花瓣的一个金发女孩。

      “好了茱莉叶，这么多已经足够了。”当她们经过他们时，班伏里奥听见高大的女士俯身对身边的女孩说。金发女孩乖巧地点了点头，小声回复“好的女士”，却在将魔杖收入袍中时，灵巧地用杖尖挽了个圈，于是最后一朵玫瑰花瓣便随着魔法慢腾腾施施然地落在了罗密欧肩头。

      班伏里奥往左看是正在向提拔尔特使劲挤眉弄眼的茂丘西奥；往右看是捧着花瓣一动不动满脸洋溢着一见钟情的幸福的罗密欧；往前看是站在人群里尝试无视这边但被满脸的不耐烦神情所出卖的提拔尔特和站在他身边时不时回头偷看罗密欧的茱莉叶，十分有远见地开始担忧起了他这学年的生活。

      等下，这位茱莉叶站在提拔尔特身边？这么说来，他好像确实有听说过卡普莱特家的小女儿也叫这个名字……班伏里奥这样一想，瞬间觉得面前摆着的的南瓜挞都变得索然无味了。

      -

      “噢，嘿，班尼，真巧在这里碰到你。”茱莉叶见已经来不及躲闪，四下里又没什么人，才一边拉着班伏里奥往更隐蔽的地方走边有些尴尬地寒暄。

      “哈哈，真没想到会在这里遇到你。”班伏里奥眼睁睁看着自己离原定的目的地以及上午让熟悉的家养小精灵提前准备好的南瓜挞越来越远，苦涩地干笑两声，回应道。

      “罗密欧呢？他没和你一起吗？”

      班伏里奥摇了摇头，告诉茱莉叶此时她的爱人正和斯莱特林一起在前面不远处的地窖上魔药课。“离下课应该还有大概十五分钟？需要我给你指路吗？”

      班伏里奥正要领着茱莉叶往前走时，却遭到了拒绝，他回头困惑地看着面前正低头摆弄衣摆的女孩，过了好一会才得到一个小声的回答。

      “我和罗密欧，我俩吵架啦。”茱莉叶的声音像怯场的小演员，在嘴里囫囵转了一圈才不情不愿忸忸怩怩地爬出来。

      班伏里奥有些意外地挑了挑眉，他想不出是什么能让整整半年都热情不减地如胶似漆的这两人产生矛盾。不过想来也在情理之中吧，处于亲密关系中的两人怎么可能一点矛盾都没有呢，何况他明白自己的好友和他的恋人都是热烈的人。之前二人之间也曾有过一些小打小闹，但这次或许问题要严峻一些。

      “总之，拜托了亲爱的班伏里奥，”茱莉叶抿了抿嘴，双手合十，焦急地看着班伏里奥说，“暂时先不要告诉别人我在这里好吗？帮我想想主意吧！”

      不过又能严峻到哪去呢？他们现在不过是一群天真的孩子，满心满眼都只有爱和自由，简直像一群快乐的云雀。于是班伏里奥放下了他的眉毛，转身带着茱莉叶往他原本打算去的厨房走去。

      不知道小精灵们准备的南瓜挞够不够他们两个人吃呢？

      -

      “好了，这儿不会有其他人了，现在能说说你和罗密欧之间的矛盾了吗？”班伏里奥找到熟练地拿起角落里放好的甜点，边用空着的手招呼茱莉叶一起吃边靠着墙壁盘腿坐下问道。

      卡普莱特家的小女儿见状，也暂时抛掉了平日家里教导的那些礼数，面对金发的蒙太古坐下，边吃着手中仍散发着热气的南瓜挞边发出夸张的赞叹声。等到茱莉叶终于把脸从食物的香气中抬起来时，意料之中地看到了班伏里奥审问的神情。她擦了擦手，扭过头悄悄做了个鬼脸，转过头来眼神闪烁着说：“好班伏，你就帮我想想该怎么哄他开心吧。”

      “可是，如果你不愿意说，我不知道是什么惹得他生气了，我又该怎么给你出主意呢？”班伏里奥挥了挥魔杖将残局收拾干净，盯着面前正为难着的人眨了眨眼，问。

      班伏里奥现在觉得自己的肠子已经后悔得变成了蒙太古长袍的蓝色了。

      这果然是很棘手的问题吧？当初自己到底为什么会这么自信地认为自己能帮助自己的朋友和他的爱人而掺和进来呢？

      不知道过了多久，茱莉叶终于停止了摆弄自己的手指和嘴唇，下定决心似的猛地抬起头，因紧张而略微缩小的瞳孔死死钉在班伏里奥脸上，深吸了口气，说：“全维罗纳全世界最最热爱和平的善良的班尼，请你答应我不管是什么矛盾都不要因此而鄙视我，可以吗？”

      虽是恳求的语气，班伏里奥却感觉那眼神像架在他脖颈处的匕首，逼得他往后缩了缩，端着下巴点了点头。

      茱莉叶吐出一口气，卸了气似的垂下肩膀，小声说：“天哪，我们是因为茂丘西奥。”

      茂丘西奥？

      “茂丘西奥？”

      班伏里奥和茱莉叶面面相觑，他们都十分确定这并不是他们中的任何人发出的声音。就在两个人神情逐渐变得惊恐时，声音的主人才低声笑着慢慢从班伏里奥身后的墙壁中钻出来。

      “拜托帕里斯，你不会跟了我们一路一直在捉弄我们吧？”班伏里奥看清来人，无奈又疲惫地瘫倒在墙壁上。

      半透明的幽灵无辜地耸耸肩，对仍满脸怀疑的茱莉叶鞠了个躬，温声说：“您好小姐，我是游荡在这所学校里的一位幽灵，他们叫我——”

      “‘玫瑰骑士’帕里斯，”班伏里奥重新坐正，对着微微蹙眉的幽灵翻了个白眼，解释道，“不过他更喜欢别人直接叫他‘帕里斯’就是了。帕里斯，这位是——”

      “卡普莱特小姐，来自布斯巴顿的卡普莱特小姐，对吗？”帕里斯站直身子，颇得意地眨了眨眼说。

      班伏里奥看着金发女孩怀疑的目光和看热闹不嫌事大的在厨房里飘荡的幽灵，并不安详地闭上了双眼。

      -

      该如何解释班伏里奥和帕里斯的关系呢？

      如果你去询问那永远在学校里无拘无束又时常端着贵族礼节的幽灵的话，他会坦言在班伏里奥踏入礼堂的那一刻就注意到他了。准确来说，是注意到他、罗密欧和茂丘西奥三个人。

      霍格沃茨里形影不离的好朋友们并不少，只是——

      只是？

      神秘优雅的帕里斯便会露出一个让人猜不透的笑来，转而反问你“谁会注意不到他们呢”。

      而如果你去询问三人组中最为温和的金发男孩，他会先认真地思考一下，再决定能否告诉你实情，因为他第一次见到帕里斯是在凌晨的学校走廊里，而多心眼的班伏里奥不会让自己的学院在年度评比中处于任何劣势——毕竟他每年都会和自己在格兰芬多和斯莱特林的好兄弟们打赌谁的学院会获得最高分，尽管自他们入学的四年以来，拉文克劳已经蝉联了每一届的冠军。

      几乎每一个初来乍到霍格沃茨的孩子都对这个古堡怀着浓重的探索欲，将这些探索欲付诸实践的冒险家也向来不少，所以当帕里斯在漆黑的走廊上看见班伏里奥时，他并不惊讶。他还记得这个孩子，他和另外两个小孩待在一起时的样子让他想起了他生前生活的那个小镇上曾经形影不离的三个好朋友。

      他也还依稀记得他的名字：“班伏里奥？”

      本来就因第一次夜游而有些紧张的小孩被幽灵吓得一转身跌坐在地上，惊魂未定地看着面前飘荡在黑夜中乳白色的幽灵，半张着嘴小口喘着气，面上说不出话来，脑海里却把半夜硬要他来塔楼上探险的罗密欧和茂丘西奥狠狠编排了一通。

      似乎是终于缓了过来，金发的赫奇帕奇理了理头发，装作无辜地对着幽灵说：“先生，我迷路了，能麻烦您送我回休息室吗？”

      帕里斯挑了挑眉，脑海里浮现出那个总跟在一头柔顺黑色长发和毛躁卷发的朋友身边的金发男孩的样子，不置可否地领着他往回走。

      一人一魂一路上只有班伏里奥鞋底轻踩地面时不时发出的咔嚓声。等到了赫奇帕奇休息室门口，班伏里奥才终于开口，小心翼翼地询问这次夜游是否会给自己的学院扣分。

      帕里斯忍俊不禁，告诉他只要不被教授们发现就不会。闻言，班伏里奥放松地呼出一口气，向他鞠了个躬表示感谢便转身打算走回休息室，却在这时被帕里斯叫住：“你是不是还不知道我的名字？”

      班伏里奥歪了歪头，好奇地看着刚刚找的新晋导航，话说之前在楼道里的时候没发现他长得这么好看吗？

      面容英俊的幽灵无奈地笑了笑，俯下身凑到班伏里奥面前说：“我是帕里斯。‘玫瑰骑士’帕里斯。你好，蒙太古家的班伏里奥。”

      -

      “好了，亲爱的小茱莉叶，这就是我和小班尼之间的故事，”帕里斯就地盘腿坐在茱莉叶身边，一边挤眉弄眼一边用有些轻浮的语气说，“那次相遇之后我们的关系渐渐升温，我就这样变成了他在学校里的树洞。而这就是为什么我会知道关于你的事情。”

      班伏里奥仍然靠在墙上装死，懒得去纠正帕里斯口中过分暧昧的描述，直到另一个听起来颇为委屈和不满的声音响起：“你居然有事情瞒着可怜的茂丘西奥和罗密欧！你可从没和我们说过那晚上的事情！”

      班伏里奥不想睁眼，只想穿越回几分钟前给那个信誓旦旦地说“这里不会有其他人来打扰”的自己几巴掌。但是不睁眼是不行的，茂丘西奥的头发对他说。班伏里奥叹出了这一天中不知道第多少口气，把手伸到脸前随意拨开茂丘西奥垂在他面上海藻一样的发丝，睁开眼，果不其然看见了一对水汪汪的绿眼睛，和下面撅得可高的嘴巴一起，控诉他的“无情无义”。

      他身后的茱莉叶呢？班伏里奥不敢看她的表情。

      “我和帕里斯的事留着一会再说好吗？但是茂丘西奥，先告诉我，你是什么时候来的？”

      茂丘西奥直起身子，大剌剌地穿过帕里斯靠着茱莉叶坐下，歪着头想了一会，说：“我一下课就过来了。本来打算回休息室的，但听‘别人’说好像看到班尼往这边来了，就顺路过来了。”

      茂丘西奥把“别人”两个字咬得过分夸张了一些，但班伏里奥此时没有多余的心情去在意他那戏剧化的朋友的语调中异常的抑扬顿挫了。

      “那——”

      “那罗密欧呢？”从刚刚开始就一直没说话的茱莉叶突然问。

      “罗密欧？他啊……”茂丘西奥一改方才消沉的样子，眨了眨眼，看看身边的茱莉叶，又看看坐在对面神情也略有点焦急的班伏里奥，转了转眼珠子，笑到躺倒在地上才掐着嗓子说，“噢罗密欧，我们那失魂落魄的罗密欧到底去哪儿了呢？不如先告诉我他亲爱的茱莉叶为什么会出现在这儿吧？嗯？”

      茱莉叶瞪了班伏里奥一眼，一字一顿地说：“我和罗密欧吵架了。”

      茂丘西奥从鼻腔里挤出一声不甚满意的鼻音。

      “因为你。准确来说是因为你和提拔尔特。”茱莉叶的语气听起来能把人杀死，而班伏里奥自怜地发现自己已经准备好劝架了。

      所幸卷发的斯莱特林已经得到了让自己满意的答复。他“噌”地一下从地上坐起来，饶有兴致地凑上前追问是因为什么。

      茱莉叶烦躁地抓了抓头发，摊开手，破罐破摔地回答：“还不是因为你每天把提拔尔特惹成那样？我跟罗密欧抱怨了几句，他就郁闷了。说真的，你俩到底是怎么回事？”

      茂丘西奥看看天，看看地，也抓了抓头发，成功地把自己的一头乱发揉得打了结，就是不回答。班伏里奥默默叹了口气，挥了挥魔杖把好友的头发梳顺，温声告诉面前郁结的女孩这段关系中的二人都乐在其中。

      -

      “茂丘西奥可没有乐在其中，”好动的斯莱特林不知道什么时候已经躺在了自己的赫奇帕奇好友盘起来的腿上，撇了撇嘴大声抗议道，“你那可恶的表哥天天和你们学校里那群法国人玩在一起，可把可怜的茂丘西奥的心伤透了。”

      茱莉叶皱了皱眉，刚想反驳，却看到班伏里奥无奈地耸了耸肩，轻柔地抚着茂丘西奥的头发给他编着辫子，莫名地卸了气。

      茂丘西奥和提拔尔特是一对冤家，这在绝大多数生活在维罗纳的人们心中并不是什么秘密。可同样对于大多数人来说，他们所不知道的是，他们不只是冤家，平常的冤家伤害对方的身体，而正如茂丘西奥刚刚说的一样，他们这对“冤家”还伤害对方的心。

      茂丘西奥在他五岁时只身一人来到维罗纳，投靠他的舅舅。在他用了整整一天逛明白这座小城镇的同时，他给自己找到了两个来自蒙太古家族的好朋友，还招惹上了卡普莱特家族里和自己有着相似处境的提拔尔特。

      从他们初见那天起两人就一起滚进了草丛，而在班伏里奥给这个刚认识半天的新朋友上药时，罗密欧就十分有远见地断言总有一天他俩会一起滚到床上。

      “床上？”当时的茂丘西奥不解地问，“床上有什么好玩的？”

      罗密欧则神秘兮兮地告诉他在床上有一种很特殊的打架方式，他曾经在晚上偷看到过那些哥哥姐姐们的房间里发生过的情形：“两个人光着身子紧紧地叠在一起，像挂画里的天使和被剥下翅膀的蝴蝶一样！你绝对会喜欢的。”说着还用手臂碰碰新朋友的肩膀，茂丘西奥被他夸张的神情逗得东倒西歪，两个人笑作一团。班伏里奥不耐烦地拿着药膏叫他不要乱动，他就边哀嚎着说“班伏你这会真扫兴”边抓过他手上的药膏悉数倒在自己身上，龇牙咧嘴地随意抹开，然后拉着班伏里奥和罗密欧躺在地上。三个人互相攀抱着，不知是谁问了一句在床上打架是不是就是他们现在这个姿势，又惹出一阵笑声。

      而等到茂丘西奥真正在床上“打架”已经是好几年之后了。那是提拔尔特在布斯巴顿的第一年，而当他在圣诞节前夕回到维罗纳时，见到的第一个人却是他的冤家茂丘西奥。

      那个留着长长的卷发的疯子看见他便高声喊他“猫王子”。提拔尔特头疼的揉了揉眉心，说：“茂丘西奥，我今天很累没时间陪你玩。”

      他怎么会试图和那个整日以自我为中心从来不听别人说话的茂丘西奥讲理呢？今天果然太累了吧？他在出发回家前还通宵参与了学校里的晚宴，宴会厅里潮湿温热的空气和人群的嘈杂声和冬季的维罗纳刺骨的寒风把他的脑袋搅成坩埚里滚滚冒泡的魔药。

      而茂丘西奥显然永远是全维罗纳、不对，是全世界最不讲理的那一个。

      “亲爱的猫王子，我可想死你啦，难道你就一点儿也不想被留在维罗纳里的茂丘西奥吗？”他走近，鼻腔里呼出的热气尽数扑在提拔尔特脸上，还没换下绸制校服的卡普莱特此时才借着月光看清眼前的人只穿了一件轻飘飘的衬衣，脚上是穿得乱七八糟的拖鞋。

      他嗤笑一声，反问他这身打扮是打算今晚一直挨打吗？茂丘西奥却没有像往常一样被挑逗起来，仍然咧着个嘴对他说那猫王子就打我好了。

      说完又是一阵高亢的笑声，提拔尔特不明白，为什么每次茂丘西奥一笑风就像跟随他的呼唤似的也随之而来？他站在风声和笑声里一动不动。等茂丘西奥重新平静下来，风也停止了，他用食指挑走眼角的泪，低头小声说了句“算啦”，便转身打算离去。

      提拔尔特也说不清在这一刻是他脑袋里的魔药要溢出来了还是终于被熬干了，他上前抓住茂丘西奥的手腕，一路沉默着把他拽回了自己房间。

      “提拔尔特，给我讲讲学校里的事吧？”茂丘西奥躺在床上，边慢条斯理地解着提拔尔特衣服上的扣子边说。

      茂丘西奥长长的卷发随着他颈部的起伏一下一下地挑逗着提拔尔特裸露出来的腹部皮肤，让他想起学校里那些柳树。

      “学校？”他轻喘着喃喃道，“学校没什么有意思的……”

      不知是哪个词汇刺激到了茂丘西奥，他皱了皱眉，粗暴地扯开提拔尔特的衬衣，有些受伤地说：“我才不信！家族里去布斯巴顿上过学的哥哥姐姐们从来都会和我讲很多有意思的事。”

      他凑到提拔尔特面前，一双绿色猫眼石样的眼睛盈满了委屈和怒意，捏高了语调说：“是路易斯吗？法国总是有很多路易斯。还是朱利安？你在布斯巴顿的那些日子里，是他在陪着你吗？”

      提拔尔特摸不清他在想什么，只觉得脑袋里有一大缸的魔药在吵吵嚷嚷，往前撞着他的头骨，于是他闭上了眼，顺从地上前，衔住茂丘西奥仍喋喋不休地控诉着的嘴唇，咬了上去。

      那一夜的过程是怎样的两人都已经记不清了，提拔尔特甚至不清楚茂丘西奥是否还记得那一夜是如何结束的。他问茂丘西奥明年打算上哪所学校。躺在身边衣冠不整的人安静了好一会，轻声笑着告诉他他会和蒙太古家的孩子们一起去霍格沃茨。

      提拔尔特闭上眼睛，想象不出茂丘西奥身着板正的布斯巴顿校服的模样。

      -

      “所以，我们的罗密欧现在到底在哪？”帕里斯见刚刚还闹腾着的氛围渐凉，开口问道。

      茂丘西奥一拍脑袋坐起来，捋了捋班伏里奥刚给他编好的辫子，狡黠地笑着对茱莉叶说：“你的好罗密欧，他去布斯巴顿啦。”

      “布斯巴顿？”

      斯莱特林拢了拢因刚才过大的动作而滑落下来的校服袍子，正要解释，却被突然打开的厨房门所打断了，门后是神情和蔼的校长和满脸怒容又十分无奈的格兰芬多院长。

      三人见状，忙不知所措地站起来。校长扶了扶眼镜，笑着摆了摆手，说：“孩子们，不如去我的办公室，我们一起吃点下午茶？”

      班伏里奥一见到教授们，先前想好的措辞早被忘得一干二净，变成了呆滞的一个人，只知道跟着大人们的脚步走了，茂丘西奥则在旁边放肆地大声嘲笑自己好友的“呆鹅”样子，处境最危险的茱莉叶面上倒是不显畏惧，但如果你熟悉她，你就会发现此时她的肩膀是僵直的。帕里斯呢？帕里斯只是一个自由且无辜的幽灵，但他仍然跟了上来。于是一伙人浩浩荡荡地穿过走廊，停在了校长办公室的门口。

      办公室的门开了，众人跟着教授们走进去，拐过几个隐秘的过道，放在他们面前的是一面巨大的镜子。校长清了清嗓子，伸出手轻叩镜面，随着镜面水波纹的摇晃一同铺开的是罗密欧和提拔尔特郁闷的脸，而在他们身旁的则是一脸威严的布斯巴顿校长。

      “好了，陷入苦闷爱情中的孩子们啊，向我们解释解释这到底是怎么回事吧。”

      “我很抱歉，教授，是我惹得茱莉叶不高兴了。我一整天都在想着她，实在不知道该怎么办了才这样做的……”

      茂丘西奥发誓罗密欧说的话是真的，指他“一整天都在想着她”那一部分，证据是整整一下午的魔药课上罗密欧都在对着他坩埚里那绿得发黑的粘稠东西深情又痛苦地念着茱莉叶的名字。

      “亲爱的茂丘西奥，”罗密欧在下课前两分钟突然用十分正式的语气对茂丘西奥说，让茂丘西奥误以为他终于决定去参军了，就像他六岁那年看到一队骑兵经过维罗纳时说的那样，“我决定了，我要去找茱莉叶。”

      茂丘西奥挑了挑眉，趁他不注意往他坩埚里倒了五只晒干的炸尾螺尾巴，然后下课铃声和坩埚的爆炸声一同响起，罗密欧随便施了个“清理一新”就匆忙跑出了教室。而茂丘西奥呢，他早就听说他的好班尼今天下午要去厨房吃点心啦，他可不会错过这一顿盛宴——尽管他向来好心肠的赫奇帕奇好友已经三令五申地展示过他对自己下午茶惊人的占有欲了。至于罗密欧？他想去就让他去吧，看看这可怜人被爱情折磨的模样。

      “咦？话说有人注意到了吗，怎么我们的好兄长提拔尔特也被抓起来了？”

      镜子另一边的马克西姆女士皱了皱鼻子，干巴巴地回答：“我们发现这位蒙太古先生的时候他正在和我们的学生，吵架。或者说，是因为其他学生向我们报告了这场冲突，我们才发现了偷溜过来的蒙太古先生。”

      好吧，看来就像茱莉叶一进霍格沃茨就遇见班伏里奥一样，倒霉的罗密欧一到布斯巴顿就遇上了提拔尔特。而显然在两人碰面没多久之后，他们就吵了起来。

      “所以，”班伏里奥举起手，对集中在他身上的视线露出一个有些歉意的笑，出声问，“你们当时在吵什么呢？”

      罗密欧和提拔尔特面面相觑，最后还是提拔尔特开口沙哑地缓缓说：“咳，他问我，能不能给茂丘西奥一个名分。”提拔尔特的声音越来越小，两个房间里的氛围也越来越凉。班伏里奥看着满脸通红的不敢和其他人对视的罗密欧和提拔尔特，同样脸红但眼神越发明亮的茂丘西奥，和努力控制着嘴角让自己保持神情严肃的教授们，在想自己问的这究竟是一个好问题还是坏问题。

      “好了孩子们，”格兰芬多的院长打破沉默，厉声说，“还有最后一个问题，你们是怎么过去的？”

      茱莉叶和罗密欧看着大人们严厉的表情，不由自主地缩了缩脖子，最后还是金发的女孩绞着手指，小声回答：“门钥匙，教授。”

      “卡普莱特小姐，不管什么时候都请注意你的仪态。”镜子对面的高大女士用平和但严格的语气说，然后她转而面向正满眼痴情看向镜子另一头的茱莉叶的罗密欧，说，“以及，先生，请允许我们没收你们制作的门钥匙。”

      这边，校长也向茱莉叶伸出手，和颜悦色地说：“卡普莱特小姐，我恐怕您这边的门钥匙也应该交由我们保管。”

      -

      等两方的对谈结束，罗密欧和茱莉叶通过校长室的壁炉回到霍格沃茨和布斯巴顿，天已经全黑了。

      “他看起来并不是很消沉啊，被没收了门钥匙之后。”班伏里奥把两位经历了动荡的一天的好友各自送回休息室后，身后突然响起帕里斯的声音，他这才发现帕里斯一直跟在他们身后。

      即使如此，他也并没有对此感到震惊。四年以来，班伏里奥或许早就已经习惯这时不时冒出来的幽灵了。他甚至要开始担心三年之后、毕业之后，没有了这总在他身边游荡的帕里斯，他是否会觉得孤单。

      但不管怎样，今夜他耸耸肩，用平常的语调回应：“毕竟双方校长也答应了每隔一段时间可以通过壁炉让他们见面啦。而且那个门钥匙毕业之后就可以还给他们了，虽然等到那时候那小东西应该也只有纪念意义了。”

      帕里斯眨了眨眼，盯着身前头也不回往前走的男孩，微不可察地叹了口气，追上前去：“班伏，这里好像是你第一次遇到我的那个地方。”

      班伏里奥停下脚步，扭头默默地盯着飘在空中的幽灵，没头没尾地问：“你们能离开霍格沃茨吗？”

      突然意识到自己的鲁莽的，班伏里奥有些不好意思地低下头，修长的手指卷着胸前松垮的领带，帕里斯在空中只能看到男孩柔软的金发：“我之前试着在图书馆里找过，但一直没有……”

      “算啦，”班伏里奥抬起头，靠墙抱膝坐下，帕里斯借着墙壁上悬着的暗色的烛光，看见面前的男孩嘴角弯出一个浅笑，“你之前说你生前生活的小镇上有和我们三个很像的三个好朋友，再和我说说他们的故事吧。”

      帕里斯摇了摇头，伸出半透明的手捋了捋班伏里奥暗金色的头发——他希望他的手没有直接穿过那些柔软的发丝。等班伏里奥的眼神逐渐变得困惑，他才说：“今天就先算了吧。这里太高了，离赫奇帕奇的休息室太远了。你今天辛苦了，我们改天吧？”

      “我们还有很多个普通又平静的日子不是吗？”帕里斯也坐到地上，笑着轻声对班伏里奥说。
