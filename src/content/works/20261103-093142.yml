chapters:
  - title: Prologue
    body: |-
      「位于挪威西海岸中部的特隆赫姆是挪威的第三大城市，也是著名的维京古都。这里坐落着斯堪的纳维亚最大的大教堂——尼达洛斯主教堂；而在大教堂之下，便是建于1681年的老城桥。在这座横越了尼达河的古老建筑上，还有着一个美丽的传说：据说穿过位于桥的入口的“幸福之门”，走过这座桥，就会获得好运。而在这获得好运的过程中 ，你便能看到在河的两岸端坐着许多颜色各异的尖顶房屋。
      威严的教堂之下温馨治愈的城镇；状似宁静的河流和它倒影中相对而立的颜色鲜艳的楼房；时而阴沉时而晴朗，却似乎始终透不进光的天空……这一次，他们的旅程就将从这里开始。」
  - title: Day0
    body: |-
      “我是班伏里奥·蒙太古，今年29岁了，是一名服装设计师和模特，”身体微微前倾坐在扶手椅上的金发男人摸了摸脖子，看着身旁的空扶手椅有些不好意思地说，“抱歉，我没想到这么久了他还没来。”

      大概是得到了工作人员礼节性的回应，班伏里奥用指腹磨了磨几小时前在化妆间新修好的指甲，继续说：“我八岁那年认识的他——是的，我想，我们大概算是青梅竹马吧。”说到这里，他像想起了所有小时候的那些囧事一样有些无奈地笑了。“从朋友变成恋人是在我读大学期间，21岁的时候。然后，大概是半年前我们分开了。所以我们两个差不多是八年吧。”

      「您觉得是什么原因导致你们两个分开呢？」

      班伏里奥歪头抿了抿嘴，就在他将要把那个早已准备好的答案说出口之前，他敏锐地捕捉到房间外那一侧的门框边沿露出几缕熟悉的黑色卷发。门外的人似乎也很快地注意到自己被发现了，便拖着步子往前走了一步，抱臂斜倚在门框上，静静地盯着座椅上坐着的人不说话。班伏里奥也换了个放松点的姿势，轻轻靠在了椅背上。但他在发现那人之后就再没有给过对方注视，即使这需要他有些别扭地扭过他的脖子。

      “因为我意识到，我们之间根本就没有爱。”

      话音刚落，房门口处就传来了皮靴有些用力地踏着木地板的声音。等声音由远及近地来到他身边时，皮靴的主人也一并到来了。班伏里奥边不经意地用手指摩挲掌心，边站起身，用平淡的语气和体面的笑容迎接他：“你是什么时候到的？”

      那人扭头笑了一声，主动将班伏里奥拉进一个短暂且虚松的拥抱中，然后理了理头发坐下说：“只是刚刚而已。”

      “我是茂丘西奥·艾斯卡勒斯，现在在做话剧演员，比班尼小三岁。”

      「能请您说一下你们从相识到分开的过程吗？」

      茂丘西奥从前往后抓了抓头发，回答道：“五岁的时候，我搬家搬到他们家所在的街道，然后我和他，还有他当时的兄弟，我们三个成为了无话不谈的好朋友，那时我们成天呆在一起。后来，他离开了我们居住的那个城市去上大学。”说着，他舔了舔嘴唇，把左半边身体靠在扶手上，头不自觉地朝右侧——班伏里奥的那一侧，倾倒。

      “我该怎么描述那三年的日子？可以说是寂寞吗？我本来以为他只是我两个好朋友中的一个，但是他不在我身边的时候，我却觉得对所有事情的兴趣都少了一大半了。即使是我在做那些我曾经最喜欢的事情的时候，我都无法不去想如果班尼在我身边，他会怎样。”

      “我很想他，”茂丘西奥又将身体重心换到右边，喝了口水，他继续说，“所以我报了距离他的大学不太远的一所学校，在开学的第一天就闯进了他在校外租住的公寓。那晚我们发生了性关系，醒来之后他问我我们现在怎么办。我告诉他我们以后不会再分开了。这就算是确认了恋爱关系吧。后来他毕业了，留在了那所大学继续读研究生，等到我本科毕业了，他的学业也结束了。这之后，我们又一起回到了我们家乡生活。”

      “分手是半年前他提出来的。”茂丘西奥苦笑着，边用手指一下又一下地梳理他长长的卷发，边把屁股往后挪了挪，与之相反的是他身边一直一动不动目视前方的班伏里奥。茂丘西奥短暂地看了他一眼，又甩回头，耸了耸肩说：“至于原因，我刚刚才知道。我们甚至在断崖式分手的前一天还一起愉快地过了我们的八周年纪念日。”

      “哈，‘没有爱’。我亲爱的班尼，你是这么认为的？”茂丘西奥有些咬牙切齿地问。

      -

      「您当时有没有自己想过是什么原因导致你们分开了呢？」导演组后来在备采间问茂丘西奥。

      茂丘西奥有些迟疑地点了点头，露出一个无奈的神情，又像是想到什么滑稽的事情一样笑了好一会，才平静下来说：“我当时觉得他大概是厌倦了。你们别看他那样，他的感情经历可丰富着呢。”

      他皱眉露出一个苦笑，撑住半边脸的手遮挡了右眼的视线，剩下可被捕捉到的左眼也不知在朝什么遥远的地方看去：“也是，为什么要拘泥在我身上呢？毕竟就算分开了也还是朋友，他不珍视我也是可以理解的。他说的也没错吧，他大概对我确实没有那方面的爱。”

      -

      “是，”镜头回到双人前采间，班伏里奥在两人都坐定后第一次挪动了身体——他转头看向茂丘西奥，摄像机取景框中他湖色的眼睛露出几点淡淡的哀戚，他轻声说，“你没发现吗？茂丘西奥，你不爱我。”

      收到控诉的茂丘西奥愣了一会，随后笑着摇了摇头，边摇头边嘟哝着类似“不，不是这样的”的话语。他摇头的幅度越来越大，像要把什么狠狠甩出去一样，过了好一会，他才停下来，轻飘飘揩去眼角不知什么时候渗出来的泪，说：“你还记不记得我们刚分开那几天？我在我家里躲了好几天不肯见你，你却像没事人一样和罗密欧他们一起来找我！就好像……就好像刚刚和我分手的人不是你一样……就好像我们之间从来、一直都是朋友一样。班伏里奥，你把我当什么了？”他扭头朝身边的人回瞪过去，那人此时却敛起了目光，只盯着两张扶手椅之间的地板。

      班伏里奥没有回答，只是咬了咬嘴唇，重新将身体转向前方——茂丘西奥知道这是他欲言又止的表现，他顿时有一种重拳打在棉花上的挫败感。

      又是这样，每次都是这样，他凭什么总是摆出一副照顾者的姿态？哈，他可真会替别人着想考虑得可真周全呐。茂丘西奥愤愤不平地这样想着，也赌气似的转回身看向身体正前方的导演组，用眼神示意他们继续进行下一个环节。

      -

      「我们接下来进行的环节是‘爱情体检’。我们准备了一些有关你们的问题，刚刚两位在来的路上已经分别填好了自己的答案。现在我们要进行一个小测试，来看看你们是否了解对方的答案。」

      “我们很了解对方，所以应该不会有什么问题吧？”班伏里奥耸了耸肩，微微侧头看了一眼隔了一米坐在身边的人。

      茂丘西奥没有接话，只是用平淡得有些反常的语气说“开始吧”，橄榄色的眼睛里有一瞬流露出不易被捕捉的疲惫。

      「首先是问班伏里奥先生的，请问你们的恋爱周年纪念日是什么时候？」

      “十月一日。大学开学的第一天。”

      “这对他来说不是什么难题，毕竟只要记得是学校开学的日子就好了。”

      「下一个问题是问茂丘西奥的：对方的生日是什么时候？」

      茂丘西奥扭过头盯着他。视线停留的时间太久了，班伏里奥也看上去有些不满地抱臂转身回望过去，好气又好笑地问：“难不成你是忘了吗？”

      被挑衅到的人“切”了一声，黑色的卷发一甩，面对着导演组说：“十二月十日。”

      “其实准确来说，这是我被收养的日子，”班伏里奥此时也已经重新转回身，解释说，“我本来是个孤儿，在我三岁那年被当地的蒙太古一家收作养子。没有人知道我出生的日子，所以就将被收养的那天当成了我的生日。他们一家对我很好，将我视如己出，一直以来我都很感激。”

      茂丘西奥不用看过去也知道班伏里奥说这话时面上的表情，就像他过去近三十年里重复过无数次的那样淡漠，好像他讲的故事从来没有发生在他身上过一样。但茂丘西奥知道，在班伏里奥还小的时候，他淡漠的外壳偶尔会裂出一个缝，露出里面柔软的脆弱。但是到了现在，到底是他伪装的技术更好了，还是他真的不在意这些了，茂丘西奥不清楚，也不会去问，因为他不想再看到班伏里奥用半真半假的话堆起来的体面。

      「茂丘西奥最喜欢吃什么？」

      班伏里奥不假思索地回答：“草莓可丽饼。”

      问题中心的主角夸张地挑了挑左边的眉毛。答题的人愣了一下，不经意地摸了摸鼻梁，犹豫着开口补充：“当然了，茂丘西奥爱吃的东西有很多……基本上我每次给他做什么，他都会很满足地吃下去，然后夸奖我的厨艺，说这是他最爱的食物。不过相比较其他种类的食物，他确实更加偏爱那些有奶油和草莓的甜食……”

      “这下对啦！不愧是我的好班尼，我的答案就是‘有奶油和草莓的甜食’。”也许是因为想到了喜欢的食物，茂丘西奥先前偶尔流露出的疲态被一种近乎餍足的神态所取代，好像他终于恢复了往日的生机。他扭头追问：“话说，你为什么会说草莓可丽饼？我们有一起……噢，是那次吗？”

      班伏里奥点了点头，面对着摄像机解释道：“我们两个在一起之前，有一年我们附近开了一家新的甜品店，他当时缠着我和另一个朋友陪他一起去。但是我们那个朋友当时没有时间，所以最后是我和他两个人去的。事实上，那几乎可以说是我们两个第一次单独相处——啊，亲爱的罗密欧，如果你在看节目的话，我希望你知道我绝对没有说你是电灯泡的意思。我们都爱你，你明白的，”班伏里奥眨了眨眼，继续说，“总之，我们当时一起过去了。因为他之前一直没吃过可丽饼，所以看到这家店的招牌是草莓可丽饼之后就更兴奋了。不过等我们进店之后，店员告诉我们当天的草莓可丽饼已经售罄了。听到这个消息之后他很失落，于是我就带他回了我的家，自己给他做了一份草莓可丽饼。然后这之后每过一段时间，他都会缠着我要吃。”

      「班伏里奥最喜欢吃什么？」

      “我在写我自己的答案的时候我就在想他会写什么了，这对他来说一定很难抉择，因为他喜欢的东西可多了，或者说，他对很多东西都不够喜欢，是吗？也许，你会写千层面？”茂丘西奥有些不确定地扭头问。
      班伏里奥点了点头，露出一个有些宽慰的笑，说：“对。我确实没有什么能称得上‘最’喜欢的食物，所以我写了我的安慰食物。每当我心情失落的时候，我就会想吃千层面。”

      “说实话，我们分手之后我就在想，模特先生会不会因为心情太失落而疯狂进食高热量的千层面，进而断送他的职业生涯，”茂丘西奥哧哧地笑了几声，眼睛眯成一条细线，上下打量着身边的金发模特，说，“不过现在事实证明他没有那样做。”

      “可别拿我开玩笑了，亲爱的茂丘西奥，”班伏里奥抓了抓头发，无奈地说，“你明明知道我的主业是设计师，我也只会在没人想穿我的设计的时候才会成为我自己的模特。”

      “没有人会不想穿你设计的衣服，班尼，大家都爱你和你的设计。”茂丘西奥安静下来，轻声说。回应他的只是班伏里奥无声的耸肩。

      「对方最喜欢的颜色是什么？」

      “黑色，蓝色，”茂丘西奥即答，他捻了捻垂在脸侧的长发，眼睛飞快地打了个转，抿起嘴顿了一下，然后不经意地飞快说，“还有金色。”

      班伏里奥抱臂皱起了眉，微微偏向回答问题的人的方向有些不解地反问道：“金色？”

      茂丘西奥没有回答，只是垂着眼睑，不断地折腾着他手里那缕可怜的已经开始变得毛躁的黑发。他身边顶着蓬松金发的人无奈地叹出一口气，耸了耸肩，宣布说：“我写的答案是‘黑色和深蓝色’，算是对了一半吧。”

      -

      「您觉得茂丘西奥为什么会在回答的时候加上金色？」在备采间里，导演这样问。

      班伏里奥真切地露出一个为难的表情，挠了挠头，皱眉思考了好一会，才犹豫着说：“老实说，我不知道。他应该是明白我喜欢黑色和蓝色的，但至于金色……？我们之前从来没有讨论过这个……”他有些烦躁地低头整理着衬衫袖口，不断将其卷上去又放下来，大概这样重复了三四次，他才抬起头，眼神越过摄像机落在不知道哪个远处，缓缓说：“我确实会在一些主打黑色的设计里加上一些金色元素，但我这样做并不是因为喜欢金色，只是因为它们在那里很合适罢了。”

      “我很抱歉他因为这个误会了我的喜好。不过，他大概也只是突然想到就这样说了吧，他是这样的人。”

      -

      回到双人采访间，轮到班伏里奥回答茂丘西奥喜好的颜色时，他平淡地说：“紫色。各种各样的紫色。”

      茂丘西奥从鼻腔中发出一声满意的闷哼声：“答对啦。这题对他来说太简单了。”他摊开手，宽大的本白色袖子顺着手臂的起伏滑到肘窝处，露出手腕上各式各样的配饰，无一不带着紫色元素。“早在我们还小的时候他就问过我了，他问我为什么这么喜欢泽色，每天都要穿着紫色的衣服，然后我当时怎么说的来着？”他晃了晃手腕，发出叮铃铃的声音，扭头求助班伏里奥。

      班伏里奥一边自然地伸出手细致地将那些首饰整理好，一边无奈地说：“你当时只是大声向我嚷嚷说你就是喜欢。天知道为什么。”

      茂丘西奥被他的回答逗笑了，止不住地乱晃。那些刚刚被整理好或是正在被整理的小玩意又随着他身体的动作一下子从规整中被解放了。班伏里奥见自己的辛苦被白费也不恼，挂着一副早已习惯的释然重新在他的椅子里坐正。

      「目前一分题的部分已经结束了，接下来的是三分题：首先，对方最大的爱好是什么？」

      “喝酒、摇滚乐、给身体打洞、寻衅滋事，非常典型的茂丘西奥。我相信即使你们只认识了他这几分钟也能想象得到，”班伏里奥先说出了自己的答案，他伸出一只手撑着自己的脑袋，继续补充，“但如果要提上一个‘最’的话，我想是‘给身边的人找麻烦’吧。”

      被安上“爱好”的茂丘西奥早已眉毛皱得老高，在座位上不断地挪动着身体：“你是认真的？不要告诉我你是。我不相信你会不知道正确答案是什么。”

      班伏里奥没有理会身旁的人的躁动，耸了耸肩，回绝了导演组是否需要更改答案的询问。茂丘西奥黑着脸说：“我写的答案是——”

      “别告诉我是那种‘和班伏里奥待在一起’之类的肉麻答案——”

      “——荡秋千。”

      “荡秋千？这下轮到你来告诉我你是不是认真的了，以及，我为什么会知道这是你最大的爱好？”班伏里奥瞪大了眼睛，不满地扭头质问。

      “你怎么会不知道？我不是每次看见有秋千就会去玩吗？你不知道？”

      “是的是的，我知道这个，我当然知道你喜欢，”班伏里奥有些头疼地揉了揉眉心，“但是我要怎么知道这是你最喜欢的呢？你总是把喝酒摇滚之类的事情挂在嘴边，但荡秋千？”

      茂丘西奥愤懑地鼓起嘴，过了一会才甩下一句：“得了，你只是在为你答错题而生气而已。”

      “顺带一提，”茂丘西奥将垂在胸前的头发向后一甩，昂着头说，“你最大的爱好是参观古建筑和跳舞。”

      “一字不差，下一题吧。”班伏里奥几近微不可查地叹了口气。

      「茂丘西奥最害怕失去的东西是什么？」

      “我猜你的答案是激情吧，对吗？”班伏里奥恢复了惯常的温和脸色，扭头看着身边的人问。

      茂丘西奥笑了，眼神从对方平静的眼睛里飘到远方不知名的某个地方：“这对他来说根本不能算是个问题，任何和我相处过一段时间的人都能看出来这一点，更何况是他呢？”

      “他是一个很纯粹的人，”班伏里奥面对前方说，语气里带着半点不易被察觉出来的疲惫和无能为力，“我们那时还没那么熟悉，他做一些事情的时候，我经常会想他心里真的是这么想的吗？他是真的想这么做吗？后来发现，他确实是那么想的，也就那样做了。”

      「比如说什么样的事情呢？」镜头外工作人员的声音追问。

      “比如说，我刚上高一的时候，那时他和我们的另一个朋友还在上初中，他们放学的时候我还在学校里，”说到这里，班伏里奥停顿了一下，扭头问，“这个能说吗，不会有什么影响吧？”

      茂丘西奥白了他一眼：“你连我喜欢寻衅滋事都说了，这有什么不能说的？”

      班伏里奥笑得埋下头去，金发随着身体的抽动在空中一颤一颤。过了好一会，他才抬起头来，只是如果眼见的话，还能看见没来得及收拾好的得逞的表情在他脸上一闪而过：“好吧，总之那时应该刚好是最后一节课前的课间，他们就直接冲进高中的区域当着所有人的面把我拽走了。等到我们不知道怎么向门卫蒙混过关地走出校门他们才告诉我是因为茂丘西奥突然很想赶在日落前去海边，如果等我放学了再去就太晚了。”

      “然后我问，”班伏里奥伸手刮了刮自己的鼻梁，“‘那为什么非得和我一起呢，你们两个不行吗？’他当时说——”

      “当然不行！”茂丘西奥几乎是跳了起来，胸口剧烈起伏着发出质问，班伏里奥在旁边耸了耸肩，看不清他朝下的脸上的神情，“你从小到大都是这个样子，觉得你可以随时从我们的生活中抽身而没有人会对此有任何意见。你怎么能这样？”

      “所以你觉得三个人一起去海边看日落比我被老师和蒙太古夫人教训要重要？”班伏里奥不置可否，偏过头去问，又在看到茂丘西奥转瞬变得愧疚的神情和即将开口辩解时拍了拍他的肩膀，露出一个安慰的笑，继续说，“好茂丘，你没必要为此感到愧疚，我刚刚是开玩笑的。逃课和你们一起去海边绝对是我这辈子最珍贵的那些回忆中的一个。”

      「班伏里奥最害怕失去的东西是什么？」

      茂丘西奥抿了抿嘴，说：“支持自己独立生活的能力吧。我知道他一直很焦虑这一点。”

      “噢，呃，我确实很害怕失去这个……”班伏里奥带着些心虚地舔了舔嘴唇，缓缓说。

      茂丘西奥眉毛一竖：“你这语气什么意思？不是这个？那是创作灵感吗？还是健康的——”

      “不，没有，”班伏里奥呼吸有些急促地打断他的话，“我是说，我的答案是‘没有’。我觉得没有什么东西能称得上是我最害怕失去的。不过，当然，你刚刚说的那些都是我很重视的——”

      “你撒谎。”茂丘西奥扭头怒视身边此时正抱臂缄默的人，一字一顿地说。

      意料之中地没有得到对方的回应，茂丘西奥继续连珠炮一样追着抛出一个又一个带着怒意的质问：“‘没有’？你怎么会没有？你以为你把你的各种焦虑情绪都隐藏得很好吗？还是说你觉得我们都是瞎的，所以我们什么都看不到？你给我抬头，你到底能不能看见我在这里？”

      班伏里奥看向茂丘西奥盈满怒气的绿眼睛，刚深吸口气准备开口解释，话头又被茂丘西奥抢了过去：“‘我已经成长到可以处理我的生活了，所以不管失去什么我都可以冷静下来思考解决办法’。你打算这样为自己辩解，就像你向我们说过无数次一样，是吗？当时你或许只是出于你那些不想让我们担心之类的考量说给我们听，但现在呢？哈，你甚至开始自欺欺人了吗？真令人放心！”说完，他便别过头去，不再看向另一个人和那个人眼中他捉摸不透的情绪。

      -

      「今天早些时候在‘爱情体检’环节，说到班伏里奥对‘最害怕失去的东西’的回答是‘没有’时，您很生气，是因为这类事情有过先例吗？」

      备采间中茂丘西奥点了点头，说：“有过，非常多次。比如说他刚读大学那会，他当时在给一个设计师兼职当助理，后来学业和兼职之间的冲突越来越多——甚至有一次他因为熬夜工作差点错过了第二天学校里的考试。那时我和我们的另一位朋友还在家乡上高中，只能从偶尔的线上联系里看出来他状态不对。然后我们找了个周末跑到他那里去找他，结果他只是告诉我们他自己能处理好。”

      “‘我自己能处理好’，”茂丘西奥怪腔怪调地学着班伏里奥的语气，“就好像没有人能看得出来他‘处理’的方式只是假装自己有办法一样。”

      -

      「刚刚茂丘西奥说你只是在假装没事的话你认可吗？」在另一个人的备采间里，导演组提出了这样的问题。

      班伏里奥略微犹豫了一下，随即点了点头：“这也是为什么我当时没有反驳他。他说的都是对的，他确实很了解我。”

      「那为什么要这么做呢？」

      “就算真的说了，他们也帮不上什么忙吧，”班伏里奥露出一个淡然的笑，“所有人都已经做了他们能做的事情来给我安全感了，他们并没有做错什么，我也很感激他们做的一切，所以我也不想让我始终没有办法建立起安全感这件事来让他们失望。”

      -

      镜头回到双人采访间，「接下来是五分题：请举例一件对方觉得他自己很厉害的事。」

      “茂丘西奥就没有觉得他不厉害的时候，我想你会写那次你被临时叫去救场吧？”班伏里奥歪了歪头，看了眼身边的茂丘西奥。

      “答对了，”茂丘西奥没有看班伏里奥，脸侧的长发遮住了他的侧脸，让班伏里奥看不清他的表情，但从他冷淡的语气中不难听出他还在生气，“以及，我大多数时候都觉得自己很厉害，而面对你的时候显然不属于这些时候。”

      见对方仍在气头上，没有要做进一步解释的打算，班伏里奥叹了口气，简单解释道：“这好像就是去年的事。当时他前几年演过但已经很久没演的一部剧刚好巡演到我们附近，然后剧组的演员和替补演员有一些突发状况突然都上不了场了，于是紧急把他叫过去顺利演完了那几场。”

      茂丘西奥边点头边将头发别到耳后，有些得意地补充说：“并且我当时救场的角色还不是我当时演过的角色。”说完他就安静了下来，低头看着自己正不停摩挲的手指，过了好一会，才抬起头继续说：“班伏里奥的话，他其实做过很多我觉得很厉害的事，他在我心里一直是一个很厉害的人。所以我有些拿不准他会写什么……在考试中取得高分或者做出招人喜欢的衣服这些对他来说都太普通了——”

      “如果你需要提示的话，我可以告诉我我写的不是这方面的，甚至可以说是完全相反的。”

      “啊，难不成你是写了那次逃课？”

      班伏里奥点了点头，笑着说：“就是在前面我提到的那个逃课去看海的事情。虽然我前面只说了是他们两个把我拽出去的，但其实如果我真的很不想去，他们也是拉不动我的。所以我还是觉得自己当时有点厉害吧，刚升入高中就做出这种违纪的事情，而且是出于我自己的意愿的情况下。”

      「最后的附加题，请嘉宾自由命题向对方提问，并根据对方的回答进行满分为十分的评分。」

      “你想好了吗？如果还没有的话我先问吧，”茂丘西奥摇了摇头，班伏里奥见状，吸了口气，缓缓问，“有时，比如那些我不想让你去做一些事情的时候，我和你说的那些话你有听到吗？”

      “什么？我什么时候……”茂丘西奥皱起了眉。

      “那些你把我推开的时候。”班伏里奥平静地补充。

      “我很抱歉，班尼……可是你知道的，你没法——任何人都没办法，不让我做那些事情。”茂丘西奥看着班伏里奥平静得有些麻木的神情，声音渐渐低了下去。

      班伏里奥伸手抓了抓头发，然后将半张脸埋进手里，发出几声了然的笑。过了一会，才抬头说：“是啊，我早就知道的，十分。你打算问我什么？你想好了吗？”

      茂丘西奥抿了抿嘴，没有看他，似乎是做了很久的心理准备，才开口问：“你觉得，你在我心中是怎样的？”

      “我在你心中？”班伏里奥有些意外地挑了挑眉毛，“我是你的好朋友，我们当过可以说相当长一段时间的恋人，然后我们现在可能又重新成为了朋友。”

      “你不能具体一点吗？”茂丘西奥撇了撇嘴，不满地说。

      “呃，你想我怎么具体？我始终是你忠诚的朋友？”

      “你始终是我离不开的那个人。”茂丘西奥硬着语气，一字一顿地纠正。

      面对突然的告白，班伏里奥反常地没有什么反应，他还是保持原有的样子，只是在听到回答的时候扯出一个轻飘飘的笑：“谢谢你，茂丘。”

      “你真令人生气。我要给你这个回答打零分。”

      班伏里奥无奈地摊开手：“好吧，你总是让我无可奈何。”

      “总让人无可奈何的人明明是你。”茂丘西奥瞪大了眼睛，有些委屈地纠正道。
  - title: Day0-1
    body: |-
      「欢迎二位来到《再见爱人》节目，你们十八天的旅程即将拉开序幕。在刚刚结束的“爱情体检”环节中，班伏里奥先生最终得分87分，茂丘西奥先生最终得分96分，恭喜二位。现在，你们可以在房间中稍事休息，等待第二天与另外两组嘉宾的会面以及旅程的第一站的到来。」

      -

      等两人都结束备采回到节目组为他们准备的房间中已经是接近晚饭的时间了。夏秋交际之时的挪威的天空已经早早地暗了下来，只剩下和这座城市一样静谧的深蓝色和底下颜色鲜亮却透不出半分吵闹的尖顶房屋。

      茂丘西奥丢下行李，“唰”的一下拉开落地窗前的纱帘，晃了一圈，又绕到正蹲在布艺沙发前埋头整理行李的班伏里奥身前，用后脑勺指着窗外，说：“喏，你喜欢的深蓝色。”

      班伏里奥翻找衣服的动作顿了顿，抬起头来，看见茂丘西奥正撅着屁股趴在沙发靠背上，带着些挑衅地看着他。他叹了口气：“他们刚刚在备采间都问了些什么？”

      茂丘西奥耸耸肩，眼睛一转，说：“问我都受了什么委屈。”

      “真巧，他们也问了我同样的问题。”班伏里奥轻嗤一声，又把头埋下去继续手上的动作。茂丘西奥就看着他慢条斯理地一件件地把叠成整齐方块的衣服拿出来，抽出放在最底下的两件睡衣，扔到沙发上，又不紧不慢地把身边堆成小山的衣服重新放进箱子里，期间不乏一些吹毛求疵地将有些松散的方块重新叠好的时候。茂丘西奥挑了挑眉：“明明放在上面的那些衣服里也有睡衣的。”

      班伏里奥无奈地闭上了眼，没有抬头。他当然知道这个，甚至这些衣服一开始就是他放进来的——他当时在家里是直接把十八天分别要穿什么衣服全部配好了以天为单位在行李箱里放好的。

      -

      「平时这些出行活动的准备工作都是由你来做安排的吗？」节目组在备采间里这样问。

      班伏里奥摸了摸鼻梁，抿抿嘴唇说：“其实我们现在已经没有住在一起了，所以我们这次的行李是分开准备的……但是确实平时我会对这些准备工作操心得更多。”他短暂地失神了一会，然后恢复以往的神情，继续说：“不过，我也不是总是会这样‘周密’地做准备的。因为我是个孤儿嘛，所以我小时候经常感到不安，觉得对什么事情都要做好万全的准备才行。不过这几年以来这种不安全感已经减少很多了，只是这次要和他一起上节目所以可能又有点回去了。”班伏里奥皱眉露出一个苦笑。

      「是和茂丘西奥的相处让你渐渐不那么不安了吗？」

      “是的，不过也不只是他——我们的另一位朋友、收养我的家庭、包括我自己，我现在有一些支撑自己在社会上生活下去的资本。准确来说，是这些所有让我不那么不安了。不过，说到茂丘西奥，我有时候真的忍不住想我面对他的时候到底是感到安心呢，还是不安呢？”

      班伏里奥低头思索了一会，继续说：“让我感到安心的是我知道他‘爱’我，我知道当我累了想休息一下的时候或者只是当我回头的时候，他会在那儿。但即使我和他从小一起长大，我还是没有办法说我真的完全了解他这个人。”

      “我真的进入他的世界了吗？他那个充满疯狂的世界应该容不下我这么无趣的人吧。”

      -

      见班伏里奥没有搭理他，茂丘西奥不满地眯起眼，然后伸出两只手托起他的脸，强迫那双湖蓝色的眼睛看向自己。“你明明知道有放在上面的睡衣的。”他又重复了一遍。

      班伏里奥又叹了一口气，但没有从那双拖着自己下巴的手中挣脱出来，有些疲惫地说：“你又生气了。而我现在不想面对你的怒火，好吗？”茂丘西奥没有回话，但班伏里奥看见他腮帮一紧，再抬起眼帘果然看见他的眼睛里正盈满委屈的眼泪。他几乎是习惯性地直起身，伸出手轻柔地为他擦掉断断续续往外冒的泪珠。茂丘西奥吸了吸鼻子，轻拍此时正抚在他面颊上的那只手示意自己已经没事了。班伏里奥垂下手，又转身抽了几张纸巾递过来。他接过纸巾，捏在鼻子上，瓮声瓮气地说：“我是为了谁生气的？”
      班伏里奥站起身，跨过还没整理好的衣服，绕到沙发后轻轻抱住了茂丘西奥。两个人都没有再说话，一时间，房间里只剩下偶尔的衣物摩擦的声音。过了好一会，茂丘西奥才用胳膊肘顶了顶班伏里奥环在他身上的胳膊，手上还没摘下来的视频发出清脆的叮铃声。“吃饭吧，”茂丘西奥说，“我看到他们准备了奶油浓汤。”

      班伏里奥从鼻腔里挤出一声顺从的闷哼声，然后松开了手。

      -

      第二天两人收拾好行李坐上车准备去制定好的露营地和另外两对嘉宾会合的时候他们之间的气氛已经缓和下来了。班伏里奥自然地拉开驾驶座边的车门坐进去，茂丘西奥则负责将两人随身携带的背包在后座放好，然后坐到了副驾驶的座位上。

      “我们过去要多久？”茂丘西奥边对着后视镜整理头发和墨镜边问。

      “半个小时。”班伏里奥先是将身子探到副驾驶座位边上给茂丘西奥系好安全带，又转身从后座拿出一个U型枕丢进他怀里——这一举动引来了茂丘西奥不满的嚎叫声，嗔怪他的动作和那个枕头打扰了他的胃。“那是因为你早上吃了太多的果酱华夫，”班伏里奥边低头给自己扣好安全带边说，“你可以趁这三十分钟补补觉。”

      茂丘西奥顺完最后一根头发后发出一声满意的哼唧声，随后一下把自己的头发重新抓乱，戴好墨镜架好枕头，头一歪抵在车窗上，下巴往柔软的枕头里缩了缩。班伏里奥扭头，看见深茶色的镜片底下的眼睛已经闭了起来，下意识露出一个浅笑，踩下了油门。

      -

      黄色的越野在开阔的公路上行驶着。班伏里奥看着正前方远处起伏的山脉，听着身边的人平稳的呼吸声，想起了几年前一次去往阿尔卑斯山脚的旅行。那时他们的朋友罗密欧刚拿到驾驶证，于是他和茂丘西奥一起被赶到后排座位上看着他“大显身手”。彼时的茂丘西奥也是一上车就开始呼呼大睡，只剩下他一个人紧张地盯着驾驶座上的动作，以免出什么意外——虽然大家都知道，即使茂丘西奥没有在车上睡觉他也不会加入爱担心的班伏里奥的队伍的，他只会成为班伏里奥需要担心的另一个因子。

      “班尼，你就休息一会吧，放心好了。”那时的罗密欧从方向盘，后视镜和挡风玻璃中分出一点目光瞥向班伏里奥，对他说。

      班伏里奥紧张地坐直了身体，刚要出声提醒他专心看路，就被不知道什么时候醒来的茂丘西奥抢过了话头。他一倒身子，将满头的卷发送进他的怀里，还伸出一只手揽过他的肩膀，还带着些睡意黏糊糊地笑着说：“你就让他操心吧！他可不能不为我们操心！你说是不是？”

      那时的班伏里奥无奈地皱起眉，一边应下了他的话，一边想着茂丘西奥是什么时候醒的——就像现在一样。

      “你是什么时候醒的？”班伏里奥快速地瞟了一眼身边正按下车窗的人，“小心风‘打扰你的胃’。我们还有五分钟就到了。”

      “刚刚。”茂丘西奥摘下墨镜翻了个白眼，边辩解着“我的胃已经好了”，边伸了个懒腰，刚想将一只手伸出窗外，就被班伏里奥警告的眼神拦下了——事实上他在看到对方经过狭小的后视镜折射来的眼神之前就已经收手了。他扭头朝驾驶位上的人吐了吐舌头，把胳膊支在车门上，刚想把头靠上去，班伏里奥就语气平淡地出声阻止：“头也不行。”

      茂丘西奥则笑着插科打诨，边说着“知道啦”边端正地重新坐好——就像他们曾经做过的无数次一样。
      班伏里奥将车在草地边停好，深吸一口气，又缓缓吐出来，看着前方草坪上正聊着天的其他人，不知道对着谁说了一句：“我们到了。”

      -

      第一个发现他们的到来的是一位有着红色头发的女士。她轻轻拍了拍她身边正和另外一男一女交谈着的黑发女士，用眼神示意她朝这边看。那位女士扭过头来，热情地向正拉着行李箱走过来的班伏里奥和茂丘西奥招手：“Hello，需要帮忙吗？”

      他们两个摆摆手，但其他四人还是主动地走过去，接过了他们手中的行李箱，将它们放在一绿一橙两辆房车前。班伏里奥搓了搓手，一一谢过后问：“我们的房车怎么分配？”

      另外四人中的男士——他刚刚自我介绍为亚历山大·卢索——有些为难地摸了摸眉毛，说：“我们刚刚还在想呢，不知道节目组会怎么安排。”

      “我原本提议干脆按头发长短分配，”黑发的维加·比安奇-佩雷拉将长发甩到身后，欢快地吹了个口哨，眨了眨眼说，“在您还没来的时候这儿就是两长两短，现在还是这样，岂不是很合适？”

      短发的莱亚·加西亚笑着说：“我同意。真的应该让亚历山大和你们两位学习一下该怎么处理这些长头发。我们同居的房子里满是他可怜的开了叉的干枯毛发。”

      班伏里奥也笑了：“可别和他学，他的头发从小就毛躁得不行。他可压根没管过它们。”

      亚历山大则有些不好意思地低头捋了捋自己的金棕色长发：“莱亚，我想节目组对此会有安排的……”

      说着，就有工作人员递来了手卡，茂丘西奥接过卡片，将上面的文字大声地念了出来——

      -

      「再次正式地欢迎六位来到挪威的特隆赫姆，开启这趟旅程。从我们现在所处的营地往下看，就能看到横穿尼达河的老城桥。传说穿过桥上的“幸福之门”，走过这座桥，就能得到好运。单纯的走过一座桥也许不能够让人们获得所有的幸福，但在过桥的过程中，人们愿意相信自己离幸福更近了一点，而这份“愿意”才是这座桥真正的魔力。你们当中，有的人是想要来寻求一个答案的，有的人是来寻找解决方法的；有的人是希望通过这趟旅程让你和你的爱人不再分开的，有的人希望这趟旅程能够成为两人之中一个完满的句号；有的人希望来看清自己的内心，也有人希望能走进对方的心中。不管怎样，希望你们都能在这趟旅途结束之后得偿所愿。」

      茂丘西奥翻过一页，继续读——

      「现在，我们需要在三组嘉宾中选择一组作为前六天的轮值导游，并且自行商量决定好如何分配房车。」
      话音落下，工作人员上前递上一个三角形的小旗子和导游手册。距离最近的维加顺手接过那些物件，看了看身边犹豫的众人，说：“那要不就我们先来吧，刚好手册和小旗子都到我手上了。埃利，你可以吗？”

      从刚刚开始就一直很安静的埃勒诺小幅度地摇了摇头，说：“我没问题。”其他人也纷纷对此表示赞同。
      此时天上开始飘起了小雨，班伏里奥边接过雨具边提醒大家尽快决定房车分配问题——“要不然大家的衣服都要被雨泡湿了。”

      “泡湿？”茂丘西奥扭头看着班伏里奥有些紧张的脸，拍了拍他的肩，说，“我的好班尼，这细小的雨丝甚至不能打湿我们的头发，更别说行李箱里的衣服了。放松一点？”

      班伏里奥抿了抿嘴：“可你并不能保证这雨不会变大——”

      “这么说的话即使在晴天我也不能确保下一秒钟不会下雨——”茂丘西奥皱着眉回头说。他的反驳被莱亚温和的声音打断：“不管怎样这雨看起俩确实有要变大的趋势了，不是吗？我们还是快点决定然后把行李拎上车吧。我们直接剪刀石头布如何？”

      “好极了！”刚刚因班伏里奥和茂丘西奥小小的争执而显得有些尴尬的维加显然随着莱亚的解围而重新放松了下来，有些雀跃地说，“我赞——”

      “我有另一个意见，”安静的埃勒诺·比安奇-佩雷拉突然小声但坚定地说，“不如直接按昨天‘体检’得分的高低来安排如何？”她抬头看着其他人，有快速补充了一句：“这样更快。”

      有那么几秒钟没有人说话，直到茂丘西奥和亚历山大率先对此表示了赞成。六人很快达成了共识，决定由分数高的嘉宾占据橙色房车，另一半嘉宾则将自己的行李搬上了绿色的房车。

      “接下来，我们要乘坐房车前往市中心用餐。饭后，我们能一起逛一逛城区和教堂。那么，就让我们一会见吧。”刚上任的导游维加挥着新到手的小旗子，站在橙色房车的踏板上对其他嘉宾说。

      -

      “结果到头来，居然就是按照维加一开始提议的按头发长短分边吗？”茂丘西奥半躺在靠窗的沙发上，看着坐在对面的维加和亚历山大，笑着说，“不过，我本来以为你们两位的伴侣会得分更高一点——毕竟，有一个说法怎么说的来着？”

      “‘两个人中安静的那个人会更了解对方’？可是我看你和你那位明明也是他更安静！”维加甩了甩自己的笔直的头发说。

      茂丘西奥耸了耸肩，笑嘻嘻地说：“我们都很了解对方，只不过我在最后的附加题拿了满分，而我只给了他零分。”

      “那么我们则是都太不了解对方了，”亚历山大在另一边苦笑着说，“事实上，我俩的分数半斤八两，都只有三十几分。”

      “真的？可我感觉你们很合拍啊，”维加有些诧异地挑了挑眉，问，“你们认识多久了？”

      亚历山大犹疑了片刻才说：“一年半。我们算是一见钟情？见面第二天就确认关系了。”

      “你俩？看不出来是那种激情充沛到见面第二天就——”茂丘西奥也惊讶地瞪大了眼，话刚出口便意识到自己的冒犯，忙止住了话头，还缩了缩脖子。他甚至能想象到如果班伏里奥在身边的话会用怎样一种责备又无奈的眼神看他——怎么又是无奈？他之前有意识到在他们两个人之间存在着这么多的无奈吗？他抱歉地做了个鬼脸，继续说：“对不起，希望你没有被冒犯到……我只是想到我的一个朋友和他的爱人。他们当年也是一见钟情的，但他俩直到现在都还十分——浓情蜜意。”

      亚历山大在空中虚虚摆了摆手：“没事，我并不介意。事实上，我觉得这正是我们之间的问题所在。你们呢？你们认识多久了？”

      “我们两个从小就认识了。四岁，还是五岁来着？我记不太清了，总之到现在也已经二十几年了，然后确认关系也有七八年了吧。”茂丘西奥把玩着手腕上的金属装饰，不等另外两人追问，就接着往下说：“分手是他提的。我昨天才知道，是因为他觉得我们还是太像朋友了。”

      维加表示理解地点了点头：“那你们分开之后是？”

      “继续做朋友咯，”茂丘西奥面露无辜地摊开手挑了挑眉，“不过我在这一点上没有什么主动权。他提出分手之后，我本来是想躲起来好好闹他一番别扭的。结果没过几天他就像什么都没发生过一样来敲我的门了，还和我们的另一位朋友一起。可能他觉得我们之间还是做朋友更合适吧，我只是在由着他来。”

      “抱歉，我能问个问题吗？我有点不明白，”亚历山大困惑地看着茂丘西奥，“他是只想和你做朋友吗？”

      茂丘西奥托住下巴思考了好一会，才犹豫着开口说：“他想和我做朋友。或者说，保持亲密关系？说实话，即便在我们成为恋人之前我们之间的关系也是那种亲密无间的朋友。但至于他有没有更多的想法，我不知道。所以，我把他拽过来也是因为想找机会让他把一些没说出口过的话说给我听。”

      “听起来很复杂。”亚历山大向横在沙发上的人投去一个同情的眼神。维加颇为感慨地晃了晃脑袋，靠在座椅靠背上半仰着头说：“你们说，他们的车里在聊些什么呢？”

      “说我们的坏话？”

      “又或者什么都不说。”

      -

      「邀请班伏里奥一起来参加节目的时候你们分开多久了？」

      茂丘西奥挑了挑眉，歪头说：“我们从来没有分开过。如果说是结束恋爱关系的话，那时候应该是三个月左右。”

      「当时邀请他的时候你有担心过他会拒绝吗？」

      “担心倒是说不算……”茂丘西奥挠了挠脸颊，眯起眼边斟酌用词边说，“毕竟就算没有这次机会我们的关系也还是会像从前那样亲密，而且，班尼很少有拒绝我的时候，我们也一直有要来北欧旅行的计划。不过，我知道他有一些事情没有想明白，也有一些话没有对我说——虽然他自己应该不会承认，所以我还是希望他会答应过来。他总是想了太多的事情，又有太多自己想不明白却不愿意求助别人的事情，自己一个人憋太久总是不好的。”

      -

      “你们是做什么工作的？”另一辆房车里，班伏里奥和隔着一张桌子坐在对面的莱亚对上了视线，斟酌着开口说。在此之前，这辆绿色的房车里已经安静了好一会。

      “我是一个摇滚乐队的主唱，”莱亚看着另外两人眼中闪过的敬意，忙摆了摆手笑着自嘲自己的乐队也许十八线还不到，继续说，“萨沙在一个芭蕾舞团里工作，是舞剧演员。”

      “这么说来，茂丘西奥也许还能算是他的同行呢，他是一名话剧演员。我的话，我是服装设计师，有时候也兼职做模特。”

      埃勒诺点了点头，说：“我知道你们两个。”在看见对方有些意外的眼神之后，她又补充道：“其实我们还是大学校友呢，我看过你的毕设展览。顺带一提，我现在是自由工作者——就是给别人画画的，然后维加在做自己的自媒体账号。”话音落下，一时之间房车里只有风和马路刮擦车体的声音传来。就在班伏里奥刚打算开启下一个话题时，埃勒诺毫无征兆地开口，听起来有些犹豫地说：“希望这不会让你感到冒犯……但是自从我认出你之后就一直在心里有这个疑问——你们之间发生了什么样的问题呢？抱歉，因为我还记得你们上学时候的样子，感觉和今天见到的给我的感觉不太一样。”

      班伏里奥有些犯难地挠了挠头：“人总会变的吧。对于我来说，大概是因为我觉得他不爱我了，并且那时我也不再想要执着于‘让他爱我’这件事情了。所以半年前我提了分手。然后因为分手前我们就是很亲密的朋友，分手后我们也只是恢复了从前朋友的状态。”

      “那现在呢？你为什么会来参加这个节目？”

      “其实一开始是茂丘西奥叫我和他一起来的，我觉得我们就那样重新做回朋友没什么不好的，但是——”班伏里奥停止了摆弄自己的发梢，抬头看着桌对面的两位女士，做了个鬼脸，说，“谁能拒绝一场免费的挪威旅行呢？”

      莱亚和埃勒诺交换了一个欲言又止的神情，笑着捧场道：“讲真的，我第一次听别人和我说这个节目的时候，也是这么想的。‘就算我们的感情没有问题也要制造出一个问题来参加这个节目’——我当时这么和萨沙说。只不过，我们现在也是真的有些问题了。”看着班伏里奥和埃勒诺小心翼翼地询问的表情，莱亚将头发拨到耳后，耸了耸肩，继续说：“我们就是在一起的时间长了，觉得没有一开始有激情和爱意了。有时候两个人之间的不同也让我们之间的隔阂越来越厚……我觉得我过来就是想试试看能不能找回从前的感觉的，如果不能的话，就用它来当作这段关系的结尾也蛮好的。”

      “感觉你们都好释然，我还蛮羡慕这种状态的。”

      班伏里奥眨了眨眼，刚想要说些什么，房车便停了下来。车门打开，门外是平静的尼德河，在砖石河畔坐落着一个暖棕色的建筑——这就是他们将要在特隆赫姆短暂落脚的民宿。

      -

      “我其实没有想到会在这里遇见班伏里奥他们两个。”在单人备采间被问及见到另外两对嘉宾的反应时，埃勒诺说。“因为我去看过班伏里奥的毕设展览，当时有一套作品让我印象挺深刻的，它与其他设计的风格都截然不同，然后那套作品的简介里大意是说灵感来自于一个对他来说熟悉又陌生的世界，并且他对于带领他走入那个世界的人十分感激——虽然他没有明说那个人是谁，但其实大家都心知肚明是茂丘西奥了。所以我当时觉得他对班伏里奥来说应该是一个很重要的人，他们的关系看起来也很健康。所以我今天一开始还挺意外的。”

      「那在和他相处过之后呢？这种意外有没有减少？」

      埃勒诺抱着胳膊低头沉思了一会，然后有些不好意思地笑了，说：“该怎么说呢？在接触过他之后我为我从前那么武断地给他俩的关系下判断感到害羞了。我是说，我现在搞不清楚他们的关系。”

      -

      午饭结束后，茂丘西奥在房间外的露台上找到了正在给莱亚和亚历山大拍照的班伏里奥。“嘿。”他放轻了脚步声，绕到班伏里奥身后拍了拍他的肩膀，轻声说。

      “怎么了？”班伏里奥没有回头，只是低头摆弄着自己的相机，似乎完全没有因为对方突然的到来而感到惊讶。

      茂丘西奥没有顺着他的话头解释自己的来意，而是挑起了一边的眉毛，反问道：“你听到我发出的动静了？我还想吓一吓你呢。我甚至还特意让亚历山大他们不要有反应！”

      班伏里奥终于从他的相机中抬起头来。他扭过头来用干巴巴的语气说：“是啊，想来你是把自己当作鬼魂了，气不会呼在我的后脖颈上，皮靴踩在瓷砖上也不会发出任何一点声响。不过鬼魂先生，您最厉害的一点是您的身影不会被这围栏上的玻璃反射出来，是不是？”说完，茂丘西奥便挂在他身上笑了起来，卷曲的黑色长发不安分地附在班伏里奥的胸前。

      “好班伏，再来一次吧，让我吓一吓你。”

      “好吧，”班伏里奥无奈地看了眼还耷拉在自己身上的人，“但我得先拍完这张照片才行，我们好不容易才找到这个合适的光线。”

      于是茂丘西奥便答应着溜达到露台的一个角落里，脱了脚上的皮靴，一屁股坐到晃悠悠的摇篮椅上，一边吱吱呀呀地晃着椅子，一边悠哉地拣面前小圆桌上的零食吃。雨后的特隆赫姆阳光出人意料地舒服，不知不觉间茂丘西奥就这样伴着摇椅沉沉的摆动合上了眼。

      等他再次睁眼时，眼前的景象吓了他一跳——“班尼，我睡了多久了？”

      班伏里奥看着茂丘西奥因惊吓而瞪大的眼睛露出一个得逞的笑。他从茂丘西奥面前缩回身子，站起身，拍了拍他的腿，说：“这已经是十八天之后了。我们怎么都叫不醒你，所以我们只好自己玩了。我现在来接你回维罗纳。”

      “可别诓我了！这明明才过了五分钟。”茂丘西奥也站起身，将身子探进露台后的房间里，看了眼床头柜上的闹钟后转身说。

      “他们已经下去了吗？”他一边慌乱地往脚上穿鞋子边说，“明明两位导游是让我上来把你们喊下去到城里参观的，结果我居然自己睡过去了……”

      班伏里奥在一旁抱着手臂看着他，柔声说：“不用着急，刚刚维加上来和我们说了。莱亚他们还在收拾东西，你可以慢慢来。”

      茂丘西奥系鞋带的手顿了一下，班伏里奥又有些耀武扬威地说：“你不是说好要来吓我的吗？怎么这下变成了我吓你？”

      等茂丘西奥终于系好了他那弯弯绕绕的鞋带，他便耸耸肩，站起身，跟在班伏里奥身后慢悠悠走出房间。“其实这是我上来想对你说的话，”茂丘西奥突然对已经走到门口的班伏里奥说，“之前——我是说早上的时候，我只是想让你别那么紧张。”

      班伏里奥转过身看着少有露出平静表情的茂丘西奥，眨了眨眼，说：“我知道。”

      “还有，我还得吓你一次。”班伏里奥转回身，继续往前走，茂丘西奥紧走几步跟上来，顺手帮他整理好衣领。

      “我知道。”班伏里奥轻轻笑了一声，拍了拍茂丘西奥从他后衣领处收回的手。
  - title: Day1
    body: |-
      “尼达洛斯主教堂的下方为奥拉夫圣王的埋葬地，这也象征着挪威基督教化的起点——”维加一边读着导游手册上的介绍，一边时不时抬眼看着面前典雅威严的建筑，“好吧，太专业的地方我也说不好，我们直接走进去参观感受一下如何？”

      人群中，茂丘西奥用胳膊肘小小捅了捅身边的班伏里奥，偏过脑袋轻声说：“嘿，给我讲讲？我知道你懂这些。”

      班伏里奥看着他抿紧了嘴巴，等茂丘西奥的脸颊从被室外的阴灰光线照得惨白到被室内柔和暗沉的冷白色灯光打下圆钝的阴影，教堂深处的管风琴音攀在高耸直立的雕花墙面上传到他们耳边，他才惜字如金地吐出一个“不”字。直到鞋底踩在木质地板上的声音在空旷高耸的教堂内回荡了几个来回，班伏里奥才继续说：“维加不是说了吗？感受它就好了。”

      “可那是因为我们不懂，而你明明就懂。”茂丘西奥不满地皱起眉，停在队伍后面，不愿意再走动。

      班伏里奥也跟着他停下来，语速飞快地说：“好吧，你想听我说什么呢？那些花窗和雕塑上讲述的故事还是穹顶上的几何结构？我只能讲这些，可是——请别不承认——你根本就不爱听这些。”

      茂丘西奥一边抬起了他绿色的眼睛，安静地盯着面前的人，一边用牙齿细碎地撕扯着嘴皮，想要开口说些什么，但最后也没有说出口，只是轻轻推了推班伏里奥的手臂，向前跟上几米外停下回头等他们的队伍。

      “聊什么呢，这么投入？”莱亚看着快步走近的两人笑着问。

      班伏里奥耸耸肩，回以一个皱眉苦笑，答非所问地说：“看看这些深色的鸡血石，这可不是一个合适的约会地址，是吗？”

      “我们本来也不是在这里约会。”茂丘西奥站在他身边冷不丁插了一句。

      “说的也是。”班伏里奥回过头来，看见披散着卷发的人盘着手，猫一样的腮帮子因为憋着什么说不出口的话高高地鼓起来。班伏里奥心下了然，便平静地将手插进风衣口袋中，歪了歪头看向他，在原地等着。

      茂丘西奥又开始低头折磨起自己的嘴皮，班伏里奥眼见就要出手制止，他便忙抢在那之前收回了自己的“刑具”，又因一下对上对方那双湖色的眼睛，寸地吸了口气，低声说：“对不起。对不起，这就是我要说的，好吗？可别再用这种眼神盯着我啦，好班伏。”

      这下换了班伏里奥抿起嘴。良久，他才松开嘴来说：“那就请你放过你可怜的嘴皮吧。要是又得了唇炎不还是麻烦我来给你涂药膏？”

      茂丘西奥眨了眨眼，微微上翘的睫毛颤得像光线下空气中飘荡的灰尘。他抬起下巴，佯作骄纵状挑起眉，说：“难道你不乐意？”

      班伏里奥则从他那浅水潭一样的眼睛和线条平和的嘴唇中流出一个淡淡的笑，玩笑似的欠身做了个鞠躬礼，抬起头盯着茂丘西奥有些圆钝的下巴说：“怎么会呢？我当然乐意。”

      -

      “班尼，回头。”不知什么时候，茂丘西奥落在了他身后，也许是几分钟前，又或许只是在刚刚。他叫住他，不轻不重的声音在落进他耳畔之前在空旷的教堂中回荡许久。等声音激起的余波也都一点点消停下来，班伏里奥才不紧不慢地转过身来。

      “咔嚓。”茂丘西奥本就被杂乱的卷发遮住一大半的脸在他双手的遮挡下只剩下从他拇指和食指围出的长方形取景框中露出来的一只眼睛和半边鼻梁，他的声音从那看不见来处的嘴巴中传出。班伏里奥从善如流地左右摇摆着摆了几个造型，然后提起挂在脖子上的卡片机，对准仍然站在原地举着手的茂丘西奥毫不犹豫地摁下了快门。

      继而班伏里奥就知道自己即将要面对的是一个近乎狂喜的茂丘西奥了。即使过了这么久，他还是不知道为什么这样小的一个举动会让他这么兴奋——早晨微焦的培根、误闯进门的飞蛾、街对面的房屋外新晾出的床单……他见过这种兴奋很多次了，每一次他都无法控制住自己不去问为什么，有时在心里，有时在口中。而问出口的那些时候也只会得到类似“相对于我来说，你太不擅长发现这些生活中的美好了，班尼”的轻佻回答，顺带一个脸颊上的吻。更多的时候则是在心里——“为什么？”“为什么？”“为什么？”然后脑海里的小人代替现实中的茂丘西奥得意洋洋地宣告自己的慧眼：培根边的焦脆、飞蛾振翅的声音、阳光在床单上投下的光斑……然后他才意识到茂丘西奥说的话全是放屁——拥有慧眼是一回事，而为此近乎疯狂的兴奋是另一回事。将这两者混为一谈就像认为身为服装设计师的班伏里奥会缺少这样发现细节之美的眼光一样是在放屁。所以在第不知道多少次茂丘西奥在这样的愉悦中搂住班伏里奥的脖子时，他在他把脸埋在他脖后之前打断了他：“好茂丘，我明白这很美，但我还是不明白你为何会这么高兴。”近在咫尺的人眨了眨眼睛，丢下一句高深莫测且恼人的“那就是你还没明白”便要继续将自己往班伏里奥身上贴。但那次他怀中的人没有继续撑着自己好脾气的形象，一撇嘴便将挂在身上的茂丘西奥推开了。

      这之后他便没再问过，但此刻他已经像曾经的无数次一样做好迎接他的准备了。茂丘西奥将耷拉在脸前的头发悉数向后一甩，一步并作三两步地窜上前来，攀上他的肩颈，也不吵着看方才拍下的照片，只是一边跟着班伏里奥的脚步往前走，一边兴奋地说着刚刚自己搭建起来的取景框里的他有多好看。班伏里奥也不打断他，只是每隔几个句子便发出一两声鼻哼当作回应。等茂丘西奥的声音渐渐小了下去，他才扭过头来，几乎是贴在他的脸侧，浅笑着问：“亲爱的大摄影师，听您描述了这么久，我现在十分急切地想看到我的这张照片。”

      茂丘西奥则一挑眉：“我的好模特，难道您刚才什么都没有看见？那看来我都白描述啦。”

      “我只看见了‘阳光下发着光的金发’、‘大理石地板里人的倒影’、‘竖直像柳枝的身躯’——可是啊，大摄影师，这儿既没有阳光也没有大理石地板。”班伏里奥摊开了手。

      茂丘西奥夸张地转了转眼珠，过了许久，等他们踏上最后一层楼梯，走上洒满阳光的塔楼时才姗姗来迟地开口道：“可是啊，我的相机里明明既有阳光，也有大理石地板。”

      -

      「你已经习惯了和茂丘西奥的这种相处方式吗？」

      班伏里奥稍稍将身子前倾：“指的是他会因为小事而激动吗？嗯，‘习惯’这个表述有些不准确，只是因为他确实一直都是这样的，所以我只是知道他会这样而已。”

      “但是一开始的时候，”班伏里奥调整了一下坐姿，重新靠在椅背上，金色的脑袋微微上仰，边斟酌词句边透过虚空中的回忆说，“最一开始的时候，我确实会因为自己没有办法接住他的情绪而感到有些焦虑。”
      「那现在这种情况得到改善了吗？」

      “当然。”班伏里奥几乎是不假思索地吐出这个短促的回答。过了半刻，他才缓慢补充道：“至少我是这么认为的。我们两个相处了差不多二十年了，不管怎样这种情况也该得到改善了。至少我能放松下来，明白我不用委屈我自己硬摆出一个我认为他希望得到的反应来，而是只是在他面前放松地做我就行了。”

      -

      “我希望他明白我没有在期望他会做出什么样，我只是想他做‘他’。”

      另一个备采间里，茂丘西奥这样说。

      “好吧，也许他现在看上去已经很好了。但是我想这依然不够……我有时候能感觉到，他在强迫自己配合我。”茂丘西奥烦躁地把头发抓到脑后，深吸了一口气，又将其轻轻地吐出来，看着高脚凳前方的地板说，“我真的，真的，真的不希望他和我在一起的时候是在勉强着自己。”

      -

      “这会儿太阳真不错。”一直很安静的埃勒诺舒服地眯起眼睛迎上西斜的太阳。她走到窗前，俯身向教堂下的城镇看去，转身说：“我们在这儿看完落日，再回民宿吃饭，怎样？”

      班伏里奥低头看了看手腕上的表，又将手垂下，顺着向下的视线盯着塔楼镌着浅色纹样的地板上清浅的阳光。过了一会，才抬起头来，夹在其他人的同意声中微笑着附和。

      节目组的工作人员搬来几张简易的露营椅，一字排开，张开放在塔楼窗前。维加率先挑中在边缘的两张椅子，一边拉开两张中更靠近中间的那张，一边轻轻拍了拍埃勒诺的肩，还转过身来招呼其他人坐下。莱亚便将手搭在维加身边的椅子的椅背上，回头看着还在犹豫的其他人：“要是你们都还没决定好的话，我就先抢占这个最受阳光青睐的位置啦？”

      “请便吧，”班伏里奥留出莱亚身边亚历山大的位置，绕到另一边坐下，戏剧性地抬起手遮住眼睛，打趣说，“即便这是挪威秋季罕见的阳光，我也还是打算先回避一下。”

      莱亚满不在乎地轻声说：“那你可就错过这个和夕阳正面亲吻的机会啦。”

      班伏里奥回以一个无声的耸肩。下一刻，他的双眼——所有人的双眼都被横穿城镇而过的尼德河面反射的橙黄色阳光所填满，干净得要融于空气中的窗玻璃之外，城镇在夕阳的笼罩下散发着一种人世之外的神圣感。许久没有人再说话，班伏里奥觉得自己微微胀大的瞳孔像吸水的海绵贪婪地想要把这一切都装进去。等落日的余晖快要散去时，他才回过神来，发现身边的亚历山大在无声地流泪。而莱亚半蹲在他身前，安静地拿着纸巾一点一点印去滚落他脸颊的泪珠。

      过了好一会，亚历山大摆摆手拒绝掉从四面八方递来的纸巾，一边皱着眉从莱亚手中抽出最后一张纸巾用力吸了吸鼻子，一边说：“你们看我干嘛？太阳都要落下去了。”塔楼里暖色的灯已经在不知不觉间亮起来了，却和窗外失去太阳后蓝得发黑的天空一起让人觉得有些寒凉。

      -

      “我刚刚听见萨沙和莱亚说——”在拖着步子从教堂离开的人群中，茂丘西奥偏头和班伏里奥悄声说。

      “偷听别人说话可不是什么好习惯——”班伏里奥看着茂丘西奥迅速往下撇的嘴角，转了转眼珠子，拉长声音说，“不过话又说回来，他都说了些什么？”

      “他说，他哭是因为他想起他们在一起的那一天，就是这样在公园的长椅上看了日落。”

      班伏里奥停下了脚步，转过身来认真审视着茂丘西奥平静的脸，试图在那上面找到一些能告诉他自己难懂的友人（爱人？）在想些什么的证据，一些能支持他说明对方在想他所想到的事情的证据。他们两个停在原地，很快又被这个拖拖拉拉的队伍落在了后面。茂丘西奥没有再多说什么，进入二十五岁之后的他似乎比二十当头的那个茂丘西奥拥有了更多沉默的时刻，但班伏里奥知道他只是学会了在一些场合下不把自己狂风一般的情绪表现出来——比如和自己相处的场合，比如这个场合。

      他抿起了嘴，再次张开时比话语更先出现的是一声被风吹散的笑：“我们一起看过的日落多了，我不知道你在说哪个。”茂丘西奥没有回答，只是扫了他一眼便低头将脚边的一粒石子踢到路中间，然后头也不回地往前走。

      班伏里奥不远不近地跟在他身后。茂丘西奥说的不是哪个日落，他知道。他们一起看过的日落多了——有纪念意义的多了，毫无意义的更是不在少数；绚烂的多了，马马虎虎算是见证了白天与黑夜的交替的也都历历在目；两个人看的多了，和罗密欧三个人一起看的也绝对说不上少。茂丘西奥只是要提醒他所有那些一起看过的日落而已。

      可是他难道看不到吗？即使在我们不再是爱人之后，我们仍然有可以一起看的日落。班伏里奥抬头看着身前正大笑着和维加交谈的茂丘西奥有些纳闷地想。

      -

      茂丘西奥在想他高中二年级时独自看过的一场落日。

      如果他在三人的小群里发出观景邀请的话，已经升上高三的罗密欧即使会在群聊中痛呼升学带来的学习压力，也会偷偷翘掉课后的补习班蹓跶到约定好的河堤上在某个时刻拍拍孤身坐着的茂丘西奥的肩膀；远在异乡上大学的班伏里奥不知道什么时候才能摆脱各式各样的辅料，打开手机上的通讯软件，边爬楼边或咸或淡地一条条回复两人的信息，也许还会在最后用命令的语气让他们交出他无法参与见证的家乡的晚霞照片——虽然最后极有可能会得到茂丘西奥“我忙着欣赏根本没拍”的回复。

      不过他最终还是没在通讯软件里知会另外两人，而是在高二年级放学后就跑到了河堤上，忽略了罗密欧在群聊里对学业的抱怨和班伏里奥象征“已读但没时间回复”的安慰表情包，拎上中午吃剩的半块三明治在河堤边从下午四点躺到天空失去了任何暖色，只剩下浓得像咖啡渣的深蓝的时候。

      他有些乏味地撑着下巴看着远处铺满大片深色色块的天空——他很难说他究竟是不是在“看日落”，也许他只是在望向那个地方，眼睛里看到的却是别的东西。像卖火柴的小女孩擦过最后一根火柴就在天边看到自己的祖母一样，每一次风把他的长发卷起来擦过脸颊、挡住视线的时候，他就越过所有的这些看到他小时候在蒙太古家过夜的那些场景——怎么说的好像班伏里奥和罗密欧都去世了一样？

      高二的茂丘西奥摇摇脑袋，抓起被扔在一旁的手机，囫囵收拾好装三明治的食盒打开通讯软件，承接住罗密欧因为没有在走出校门的时候看到在外迎接等候的茂丘西奥的哭诉。班伏里奥的头像在三人群组里静悄悄的，等茂丘西奥点进和他的私聊才发现对方不知道什么时候将头像换成了一片玫瑰色的天空——不知道什么时候拍的、不知道在哪里看到的、甚至不知道是不是天空，只是茂丘西奥愿意把它当成是一片玫瑰色的天空。

      — 我今天自己去看日落了

      他叼着刚从便利店里买到的酸奶，在和班伏里奥的私聊对话框里敲敲打打下这样一句话。

      — 是吗

      对面几乎是一瞬间就发过来这样两个字。茂丘西奥不满地翻了个白眼，刚要控诉对方的敷衍，下一条讯息就传了过来：

      — 我要看

      — 虽然我猜你没拍。

      茂丘西奥端着手机蹲在便利店门前，几乎调动了全身可用的肌肉才使得嘴里的酸奶没有在他嘴角抽动的时候掉出来。他的肩膀在无声耸动了好一会之后终于平静了下来，于是他重新摁下屏幕上的发送键：

      — BINGO

      哪有你不能在我身边陪我一起看还要我给你分享我看到的天色这样的好事？

      茂丘西奥对着输入框里最后这行字修修改改，然后站起身，将手指摁定在删除键上，边往家的方向走边感受着那行字在手机的震动声中一点点被竖直的光标推成平地。

      “想什么呢？”现实里的班伏里奥站在26岁的茂丘西奥的身后轻声说，“他们准备去餐厅吃晚饭了。”

      茂丘西奥从落地窗外的城景和回忆中回过神来，跟在班伏里奥身后往餐桌的方向走，走到一半没头没尾地说：“他们的街灯都是暖橘黄色的。”

      “嗯。”

      “有点像落日的颜色，”茂丘西奥低低地笑了一声，“像太阳在等谁回家一样。”

      -

      “好啦，”维加环视了一圈餐桌上被吃得只剩下零星酱汁的盘子，一拍手拿出吃饭前节目组递来的任务手卡，轻快地说，“接下来是我们的餐后小游戏环节——”

      「“异口同声”游戏，规则如下：

      节目组会提供几个具有概括性的词语，如颜色等，两位嘉宾在互不商量、限时三秒内说出脑海中想到的第一个属于该词语门类下的一个具体词语，如颜色中的黑色等。只有当嘉宾中的两人说出了相同的词语，才积一分。游戏一共进行三轮。」

      “提问——最后的胜者有什么奖励呢？”

      “获得明早的早餐的决定权怎么样？”埃勒诺眨了眨眼，从长桌的最边缘侧过身来看着其他几人说。
      维加像是突然咬到了舌头一样突然坐直了身子，扭头看看身边的其他人又看向另一边的埃勒诺，遮挡了其他人得以目睹到她一闪而过的狡猾神情的视线。因此，众人纷纷点头答应下来。

      「第一个词语是：季节。
      三、二、一——」

      “夏天。”班伏里奥和茂丘西奥异口同声地说。

      两人平静地相视一笑，茂丘西奥伸手轻轻拍了拍班伏里奥的背。班伏里奥则不动声色地朝茂丘西奥的方向靠近了些——他还记得曾经在他状态最糟糕的那些夏天，他总是很排斥靠近茂丘西奥。他是很怕热的人，茂丘西奥那头杂乱的头发会变成那些毛躁的毛线衫缠在他身上，让他全身热得像火炉，即使只是靠近，即使只是看着。“其实这个还挺难的，虽然只有四个答案，但每个答案里都有很多——”班伏里奥歪了歪头努力寻找着合适的措辞，不过他最终也没有找到，只是无意义地摆动着手臂。他无奈地笑了：“我感觉倒数的那三秒里每一个季节都在我脑子里嚷嚷让我选它。”

      “那为什么最后选了夏天呢？”亚历山大问。

      班伏里奥低头沉吟了一会，刚想要回答时他身边的人突然说：“我的话其实没有为什么，只是我喜欢夏天。嗯虽然班伏里奥总是说我秋冬的衣服比夏天的好看，但我就是喜欢夏天吧。”茂丘西奥耸了耸肩，扭头看向坐在身旁的班伏里奥：“我倒是没想到你也会说夏天。你不是更喜欢冬天吗？”

      “因为你应该会说夏天吧。”

      “那万一我说了冬天呢？”茂丘西奥皱起眉头。

      “你这不是没说吗，”班伏里奥笑了，“好吧，而且你不是也觉得我会说夏天吗？”

      -

      「班伏里奥在玩游戏的时候说了“夏天”，会让你觉得意外吗？」

      茂丘西奥在备采间的长椅上别扭了好一会才抬起头来说：“意外倒是说不上意外。就像他说的每一个季节都很值得选，毕竟我们认识那么久了，发生过的事情散落在每一个季节里，所以不管他说哪个季节我都能为他想到理由的。但是——”茂丘西奥再次把头偏到一边去，摄像机取景框中只能透过他海藻一样的头发看到他有些紧绷的侧脸。等到他重新将脸摆正时，他的眼神中充满着一种莫名的怒气：“但是他为什么总是要这样？总是显得他是在照顾我一样。就好像夏天除了是他认为我会说的答案之外对他而言没有其他意义一样。”

      -

      「第二个词语是：礼物。
      三、二、一——」

      “戏服。”这次只有茂丘西奥一个人回答问题的声音，班伏里奥则半张着嘴没有出声。过了半刻，他才双手合十笑着道歉：“抱歉，刚刚那几秒我真的没想到要说什么。”

      茂丘西奥有些不可置信地瞪圆了眼睛扭头盯着他，语气中还流露出一些能够被人轻易捕捉到的委屈：“可是我明明送过你很多礼物。你不要说什么‘送的太多了所以我选不出来’之类的话，我会将其视为你认为所有的那些礼物都是平庸之辈的证据。”

      “那不如我们让班伏里奥再想一会？你和我们说说戏服的故事怎么样？”

      茂丘西奥这下才将自己方才周身散发出的不满收敛起来：“我大学毕业的时候班里组织毕业大戏，然后因为我的角色是那个剧本里面原来没有的角色，所以我们拿不定穿什么样的戏服好。我有一天和他提了一嘴之后，结果第二天他就带着戏服的草稿和黑眼圈来找我。”说完，茂丘西奥带着些挑衅地回头看了班伏里奥一眼：“你现在想好了吗？我给你一个补救机会。”
      “其实认真想过之后更难说了吧——”

      “那刚刚容易说的时候你也没说出口啊。”

      “那我说‘安迪’吧。是之前茂丘西奥送我的一盆绿萝。他强硬地要求我摆在工作室里，希望它能监督我注意用眼。”

      茂丘西奥抱起双臂，摆出一副严苛的考官的审视样子，眯起眼睛上下扫视了班伏里奥许久，才说：“行吧，勉强算你合格了。虽然我其实觉得你带眼镜也很好看，但你要是不带眼镜就看不清我的话我会不爽的。”

      「那么最后一个词语：地点。
      三、二、一——」

      “舞厅。”

      “河边的公园。”

      班伏里奥夸张地叹了口气，摇摇头说：“到头来我们两个只能有一分吗？河边的公园？”

      茂丘西奥挑了挑眉毛：“我们小时候在那里有一个秘密基地。舞厅是高中的那个舞厅吗？”

      “对，我刚上高中的那年的万圣节舞会，我没有舞伴也没有什么很熟的朋友。我都忘了我当时和你们抱怨过这件事了，所以后来你们突然出现在高中部门口，还很夸张地在我们班门口行礼让我答应你的舞伴邀请的时候，我真的吃了一惊，”说到往事，班伏里奥有些不好意思地捂住了脸，“说起来，我没有想到你会那么喜欢那个秘密基地。我记得它建成三天之后就被我们抛到脑后了吧？”

      茂丘西奥做了个鬼脸，语速飞快地说：“当然了，因为当时只有我一个人关心这个秘密基地！你们两位只一直站在一边说着为什么不能在家里为什么非要在外面看不惯这看不惯那。拜托，小孩热爱探险的天性呢？在家里还怎么叫探险？”

      “好了好了，算我求你快别说了。”班伏里奥被茂丘西奥怪里怪气的语调逗得笑红了脸，伸手就要捂住那张仍要不断往外吐露自己童年窘事的嘴。最终在茂丘西奥要讲到他上小学时还会把鞋子穿反前，班伏里奥成功用“茂丘西奥有一天突发奇想把所有的头发打成了没有人能解开的死结最后隔天就被大人拎去剃了光头”作为要挟让他停了嘴。

      “好吧女士们男士们！我们最后的结果是两位男士和两位女士组合都获得了一分的佳绩，并列第二，”从笑声中艰难直起腰的维加走到桌前宣布，“而我们的一男一女组合以两分的优势拿下了第一名，恭喜！”长桌上响起稀稀拉拉的掌声，维加接着说：“我们明天会赶一天路，先自驾到博德，再在博德坐渡轮抵达罗弗敦群岛。然后我们预计早上八点半出发，大家今晚都早点休息吧。”

      “最后——”她狡黠地朝莱亚和亚历山大眨了眨眼，“辛苦游戏的获胜者们早起帮大家定早餐了。”

      亚历山大靠在莱亚肩上，有些不可置信地瞪着维加和埃勒诺。后者则回以一个无辜的眼神：“你们都同意了的。”

      亚历山大扭过头来看向莱亚，短发的女孩只是无奈地笑着摊开手：“我们确实同意了的，尽管我对于这其中的不公平也十分不满，但总要有人来买早餐的不是吗。”她拍了拍亚历山大的大腿：“好了，我们早点休息吧？”

      -

      房间的另一边，刚结束后采的班伏里奥被茂丘西奥拉到门柱旁。站在阴影里的茂丘西奥吸了几口气，像第一次站在舞台上的新人演员——即便当时的茂丘西奥没有这样做过。挂在墙壁上的钟沉静地带着它的咔哒声走了几步，他才开口说：“班伏里奥”，他有些被自己声音中的严肃惊到了：“你有没有觉得我们一直在演戏？”

      秒针又走了几个来回，班伏里奥不肯示弱地端住对面审视的目光，也沉默地回望过去。不知道过了多久，他才呼出了长长一段气，毫不掩饰声音中的疲倦，说：“是啊，而我要说这场戏是你先开始的。”
  - title: Day2-3
    body: |-
      “Hello，两位先生上午好，我是这次负责‘海报拍摄’的摄影师，可以叫我尤利。昨晚在船上休息得还好吗？”铺满柔和的奶白色大理石地板的房间外一个身着亚麻色棉布长裙的女孩正端着摄影机温和地和两人打着招呼。此时他们正身处的中型渡轮已经在半小时前缓缓停靠在了罗弗敦群岛南部的港口。在这之前，他们一行人经历了将近十二小时的自驾行程，以搭乘上他们脚下这艘从博德的港口出发的轮船。

      得到两人肯定且客气的回答后，尤利微笑着忽略掉茂丘西奥显然还没有完全从睡梦中清醒过来的咕哝，一边将两人往房间里领一边继续介绍道：“我们一会将要进行的是我们这次节目的海报拍摄环节。然后现在在房间中央的，是我根据你们的关系现状做出来的一个用于拍摄的装置——”

      房间里赫然摆着的是一对相邻平置着的接近一米高的白色空心圆台，它们正大敞着口面对着几人，走近看还能看见在封了口的那一头上，有一根绳子将它们连在了一起。“这是一个大型的纸杯传声筒，就像我们小时候科学课本里讲过的实验装置一样，”尤利站在一边为两人解释道，“你们小时候有玩过这个吗？也许你们对它还有些印象？”

      “当然，”班伏里奥点点头，和气地笑着说，“我们第一次看见它的时候还挺激动的，不过后来，我们就像所有喜新厌旧的小孩一样，很快地把注意力从那上面转走了。我记得那是——我十岁的时候，是吗？”他微微偏过头去看茂丘西奥。而茂丘西奥却只是耸耸肩，含混不清地说：“我没什么印象了。”班伏里奥无奈地摊开手：“像我说过的，‘喜新厌旧’，不是吗？”

      茂丘西奥却在听到这句话时像是突然醒过来了一样。他从班伏里奥身边撤开，皱起脸问：“你在指责我吗？”

      “什么？不，我当然——”

      “你当然有，”茂丘西奥几乎是咬牙切齿地说，“我每一次这样问的时候你都在说‘不’、‘才没有’之类的屁话，所以我每一次也就装作没看到了。但听着，我现在要说，你生气了。你因为我忘记了你觉得值得纪念的事情，所以你生气了，不是吗？而你从来不告诉我。为什么？”他微微抬起头恶狠狠地瞪过去。

      班伏里奥先是被对方突如其来的愤懑冲得愣了神，随即他一向温和的面容在一瞬间几乎要露出一条裂缝来，但只是一瞬间。他深吸一口气，努力保持语调不受那股隐隐而来的气愤的影响——但当气流颤抖着流经他喉口时，他就意识到自己失败了：“我不明白，你为什么这么肯定我生气了？难道你宁愿认定我在生一些莫名其妙的气而不肯告诉你，也不愿意相信我说的我就是没生气？”茂丘西奥看着面前的人绞在一起的眉眼，尽管有些不知所措的扭过头去，仍梗着脖子，不肯示弱。不知道过了多久，他听见班伏里奥重重叹出一口气，低声说：“上帝啊，你真是太傲慢了。”

      一时间，房间里几人相顾无言。过了一会，尤利才按照耳机里给出的推进指示小心翼翼地打断了这份安静：“我们现在就开始吧？我们可以试着走近一点，看看你们有没有什么想法。”两人顺从地上前去，站到其中一个“纸杯”的开口处，这时他们才发现这个装置的边缘还很细致地做了磨损泛黄的做旧工艺。

      茂丘西奥扭头看向纸杯深处，然后像是要抗拒什么似的向后退了一步，笑着说：“站在这儿，总感觉像是有一个喇叭一直在我耳朵边嚷嚷一样，我快要被震聋了。”

      尤利捕捉到他话语中的关键词，眨眨眼，问：“你觉得自己经常是承受对方的指责的那一个吗？”

      班伏里奥抿了抿嘴，本能地想为自己辩护，最后却没有出声，只是静静地看着茂丘西奥。“指责也说不上，只是建议吧，”那人捋了捋自己的长发，“不过有时候那些建议听上去也不那么令人舒服。”

      “可是有些时候，你也并不会按照我的那些建议去做。”班伏里奥犹豫着开口说。

      “是的，有些时候——大多数时候，我还会责怪你太过扫兴。但那些话已经说出口了，我已经听到了，不管我会不会按照你说的做，我都会感到不舒服的。”茂丘西奥站在一旁苦笑着说。

      “你感到不舒服，因为我给你提建议？”班伏里奥抱起手臂，“还是说，是因为那些建议打扰了你去实施你自己的那些‘好计划’，所以你才感到不舒服？”

      茂丘西奥先是怔住了，但他很快反应了过来，脸上的表情便像台风过境一般——悲伤、愤怒、嘲讽……所有的情绪揉在一起，最后化成无声的大笑。他蹲在地上，肩膀颤抖了许久才撑着膝盖站起身来，撇掉眼角不知来处的眼泪，抬头盯着班伏里奥，露出一个讥讽的笑，说：“天呐，你说我傲慢？班尼，听听一直以来你都在说些什么！你有哪怕一次敢用耳朵用心而不是用鼻子用下巴来听听我在说什么吗？你说我傲慢？嗯？你说我，傲慢？”

      班伏里奥皱起了眉，铁青着脸看着面前重新蹲坐到地上的人说：“那你倒是说说你为了什么感到不舒服。”
      “也许等你放下你那莫名其妙的偏见的时候，我会说的。”茂丘西奥的声音从自己捂住脸的双手指缝间闷沉沉地传出来。

      -

      「你们前一天早上的围巾那件事后来怎么样了？」

      “围巾那件事吗，”茂丘西奥挠了挠头，“后来我还是把围巾带在身上了，但我没有围起来。”他耸耸肩继续说：“而且我们一直在车里，根本也不需要戴围巾吧。”

      昨天早上，两人提着拉杆箱准备出门时，茂丘西奥注意到班伏里奥正有些不悦地看着自己。他先是下意识地以为自己的头发上又沾上了牙膏，草草检查了一番排除这个可能性后，他才抬头问：“发生什么了？”

      班伏里奥揉了揉已经不动声色向上隆起的眉心，反问道：“昨天晚上我放在你衣服上的那条围巾呢？”

      茂丘西奥不自在地摸了摸自己空荡荡的脖颈，刚要开口解释，就被班伏里奥有些不耐烦的声音打断：“我昨晚不是和你说了今天风会很大吗？难道你就这么想要偏头疼？”此时他已经放弃了用手捋平眉头的无用功，取而代之的是张开那只宽大有力的手摁压着他脑侧的太阳穴。

      茂丘西奥抿起嘴，他想说那条围巾就在背包里，风大的时候能随时拿出来，但他卸下嘴边的力，什么都没说。也许是因为被迫的早起让他不像以往一样富于回应对方的精力，也许是出于另一种更深邃的疲惫，他宁愿是前者。维加的催促声适时在门外响起，他便抓起手边的背包，拎着行李箱不发一言地走出了门去。

      “退一万步来讲，”在备采室里，像是要偿还当时没对班伏里奥说出口的话一样，茂丘西奥不满地撇了撇嘴有些怨怼地说，“行李箱他已经收拾好合上了，我就算再不喜欢那条围巾，要把它塞进箱子里不是也太麻烦了吗？我只能放进随身的背包里啊，我还能扔掉不成？”

      他停下因愤懑而不断挥舞的双臂，安静了好一会才轻声说：“他就是太想所有的事情都按照他的控制发展了。”

      「我注意到你前几次开车的时候好像习惯开窗，但你昨天好像没有打开，是吗？」

      “是吗？我好像没什么印象了。那也许就是昨天风确实太大了吧。又或者是班伏不想开窗，他偏头痛起来也很要命。”

      「这种情况经常发生吗？」

      “你们是说他管我、我又不听他的这种情况吗？”茂丘西奥眨眨眼，然后莫名颇有些得意地笑了：“与其说是经常发生，不如说这是我们相处的方式，几乎从我们见面的那一天起我们就是这样相处的，可能一直到现在都没有改变过吧。但是——”

      -

      “——但是其实我知道，我们之间有些东西是改变了的。我知道，因为改变的是我，但我不知道茂丘西奥他又没有察觉到。”在另一间备采室里，班伏里奥抱着胳膊有些严肃地说。

      「这个改变有什么契机吗？」

      “有，当然，”班伏里奥点点头，犹豫了许久才看着对面的工作人员说，“但我不确定这件事是否适合现在说出来，我不确定他想不想告诉别人……”

      「他向我们提到过一次打架斗殴的事件。」

      方才一直紧绷着脸的班伏里奥顿时露出一个无奈的苦笑：“也是，他应该自己也会提起来的——是的，我觉得我改变的契机就是这件事。”

      当班伏里奥在他外出写生的某一天接到罗密欧火急火燎的简讯，告诉他茂丘西奥在街头打架斗殴并因此受伤住进了医院时，他脑子里第一个念头只有“这像是他能干出来的事”。而在友人哭得上气不接下气又绘声绘色地对于伤情的描述中，他的大脑才终于缓慢地从眼前平和宁静的美景中苏醒了过来，于是他的第二个念头是：走之前我明明叮嘱过他别在这期间去找别人的麻烦。

      也因此，在他用无数次曾经茂丘西奥打过架后身上那些看似吓人但绝不致命的淤青和擦伤安慰自己之后，他面对躺在病床上缠满雪白绷带的茂丘西奥时，脸色实在说不上和善。

      “嘿，我的好班尼，你终于回来啦。”病床上的人有些艰难的扭过头去盯着他说。

      班伏里奥紧紧抿起嘴，过了好一会才憋出一个反问：“我不是让你别去吗？”

      茂丘西奥摇晃着他的脑袋，似乎还没有习惯长发被绷带包裹起来的感觉，咯咯笑着说：“你每次都让我别去，可我每次不都还是去了？”

      后来班伏里奥才从几位当事人添油加醋的讲述中大概还原出一些事件经过来——总之就是不知怎的后脑勺磕到了桌角，又不知道从哪里飞来一只玻璃花瓶，也许还被某个高大的盆栽压了腿。这里划拉一下，那里擦伤一道，回过神来，茂丘西奥已经在医院里躺了半个月，拆开绷带时原本细腻光洁的身体上找牙舞爪着好几道惹眼的疤痕。

      “从那之后我大概就有些变了，”坐在采访室里的高脚凳上的班伏里奥沉思了一会，从回忆中抽离出来回答说，“脑子里好像突然就有了一个声音，一直在提醒我：不这样的话他会受伤，或者——会死。我想我大概是有点过度紧张了。”他耸耸肩，若有所思地看着地面。

      -

      站在一旁的尤利看着两人都正各自消化着刚才激昂的情绪，轻声说：“也许你们现在心里都有一些对这个装置和自己的定位的看法了，我们要不先来看看？”

      茂丘西奥最先行动起来，他走向另一个传声筒，整个人横着侧躺在了筒外，大有一副不愿向听筒中传来的那些声音屈服的意思。

      尤利看着仍站在原地没有动的班伏里奥，试探着开口问：“你们两个认识这么久了，你了解他对于这些事情的态度吗？”

      班伏里奥点点头，露出一个复杂的笑：“我知道你想要问什么。你是不是想问为什么我明明知道他不爱听我却还要说？事实上，昨天有另一个嘉宾也问了这个问题。”

      前一天中午，所有人聚在一起吃午餐时，埃勒诺这样问。当时的班伏里奥缓慢地眨了眨眼，告诉她可能只是自己习惯了而已。

      “那你有想过打破这个习惯吗？”埃勒诺追问。

      班伏里奥摇摇头，嘴巴张开又合上，沉思片刻才有些迷茫地说：“我应该这样做吗？”

      埃勒诺没有回答，只是向前探出身子看了看班伏里奥身边的茂丘西奥。显然他还在因为早晨的事情生着闷气，正一言不发地用叉子戳着餐盘里的小番茄，像是完全没听到身旁正在进行着的对话一样。

      “那你现在是怎么想的呢？想试着换一种相处方式吗？”尤利端着相机问。

      班伏里奥缓慢地开口说：“我昨天其实一直在想这件事。其实也许我是想改变的，但同时我也不确定我会改成什么样，我们的关系又会变成什么样。”

      “所以你的意思是你还是不想改变？”躺下之后就一直没吭声的茂丘西奥突然尖锐地插嘴说。他直起身子，幽绿色的眼睛紧紧盯着站着的家伙，仔细看能从中找到一丝怨怼。

      班伏里奥轻轻叹了口气，走到另一个外敞的传声筒里面，背靠着装置光滑的内壁屈腿坐下，扭头看向黑洞洞的筒底，说：“如果你想的话，我会改的。”

      尤利见状，轻巧地摁下了手中相机的快门，留存住了茂丘西奥脸上一闪而过的迷茫。“也许，除了那些可能让你们感到不愉快的建议之外，这个传声筒还能让你们想到别的东西吗？”

      “比如童年吗？我看到它的时候就想到了，”班伏里奥重新搭着巨大的装置站起来，一边用手比划一边说 ，“一开始我们知道它的时候，我们想用它做一个‘伸缩耳’，就是《哈利·波特》里的那个，可以把一个纸杯悄悄放到会客厅之类的地方，然后我们拿着另一只纸杯躲在我们的地盘偷听大人说话。”提到小时候幼稚的行为，班伏里奥有些不好意思地笑了，他捏了捏鼻梁，继续说：“不过最后我们失败了。想来这样简陋的装置只有把嘴巴对在上面说话才能让对面的人听清吧。”

      不知道什么时候，茂丘西奥也从地上站起身来，安静地扭头看着身边的人。班伏里奥没有理会这边的动静，只是自顾自地继续说：“即便如此，我当时还是很着迷于这个小东西，可能我是最着迷的那一个吧。因为，怎么说呢？它给我一种‘这是只属于我们之间的秘密联络方式’的感觉。现在想想，还是觉得没有办法抵抗它的诱惑啊。”

      “我当时也很着迷的，你不记得了。”茂丘西奥抱起胳膊，微微鼓起嘴，突然说。

      班伏里奥挑了挑眉：“你明明刚刚说你对它都没什么印象了。”

      “现在有了，被你的描述勾起来的。”他轻轻拍了拍身边的圆弧形装置说：“我做了一个很长的传声筒，这样我就可以在你们家楼下抓着一边把另一边扔给你们，你忘了吗？”

      班伏里奥有些讶异地微微张开嘴，面露遗憾。茂丘西奥继续说：“那时候我总是用那个在楼下喊你们下来玩。现在想想，这是不是有点像乐佩和葛朵？”说着他便笑起来。

      “说到这我倒是想起来了，”班伏里奥看着面前沉浸在回忆中的人笑着说，“后来你还总试图让我拽着我那边的纸杯把你拉上来，想来那时候我们大概确实沉迷于莴苣姑娘的故事了。”

      “而你没有一次应下我的请求。”

      班伏里奥耸了耸肩，故作神秘地笑了，告诉他其实自己试过了，在某一次茂丘西奥在楼下使尽浑身解数说服他的时候——“我拽了一下——可能是被你说烦了，但我没有告诉你，不过那时你也没有察觉到。”

      茂丘西奥愣了好一会，才有些遗憾地说：“那看来我们做不了高塔上的长发公主了，一直到初中我都还对这件事情耿耿于怀。”

      这时，尤利拿来两红两黑四支白板笔，递给两人说：“我们为每个人准备了一支红笔和一支黑笔，现在你们可以用黑笔在这个装置的内壁写下小时候用传声筒时最经常听到的对方说的话。”

      “具体写在纸杯的哪里呢？”班伏里奥问。

      “由你们决定。”

      这次最先开始行动的人变成了班伏里奥。他转身走进大型纸杯的深处，在靠近纸杯底部的地方大手一挥写下好几个环绕着内壁的大字。在嘎吱嘎吱的写字声中，茂丘西奥的嗔怨声不远不近地响起：“他应该比我好写一点，毕竟我说的话比较多，而不管我说什么他回的都是——”说着，他突然瞪大了他的双眼，手上不断开关笔盖帽的动作也停了下来，一边喃喃着“我知道了”一边转身。他侧身趴进另一个传声筒里，用左手把上半身撑起来，右手则留下了一道龙飞凤舞着从杯子底部蔓延到外围的黑色笔迹。

      “我写的是——‘您的骑士已经抵达，请速速前来迎接’和‘快点下来’。”班伏里奥边笑边说。

      茂丘西奥则在一旁涨红了脸：“我顶多说过一次——或者两三次！在我还在看童话故事的时候！”

      “好吧好吧，那你至少说过‘快点下来’，或者其他类似的吧？”

      “但这可不公平，你公报私仇，”茂丘西奥赌气地把脸别开，“早知道我就把你写的那些情诗写上来了。”

      “我可没写过那种东西！”

      “你写过！你还用传声筒朝我喊过呢，你想听听看吗？”茂丘西奥微微将脸转过一些角度来扬起下巴斜睨着班伏里奥，清清嗓子深吸一口气就要开口：“你那玫瑰色的面庞——”

      “停！我知道我的不是了，好茂丘，我认输了，求你停下来吧。”这会脸上的红晕像是从这黑发边的脸颊偷跑到那金发边的脸颊上一样。班伏里奥一只手捂着自己通红的脸，另一只手盖在茂丘西奥仍不打算消停的嘴巴上，做了一两个深呼吸，说：“我去把那句话擦掉，你也别再念诗了，好吗？”

      茂丘西奥满意地笑了。他看着班伏里奥恳求的眼神，吊胃口地摆出深思熟虑的样子，过了好一会才破了功似的笑出声来，说：“好啦班尼，别擦了吧，就让它留在那儿吧。”

      班伏里奥感激地眨了眨眼。这时他才想起来手中还有一支红笔，便扭头问站在不远处端着相机的尤利：“那这支红笔是用来做什么的呢？”

      她朝两人走近了点，说：“现在请你们想象自己正像小时候那样用这个传声筒通话，并且用红笔写下你想对对方说的话，同样写在内侧。”

      “有什么场景吗？就干想？”茂丘西奥已经重新趴进了传声筒中，此时又探出个脑袋问。

      “没有场景限制，所以可以好好想一下你们最想对对方说什么。”

      这次两人的写字声都犹豫许久才颤颤巍巍、一划一顿地响起来。尤利一边调整着相机的参数和角度，一边默默观察着两人的行动。茂丘西奥写完后便一言不发地从传声筒里钻了出来，蹲在一旁听着另一个传声筒里传来的嘎吱声。等另一边隔着光滑的白板壁闷闷地传来班伏里奥的“我写好了”时，尤利才开始问茂丘西奥写了什么。

      这次茂丘西奥的字迹不像第一次一样龙飞凤舞。从杯口朝里看去，就能看到在和黑色字母相对的另一边上与它几乎平行的红字，只不过这次字迹的方向是从杯口向杯底延伸，上面写着——我在这里。

      尤利没有说什么，只是看向身边低着头不知道在想些什么的班伏里奥，问他写的是什么。

      另一个传声筒里，在原先环绕杯底的黑字之外盘踞着一块红色的笔迹，从字母间平直突兀的转折和墨水的顿挫处能看出他写字时的犹豫。“‘我迷路了’，”班伏里奥挤出一个轻飘飘的笑，说，“我犹豫了很久是‘我’还是‘我们’，但后来决定还是只有‘我’。”

      “能具体说说吗？‘迷路’是什么意思？”问题是尤利提出来的，茂丘西奥的眼睛却紧盯着他。

      “就是，可能有点像走进了那种镜面迷宫，”班伏里奥抿了抿嘴，“我和他从朋友变成了恋人，但我不管怎么看却都只能看到镜子里照出的曾经的样子，我有时候不知道我在做什么，也不知道我能到哪里去。” 

      “可是我在这里。”与班伏里奥缓慢得像海面上随波飘荡的船只一般的语气相比，茂丘西奥横插进来的话语显得有些急促。他的胸口波浪似的起伏了好几下，才继续说：“可是我就在这里，我在你身边啊。”

      班伏里奥看着茂丘西奥恳切的眼神，叹出一口气，摇了摇头。

      -

      结束轮渡上的海报拍摄时已是中午时分了。众人收拾好自己的行李，踏上码头准备前往午餐的餐厅时，迎接他们的是迎面刮来的凉风。而当他们重新整理好视线，不远处洁白的冰川，幽绿的苔原，和宁静宽广的海面便不由分说地涌入他们的视野——他们站在了罗弗敦群岛的土地上。
  - title: Day3-4
    body: |-
      对于一个对壮丽的自然风光和维京捕鱼文化都兴致缺缺的人来说，他们在罗弗敦群岛的第一站显然不是一个说得上有吸引力的旅游地。不幸的是，这个团队中有将近一半的人都表现出了这样的倾向——茂丘西奥站在六人面对着奥镇的渔村博物馆中的讲解员围起的扇形的外围，对着同样面露乏味之色的维加挤了挤眼睛。

      -

      “我发自内心地佩服他们，”采访间里茂丘西奥这样说，“我当然知道那些景色很美很震撼人心，但我除了简单地在心里感叹一下之外思绪就飘到其他事情上去了。但班尼不一样，他会——”他歪了歪头，不消停的手大概和他此时正在飞速转动的大脑一样，搜寻着合适的用词，但最后似乎也不了了之。

      “他会看进去，”茂丘西奥把最后那三个字咬得很重，“就是真的像把他见到的那些景色化成他身体的一部分一样。说不定过不了多久你们就能看到他新推出的维京系列服装。”

      他有些骄傲地继续说：“他就是那样的人。也许面上不显，但我总觉得就算是木板的一个霉点都能变成他的灵感。”他又皱着眉思索了片刻，随即笃定地说：“他很细致，也一直这样细致入微地感受着生活的每一个角落。”

      「你爱他的“细致”吗？」

      听到这个问题，茂丘西奥先是不解地皱了皱眉，随即联想到一天前和上午在渡轮上自己和班伏里奥那场关于“建议”的纠纷，苦笑着说：“这世上可没有那么容易遂人心愿的事，对吗？我爱他，可他的那些关心有时候却让我痛苦。”

      他顿了顿，像在考验自己的真心一样。最终他浅浅吸了口气，开口道：“但我想我还是爱他的那份细致的，因为我爱他。”

      -

      “没想到你也对这些不感兴趣。”在又一次讲解员背过身领着六人往博物馆更深处走时，维加用气声和茂丘西奥说。

      茂丘西奥耸了耸肩：“博物馆从来不是一个足够‘茂丘西奥’的地方。”

      “同样，它也不是一个足够‘维加’的地方，”维加做了个鬼脸，“但看起来，他们都对此饶有兴致啊。”茂丘西奥偏过头去看她，即使被脸侧的长发着去一半，她面容中的惆怅还是从那双若有所思的眼睛中流露了出来。茂丘西奥眨了眨眼，安静地等着她接着往下说。

      维加叹了口气，肩头一耸一落：“埃利她一直都很喜欢来这些地方。一开始的时候，我还会陪着她一起去，即使我对这些都不感兴趣，只是待在她身边我也会觉得很——该怎么说呢——很值得吧。但不知道从什么时候开始……”

      维加跟着人群继续往深处走，再一次站定时，她的肩膀似乎沉得更低了。她看着不远处那头醒目的红发，用几乎只有自己能听到声音说：“但不知道从什么时候开始，我们都默契地觉得不再有这样做的必要了。”

      茂丘西奥不好再说什么，只是同情地轻轻拍了拍她的肩头。

      班伏里奥是一个像维加口中的埃勒诺一样总喜欢待在那些或明亮或幽暗的、有着截然不同的装修风格的场馆中目视着那些或千奇或无趣的馆藏的人。茂丘西奥则从来没有在他面前掩饰过自己对此的排斥。很多次他传短讯问对方现在在哪的时候，对话软件另一边的家伙就会隔个几十分钟不紧不慢地扔出某一个博物馆或美术馆的地址。然后过不多时，那个地址里就会多出一个几乎是有些横冲直撞的，嘴角不悦地下弯的人。幸好在绝大多数时候馆内的人并不会太多，不至于真的撞上什么人。但那人脸上的不满却好像他面前真的有人山人海，隔绝着他的目的地。不过有时这样不满的神情也会出现在馆外——长椅上，台阶上，或是干脆就在出口旁的地面上。

      班伏里奥也很快习惯了在这样的日子里安抚一个因等待了太久而心生怨气的爱人。他自认是那种适应能力很强的人，因此当茂丘西奥不再在这件事上折腾的时候，他也几乎是在那一刻就接受了。那天他在展览的出口前等到工作人员第二次即将闭馆的提醒才动身离开。他在走回和茂丘西奥的合租屋的路上发现自己把那段冗长的结语背了下来。他由着一些说不清道不明的情绪游荡在心头，就这样推开了合租屋的门。茂丘西奥侧躺在沙发上看剧本，听见门响动的声音便将将抬起头来，埋怨他今天回得好晚。班伏里奥合上门，随手拉开餐桌旁的椅子坐下，边掀开面前温热的晚餐上的保鲜膜边说：“我和你说了我在美术馆。”沙发那边传来翻页的声音，茂丘西奥过了半刻才说：“对哦，你总是在那里待很久。”然后班伏里奥发现自己那些混乱的情绪不见踪影了，他又恢复了平静，因为他早已适应了茂丘西奥那些天马行空的想法的倏起倏灭。

      -

      在回程的房车上，一向安静的埃勒诺罕见地主动开口问：“你们觉得，你们还爱对方吗？”

      莱亚和班伏里奥交换了一个眼神，摇摇头回答：“我不知道。”班伏里奥则坐在另一边抿起嘴来不置可否。两人都不约而同地看向红发的女孩，明白她有满腔的心事将要诉诸于口。

      坐在另一边的埃勒诺则长长呼出一口气，头躺在臂弯里看着车窗外的景色说：“我一直爱她，我也知道她一直爱我。但不知道从什么时候起，我们好像都觉得不再有一起生活的必要了。”

      “为什么会这样呢？”莱亚问。

      “因为一些琐碎的分歧和无法达成的期待吧，”埃勒诺活动了一下脖颈，将头偏向另一边，用戏谑的语气说，“她希望我能按时吃饭、出门交些朋友、多补充维生素D之类的。我希望她能够不要那样看我——就好像我是一个亟待改进的人。这些期待我们都做不到，继续在一起简直是互相折磨啊。”

      “可是你们还爱对方啊，就这样分开不会很可惜吗？”班伏里奥有些不解地问。

      “也许就是因为爱对方才不忍心看她在这段关系里受折磨吧。”莱亚轻声说。

      埃勒诺重新坐直身子，肩膀却还是矮着相对笼起，不置可否：“不管还爱不爱对方，只要这段关系不能再让我们感到愉悦了，不再有存在的必要了，我就要结束这段关系——我一直是这么想的。但是等真的走到了这一步，还是难免觉得唏嘘。”

      班伏里奥点点头，在一天之内第二次想起来那些被茂丘西奥疯狂地孕育出来又很快被舍弃掉的“浪漫念头”，说：“看起来人们对失去价值的事情实在没什么容忍度，是吗？”

      他没有料到自己语气中的僵硬，按理来说，作为茂丘西奥多年的好友和那么几年的恋人，他早就习惯了他的那些天马行空，这也意味着他不应该对此心存怨怼，按理来说。如果你已经知道了事情会变成这样，而你依然不肯放下你可笑的侥幸心理选择往火坑里跳，那么你就不该为火焰烧灼你的身体而感到失望和怨恨。班伏里奥这样对自己说。

      房车里的两人和无处不在的摄像机都正看着自己，班伏里奥只能一边祈祷自己的神色如常一边继续往下说：“茂丘西奥总是突然冒出很多新奇主意，然后过不多时便把它们抛之脑后。也许他也觉得那样做没有存在的价值吧。”他环起手臂，故作轻松地笑了笑。

      -

      “嘿。”班伏里奥独自坐在民宿面向一座雪山的的露台上，突然感到自己的手臂被轻柔地碰了碰。他扭过头去，不知什么时候桌子对面神不知鬼不觉地坐下了一个人——他正趴在桌面上，胳膊肘还停留在和自己的手臂相贴的位置。从他居高的视角看过去，只能看见对方湿水后更显杂乱的头发和正使劲压着上目线望向自己的眼睛。

      班伏里奥暗自叹了口气，扭头回房间里翻找出一条毛巾，再回到露台时便看到那人已经坐直了身体，盯着房间里正在发生的一切。他远远地把毛巾扔到茂丘西奥怀里，边走过来边说：“晚上风大，明天下午还要海钓呢，吹得头痛就不好了。”

      茂丘西奥“哦”了一声，熟练地把自己的长发统统胡乱塞进干发巾中，忙完手上的动作才又安静下来，问：“你一个人在这里干嘛？”

      “发呆，看雪山。”班伏里奥递完毛巾后就没再看向对面。他一只手搭在椅背上，背靠着一边的把手，望向屋外夜幕下只剩下比黑夜更深重的轮廓的群山说。

      茂丘西奥也不闹，只哧哧轻笑着说了一句“晚上明明根本看不出那上面有雪”便重新安静下来，低头用指尖顺着木质桌面的纹路划着圈，像在玩儿童杂志上的迷宫游戏。

      这种风都吹不破的静谧持续到第三阵风起，茂丘西奥不习惯没有头发遮挡的脸颊，抬起一只手托在下巴上把空荡荡的面部护住，微微向前探出身子说：“你今天是不是有点不高兴？”

      班伏里奥的余光瞥见茂丘西奥探寻的眼神，刻意将眼睛转向另一边，说：“你刚刚去游泳了？你昨天才刚洗过头吧。”

      “我只是想洗而已。”茂丘西奥甩甩头，包得不十分紧实的毛巾连带着绞在里面的半干头发一齐散落下来，一瞬间空气中迸发出他的热带水果洗发水的味道。

      班伏里奥耸耸肩，没有回应。两人之间的氛围眼见又要落入茂丘西奥痛恨的冰冷的沉默中。

      “为什么不回答我？”茂丘西奥见对方大有要对前面的问题视而不见，觉得将话题扯远就一劳永逸之态，一半愤怒一半委屈地质问道。

      坐在他对面的金发男人叹了口气，转过身来。下垂的眼角、微微隆起的眉毛、绷成一条细线的嘴唇，无一不在显示他的疲惫。班伏里奥自嘲地翘了翘嘴角，嗓音沙哑地问：“而现在这又是你从哪个剧目中找出来的桥段呢？”

      “班尼，你把我搞糊涂了……”

      班伏里奥提高声音打断他：“这可不就像某天突然说要在博物馆门口等我回家一样吗？那时你正在演一个一秒钟见不到爱人就受不了的角色，是吗？而你又坚持了多久就放弃这样做了呢？”

      “茂丘西奥，我不是你践行你那戏剧人生的工具。”班伏里奥在又一次深呼吸后这样说，然后他在椅子拖行的刺耳声音中站起身，转身就要往室内走。

      “你回来！”他身后传来茂丘西奥急切的叫嚷声。他刚从班伏里奥一连串的控诉中消化完全反应过来，就看见对方离去的背影。他将还氤氲着水汽的头发往耳后一别，也推开椅子追上前去，却没料到班伏里奥真的停下脚步转回身子看着他，平静得和刚才崩溃的样子判若两人。他也赶忙刹住脚步，顾不上调整呼吸便说：“你的意思是，你根本不相信我爱你，是吗？”

      他干笑了两声，顶着班伏里奥不置可否的表情，咬牙切齿地说：“我真恨你这幅样子。有时候我都在想是不是因为你压根就不爱我，所以才不敢相信我是真的爱你？”

      有那么一瞬，班伏里奥犹如被针刺痛一般瞪大了双眼，但很快他又恢复了平和的神态。风又刮了起来，吹得茂丘西奥还沾着水汽的头发一丝一缕地抽在他热红的脸上。最后，班伏里奥只低头说了一句“记得用热风吹头发”便头也不回地离去了。

      -

      第二天早晨，和茂丘西奥同屋的亚历山大彬彬有礼地敲开另一间房间的房门，告诉前来应门的班伏里奥，茂丘西奥果不其然正因为头痛下不来床。

      “他跟我说止痛药在你这里，让我帮忙过来拿一下。”亚历山大有些小心翼翼地说，即使是他这样不经常和其他嘉宾接触的人也能感觉到昨晚他们两人之间发生了一些不愉快的事情。

      接着，亚历山大确认自己看到这位在他认知中总是十分和善的先生叹了口气，先是礼貌地谢过他，然后一边起身从行李箱的角落翻出一个小包裹，从里面拿出几盒药，一边背对着他说：“一会我自己给他送过去吧，就不麻烦你了。我听说莱亚要和女士们去海边晒太阳，这会儿的天气真是难得的不错。”班伏里奥转过身来对着他眨了眨眼，亚历山大便会了意，打了个招呼便走了。

      “萨沙！你可算回来了！”房间深处床上的那个白色的包袱翻滚了好一阵，露出茂丘西奥的脸。那张脸上先是欣喜，那样的情绪却在看清床边站着的人时一瞬间变成了一种有些忸怩的不满。“我听说姑娘们都上海边去了，你这个自然爱好者不跟着去吗？这会儿的好天气可是可遇不可求。”白色的包袱又翻滚起来，黑色的乱发代替了茂丘西奥圆鼓鼓的脸，他有些讽刺的声音背着他从墙的那边传来。

      “拜托，茂丘西奥，别总是闹小孩子脾气，”班伏里奥翻了个白眼，将装着温水和药丸的托盘不轻不重地放在床头柜上，一边用手臂隔着厚重的被子轻柔地捣了捣他背部，一边问，“医生来过了吗？你昨晚在外面吹了多久？”

      茂丘西奥扑腾着自己裹着白棉被的四肢艰难地坐了起来，点点头说：“医生早就来过啦，只是普通的头疼而已，过一会就好了。”他伸出手抓了抓手指，等着班伏里奥把水杯和药递过来，仰头将药丸吞下后又面对着墙躺了下来，过了好一会才传来他闷闷的声音：“也没有吹很久吧，反正吹到后面头发都干了。”

      茂丘西奥听见身后传来一声叹息声，他刚想转过身来，就感到有一只手按在他的肩膀上。

      “即使刚吃了止痛药，也还是别老是转来转去了，就这样安静地休息一会吧。”茂丘西奥偏过头去瞥了他一眼，“哦”了一声，往里蜷了蜷身子。又过了好一会，他才又听到身后班伏里奥的声音，他放轻了声音说：“对不起，昨晚是我太冲动，有些口不择言了。”

      “口不择言？”茂丘西奥睁开眼睛，死死地盯着墙壁，觉得有些好笑，“所以你真的是那样想的？你真的觉得我不爱你？”

      “你心知肚明，只是不愿意承认，我明明说过那么多次。”

      “我当然不愿意承认。”包裹着茂丘西奥身体的白色棉被狠狠地翻动了一下，班伏里奥几乎要以为他不安分的病人又要转过身来了，但他没有。

      大概他也觉得有些话只有不看着对方时才说得出口吧。

      茂丘西奥愤恨地继续说：“你和我说说，什么人才会愿意承认自己真心付出的爱不被别人所认可？我倒想看看是谁有这样宽广的胸襟！”

      班伏里奥又放弃了回答，若没有那些规律的铺在茂丘西奥裸露的脖颈上的温热气息，他几乎都要怀疑在某时某刻班伏里奥已经悄声离去了。茂丘西奥不喜欢这样的沉默，于是他继续张开嘴，用几乎是恳求的语气说：“我的好班伏，能不能告诉我，那些都不过是一时的气话、玩笑话？”

      班伏里奥原本均匀的呼气屏住了一刻，接着露出一个苦涩的笑，摇了摇头，说：“别那么小孩子脾气，茂丘。我真的是那样想的。”

      “这是你今天第二次这样说我了。”茂丘西奥扔下这样一句话，便不再有其他什么动静。过了好一会，班伏里奥才察觉到在厚厚的棉被底下茂丘西奥抽动着的肩膀和时不时传来的轻轻的吸鼻子的声音。

      “茂丘……”他抽了纸巾就要递过去，不料却被躺在床上的人一把抓住他伸过来的手腕。茂丘西奥通红的眼眶和其他五官扭在一起，像要用眼神将他挖穿一样瞪大了盯着他。

      茂丘西奥用空出来的手一把将脸上的眼泪抹掉，说：“那你能不能告诉我，你爱我吗？你讨厌我的孩子气吗？你讨厌我夸张戏剧化的举动吗？班伏里奥，你讨厌我吗？”

      班伏里奥的手悬在半空，身体仍然保持着刚才递出纸巾的姿势，这迫使着他直视茂丘西奥盈满忿恨的绿眼睛。他深吸一口气，闭上眼说：“我怎么会讨厌你呢？我爱你的孩子气，我爱你那些需要我照顾的时刻，尽管你大概在一些时候不是很乐意受我看顾；我也爱你的戏剧化，我其实很享受那些浪漫的时刻，即使我知道它们总是一闪而过——”他重新张开眼睛，看着茂丘西奥抖动的双眼，轻声说：“我爱你呀，茂丘西奥。”

      茂丘西奥像是突然卸了力似的整个身子坠回床里。他松开自己钳在班伏里奥手腕上的手，仍然躺在床上扭过头看着坐在床边的人，笑着说：“而你就是不愿意相信我爱你就像你爱我一样吗？班伏里奥，我要怎么做才能让你相信，我爱你呢？”

      -

      「你自己觉得是因为什么才让你在这段关系里这么没有安全感的呢？」

      班伏里奥坐在椅子上转了好几圈才停下来。他眉头紧锁，大概是在寻找合适的措辞。过了几秒钟，他才开口：“我觉得很难概括成一个具体的原因，可能是一种‘不相信’吧。”

      “不相信我们可以就这样成为恋人，不相信他在过去的十几年里也抱有和我一样的情感——归根到底其实是不相信我自己吧，”班伏里奥低下头无奈地笑了笑，“有一段时间我一直很焦虑自己作为一个恋人是否合格。我是说，我总是习惯在他身边做朋友，但是恋人到底要怎么做呢？也许我到现在也还不是很清楚。”

      “现在想来，也许我当时不应该就那样答应他来参加这个节目，让我这样糊里糊涂的人当恋人实在是对他太不公平了，不是吗？”

      「那你觉得茂丘西奥能帮你解决这个问题吗？」

      班伏里奥长长地叹出一口气，将脸埋在手心里狠狠揉了揉，说：“不能——至少我觉得不能。所以昨天晚上我真的很抱歉。只是因为想到了之前的一些事情，居然就一股脑地把气发在他身上了。所以我说在这段关系里，我真的对他太不公平了。”

      “其实我想，我是知道他爱我的，”班伏里奥重新抬起头看向摄像机时，他的眼神中满是歉意，“但是我不理解——他为什么会爱我呢？他真的把我当作一个恋人而非一个忠实的朋友而爱着我吗？当我不理解一件事的时候，我就不敢相信它了。”
  - title: Day4
    body: |-
      即使远在挪威，被尖锐的寒气包裹着，大海的腥气仍然冲击着漂泊在这大海上的每一个人的鼻腔。茂丘西奥独自一人坐在受顶棚遮蔽的长椅上，一言不发地看着不远处不断起伏变化着的海面。

      真奇怪，他拖着自己的下巴想，之前怎么会以为寒冷的地方的海水没有腥味呢？他的头还在隐隐作痛。
      “上午休息得还好吗？”

      “啪嗒”一声，茂丘西奥面前出现了两杯装着正散发着诱人暖意和甜香的稠浆的白瓷杯。亚历山大走到海钓船的甲板上，一边将原本手上端着的两杯热巧克力平稳地放在面前的桌子上，一边在茂丘西奥身边坐下。

      “托你的福，还不错。”茂丘西奥将一杯热巧克力推到自己面前，俯下身去轻呷一口。

      “班伏里奥和莱亚去潜水去了，他们好像已经迫不及待为自己的下一部作品寻找灵感了。”

      “是吗。”茂丘西奥端起那杯暖融融的热巧克力放在唇边，但迟迟没有下一步举动。过了不一会，他才重新将杯子在桌面上放好，再一次抬起头时脸上带着些隐晦的耀武扬威的傲气，说：“与其说是找灵感，不如说是他又一次在和我吵了架并且吵输了之后逃避见面。”

      “你们吵架了？”亚历山大眨了眨眼，希望他这句话不会听上去像它本来的那样不尊重对方隐私。

      茂丘西奥端起杯子，从亚历山大的视角看不到他被素白瓷杯遮住的下半张脸，只能听到那从他鼻腔中发出的一两声语调欢快的哼声。茂丘西奥放下杯子，细细抿掉粘在唇角的一点巧克力。他的绿眼睛有些机警地迅速打了个转，猛然间攀上亚历山大的肩头，逼问：“你可不会觉得又是我在惹他生气、这都是我的错吧？虽然我有些时候确实做得不太好，但我可得说清楚，萨沙，这次完全是那家伙太固执己见又太傲慢，我无辜得很。”

      “我可完全没那么说过，茂丘。”亚历山大无奈地扭过头来，轻轻拍掉茂丘西奥扒在他肩上的那只手。

      茂丘西奥“哦”了一声，以与方才突然动身发难几乎旗鼓相当的速度缩回身去，安静下来。过了好一会，亚历山大才听见身边传来他这位即便认识不久也已经能被他认为是“情绪无常的”朋友轻轻的声音：“他这次可将我伤透啦。”他又扭过头去，注意到茂丘西奥面前的杯子已经空了，里面只留下一些盘在杯壁上正在逐渐变得坚固的巧克力——显然此时已经不能再将它们称作“热”巧克力了。

      他正犹豫着要不要再去帮他要一杯，因为看上去他十分钟爱这份暖呼呼的甜食。但就在他决定起身时，茂丘西奥的声音将他拉回了原位。那声音显然经过了深思熟虑，也许在茂丘西奥的唇齿间来回翻腾了好几遍，才被允许准入这场对话中——“你怀疑过你们之间的爱吗，你和莱亚，萨沙？”他问。

      亚历山大侧过身来，将手托在下巴上摩挲了很久，才笃定地说：“当然。甚至我怀疑莱亚也一定这样想过。她是个写歌的艺术家，她的生活需要‘去爱我’来让她保持——怎么说呢，保持感官的敏锐？”亚历山大皱起了眉，但他没有即使抚平它，因为此时他的手正忙于无意义的比划。

      “而我，”他露出一个带着些歉意和愧疚的笑，“我是演戏的，我也时常怀疑我自己，是不是把戏剧中的东西带到了现实生活中？又或者，我是因为渴望着戏剧一般的爱情才与她相爱的？这当然十分不道德，也许正是因为我受此折磨，我当时才很愉快地接受了分手。”

      “当时？”茂丘西奥敏锐地捕捉到对方话语中的这个词，调笑着说，“那现在呢？我注意到你现在正在参加一档与刚分手不久的前任纠缠不清的综艺节目。”

      亚历山大耸耸肩，也笑了起来，说：“现在我不再纠结了，不过这也许是出于一种自暴自弃——也许你不会喜欢这种说法的。因为我意识到对完全纯粹的爱意的追求也是一种对戏剧性爱情的刻板追逐。所以我放弃挣扎了。”

      亚历山大说完，举杯将自己杯中剩下的热巧克力一饮而尽——即便这种浓稠厚重的饮品显然不适合这种需要表现出洒脱的场面，尤其是当它们在罗弗敦群岛的海面上被清冽的风吹得更加慢腾腾时。

      亚历山大暗自下定决心再过五分钟，他就要去再为自己添一份新的热巧克力，并且在它凉掉之前享用完。但此时，他不急不忙地在清脆的“咔哒”声中将杯子重新放回托盘上，扭头对茂丘西奥，说：“看来对我们来说，这份行业的影响都不只是一份薪水而已，是吗？我很好奇你们之间发生了什么。”

      “其实与你们的情况倒是相反的，”茂丘西奥缓缓转动着他手中的杯子，仔细地看着挂在杯壁的热巧克力缓慢地流动，“不过他和你刚才说了差不多的话。他说我并不爱他，他说我只是——”茂丘西奥顿住话头，放下手中的杯子，偏过头去看身后的海面，然后他深深吸了一口气，又轻快地吐出来。“算啦，总之就是和你刚刚说的那些差不多。”

      “那你是怎么想的？”

      “我从来没有怀疑过我对他的爱！”茂丘西奥转过身认真地看着亚历山大说，“曾经没有怀疑过，现在也没有。但是等我吵完架冷静下来之后，我突然觉得很抱歉。我很难过他一直以来都是这样想的，我也很抱歉我一直以来都在让他这样想。”

      “但又凭什么抱歉的是我呢？明明我已经做了我该做的——给那家伙一片真心！而他却说，却说——”茂丘西奥像驱赶蚊虫般甩了甩头。他的胸脯上下起伏了好几下，然后转过身去，低头瞪着自己面前斑驳着巧克力污渍的杯子，轻声说：“他却只是将那些当作我的又一出戏剧。”
      亚历山大坐在一边安静地眨着眼看着他，等他继续说下去。“我知道也许我平时是有那么一些‘戏剧化’，但是，这不代表我不爱他呀，他难道不明白，这就是我的爱吗？他难道不明白，我一直就是这样的吗？”
      “你‘一直都是这样的’吗？”亚历山大突然说，语气缓慢像是找到了什么端倪。“从你们认识起就是‘这样’吗？”
      茂丘西奥缓缓眨了眨眼，随即也在亚历山大的提问下想到了什么：“我认为是的……”

      “——那班伏里奥为什么这会才怀疑你的爱呢？我是说，在你们是朋友的时候，你一定也爱着他，用你那戏剧化的方式，那时的他也怀疑你的那份爱吗？”

      -

      莱亚正在一边进行潜水前的最后一步检查，一边回答着身边显然比前几天都要更沮丧的金发男人的问题：“想谈什么样的恋爱？其实这样说也许有点邪恶，但我确实一直期望着我的恋情会是那种能被我写进歌里的。你呢？”

      班伏里奥手上的动作停了半秒：“我不知道。”

      “但总之不是和茂丘西奥的那种？”莱亚从检察工作中抬起头来，笑着看向班伏里奥说。

      “我们是朋友的时候很快乐。”班伏里奥不置可否。

      “而是恋人的时候不快乐吗？”

      班伏里奥不说话了，只是下意识地抿着嘴唇，目光散落在脚下因经年累月地浸着水而蒙上一层怎么也擦不掉的污垢的船板上。莱亚看着他，率先站起身拍了拍他的肩膀，朝坐在对面的潜水教练点一点头，说：“都确认好了我们就先下去吧，其余的事情待会再想吧。”

      班伏里奥一直都很享受这样的时刻——海水在他周身流动，他的身体也跟着海水的波动而摆动着，大脑被满眼成片的蓝色所占据，他所需要做的只有呼吸。渐渐地，他觉得自己好像消融在了这片海水中，万千浮想都趁着这时机赶着趟从他的身体里钻了出来、涌入海水中、轻柔地包裹着它们原先被困于的那具躯体。

      班伏里奥在这环绕下眨了眨眼，不远处闪过一片银光，鱼群从他面前摆着尾巴游过，让他想起自己仔细收好的某个劣质塑料戒指，那来自茂丘西奥小学时某一次无厘头的告白。又有一尾鱼倏地游过，那是一颗生锈的衬衫袖口，一片课堂美术活动留下的叶脉书签，一张节日贺卡……他有一个马口铁小盒子，专门用来盛放这些扔不掉的小东西们。他总是带着它，尤其是在他远离家乡，远离这些小东西们的家乡时。

      “你还带着它们呐。”茂丘西奥在他开学的第一天下午闯进他在大学旁租的公寓，在带着一股趾高气扬的神情环视了一遍那杂乱的、到处散落着破布料的小房间后，将他的目光停留在那个熟悉的小盒子上，轻声说。

      “我总是带着它们。”

      茂丘西奥走到放置那小盒子的书桌旁，将桌面上的几支笔扫到一旁，背靠桌边手臂一撑便将自己抬到那可怜的桌子上坐好，一边摇着腿一边熟练地侧身翻看那铁盒里面的东西。“我说呀，好班尼，”叮叮当当的翻动声停了下来，换茂丘西奥含了糖一样的嗓音，“你总是那么喜欢过去。”

      “那些过去都如此值得我怀念。”班伏里奥说。茂丘西奥此时正低头直直地看着他，从他身后大敞着的窗子外射进刺眼的阳光，让班伏里奥看不清对方的神色，只是觉得在这光晕下，一切都好像一场梦一样遥远。然后茂丘西奥轻飘飘得像梦中缓缓落下的羽毛一样的声音响起：“我有时候都在想，如果我和罗密欧都死了，你会不会成天沉浸在回忆中走不出来。”

      班伏里奥喉咙发涩，掐断了自己脑海中由着方才茂丘西奥的假设营造出来的画面——此时他痛恨着自己拥有的在脑海中如此生动地呈现一幅画面的能力。他边走向自己总是异想天开的友人边故作轻快地说：“也许我会跟着你们去死的。”他这样说，即使他知道自己不会这样做的。他的生命也是那小小的铁盒子中的一件藏品，是他怎样都无法舍弃的东西，出于无法断舍离的懦弱。班伏里奥这样想。

      茂丘西奥也许也想到了这一点，但他没有反驳对方，只是从鼻尖中吐出几声小小的气声。十月初的意大利已经将占据了一整个夏季的暑期驱散的所剩无几了，街边吹来的风鼓动起米白色的纱帘，房间里是一种让奶油软塌下去的温度。奶油——也许他今晚应该买一个蛋糕庆祝茂丘西奥开启他的大学生活？他喜欢这个，他知道。但是不要草莓——虽然说服他选择其他口味的蛋糕也许会有些难，这会让他想起刚刚自己脑海中被他强行驱赶出去的血腥画面。

      不要草莓，看到草莓就好像看到了自己一个人坐在两尊坟墓前的样子——他们也许希望自己给他们带去鲜红的玫瑰。不要草莓，草莓红艳得就像滴血的刀刃，想到草莓他就感到有一股浓烈的酸味正攥紧着他的喉管。

      “班尼，你怎么了？”耳边响起茂丘西奥有些担忧的声音，他这才回过神来，发现几秒钟前还坐在桌子上的人不知什么时候已经站在了他对面，有些不知所措地举着两只手。

      “别离开我。”班伏里奥低声说。他不知道茂丘西奥有没有听清楚，但他没有办法让自己重复一遍了，茂丘西奥讨厌被别人管教，更别提这种命令了。但随即他便被他紧紧地抱住，那人毛躁的长发埋在他脖颈处，蹭得发痒。然后他听见茂丘西奥说：“不会的。”

      “可是，根据你们说的，是你先离开了他。当时是你先提的分手。”莱亚一边给班伏里奥递过去一条毛巾，一边有些不解地问。

      “我没有离开他，我只是，”班伏里奥偏了偏头，“我只是离开了作为‘恋人’的他。”莱亚没有回话，安静地坐在一旁等着他继续说下去。班伏里奥正蒙着毛巾擦头发，他的声音便从那窸窸窣窣的摩擦声的遮蔽下传出来。“其实有点糟糕，”毛巾下传来一声低低的笑，“我发现我变了，在确认关系之后。我变得想要更多，想要确认自己是被他爱着的；而他却几乎从来没变过。于是我开始有些排斥接近他了，和他在一起时焦虑好像无处不在，总是有一个声音徘徊在我脑袋里，苍蝇一样问我：他爱我吗？他是不是要离开我了？

      "我有时候也会感到愤怒，在心里责问他为什么可以和从前一样呢？但随即我就意识到这不过是我可鄙的迁怒，我真正生气的是自己，为什么要索取更多呢？所以我当时想着，回到朋友位置的话，一切都会好起来吧，毕竟我们都知道要怎么做对方的朋友。”

      “这些你和茂丘西奥说过吗？”

      班伏里奥揭下盖在头上的毛巾，把它挂在肩上，摇了摇头。

      莱亚抿着嘴看了他好一会，犹豫着开口说：“也许我接下来说的话有些自大，但经过这几天的相处，我觉得他是爱你的。”

      听到短发女孩的这句话，班伏里奥面对着远处的雪山，露出了一个有些复杂的表情：“是啊，他也是这样说的。我真的不该怀疑他的爱，也不该对他说那些话的，是吗？”他转过头来，苦笑着看向莱亚说，“我相信他说的话，我也相信你的判断，在所有的事情中出错的只有我的感受而已。还记得你下水前问我和他做恋人的时候快不快乐吗？我现在想来，这不是快不快乐的问题，它只是——不对，它感觉不对。”

      莱亚眨了眨眼，安抚地将一只手贴在班伏里奥的背上轻轻拍了拍。等到他刚才随着语气加快而变得紧绷起来的肩背重新舒缓下来，她才轻声开口问：“那你当初为什么会答应来参加这个节目呢？”

      班伏里奥愣了一下，缓缓合起眼又睁开，像是在追溯一段很遥远的记忆：“我当时想，我应该向他道一个歉。”

      -

      “我很抱歉，我擅自怀疑、否定了你对我的爱。”

      在民宿的庭院里，班伏里奥深吸了一口气，在月朗星稀的夜空下对着几米外那双他熟悉的绿色眼睛说，手里拿着二十分钟前发到他们手中的信纸。

      他们六人从钓船上回到居住的民宿用完晚餐后，天色已经完全沉静下来了，变成一种安宁的深蓝色。维加和埃勒诺接过导演组递来的提示卡：“接下来我们要进行的环节是「最后一封情书」。请各位嘉宾使用节目组提供的模板，写一封‘情书’，向对方表达自己的愤怒、悲伤、恐惧、悔恨和爱。”

      班伏里奥接过信纸，笔尖轻轻点在纸面上，滴落的墨水晕出一个小小的黑洞。他微微偏头，透过身边茂丘西奥垂落的黑发缝隙看桌边跳动的仿煤气灯盏内跳动的暖色灯光。像是察觉到身边的目光，茂丘西奥一把撩起自己的长发，转过头去问班伏里奥怎么了。

      “又在把我的头发当珠帘？”他笑着问。

      班伏里奥只是一边摇头，一边故作警备状地竖起自己手边还空白着的信纸，说：“你可别偷看我的答案。”茂丘西奥回以对方一个白眼，嘬着嘴“嘁”了一声便转过头去。班伏里奥看着他重新把那串珠帘一样的头发放了下来，眨了眨眼，重新抓起笔，认真地在纸上写下——

      “亲爱的茂丘西奥，我写这封信，是想与你分享我的心情，”班伏里奥轻轻吸入一口气又吐出，没有抬头看对方的表情，有些紧张地继续说，“我不喜欢，你每次对我认真的关切不屑一顾。我感觉很沮丧，你好像总是轻视我的话、否认我的感受。我很生气，当我看见你因为没有听从我的建议而受到伤害时。我很恼火，当我每次下定决心下次不会再做多余的举动时，却发现我是如此固执，或者就像你说过的——如此傲慢，以至于我无法停止这样做。”

      班伏里奥仍然没有抬起头来，但他听见对面传来一阵小小的扰乱了气流的笑声，他原本紧绷的神色也缓和了下来，在又一次调整了呼吸后，他抬起头来，看着茂丘西奥在不远处的成黄色灯光映照下比平日里更加柔和的面庞，在这样的情景下，他的眉眼中间也流出了一丝笑意。他继续说：“我希望，我们都能够忍受对方适当的‘傲慢’，像我们从前一样，不管是以什么样的身份，朋友也好，恋人也罢。”

      “我感到很失望，也许在你心中我并没有那么重要，”班伏里奥再次把头低了下去，“我很难过，在成为恋人之后，我的不信任让我们之间的距离拉大了。我感到很受伤，当我每一次被自己的焦虑淹没时，你却一切如常。我原想——”他的声音被自己突如其来的哽咽塞住了。班伏里奥艰难地抬起头咽下喉头间的滞涩，却不经意间看见对面原本站着的茂丘西奥这会却像走丢的小孩一样蹲在了地上。他赶忙抽了几张纸巾递给他，一边半蹲着抱住了肩膀仍在不停耸动的茂丘西奥，轻声说：“怎么啦？我还没念完呢。”怀里的人只是伸出一只手一张张地抽走纸巾，没有答话。

      “是想念之前的日子了吗？”茂丘西奥把脸埋在纸巾里摇了摇头，过了许久，等他用完了最后一张纸巾，他才抬起头来，推了推面前的人，催促他回到原来的位置上，继续接下来的环节。班伏里奥只得最后轻轻拍了拍对方的后背，然后便转身退回几米之外。

      “我原想，我们会一直像从前那样、甚至比从前要更加亲密。我希望，”班伏里奥从信纸中抬起头来，隔着几米凝滞的空气窃贼似的堪堪扫了一眼仍蹲在地上抬头看向他的茂丘西奥便低下头去，闭上眼睛说，“我希望，如果可以的话，那天我从来没有答应过你。”

      “我很担心、害怕、恐惧，你离开我。可是我也不想要，让自己活在不安中，所以我只能先从这段关系中撤走了，我很抱歉。我希望，我们能重新成为那个快乐的、不再不安的我们。”话音落下，班伏里奥长长呼出一口气，重新睁开眼睛，却没有抬起头来去看身前茂丘西奥那双在夜里也过分明亮的绿眼睛，因为他听见在低沉的夜幕下藏在脚边的篝火所发出的噼啪声中传来的混杂着抽泣声和笑声的抽动。

      “我很抱歉，我擅自怀疑、否定了你对我的爱。我感到羞愧，是我变了，我变得想要更多，我变得如此猜忌，是我让我们之间变得如此糟糕。我原本无意，用我的猜疑伤害你，我很抱歉。我期望——即使我知道在经历了这么多之后也许再无可能——但我期望，我们能回到曾经。”

      “班伏里奥，你敢不敢抬头看看我？”在班伏里奥的大脑还没有完全明白那颤抖着的声音在说着什么之前，他便条件反射一般放下了一直遮挡着他视线的那张纸，让他那双此时正盈满泪水的眼睛直直望向另一双通红的眼睛。那双眼睛的主人却咧开嘴笑了：“你告诉我，你真的认为和我分手并且假装什么都没发生过就真的能回到从前吗？”

      班伏里奥用紧紧抿起的嘴唇作为他沉默的回答，再一次举起手上的纸，说：“我爱你，我爱所有的你，即使是那个因为没有穿好衣服而生病躺在床上的你，或是那个拽掉我的雨伞拉着我跑进雨里的你。我想要你做自在的你；我想要你一直幸福无虑；但是我也想要我们在一起时都不再痛苦。听上去有点无解，是吗？”他想要轻轻笑一声，却发现原本轻快的气流涌动带起喉咙深处一阵梗塞，堵得他难受。

      “我理解你的所有感受。我能谅解，你因为想试试所有人一起淋雨的感受而最终让我们都生了病。我很感激，你曾经在那个蛋糕店里选了我想吃的巧克力蛋糕，并告诉我你不会离开我。我知道，我的道歉很糟糕，我说过的话也很糟糕，和我在一起很糟糕，如果——”

      “你又要说‘回到过去’、‘做回朋友’之类的话了吗？”茂丘西奥站起来，瞪起他翠色的瞳孔愤怒地看班伏里奥，“我早该想到你会写这些，我就应该在你之前先说完。要不然在听过你的‘朋友宣言’之后再看我写的，让我像个笑话。”

      “茂丘，我不是这个意思，我只是想说我很抱歉伤害了你。”

      “是啊，而你道歉的方式是说‘让我们回到更快乐的从前吧’！”茂丘西奥梗着脖子说。

      “你明明知道这是两回事。”班伏里奥有些不悦地指出。

      茂丘西奥没有理会这句话，自顾自地拿起刚刚一直攥在手里的那张信纸，有些咬牙切齿地说：“亲爱的班伏里奥，我写这封信，是想与你分享我的心情。我不喜欢在发生矛盾时，你总是做出一副迁就不懂事的小孩的大人模样。我感觉很沮丧，你什么都不愿意告诉我，如果不是这个节目，你是不是根本不打算告诉我你觉得我不爱你？”茂丘西奥自嘲地勾了勾嘴角，接着念下去：“我很生气，你什么都不愿意告诉我。我很恼火，我居然没有办法让你把所有事情都告诉我。我希望，你能不再焦虑，即使那需要你离开我。”他抬起头看向对方，眼神里却没有他话语中的那份强硬。

      “我感到很失望，在我们分手之后不久你就像从前一样、像朋友一样来找我，好像我们之间的那几年只是一场无足轻重的幻觉。我感到很受伤，因为你说——”茂丘西奥深吸了一口气，才继续说，“因为你说我并不爱你。我原想，从今往后，我们再也不会离开彼此了……”

      “我没有离开你呀，茂丘。”班伏里奥忍不住轻声打断对方。

      “不，你离开了，”茂丘西奥直直地瞪视回去，“别再自欺欺人了班尼，你不是自己也说了吗，我们回不去了。”对方紧紧绷着脸，没有回答。他便继续念下去：“我希望，即使现在看来事情已经无法挽回了，但我希望你知道我爱你，就像我知道你爱我一样。”

      “我很害怕，你会将我推走，我确信那对我们两人都不会是一个足够好的结局。我很恐惧，当我想到你可能会消失在我的生命中。我需要你，”茂丘西奥露出一个有些无奈的笑，抬起头，果不其然看到班伏里奥的眼眶已经不堪眼泪的重负了，他正将纸巾小心地印在眼下，茂丘西奥站在几米外能看见纸巾上他眼泪的形状，他垂下头来继续说，“我需要你，我需要你在我身边，唠叨我、教训我、拿我开玩笑——总之，我需要你。我希望，你在我身边。”

      “我感到尴尬，当我真心付出的爱不被你所承认。我很抱歉，我没能在过去的日子中给你足够的安全感，让你总是不安。我不希望，你只是将你视作实现我的‘戏梦人生’的工具，你在我心中远比那要重要得多。不如说，也许我的人生本就是戏梦一场，而我始终期望着你的到来，你的存在让它更加如梦似幻。”

      “我爱我们在一起的那些时刻，尽管它们让你痛苦，但我想在大多数时刻我们应当是快乐的，是吗？”茂丘西奥从信纸中抬起头来，问对面站着的人。班伏里奥用力吸了吸鼻子，挤出一个有些难看的笑，用混杂着浓重鼻音的声音喃喃：“是的。天呐，是的，和你在一起的时候总是那样快乐啊。”

      茂丘西奥抹掉自己眼角的泪，快步走到班伏里奥身边将他拉进一个紧紧的怀抱中。他一边缓慢地上下抚摸着对方的脊背，一边将头埋在他肩部闷声继续念着信纸上的文字：“我想要更多的那样的时刻，尽管我们都知道往事不可追。”

      班伏里奥刚平缓下来的呼吸顿了一刻，茂丘西奥便明白他的意思了。他轻轻拍了拍班伏里奥的肩头，向后小撤了一步。他的信纸仍然拿在手上，但他却并没有低头看它，而是隔着不到一米的距离和复杂的情绪遥遥看向另一双在说不清道不明的情绪深埋之下的眼睛，有些哀怨地说：“我理解，你的所有不安和焦虑。我感谢你在我们同居的日子里为我做过那么多道美味的食物、将我们的小公寓整理得那么令人愉悦——”

      茂丘西奥最后低头扫了一眼手上的信纸，然后将它折好，颇有些庄重地抬起头来，神色中的责怪怨怼舒展开来，他轻声说，像是不想戳破一个美好的梦境：“还有，如果这是‘最后’的，那么最重要的是，我很感谢你，同意和我共同度过那么多年。最后的一句话是，我知道，我也从不怀疑，我爱你。”
  - title: Day5
    body: |-
      “其实你们两个的问题不是很简单吗——从昨天的游戏来看，”埃勒诺从加油站边上的移动冰饮站台边上接过两杯带着巨大雪顶的冰沙，将莓果味的那杯递给身边的茂丘西奥，探头含住自己手上的那杯，边往回走边含混地说，“班伏说他不相信你爱他，你让他相信不就得了？”

      茂丘西奥低头猛地咬了一口撒满跳跳糖的奶油雪顶，皱着眉噼里啪啦地说：“你说得简单。我实在是不明白，我都说过那么多次了，我说‘我爱你我爱你我爱你’，他到底为什么就不能相信我呢？”

      埃勒诺不赞成地哼了一声：“不是所有人都能从话语中获得安全感的。”

      “那他到底想让我怎么做？”茂丘西奥有些烦躁地低头吸了一大口冰沙，紧接着便被冻得不由自主挺直了脊背。

      埃勒诺从自己手中的冰沙中抬起头，眨眨眼睛盯着茂丘西奥，说：“那就去问问他，去和他聊聊。”

      -

      “你有没有觉得自己有点钻牛角尖了？关于他到底爱不爱你这一点。”在这个通往特罗姆瑟的公路旁的加油站的另一边，三辆颜色鲜艳的汽车旁，维加问身边正半身斜靠在车门边上的班伏里奥。

      班伏里奥耸耸肩，微微皱起眉露出一个淡淡的笑，说：“也许吧，不过我认为这确实是个需要站在‘牛角尖’里确认的问题。”

      另一辆轿车里坐着的莱亚降下车窗，探出半个脑袋加入这场对话。“这确实是个很重要的问题。但通常来说，‘牛角尖’的坏处在于——你将自己困在只有一人的斗牛场中，和一个莫须有的幻影进行着生死对决……嘿，别用那种眼神看我，维加！”

      被点到名的女人咧开嘴笑了，缩了缩脖子做了个鬼脸，打着趣说：“抱歉，但你打算把这句话写到你的歌里吗，因为我发现它非常合适。”

      “噢，”莱亚撇了撇嘴，班伏里奥注意到她脸颊泛起一层薄薄的红晕，尽管如此，她还是轻咳了一声，继续说，“总之，我的意思是说，你现在面对的是两个人的问题，在自己的牛角尖里纠结听上去不太合适。”

      刚刚还嬉皮笑脸着的维加这时也正色起来，收起笑脸扭头对班伏里奥说：“我赞同莱亚说的，你俩应该谈谈。”

      “我想我们已经谈过很多了，在这个节目上。你们也都看到了——”班伏里奥摊开手。

      “哦不，我想她指的不是那种‘谈谈’，”一只手轻柔地搭在班伏里奥的肩上，他扭过头去，看见方才还坐在莱亚身边副驾驶座位上的亚历山大不知什么时候站在了他身边，正温和地看着他，“你要把那些你告诉过我们的、节目组的、和你自己的都向他坦白。”

      班伏里奥眉间刚抚平的皱痕再次变得深重起来，他吸了口气刚要说些什么，未出口的话语却被莱亚堵了回去。她将身子完全趴在车门上，说：“以我个人的经验来说，感到不安通常是因为未知，而‘爱’又是一个太过于包容的概念了，以至于在很多当我听到它的时候，我并不能在第一时间就明白它所说的是些什么。”

      “那如果最后我们谈话的结果是我发现他的‘爱’并不是我想要的那种怎么办？”班伏里奥努力使他的声音保持着平稳。

      “那么至少你不会受未知的感情所折磨了。”亚历山大轻轻拍了拍他肩膀，几乎是用气声说。

      班伏里奥叹了口气，望向远处的眼睛捕捉到两个正朝这边走来的熟悉的人影：“好吧，我会试试的。但在那之前，我想我需要先去下卫生间。”

      -

      班伏里奥显然并不是故意如此恶劣地对待那扇可怜的车门的，他也被这意料之外的响动惊得从他的思绪中跳脱出片刻。自刚刚那场发生在露天停车场的谈话结束之后，他便一直沉浸于此，此刻这谁也没料到的声音反而将他拽回到现实中了——他一直努力使自己做好准备去面对的现实中。茂丘西奥也被这声响吓到了。他的脸本能地转向驾驶座的方向，脸颊旁的头发却像是没反应过来一样仍然停在原地。他眨了眨眼，眼睫毛和错位的头发几乎要搅在一起。

      “呃……抱歉，我不是故意的。”过了半晌，班伏里奥才伸出手抹了把脸，有些懊丧地说。

      茂丘西奥换了只手拿过手上正不断往外渗出水珠的塑料杯，一边咬着吸管发出“咕噜咕噜”的声音，一边将空出的那只手上的水珠擦在裤子上。“我们还有多久到特罗姆瑟？”

      “很快了，应该还有两个小时左右吧，”班伏里奥发动汽车引擎，随着汽车发动机隐约的隆隆声，他轻轻吸了口气，瞥了一眼身边正在系安全带的茂丘西奥，说，“出发前去过卫生间了吗？”

      茂丘西奥边点头边发出几声哼哼声。

      “冰沙怎样？是葡萄味的吗？”班伏里奥又快速偏头看了一眼茂丘西奥手中的饮料瓶。

      “是混合莓果味的啦。总的来说还不错，但这个糖浆太酸了。”茂丘西奥晃了晃手中已经融化得差不多的塑料杯，冰水混合物撞击着杯壁发出让人喉咙泛酸的声音。

      班伏里奥点点头，正犹豫着该怎么开口，他身边的人却猝然叹了口气，低声问：“你想让我怎么做？”

      “什么？”

      “你需要我怎么做，你才能相信我爱你？”茂丘西奥转过头来盯着他，一字一顿地说。

      “噢，”班伏里奥的眼神死死地盯着前方笔直的公路，努力压下遍布口腔的酸涩感，缓缓说，“你要明白，我其实知道你爱我。”

      “‘知道’，但不是‘相信’？好班尼，别在这儿玩文字游戏了。”茂丘西奥转回头去，轻嗤一声，随即又恢复了片刻前的正色，继续说：“算我求你了，快告诉我吧，我什么都会做的。别再让它折磨我了，别再让它折磨我们了。”他的声音几乎可以用恳求来形容，班伏里奥不用扭过头去看也能想象到对方此时的神情。事实是，他也不敢扭过头去看他，于是他只是像一座固执的雕塑一般僵硬地目视前方。

      沉默在狭小的轿车内像是缠绕石像的藤蔓般蔓延开。当班伏里奥终于打算张开嘴说些什么的时候，他奇异地发现自己的喉咙像是被紧紧扒在上面的藤条榨干了水分一样干哑。他有些艰难地咽下一口水，说：“你不会‘什么都会做’的，你不应该说这样的话，茂丘。”

      就像你也不应该告诉我你不会离开我一样——这是班伏里奥没有说出口的话。

      尽管他还是没有扭头，但他的余光告诉他副驾驶座位上的人正安静地扭头看着他。“安静”不是一个经常出现在茂丘西奥身上的形容词，即使他没有说话，人们通常也能从他的跳动的眉眼和飞舞的唇角间知道他在“说”些什么。但此刻，班伏里奥确信他是“安静”的。而你要怎么才能知道一个安静的人此刻正在想些什么呢？他在责怪我吗？我让他失望了吗？他终于决定放弃了吗？他听见我没说出口的话了吗？他——

      如果茂丘西奥终于无话可说了，那为什么这里又会如此嘈杂？班伏里奥的脑海被这些嗡嗡作响的飞虫般的猜想所占据，以至于他几乎没有察觉到身边人沉重的叹息声。他微微抬起头来，从后视镜里瞥了一眼茂丘西奥的神色。那人的呼吸声放得很轻，像是被什么东西压得不敢大口喘气。然后仿佛突然苏醒过来一样，他猛地将自己的脸深深埋进了他的掌心，努力抑制吸气声不管不顾地从指缝间溢出来。过了片刻，茂丘西奥才放下覆在面上的双手，撑在柔软的座椅上，弓起背扭过头去，对上了班伏里奥混杂着不知所措和担心的眼神——尽管他很快便再次转回头去盯着面前的路了。

      他终于成功地张开了他的嘴，让浑浊的气体囫囵通过他的口腔，发出破碎的声音：“天呐……班尼，我真不知道我要怎么做才能……”他努力吞下正在他体内不断翻涌的哭泣的冲动，有些语无伦次地说：“我……我很抱歉……你为什么……”

      但是还没等茂丘西奥从他有些混乱的大脑中弄明白他要说的话，班伏里奥便率先开了口。他长长呼出一口气，发出两声疲惫的干笑，说：“我真不希望我们之间会是这样的，茂丘。我们之间不应该是这样的。”
      “那你觉得我们之间应该是什么样的？”

      班伏里奥感到他嘴内的酸意像一口咬下未成熟的橘子瓣一样瞬间充斥了他的整个口腔。他反复磨咬着脸颊的软肉，以对抗那阵深入肌理的酸楚。“你能够永远做你想做的事情，而我也不会为此烦恼。反过来也一样。”他最终艰难地张开嘴说。“你不应该为我的自扰感到抱歉，这就是为什么我不愿意告诉你这些。”

      “可是你应当知道这是不可能实现的，对任何人来说都不可能，”茂丘西奥在停顿了几秒后轻声说，就像他也不忍心戳穿这个愿望的不现实性，“你应该比我更清楚这一点，什么时候我成为了我们两个之中更现实的那个？”他几乎要哑然失笑了。

      “怎么不可能？”班伏里奥发现自己的声音不自觉间变得尖锐了。他咽下一口水，努力用更加平稳的声音继续说，可当他一张开口，他便发现这似乎是不可能的。你要怎么用一个无法停止颤抖的喉咙说出平和的话语呢？“怎么不可能？我们原来不就是这样的吗？”茂丘西奥没有回话，于是班伏里奥便继续说了下去：“我不明白为什么朋友能做到的事情恋人做不到，所以也许我们都爱得不对了，茂丘西奥。”

      “我不认为这是一个可以分出对错的课题。”

      “可是至少我们曾经都很快乐。”班伏里奥没有分给身边的人任何眼神，只是一直看着面前笔直向前延伸的公路，仿佛他只是在自言自语。

      -

      「你愿意说说你们做朋友时的样子吗？那时真的那么美好吗？」

      班伏里奥坐在高脚凳上沉思了一会，然后缓缓点了点头，有些苦涩地说：“是的，那时我们，非常美好。我甚至觉得那是我所能想象到的最美好的关系。我们曾经将所有的时光都消磨在对方身上，即使我们什么都不做，也丝毫不会觉得这是在浪费时间。后来我们长大之后，有时不能总是见面，我们也不会因为见不到对方而感到焦虑，尽管我们当然仍然渴望和对方相见，因为我们都知道我们想见的人就会在那里。”

      “他总会在那里，至少我们当时都是那样相信的。但是这件事对爱情来说不怎么说得通，是吗？”班伏里奥的声音变得轻柔起来。他抬起眼，轻摇着头露出一个有些哀伤的笑，继续说：“我是说，通常来说，爱情是一种比友情来得更加易爆的情感，我不确定我是否能抓住它。我想我们都不能确定。”

      “也许这是一个错误，”在班伏里奥保持沉默得时间长到让节目组已经开始准备问下一个问题时，他突然再次开口，“用恋爱的方式来确保一个‘不会离开’的承诺。”

      -

      “我总是在想他过度美化了那些过去的时光，只是为了贬低、逃离我们做恋人的那些时候。”另一个采访间中，茂丘西奥紧紧环抱着他的胳膊说，从他微微眯起的双眼和皱起来的唇鼻间可以轻易看出来他的不满。

      “我是说，我当然不否认我们曾经很美好，”茂丘西奥舔了舔他有些干裂的嘴唇，继续说，“事实上，我甚至无法责怪他因为怀念过去而对现在感到畏缩，因为我知道它就是很美好。”他有些无奈地叹了口气，微微闭上眼。重新睁开时，那双绿眼睛里总是闪着的有些奇异的光少见地柔和了下来。他定定地看向某个遥远的地方，轻声说：“我已经记不清我们第一次见面后、成为朋友之前的事情了——我甚至怀疑我们之间根本就没有过这样的时间，我们见面的那一刹那脑海里就有个声音告诉你‘就是他’。一切就像是你遇见了童话故事里你命中注定的那个人。”

      提到过去，茂丘西奥像是看见熟睡的婴孩一样用一种欢欣又小心的语气说：“我第一次从理发师的剪刀下逃跑的时候，我毫不犹豫地跑去了蒙太古家——他和我们的另一个朋友都在那里。而在拐过第一个街角时，我就看到他们从暗处的小巷子里跑出来，拽着我的手往另一个方向跑。”他情不自禁地嗤笑了一声，继续说：“我问他们我们要去哪？我问他们怎么在这里？班伏里奥边拉着我在逼仄的巷子里七拐八绕，边说他‘感应’到了我的头发在求救，他来保护这珍贵的美的遗产——我想他在那时就表现出他的时尚天赋了。事实上，一开始就是他建议我留长发的，尽管这会在我们一起睡觉时给他造成一些困扰。总之，最后他们带着我进了一个树林，然后他有些不怀好意地看着我，并开始和我们的另一位朋友一起往我的头发里插散落在地上的枝条和树叶，后来他们才告诉我他们一直想试试这个——把我打扮成某位会在头发里插树枝的希腊神祇。”

      他又低下头吃吃地笑了几声，再次抬起头来时，眼神里却比几秒前的温柔更多了一层浓重的哀伤。他吸了口气：“后来我再想起我们曾经的关系时，我总是会想到那天。”

      「那你有想过可以和他回到朋友关系吗？」

      茂丘西奥挑了挑眉毛：“‘可以’指的是什么？我们有这个能力，还是有这个选项？好吧，不管怎样，我曾经确实想过，在我们分手之后。我当时告诉自己，也许我们可以和从前一样，并且显然班伏里奥他也是那样想的，并且他试着那样做了。”

      “但是，怎么说呢，”茂丘西奥不自觉地咬着他的下唇，他的唇边逃出了一声干涩的笑，“没过多久我就发现这是根本行不通的。”他摇摇头，将垂在脸侧的乱发抓到耳后，让他脸上的疲惫和无奈一览无遗：“我不知道他有哦没有察觉到，但是对我来说，这是完全行不通的。因为你到底要怎样才能让一个已经浪漫地爱上他的人忍着那份爱意去回到那个‘无垢的从前’呢？”

      -

      狭小的车内安静了许久，两个人似乎都忙于默默将空气抢夺进自己体内。

      “你在害怕什么？”茂丘西奥开口时才发觉自己的声音如此沙哑，他忙干咳了几声，试图赶走自己嗓子里那份不适。就在这时，一瓶瓶装水无声地从驾驶座那边跃到他大腿上。他扭过头去看身边脊背和嘴唇都僵直着的班伏里奥，动了动嘴唇低哑着嗓音说了句“谢了”。

      “你在害怕什么？”他拧开瓶盖，喝了口水，几乎有些恳切地重复道。“为什么你这么害怕面对恋爱关系？还是说，你只是害怕面对和我一起的恋爱关系？”他干笑了两声，继续说，“求你，不要是后者。天啊，为什么我们会在你描述中那完美无瑕的感情中度过了二十多年而我现在却发现我还是不那么懂你？”

      “也许我也没那么懂你。”班伏里奥这时才发现也许自己也需要一瓶瓶装水。

      就在茂丘西奥以为对方不会回应自己的问题的时候，班伏里奥轻咳了一声，将自己直挺的背部松懈下来，送解开他面部僵硬的线条，长长叹了口气，说：“我很抱歉，但我想恋爱关系中的每一处都让我不安。为什么会有这样来势汹汹却又像是虚幻一样的感情？为什么每次当我想说服自己这是真实的时候它又那么像是一场虚无的梦？为什么它把我、我们变成了这样？你爱我吗？我爱你吗？”

      他又深吸了一口气，屏住几秒后缓缓将其吐出，蹙起的浅色眉毛下湖蓝色的眼睛不解又悲伤地看着车窗外不断向远处延伸的公路。接着，就像他吐出那口气一样，他问——就像他嗓子里有只手正紧张地抓着那些词句，好不让它们轻易地流出来：“你又为什么会爱我呢？”

      茂丘西奥张开嘴想要说什么，却很快便欲言又止地合上。重复了几遍之后，他便放弃了这种徒劳的举动，转而轻轻叹了口气，将头抵在车窗上一边看着窗外飞驰而过的景色一边说：“我要怎么回答这个问题呢？我只知道在我见到你的第一面就有一个声音告诉我我无法离开你了，也许是命运。”

      班伏里奥显然对这个答案并不满意：“你知道我说的不是这种‘爱’，茂丘。”

      “可是这又有什么关系呢？”坐在驾驶座上的人被茂丘西奥突然提高的声音惊得短暂朝身边投去了讶异的一瞥。“这又有什么关系呢——这种爱、那种爱，友人的爱、亲人的爱、恋人的爱、还有所有那些混杂了一切说不清道不明分不开的复杂情感的爱？班尼，我敢说你也没有办法从你对我的情感中剥离出一个具体的命名方式。”班伏里奥的喉结上下动了动，从他努力紧抿着的唇线边缘可以看到一丝细微的扭曲。

      茂丘西奥继续说：“我爱你。虽然我没有办法回答为什么，但我希望每一刻你都能在我身边，在我清醒的时候、在我睡觉的时候、在我犯蠢的时候、在我散发魅力的时候、在我无聊的时候、在我找乐子的时候……我需要你在我身边，好吗？”当班伏里奥听见对方话语间毫不掩饰的啜泣声时，他才发现自己喉间的哽咽。

      “我需要你，”茂丘西奥做了几个深呼吸试图将自己的情绪平复下来，“有时当我想到我们可能会回到我们分开的那些日子，我便觉得一切都变得毫无意义了。”

      “你太夸张了。而且我们没有分开过。”班伏里奥终于成功张开嘴，有些嘶哑地说。

      茂丘西奥挤出几个低低的笑：“你心知肚明我在说什么。过去的这半年你过得怎样？这半年的时间有没有让你终于厌倦了‘扮演过去’的游戏？在你自欺欺人粉饰太平的幻想里你有没有哪怕一刻发现，我们根本回不去了？”

      有那么一瞬间茂丘西奥几乎要觉得班伏里奥又要开始否认这一切了，但几秒之后，他眼角的余光却捕捉到轿车的另一边有一头柔软的金发正轻轻地颤抖着。他坐直了身体扭头看着对方，等他从他那莫名的笑中恢复过来。

      “实际上，我几乎没过几天就意识到这一点了。”茂丘西奥有些诧异地挑起一边眉毛，等着他继续说下去。“还记得那天我和罗密欧来你的公寓找你去野餐吗？我原本在选野餐垫，然后我，天呐，我不知道为什么不管我看到什么样式的野餐垫我都能想到我上大学时给你做的那些蠢衣服！但我当时还以为这只是因为我们刚分开没多久，我以为只要过一会，我们就能回到我们在一起之前的样子……”他又干笑了两声，“而我在过了足够久之后终于说服自己这是不可能的。我很抱歉，茂丘。我只是无法接受这一切：如果我不能忍受恋爱关系中的那混乱的一切，又不能回到过去，难道我们就这样了吗？”茂丘西奥没有错过班伏里奥说出最后几个字时声音的颤抖。

      “我们不会就这样的。”他几乎是在班伏里奥话音落下的那一刻便开口说。

      -

      在维加举着喇叭在所有人落脚的民宿里激动地上蹿下跳通知大家准备好防寒衣物出门时，他们刚刚吃完在特罗姆瑟的第一顿晚饭。等所有人都匆忙地跳上准备好的小巴车，车窗外的天空已经完全黑下来了，看不到一点那让所有人都期待着的自然现象的迹象。“我们现在要乘车去市区附近的一片空地上，今天天气很晴朗，所以很有可能能见到极光。”有些摇晃的车内，维加坐在最前面转过身来对着其他人说。

      “不过也有可能我们见不到极光。”在她身边，埃勒诺说。

      “嘿，别这样说，多不吉利！”在坐在后排的人们看不见的地方，维加撅起嘴用胳膊肘不轻不重地顶了顶埃勒诺。
      埃勒诺耸了耸肩：“我只是不想让大家失望，你知道的，如果极光真的没有出现的话。”

      “而这不会发生的，如果我们现在就开始朝着北方唱Let It Go并且拿出来我们准备的巧克力棒的话*。”

      坐在她们后面的莱亚似乎轻笑着叹了口气，轻轻拍了拍她身前的座椅：“不会只有我一个人觉得这是我们向导为了活跃气氛的胡说八道的，对吧？”

      茂丘西奥和班伏里奥坐在最后排的位置上。他看看前面的同伴，又扭过头看着正将头倚在车窗上的班伏里奥。对方挑了挑一边眉毛，无声地询问。茂丘西奥眨眨眼，轻声问：“好吧，我只是想问，如果今晚最后我们没有看到极光，你会难过吗？”

      班伏里奥先是一愣，然后摇摇头说：“不会的，我们都带了巧克力棒的，记得吗？而且看起来女孩们已经开始唱歌了。”他朝前面正七零八落地唱着歌的几人抬了抬下巴。随后，像是早已预料到后果一样，他上前伸出手揉了揉茂丘西奥因不满而有些紧绷的脸颊，咧开嘴低头笑了。过了一会，他才重新抬起头来，浅色的眼睛在没有开灯的室内里闪着光。

      “不会的，”他重复说，但是这次的语气更加平和，“你知道的，你不需要为一个‘户外爱好者’能否在户外找到乐趣而担心。再说了，如果这次见不到，我们也还有很多机会呢。而且——”

      “而且？”茂丘西奥发现班伏里奥重新把头转向了窗边。

      班伏里奥扭回头来，指了指窗外的某个地方，说：“而且，极光已经在了。”

      茂丘西奥瞪大眼睛，急切地向车窗边探过身去，将整个人趴在班伏里奥身上。他将车窗打开一条细细的缝，特罗姆瑟夜晚的寒风挤进温暖的车厢里，一瞬间刺得他有些睁不开眼睛。几秒之后，等他终于习惯了冷风的侵袭、睁开双眼时，他看见远处雪山之上的天边飘荡着一条蓝绿色的光带。他一下子看得愣了神，直到被他霸道地挤到座椅和车壁之间的班伏里奥在他耳边笑出了声，他才回过神来。

      茂丘西奥关上窗，重新坐回自己的位置上，看着身边笑得肩膀都止不住颤抖的班伏里奥，有些不知所措。“班尼……”

      班伏里奥也重新坐好，又隔着干净得能反出光来的窗玻璃遥遥盯着那条轻盈飘逸的光带看了许久，轻轻呼出一口气，扭回头来看着身边人在黑暗中仿佛也倒映着极光的颜色的瞳孔，嘴边挂着浅淡的笑：“茂丘，我希望每一个这样的时刻我都能在你身边。”

      茂丘西奥眨眨眼，感觉自己的思绪随着摇晃的车厢飘飘然顺着明亮的玻璃窗外延伸而下的蓝绿色光带一路悠然向上。

      “我也是。”他听见自己这样说，眼前荧蓝色的极光和面前的人的浅淡的眼睛几乎要融在一起。

      -

      *来源https://tw.trip.com/moments/detail/tromso-1857-132712364/
  - title: Day6
    body: |-
      「我们今天要进行一个画像环节，画师会在仅仅根据嘉宾口头描述的情况下分别对嘉宾自己和嘉宾的恋人作一副画像。

      你内心的自己，和你的恋人描述中的你，会是什么样的呢？你希望被看见的那个自己，和对方看见的你自己，这两者会有什么样的不同呢？“沉默”的画像们又会讲述一个怎样的故事呢？」

      -

      节目组选定的地址在一幢有着棕红色窗框和蓝黑色瓦楞房顶的白墙双层建筑里。

      茂丘西奥推开叮铃作响的浅色木门，一边好奇地左右张望一边顺着工作人员的指引拾阶而上，最终走到一面巨大的白布前，那幅轻飘飘的白布墙从天花板垂到地面，在无风的室内沉静地将茂丘西奥与白布另一边的世界完全隔绝开，只能隐约看见一个坐在椅子上的人影。

      听见来自白布另一边胶鞋底踩在打了蜡的木地板上的吱嘎声和布料摩擦的声音，在茂丘西奥看不到的地方，等待已久的画师摘下脸上的眼罩，一边拿起放在脚边的作画工具一边说：“我是今天为您和您的恋人作画的画家，您可以叫我卢卡。那我们就先从您本人开始吧？”

      -

      “他脸上的线条有些钝。”面对着一整面白布的班伏里奥在收到画家开始的提议后下意识点了点头，轻咳一声后说。他微微垂下眼皮，视线斜向下停滞在地板上的某一块光斑上。他的手搭在扶手上，时不时比划着什么，好像在空中描摹着他记忆中的那张脸。

      “他的脸算是椭圆形吧？整体的线条很流畅，在他再年轻一点的时候，他的脸上还有一些胶原蛋白，看上去会有些圆圆的，总是让我特别想捏——天呐，抱歉，说到无关的话了。”班伏里奥有些懊恼地咬了咬嘴唇，难以相信自己居然将这种话说出了口。

      另一边画笔扫过画布的声音没有停下来，卢卡安抚地轻声说：“没关系的，这并不是无关的话。您对您恋人的所有描述都会影响这幅画像最后的样子。”过了几秒，萦绕房间的细碎的沙沙声顿住了，卢卡投在白布上的投影左右晃了晃，像是在调整角度审视着画布上的轮廓。不一会，当他重新开口时，他语气中流露出些微的满意来：“那关于他的三庭和五官呢？”

      听上去他已经成功地画出了一个“总是让人特别想捏”的椭圆形脸蛋。

      “三庭的话……”

      -

      “三庭？”

      “啊，三庭分为上庭、中庭和下庭。上庭就是前额发际到眉毛的距离；中庭是眉毛到鼻子底部的距离；下庭就是指鼻底到下巴尖的距离。”

      卢卡耐心地等着另一边的茂丘西奥，想来他正在纠结地用手头能找到的工具测量他的三庭比例。等对面持续不断的布料摩挲声安分下来，茂丘西奥有些不确定的声音便传了过来：“我想，我的三庭大概是差不多一样长的？啊，也许中庭和下庭会稍微长一点……哦不，不对，不不不，我想它们三个是一样的，对。”

      “然后，五官的话……我的眼睛是绿色的，我觉得有点像小时候玩的那种玻璃弹珠里绿色的弹珠的那种颜色。有时候他会说我的眼睛是森林的颜色。”茂丘西奥把玩着手上的手串，将一个金属制挂件对准从一旁的落地窗照射进来的阳光。蝴蝶形铁片反射出的光线让他不由自主地往后缩了缩，即便如此，他还是眯起眼睛弓着身子遥遥看着那枚闪着光的铁片。过了一会，他才轻笑一声，摇摇头说：“但是请别误会，要我说，怎么会有人的眼睛那样绿呢？他只是在夸张而已——听上去不太像他会做的事情吧？但他坚持这样说。”

      -

      “他的眉毛和眼睛的长度差不多，从大体上来说是偏粗的平眉，但是在眉毛最后的部分会有一点点上挑，带得他的眉尾也会收细，”班伏里奥半倚在高脚椅的铁艺椅背上，垂着头仍旧摆弄着自己的手指说，“他的眼睛偏圆，是浅绿色的。他的瞳色很浅，所以有时候也会有些畏光，尽管他本人的意向和这大概是相反的，他总是很喜欢阳光。”

      “是哪种绿色呢？翠绿？草木的绿色？祖母绿？还是比较透的绿色？”

      班伏里奥抬起头，视线静止地定在面前巨大的白布上的某一点，像是在审视虚空中的某个模特。他下意识地伸出手揉了揉自己的下巴，缓缓说：“是那种带着一些棕色调的绿色，但不多——啊，我想大概是有点像苔藓的绿色。”

      他偏过头去拿起手边的玻璃杯抿了一口，重新抬起眼时，他的视线却被房间内的另一处吸引了去。他径直走向摆在不远处的木制展柜上的一小副画着夜晚雪地中的针叶林的装饰画。那是一副大约两三个手掌大的油画棒画，画面上看似随意却精准地涂绘出森森然竦立的松树群。班伏里奥拿起那幅画，端详许久，突然毫无预兆地笑了：“在我们还小的时候——那时候我们都大概还在上中学，有一天傍晚，我一个人在城市里闲逛，绕到了一座树林边上。然后我突然觉得那时树林的颜色和他的眼睛一模一样。后来我拉着他们去看，却不管怎样都看不到当时那种颜色了，也许是因为光线和时间不对吧。但我当时十分坚持自己看到的就是那样的颜色。”

      班伏里奥抿起嘴，将目光从那幅小画上移开，有些无奈地从鼻腔中叹出一口气，继续说：“只是后来的每一次看到的都不再能给我那样的感觉了，时间久了，我也开始怀疑我的记忆是错觉了。”他轻轻将手上的画框放回原处，却并没有直接走回房间中央的高脚椅上，而是仍然停留在原地，仰起头来一边看着屋内陈设的其他作品，一边继续往下说：“他的眼窝比较深。如果仔细看的话还能发现在他的脸颊上方，还有一道浅浅的泪沟从眼鼻之间延伸往下。”

      -

      “鼻子的话……”茂丘西奥有些焦躁地在椅子上扭了扭，鞋尖一下又一下地踢着椅子腿之间的横杆，“我觉得就是普通的鼻子吧。”

      另一边的画家尽管有些为难地抿起嘴，但神色上却看不出意外来。他略微思考了片刻，问：“那我们先从最上面开始吧，您的山根高吗？”

      正眨着绿眼睛的人伸出自己的食指和中指抵在鼻梁边上，有些含混地说：“嗯……大概有我的两个手指那么高吧，我想大概是算比较高的？”

      在茂丘西奥看不见的地方，卢卡点了点头，继续问：“那鼻梁呢？是比较平直的，还是有些起伏的，比如鹰钩鼻那样？”

      “平直的。”这次他回答得很果断，犹豫了一会后他补充道：“因为他总是喜欢说这个，说它的线条很‘平和’，看起来很舒服……”他飞快地揉了揉泛上几丝红晕的耳尖，边笑边说：“天呐，真该让他好好学学怎么用这些形容词。”

      “接下来是鼻翼和鼻头，是吗？”在茂丘西奥看不到的地方，画家一边按照刚才的描述在画布上勾勒出鼻梁的轮廓，一边有些意外地挑起一边眉毛——这几乎是这么久以来茂丘西奥第一次主动提起接下来的描述。“我的鼻头很圆。鼻翼的话，线条也比较圆润流畅吧，不是特别外扩的类型。”

      “听上去你对自己的鼻子更熟悉一些？”

      他哧哧笑了一声，戴着各式银戒的手指在他缓慢的抚过自己鼻子的动作中发出几阵清脆的叮铃声。“因为他喜欢这个。他是那种喜欢仔细地盯着别人的脸看的人，毕竟是服装设计师嘛。总之，他喜欢我的鼻子，所以他几乎和我说过无数次了，关于我的鼻头‘如何圆滚滚得像一颗可爱的珍珠’，或是我从鼻梁到鼻翼的曲线有多‘完美’，诸如此类，”尽管他的口吻十分平静，但他嘴角和眼神里的笑意仍然以一种不易察觉的方式流入了他的话语中，“不过这些话只有他喝醉了的时候才愿意说。一般他只会安静地在一边凝视我，然后在我问他‘怎么了’的时候说‘没什么’。搞得好像这样我就不会知道他在想些什么了一样。”

      -

      “他的头发一般是怎么样的呢？”

      “黑色的长发，长度大概到胸口；小卷——大概比羊毛卷弧度大一些那种。”属于班伏里奥的那边半边房间在简短的描述后陷入了短暂的沉默，在这安静中几乎能察觉到他的纠结。不过，最终他还是开口，用有些无奈和调侃的声音缓缓说：“也许，你可以把他的头发画得狂野一些吗？”

      卢卡不得不将笔刷从画布前拉走，以免上面的颜料因为自己一时间的惊讶和笑得止不住抖动的肩膀而洒在不合适的位置上。他忍着笑意问：“你想要什么样的‘狂野’？”

      “大概，像是奔跑的野马或火焰？”班伏里奥边说边举起两只手在虚空中比划着，“比喻真的不是我的强项，希望这没有太难为你。”

      “完全不会，我脑海中已经有画面了。顺带一问，他的耳朵一般会露出来吗？”

      班伏里奥点点头：“会的，他一般会把左边的头发别过去露出一边的耳朵。有的时候，他也会为了让更多的耳钉露出来而把头发扎起来，不过一般来说，就只是左耳。”

      -

      “左耳耳垂上有三个，还有一个耳桥；右耳耳垂上有一个，耳骨上打了两个。”茂丘西奥将自己的长发撩到一边，用无名指细细点过自己左耳垂上的空洞，过了一会，继续说：“平时我会习惯把左耳露出来，不过——”

      画家眨眨眼，询问骤然顿住话头的人想到了什么。茂丘西奥耸耸肩，微微撅着嘴有些难为情地问：“你觉得，我应该怎么戴耳饰？”

      “我？”卢卡茫然地半张着嘴，过了半刻才干笑了几声，继续说：“我想我的意见在这个环节应该不值一提。”

      “我之前总喜欢在我的耳朵上挂满耳饰，事实上，我打耳洞就是因为喜欢它被金属填满或拉扯的感觉……但他会说我‘戴得太满了’，而且容易挂住头发，一不小心就可能会扯出血，”画布的另一边传来一声叹息声，紧随其后的是茂丘西奥有些埋怨的声音，“他有时候真的有些扫兴。我发誓我戴满耳钉的样子看起来很棒，他为什么非得那样说？总之，后来我每次戴耳钉的时候总是想到他说过的那些话，渐渐的，我就也不爱戴那么多耳钉了。”

      他深吸一口气，闭上眼屏住两秒后将其缓缓吐出，睁开眼，勾了勾嘴角说：“你知道最有趣的是什么吗？他总是说他不愿意影响我，希望我永远做我想做的事情，就像我们不是恋人时那样。可事实是有时候，他显然忘了自己并不是一个那样好的朋友，我们的友谊也并不是他所描述的那样。”

      天啊，他是不是在当朋友的时候开小差了？茂丘西奥哑然失笑。

      “我能在画像上把耳钉戴满吗？两只耳朵都露出来，全部戴满。”他最后说。

      -

      揭开盖在画框上的白布，出现在几人面前的是两幅无一不画着杂乱黑色卷发的画像，区别是左边画像中的人的发丝要更加狂乱一些，甚至要完全盖住了耳朵和脸侧边微微膨起的颊肉，但仍然能从那些纷繁的发丝中看清画中人白里透红的圆润的脸颊和左耳耳垂上点缀着的一只金属耳钉；而右边的那幅画像中，尽管仍然有着一头乱糟糟的头发，露出来的两只耳朵和上面挂满的耳饰像是固执地想要宣告什么一样地挡在了那些卷曲的头发之前。

      “哇哦，你们是都告诉了画家要上满鼓风机吗？”维加在一旁幽幽地说。

      班伏里奥忍着笑说：“我和画家说要野马一样的头发。”

      “野马，”茂丘西奥半个身子斜躺在长沙发的扶手上，他的小腿抵着班伏里奥的膝盖，他的目光钉在班伏里奥的脸上，说，“我只是和画家说我喜欢我的头发被风吹乱的样子。你从来没和我说过，你觉得我的头发像野马。”

      班伏里奥的视线从画像上移到他身边正懒洋洋的茂丘西奥的脸上，耸了耸肩，说：“只是突然想到了而已——事实上，也许不只是头发。我有时候想起你就会想到在草原上自在奔跑的、无人能管束的野马。”

      “野马已经灭绝了。”坐在沙发另一端的亚历山大突然说，他身边的莱亚立刻扭头投去一个责备的眼神，轻轻拍了拍他的手臂。

      茂丘西奥缓缓坐直身子，扭头看向摆在众人面前的两幅画像，提起一边眉毛。“我想这不是你认为的我和野马的共同点之一吧，”班伏里奥翻了个白眼，但没等他开口，茂丘西奥便自顾自地接着往下说，“不过我觉得萨沙说的很有道理。班尼，你想要的那种无法被任何事物、任何人所管教的野马已经‘灭绝’了。你没有办法控制自己不去要求我，我也无法不因为你而受影响。”

      他的余光瞥到班伏里奥像被针戳到一般闭上了眼睛，他颤抖着吸进一口气，睁开眼时他扭头看着身侧的茂丘西奥，说：“而你讨厌这种管教，不是吗？我不想做你讨厌的事，茂丘。这就是我一直在说的让我们分开、回到朋友关系的原因。”

      “可是如果我要说即使在我们刚开始做朋友的时候你也没有停止过这些对我的管束，你又要怎么做呢？从此和我完全一刀两断吗？”茂丘西奥的手肘撑在膝盖上，十根手指深深地插进发根处。“不要让我开始翻旧账，好班尼。我十岁生日那天你不让我去爬那棵最高的树；中学二年级的圣诞节你勒令我带好手套和围巾，否则不能上集市去；还有我的耳钉，你说戴太多容易扯伤耳朵……别提无数次我想要去找我们好邻居麻烦的时候你把我拦下了。你不会希望我把这些旧账都倒出来的。”

      莱亚和埃勒诺交换了一个眼神，在一旁低声说：“耳钉，我想我知道哪幅是茂丘西奥自己描述的了。”在另一边，班伏里奥微微瞪大了眼睛，有些无措地试图从茂丘西奥垂落在脸侧的长发的间隙看清他的表情。

      “我很抱歉，茂丘……天呐，我真的……”他开口时才发现自己的喉咙不自然地紧绷着，让他的吐露出的词句像是新手初学提琴时拉出的颤颤巍巍的琴音。

      茂丘西奥终于抬起头来，直直地望进班伏里奥混杂着愧疚和悲伤的眼神中。周遭的空气变得愈发凝重起来，以至于茂丘西奥甚至要有些喘不过气来了，他深吸一口气，下定决心般举起自己的双手朝面前的人伸去，将对方拉进自己的怀抱中。班伏里奥还没反应过来的身体仍然有些僵硬，但承接住茂丘西奥下巴的肩颈却像被他呼出的温热的空气揉化了似的率先放松下来。

      “天呐……”茂丘西奥眨眨眼挤掉眼眶里的眼泪，他无法止住的抽气——也许是因为笑或是眼泪，或是二者都有——让他的话语断断续续的，“亲爱的班伏里奥，你能就听我这一次话吗，至少？请你听好了，我不会因为那些事情怪罪你的，我更不会因为那些事情而恨你的，我也不会因为那些事情而不爱你的。所以呀，请你不要因为它们而难过了，好吗？”

      班伏里奥有些难以置信地将双手摁住茂丘西奥的肩膀将两人的距离拉开，直到他可以完整地看清对方此时脸上的表情。他眨眨眼，有些不解地说：“可是，你讨厌别人那样做。”

      茂丘西奥轻轻叹了一口气，还留在对方腰间的手安慰地缓缓轻抚着他的身体。过了几秒钟，他才说：“而我奇迹般地发现我并不讨厌你这样做。”

      “真甜蜜，他说你是他的奇迹。”班伏里奥原本还打算开口说些什么，坐在另一边的埃勒诺却用她戏谑的话语将他未成形的句子堵了回去。他有些不可置信地扭过头去看茂丘西奥。被注视着的人有些忸怩地扫了扫他泛红的耳尖，飞快说：“是啊，我想我是这个意思。”

      在众人的哄笑声中，维加注意到遮盖住另外两张画像的白布不知什么时候已经被导演组掀开了，露出了两张顶着金发的男人的脸。她吹了个口哨：“看来是时候让我们进入下一个部分了。”

      “比较大的不同是表情，”亚历山大身体微微前倾，看着面前的两幅画像，“猜猜谁描述中的班伏里奥是笑着的吧。”

      -

      “他其实看起来有些刻薄，或者说是那种你一见到就会担心自己会得到他尖刻的教训的长相，”卢卡因白布另一边的人一开始就出言不逊而感到有一丝意外，他挑起了一边眉毛，等着茂丘西奥继续往下说，“我第一次见到他的时候就这样想过。”

      “那你现在还这样想吗？”

      茂丘西奥微微思索了一会，耸耸肩。“只是有时候还是会担心被他教训。不过……”他低头轻轻笑了一声，继续说，“这样说会很矫情吗？但我有的时候又会因为想到他会教训我而感到有些兴奋，因为我想到他这样在意我。”他清清嗓子，大手一挥，继续说：“总之，你就想象那种总是很严肃地告诉你你做了错事的家伙的脸。就算是现在，我们已经认识了这么多年，他不笑的样子有时候还是能吓到我。他眉毛和眼睛的距离很近，又因为他的眼窝陷得很深，所以看起来总像是他在怒视着你。”

      他顿了顿，继续补充道：“不过我知道他不是的，如果他在那样看着你，他就真的只是在看着你，或者说凝视？你肯定懂的，毕竟你们的工作都要盯着人看啦，总之就像你们在看人体模特一样。不过当然了，也有一种可能是他真的在怒视你，但等到了那时他会让你知道的，你会发现他的眉毛几乎要拧成一团结了，简直像乌云一样压在眼睛上面。”说着，他像是透过空气看见了那样的班伏里奥一样，身体情不自禁地颤抖了一下。

      “好吧，非常生动，我已经想象出来了。那么颜色呢？”

      “眉毛是浅金色的，头发也是，就是那种在太阳下能几乎融进阳光里的颜色。眼睛的话……如果面前没有光的话，就是蓝色的——浅蓝，像是网络上看到的极地冰川的那种蓝色；但有光的时候，你就能看到他靠近瞳孔的地方有一圈黄绿色。他很适合太阳。”

      在茂丘西奥看不见的另一边，画家一边在低头调着颜色，一边在发出两声鼻音后突然说：“你似乎对他的脸比对自己的更熟悉？”

      茂丘西奥有些得意地轻哼了一声，不置可否。

      -

      班伏里奥在开口前不轻不重地叹了口气。他下意识地轻轻点着自己的脸，说：“自从我意识到这件事后我一直在练习怎么让我的脸看起来不总是那么紧绷。”接着，他像是想到了什么一样笑出了声：“我突然想起来在我们小时候，那时我第一次意识到了这一点，我花了一整个下午把他堵在墙边，问他他怕我吗。一开始他还不愿意承认，后来，还是我们的另一个朋友劝他说实话他才承认其实有那么一点。然后我问他怎样可以让它看起来温和一点，他就告诉我多笑笑吧。”

      “你因为这件事很困扰吗？”伴着笔刷划过画布的声音，卢卡问。

      班伏里奥微微皱起眉头，思索半刻后说：“如果你是指因为我的脸，那么不——我是说，我并没有那些自厌情绪，我接受它作为我的一部分，毕竟你也没有办法改变它，不是吗？但我确实因为我身边的人可能会感到不愉快而困扰过。”

      他低头喝了口水，再次开口时他的声音更加轻快了些：“不过现在我大概没有这种困扰了，我想没有人会觉得一个总是笑着的人是不友善的吧。”

      -

      “和我一开始想的有些不一样，”埃勒诺仔细研究着面前的两幅画，说，“一般来说，我觉得对方描述的自己会看起来更加生动，因为通常来说，他们是那个能捕捉到我们自己察觉不到的面部动态的人，所以我一开始以为笑着的那幅是茂丘西奥描述的，但是现在看来，反而是另一副更生动一些。”她点了点左边的那幅画像，画面上的班伏里奥眉毛微皱，叶片状的眼睛微微眯起，浅色的眼睛专注地直视前方，仿佛正在审视着面前的事物。而不管他正在注视着什么，他的薄唇似乎因为对其不满而有些扭曲。

      而右边的那幅画像上的人正温和地笑着——就像班伏里奥一直以来做的。他的眉毛微微上挑，同样上挑的眼眶上可以看到平时总是被藏在眼窝下的双眼皮褶皱。在他眼下，两边透红的脸颊对称地鼓起，他挂着浅淡柔和的弧度的嘴唇边上有一个酒窝。一切都看上去很完美，将他原本锐利的骨骼都藏在那温和的笑容下。

      “发型是不是也不太一样？”莱亚突然说，她伸出手指了指左边那幅画像上的人颈部侧后方一个不显眼的发揪，又回过头来看了看此时正坐在沙发上的班伏里奥，他和右边画像中的人一样散着长度将将过下巴的打着卷的金发。“我猜右边这幅是班伏里奥自己描述的。”

      班伏里奥点点头。“我一般在工作的时候会把头发扎起来，”他抚着自己后颈的发梢，偏过头去看着茂丘西奥——后者此时正出神地看着面前的两幅画像，不知道在想些什么，“怎么会想到要这么说的？”

      茂丘西奥耸耸肩，语气淡然：“只是想到了。可能你工作的样子给我的印象比较深刻吧？”

      “你是怎么说的？”

      -

      “刚刚说到哪儿了？哦，嘴巴。”刚刚不知又神游到哪里去的茂丘西奥一拍拳头，又滔滔不绝起来。

      “他的嘴唇很薄，尤其是上唇。但即使是他完全放松的时候，他的唇角也是微微上扬的，仔细看也能看见他上唇的唇峰。下唇的话……”他抿了抿嘴唇，“其实仔细看，他的下唇要厚很多，但因为他的唇色太浅了，所以不大明显。”

      “那表情呢？他常笑吗？你想要这幅画像上的他是一个什么样的表情？”画师问。

      茂丘西奥先是下意识地点了点头，然后才反应过来对方看不到自己的动作，于是他张开口，但等他发出声来时却显得有些犹豫了。“他经常笑，因为他不想让别人觉得他不友善。但是这幅画像上，我想要另一个表情可以吗？”没等白布对面的画师出声应允，他便自顾自地继续说了下去：“其实前面也提到过了，就是他在工作的时候凝视别人的样子。这个时候他一般是不笑的。相反，他的嘴唇有时还会微微抿起来，或是纠结出一个不大自然的弧度。”

      //“班尼。”茂丘西奥有些无聊地坐在白色方形凳子上，看着对面神色严肃、正低头写写画画的人。那人时不时抬起头来——有时连头也不抬，只是转转眼珠顶着上目线来盯着他对面的茂丘西奥。他确认坐在对面的人就是他的班尼，也确定他的听力没有任何问题，但他却对他刚刚的呼唤充耳不闻，于是他有些气不过地提高了些声音，又叫了一声。

      “嗯？”不知道过了多久，班伏里奥才低低地从喉咙里发出一声闷哼声，声音轻得叫茂丘西奥几乎要怀疑他是否只是幻听了。

      “我非得一直坐在这里吗？”他低头看看自己坐着的白椅子、椅子之下一览无遗的白布、和白布之下乏味的米色方砖地板，有些不耐烦地从鼻腔里喷出一股热气，“我是说，你又不是不知道我长什么样。”

      对面的人只是耸耸肩，依然没有从他的速写本上抬起头来：“我以为你在毛遂自荐要做我这次作业的设计对象的时候就已经知道了这个过程会有多无聊了。”他活动了一下脖颈，在茂丘西奥“这是你大学第一份完整的设计项目，你自己都还不知道要怎么做吧”的互呛声中将铅笔放到一边，调转着角度审视着他面前画纸上各种凌乱的线条，接着有些自暴自弃地泄下气来，将速写本扔到身边的桌子上。茂丘西奥挑起一边眉毛，班伏里奥说：“算了，要不你先去忙你的吧，我想我确实不知道现在要怎么做。”

      “班尼……”茂丘西奥看着友人有些颓唐的样子，走到班伏里奥面前蹲下，伸出手捏上对方的脸颊，边揉还边提议说，“要不你多看看我呢？毕竟是给我的设计呀。”

      班伏里奥先是表情空白地低头一瞥，接着他像电流流经身体一般猛地坐直身子，抓过纸笔，闪着光的眼睛死死地低头盯着有些不知所措的茂丘西奥，让他别乱动。//

      茂丘西奥像是想到了什么一样在高脚凳上不太安分地扭了扭：“说起来，那家伙真难伺候，有时候灵感突然来了就要我保持一个奇怪的姿势好几十分钟！好吧，说回表情，对。他仔细盯着我的时候眼睛会稍稍眯起来一点，有时候这也让他的黑眼圈更明显了。不过他真的会看得很认真，有时候我在他面前都会忍不住想如果他的眼神有实体，我是不是已经被挖穿了？”他轻轻笑了起来。

      //“班尼。”茂丘西奥在想他从来不知道自己可以蹲这么久。

      “别乱动。”班伏里奥飞速地在他的本子上扫过几笔后，又将他的目光转回茂丘西奥身上。

      “我没动。”茂丘西奥撇撇嘴，翻了个白眼。

      班伏里奥叹了口气：“你应该叫罗密欧来的。”

      “切，”茂丘西奥这次翻了个更大的白眼，“他一定比我还不能忍。没准待不了几分钟就开始念叨他的朱丽叶来了。”

      “茂丘，”茂丘西奥感觉有只手托住了自己的下巴，“别乱动，看着我。”接着茂丘西奥便发觉自己迎上了班伏里奥专注得几乎要穿透他的目光。//

      “他经常找你做他的模特吗？”

      茂丘西奥笑了两声后说：“我不清楚怎样算经常……但是他不只是在工作的时候才会这样盯着我，更多的时候可能只是日常生活里的某一秒。他大概只是喜欢这样看着我吧。虽然我们已经认识二十多年了，我不知道我脸上或我身上还有哪些地方还这么有趣。”

      -

      “班尼。”晚上结束所有人的采访过后，茂丘西奥在民宿的露台上找到正盯着夜空发呆的班伏里奥。被叫住的人回过头来眨了眨眼，不解地望向他。他拖着漫不经心的步子走到班伏里奥身旁，大腿一岔陷进摆在班伏里奥身边的单人沙发里，偏过头去看仍靠在栏杆上的班伏里奥，拉长了语调缓缓问：“上个季度你刚推出的系列里面，有几件是靠盯着我画出来的？”

      班伏里奥被没头没尾的问题砸了一个晃神，随即心领神会地笑了：“差不多一半吧。”

      “不是全部？”茂丘西奥扬了扬下巴。

      班伏里奥不轻不重地从后背拍了拍他的肩膀，调笑着说：“给我的大脑留点除了你之外的空间吧，别那么霸道。”
  - title: Day7
    body: |-
      “他今天有问题。”一天之后的晚上，茂丘西奥看着班伏里奥朝备采间走去的背影，撇一撇嘴，抱起胳膊对正坐在床上的亚历山大和维加说。

      维加一边抚平自己脸上的面膜的皱痕，一边问：“真的？我看你们这一天下来挺好的啊。”

      茂丘西奥抿起嘴，摇了摇头。亚历山大有些笨拙地从维加床头柜的瓶瓶罐罐中翻找出一小瓶护发精油，在自己手心上挤出几滴来搓热，细细揉在发尾上。“这么说的话，他上午好像确实心不在焉的，尤其是在牧场的时候。”

      “对吧？他甚至在发呆！还是在面对他最爱的驯鹿的时候！”

      “也许只是他太累了呢？”

      “不，他那副样子一定是又在自己琢磨些什么事情，一些他不想让我知道的事情，”茂丘西奥斩钉截铁地说，他抱起胳膊，微微眯起的眼睛里闪过几丝好胜的光，“但这次我一定会想办法知道的。”

      -

      那天上午，班伏里奥回过神来时，他正和栅栏外的一只驯鹿大眼瞪小眼。啊，对了，这是他们今天的活动安排——昨天晚上回房间前新晋的轮值导游莱亚和亚历山大向他们介绍了这一天他们将会在当地的驯鹿牧场体验萨米文化。“呃，你好……？”他眨眨眼，不确定地说。

      就在他不自然地咧开嘴想再傻乎乎地伸出手和那家伙打个招呼时，茂丘西奥从他背后贴了上来。他将自己的胳膊环在班伏里奥的胸前，他的脸窝在对方的颈窝处，直直看着正和两人面对面的那只驯鹿。

      “你的睫毛可真长啊，是不是那两只美丽的眼睛把我们的班尼的魂给勾走了？”他先是伸长了脖子凑到那只鹿的近前去，饶有兴致地看着那只玻璃球一样的眼睛，再稍稍偏去点头，从斜下方看着班伏里奥的表情和反应。可那人却像真的失了魂魄一般僵直在原地，过了好一阵才有动静，不动声色地轻轻挣出茂丘西奥的搂抱。“班尼？”茂丘西奥微微皱起眉头，有些不知所措地眨了眨眼。

      班伏里奥这才像反应过来一般有些头疼地抓了抓头发，避开茂丘西奥的视线低声嘟囔着说：“我想我大概是没有休息好……”

      茂丘西奥狐疑地挑起一边眉毛，但没有多说什么，只是不轻不重地在他背上推了一把，往不远处其他嘉宾聚集的空地上抬了抬下巴：“好啦，大家都在等我们呢，再这样发呆下去可不好。”说着，他便不由分说地拉着班伏里奥走向人群。尽管他没有回头，但茂丘西奥还是感受到了班伏里奥脸上的笑，他略微温热的气息吐在他脖颈处，让他不由得也露出一个会心的笑来。

      他想起来班伏里奥高中的毕业舞会，那时他还在因班伏里奥不主动邀请他做舞伴而生着闷气，自己一个人坐在他们三个人在学校年久失修的泥墙外找到的秘密基地里，百无聊赖地拿落了满地的树叶逗蚂蚁。

      他不知道自己一个人和蚂蚁讲了多久的话，直到班伏里奥憋着笑的声音在他身后响起：“你可别耽搁蚂蚁先生回家了吧。”茂丘西奥扭头便看到惹恼自己的人正趴在墙边，脸上挂着无辜的笑。

      茂丘西奥见他这表情便赌气地扭过头去，对着地上的蚂蚁说：“听说您也着急回家呀，那可怜的茂丘西奥也得回家了，要不然可能要耽搁别人跳舞啦。”说着他便将拍拍衣服站起来，扭头就要走。班伏里奥见状，忙上前来拉住他的手腕，赔着笑脸说：“好啦，别生我的气了。”

      “我不明白你为什么就是不肯邀请我去舞会。”茂丘西奥扭过脸来，细长的眉毛因不满和困惑拧成一个疙瘩。然后那个恼人的家伙叹了口气，用茂丘西奥看不懂的眼神看着他说：“而我不明白你为什么非得让我邀请你去舞会，你明知道我早就答应了罗瑟琳的。”

      然后他是怎么回答的？他以为他可以是例外、他以为他可以是特殊的——他张开嘴又合上，最终还是什么都没说出口。班伏里奥像丝毫没察觉到他的不对劲一样，自顾自地拉着他往前走，等他回过神来时他们已经站在了学校礼堂里了。他茫然地看着面前围了一圈的朋友们和面前正含笑看着他的班伏里奥。一旁的罗密欧叫着：“班尼邀请你做他今晚唯一的舞伴呢，你今晚反应可真够慢的。”然后班伏里奥低声哀嚎了一声：“你现在不会是打算反悔吧？拜托，罗瑟琳已经和朱丽叶进去了，你可别再耍我了。”

      茂丘西奥这才完全反应过来，一边点着头一边笑倒在了班伏里奥的怀里。等他笑够了，便拽着班伏里奥往舞池里走——简直就和现在的场景一样。茂丘西奥看着正激动地和向导聊天的维加想。

      “你们快点！向导说我们一会可以喂驯鹿呢！”维加朝姗姗来迟的两人招了招手。她身边的向导穿着手工缝制的萨米服饰，正和一头温顺的成年驯鹿勾肩搭背地站在一起。埃勒诺担心惊扰那匹大家伙，小声地询问着向导自己能不能摸摸它，在得到向导肯定的答复后，小心翼翼地用手掌缓缓地在它的脖颈上抚过一下又一下。

      “是什么样的感觉？”班伏里奥走到她身边问。

      她歪歪头，想了一会后说：“我本来以为会跟松针一样硬，但比我想象中的柔软很多，有点像猫毛。你可以来试试。”

      班伏里奥试探着伸出手，用手背轻轻点了点驯鹿的鼻背处。他很快收回手来，带着些惊喜地抬起头，逆着阳光望向它温和的大眼睛。然后在大家意料之外地，那匹驯鹿缓缓合了合眼睛，低下头来用它湿漉漉的鼻头拱了拱班伏里奥收到胸前的手。

      “嘿得寸进尺的家伙，它在向你讨零食呢，”在众人的惊呼声中，向导解释道，“找第一次见面的人要吃的，你真是个厚脸皮的家伙啊。”接着，他不轻不重地拍了拍那头驯鹿的背部，往它鼻子下放了一小把苔藓，将那头驯鹿和大家带到竖着讲解板的空地上，讲解了当地特色文化和驯鹿的生活习性后，给所有人发下一小桶苔藓。“那么接下来就是和驯鹿的自由互动时间了，”莱亚拿出轮值导游手册，对着跃跃欲试的众人说，“大家可以在这片区域自由活动一个小时，然后我们会一起在牧场里吃午饭。”

      “就像你一样。”等两人走到鹿群一个僻静的角落里时，班伏里奥突然没头没尾地冒出这样一句话来。

      “什么？”

      班伏里奥没有扭头看落在半步之外正在低头调试相机的人，兀自走向一只落了单的驯鹿，轻轻抚过它的脖颈，对着那只温顺的生灵低声嘟囔着“好家伙”，抓起一小把苔藓藏在手心里，放在它鼻子底下逗弄它。“刚刚那只驯鹿，就像你一样，都是得寸进尺的家伙。”他头也不回地说，终于在那只大家伙急眼前松开了手，任由它不满地用鼻子在自己的手掌里拱来拱去。

      “我有吗？要我说，你在得寸进尺这方面也不遑多让吧。”茂丘西奥端起相机，扭着身子寻找合适的角度。

      “你当然有，”班伏里奥终于转过身来，看着正面对着他的黑洞洞的镜头微微抬起下巴，“需要我给你举出例子来吗？顺便说一句，明明我才是更会拍照的那个，为什么每次都是你这么热衷于照相？”

      茂丘西奥按下快门：“因为我不会认为做得不够好就没必要做。以及，不用举例子了，我的得寸进尺都是我故意的——别动，这会阳光特别好。”

      班伏里奥叹了口气，但还是配合地合着阳光摆了个动作。“我什么时候才不会因为你的厚脸皮程度而惊讶？你还记得我高中毕业那个时候吗？”

      茂丘西奥哼了一声，转到一边去朝着已经走到不远处去吃草的驯鹿调整着焦距。就算不是上午刚刚想起那场毕业舞会他也会记得那个夏天的，不管是那场糊里糊涂被邀请了的舞会还是毕业典礼那天发生的各种事情。毕业典礼那天他本来应该在上课，所以当他找到正在拍毕业照的班伏里奥时，对方先是露出一个有些讶异的表情，但又在下一瞬便变成了了然。“你逃课了，”他抱起胳膊，用毫无波澜的语气说，“我真荣幸。”

      站在他身旁的罗瑟琳则发出一声戏谑的笑，招呼他过来：“我和班正在发愁找不到人帮我们拍照呢，你来得正好。”说着，她便将班伏里奥手中的相机塞到茂丘西奥手里，拉着班伏里奥到教学楼大门前站好。茂丘西奥撇了撇嘴：“我可不是翘课来帮你们两个拍照的。”

      罗瑟琳挑起一边眉毛：“难道不是吗？”班伏里奥看着两人之间越发剑拔弩张的气氛，叹了口气走到两人中间，从茂丘西奥手中重新拿回自己的相机，思索再三还是选择了今天似乎生着一些莫名的闷气的茂丘西奥。他将相机先递到罗瑟琳手中：“抱歉了罗斯，你愿意先帮我们两个拍一张吗？你知道的，他的班主任可不好对付，万一一会他找过来……”出乎他意料之外的，他中学的同窗好友没有像平时一样调侃他们的关系，反而带着一种神秘的神态迅速地摁下了好几下快门，但班伏里奥只当她是害怕那位全校出名的老师。

      而茂丘西奥则在匆匆扫过那几张照片后开始撺掇两人翘掉十几分钟后的毕业典礼和他一起去学校对面新开的冰饮店去。罗瑟琳倒是一脸无所谓，班伏里奥却在一旁面露难色：“茂丘，蒙太古夫人会来看毕业典礼的，我不能放了她的鸽子吧？”——这大概就是班伏里奥说的“得寸进尺”。但当时茂丘西奥罕见地没有继续坚持，则是耷下了嘴角，跟着两人慢吞吞地走到学校礼堂门口，有一搭没一搭地聊天。他问罗瑟琳决定好毕业的去向没有，女孩甩了甩头发，说她要去英国读文学。他只是干巴巴地回了一个礼貌的“听上去真不错”然后就在礼堂门口被守株待兔的班主任带走了。现在想来他那天真的挺反常的，他甚至没有在被老师训斥时还嘴，只是那天两个人都没有反应过来这份反常会对他们的关系走向有怎样的昭示作用。

      -

      “如果我当时就注意到我对他或者他对我有不同于友情之爱的话……”采访间里的班伏里奥用指腹一下下擦过两腿之间的皮革椅面。他摇摇头：“我想我会是回避派。做他的朋友就已经够痛苦了，在这个基础上再加上爱人的爱？那会把当时的我压垮的。”

      「现在这份情感没有把你压垮吗？」

      “我只能说，我坚持得比我想象中的要好太多了，”他苦笑道，“我有时候想，爱他的时候就像把一团火聚在手心里，而我只想看它燃烧。”

      「那你觉得在他发现自己的那份情感的时候有纠结过吗？」

      班伏里奥眨眨眼：“他其实和我说过这件事。但不用他说我也感觉到了，在我结束了大学的第一个学期回到家里时，我发现他有意无意地躲着我。”想到过去的事情，他脸上的苦涩也化成了温柔的浅笑。“这听起来简直就像是三流小说里的烂俗狗血情节。他因为不确定我的感情而不敢面对我，而我也暗自里因为他不愿见我而难过。我们就这样在各自幼稚的小心思里浪费了一整个冬天，那个冬天维罗纳可是下了好几场大雪呢。”

      「你现在认为这种患得患失是幼稚的吗？」

      “在现在的我看来，我小时候做的事情都是幼稚的，”他定定地盯着镜头，过了好一会，继续说，“但这不意味着我现在不会再做我觉得幼稚的事情。”

      -

      “咔嚓”。身边突如其来的拍照声让茂丘西奥回过神来。他转过头来，看见班伏里奥正单手举着一只数码相机，透过遮住他一只眼睛的电子屏看他。“我只是要提醒你，”他低头看了一眼刚刚随手摁下的照片后满意地收起相机，“再不去看好你的铁桶，里面的苔藓就要被那些贪心的家伙偷光了。”

      茂丘西奥这才顺着他的视线看到他脚边已经空了一大半的苔藓。“嘿，那群鬼鬼祟祟的家伙。”他撅起嘴埋怨道。

      “事实上，我觉得他们动静不算小，”班伏里奥抱起胳膊，“你在想些什么，心不在焉的。”

      “在想你说我得寸进尺。”

      “你别告诉我你不乐意听到这个形容，你不是一向引以为豪吗？”

      茂丘西奥蹲下身来，抓起铁桶里剩下的一小把苔藓，拖着步子走向近前一只正趴在地上的驯鹿。他一边入神地盯着那只安静的家伙，一边不由自主地放轻了声音——轻到班伏里奥都在怀疑这句话并不是说给自己听的：“我只是在想，我真的得到‘寸’了吗？不会从一开始就是我的一厢情愿吧？”他回过头来，看着站在身后嘴唇紧抿的班伏里奥，露出一个虚弱的笑。

      班伏里奥看着面前缩在背阴处显得不可置信的年幼的人，不自觉间将他与十年前自己毕业舞会上见到的那张脸合在了一起。他们在昏暗的舞池边缘熟练地跳着华尔兹，从门厅处一直滑向房间的最深处。他看着光影的明暗变化映照在茂丘西奥的脸上，默默在心里记下了在各种光线下他眼睛的颜色，他陶醉地注视着他的脸，直到对方踩了踩他的脚。他吃痛地叫了一声，松开搭在茂丘西奥背部的手，飞快地向后撤了一步，问他怎么回事。那人则一脸无辜地抬起下巴：“一圈转完了，该换你跳女步了。”班伏里奥闻言，在暗处翻了个白眼，为他特意为了舞会而擦干净的皮鞋默哀了半秒后旋身转到另一边去摆好了女步的姿势。那时他忙着讶异于自己心里莫名生起的庆幸，没有注意到茂丘西奥投向自己的目光和他不自觉抿起的嘴唇。

      面前二十五岁的茂丘西奥又开始摆弄起他的那只相机来。不知什么时候他朝后撤了些，此时正撅着屁股给那只已经吃饱喝足了正眯着眼睛休息的驯鹿找角度。“茂丘。”他听见自己的声音从喉咙里跑出来轻声叫他的名字。

      “嗯？”地上的人头也不回。

      “你知道的吧，这是很严重的指控。”

      茂丘西奥似乎是轻笑了一声，满不在乎地说：“我们来到这儿的每一天都在互相朝对方扔出这样的指控。”

      “茂丘。”他又叫了一声，气流在他的口腔里横冲直撞，逗得他牙根发痒。这次，茂丘西奥转过身来，只是他的脸让仍然端在面前的相机占了大半。他没有说话，安静地等着班伏里奥接着往下说。站着的人逆着清澈的阳光微微眯起眼睛，也蹲了下来。他直视着对面的摄像头，想象着自己在取景框里的样子。

      “茂丘，”他发现自己无法面对着那个人而抑制住发出那几个代表他的可爱音节的冲动，“让我看看你的眼睛吧。”

      “这算是你的‘得寸进尺’吗？”茂丘西奥依旧固执地举着相机，即使指尖逐渐因为冰冷的金属外壳和冷风而感到麻木僵硬也不肯放下它。

      班伏里奥闭上眼，深深吸入一口气后有些紧张地说：“这取决于你是否这样想，并即使你同样这样认为还仍然决定给予我。”话音落下后他也依然没有睁开眼睛。他从来没觉得自己这么害怕摄像头过。

      但紧接着，他感到有一双带着凉意的手轻轻覆在了他的眼皮上。“嘿，你要是再不睁开眼睛，我就罚你这辈子除了这只手什么都看不着。”

      然后茂丘西奥感到两排细软的睫毛扫过自己的掌心，那双湖蓝色眼睛的主人在一手之隔外低声笑着说：“那你是打算这辈子都在我身边了？艾斯卡勒斯大人，行行好，让我看看您的眼睛吧。”

      茂丘西奥这才把手放了下来，看着面前那双表面平静的蓝色眼睛，一边心想着是不是自己的眼睛在对方眼里也是这个样子，一边不由分说地朝着那双眼睛细细地吻了上去。被他拥在身下的班伏里奥在发出一声低低的惊呼，但很快便伸出双臂抱了回去。“这样我可怎么看你的眼睛呀，我的好茂丘。”他轻声说。

      “我现在想进这个尺，你是让还是不让？”茂丘西奥埋下头来，用鼻尖亲昵蛮横地拱着班伏里奥的眼窝。

      班伏里奥无奈地笑了几声，一边说着“你是驯鹿吗？”一边微微抬起头来用自己的鼻梁贴上对方的鼻翼。

      -

      “可是我还是没看出他有哪里不对劲。”维加揭下面膜，偏过头细细回想一番后摇了摇头。

      茂丘西奥皱起眉头，低下头沉思了一会，然后突然想起来什么似的猛地抬起头来，颇有些激动地说：“你还记不记得今天午饭的时候，莱亚说的那件事？”

      维加看了一眼坐在另一张床上的亚历山大，点点头——中午吃饭的时候，不知是谁发起的话题，他们突然聊起了这几天下来六人中最和谐的一对。“我这几天相处下来，没感觉到你俩有什么问题啊？”维加看着坐在长桌中间的两位轮值导游，困惑地问。

      莱亚咽下嘴里的熏肉，低下头来漫无目的地切着盘子里的莴笋说：“我有的时候觉得他有些像一个没有缝的蛋。”

      “你这是什么比喻？”茂丘西奥一听边笑了起来，“这么说你是苍蝇咯？”

      莱亚无奈又好笑地撩了撩耳侧的头发，摆了摆手说：“我本来想避免在大家用餐的时候说到这个词的。不过这个比喻可能也不太恰当吧，你们就当我没说过好了。”

      就在大家都为这个有些滑稽的比喻哄笑作一团的时候，茂丘西奥敏锐地感觉到身边的班伏里奥似乎出于不知名的原因轻轻呼出了一口气。他扭头去看，却看见他已经恢复如常，和身边的亚历山大开起了玩笑。

      “她为什么这样说，你知道吗？”终于平静下来的维加探出身子，越过莱亚去问亚历山大，说完还扭头对莱亚说“你不准给他提示”。

      亚历山大则是茫然地摇了摇头，有些无措地看着莱亚说：“你从来没和我说过这个。”

      “所以是为什么呢？”坐在最边上的埃勒诺问。

      “饭都吃完了吧？”莱亚浅浅吸入一口气，扭头看向两边，然后在大家的笑声中清了清嗓子，说，“蛋是没有缝的，就在于——”

      -

      “‘——就在于它是一个完整体，它有光滑、坚硬的、毫无破绽的外壳，而我只能在它之外徒劳地寻找入口，连落脚的地方都没有’，”班伏里奥一个人坐在备采间纯白色的幕布前，面无表情地复述着中午时莱亚说过的话，“莱亚想要离开亚历山大因为她没办法在他身上看见他们共同存在的痕迹，好像一切都只有亚历山大一个人。但是对我来说——”他不知道想到了什么，眼神飘向前方地板上的电线，嘴角扯出一个有些无力的笑。

      “但是对我来说，所有人都是一个没有缝的蛋，”他抬起头，眼神依旧空洞，“你没有办法去影响另一个人。不管你们关系再怎么亲密，他始终是他自己、始终是一个有着独立思想的个体。而当人们说他们是‘独立’的时候，他们是认真的——就像依照互不相同的轨迹运行的行星一样，所有人都毫不相关。”

      他吐出一口气，连带着方才一直直挺着的背也弯了些。他有些神经质地不断把手指插进发根处梳到发尾：“我想这大概是我的问题。我也许对人与人之间的连接没什么信心。”

      然后小小的房间落入了沉默之中。过了约莫半分钟，节目组的人开口问：「我们方便了解你为什么会这么想吗？」

      他眨了眨眼，像是早就已经责问过自己无数遍一样对答如流：“我想，大概是因为和我的亲生父母有关的事情。”
