  “为什么对敌意的自觉意识可以成为一件不可容忍的事情呢？最主要的原因就在于人可以在憎恨某人的同时，又爱或者需要这人；就在于人可能并不愿意知道造成敌意的原因是嫉妒或占有欲等；就在于人可能害怕在自身中发现针对他人的敌意。”


  摘录来自
  《我们时代的神经症人格》
  卡伦·霍妮
chapters:
  - body: |-
      01

      妈妈，莉迪亚是谁？我问。

      她显然被我的话搞糊涂了，两根眉毛缠结在一起。莉迪亚就是你呀，我亲爱的。

      尽管此时父亲不在这里，我还是努力不让面部肌肉走漏心声、露出任何不耐烦的表情。

      那妈妈，塞巴斯蒂安是谁？

      她的表情一下子亮了起来，开始侃侃而谈起来。哦，塞巴斯蒂安啊，他是你父亲的祖父，是一位伟大的……

      噢，所以这下她知道了。我在心里冷笑一声，没有继续听下去。

      那时我的弟弟顶着比我长了一个音节的名字生活到了他人生中的第三年，四岁的我还没有意识到自己问出了历史上最著名的哲学问题之一。

      我想“莉迪亚”算不上是什么好名字，它的尾音太过于轻飘飘，念出来就像是在赶一只苍蝇，或是要吐一口痰。也许“塞巴斯蒂安”也不是。这样长的名字，还有那么多讨人厌的摩擦音，念起来总是刺嘴。想来念这个名字会比我那可怜的名字要磨人得多。塞巴斯蒂安自己大概也不喜欢这个名字，我看见父亲喊这个名字时他的表情，看起来像他自己的嘴巴里刚刚经历了一场翻江倒海。

      “塞巴斯蒂安——莉迪亚——”

      又来了。

      我看着塞巴斯蒂安脸上隐约的面部抽动，在父亲看不见的地方揉揉脸，提醒自己放平幸灾乐祸的嘴角，还悄悄翻了个白眼。

      但所幸这次似乎不是什么严重的事，事实上，也许有些太轻松了——他提议全家一起坐上游艇到海边去度过即将到来的盛夏。


      02

      海鸥——你见过海鸥吗？

      我是说，我当然在科普图书或生物教材里见过它们，但那只是“它们”，而现在在我面前的可是海鸥。

      我隔着一整个甲板遥遥看着那群站在栏杆上的鸟儿，它们的银白色羽毛在午后的阳光下发出的光刺痛了我的眼睛，但我强迫自己直视那不断抖动的翅膀。

      这是一天中极少数父亲允许我在他视线范围外自由活动的时候——好吧，只是他还没有发现我这个时候在自由活动。游艇上的所有人都在房间里的大床上享受着他们安宁的午睡，这可是个千载难逢的好机会，整个空荡荡的世界上只剩下你自己和海鸥——除非现在突然出一个人把海鸥全部吓走。

      莉迪亚趾高气扬地站在我面前，投下一片阴影，而我的眼睛终于停止发痛了。我注意到她手上拎着琴盒，这让我感到有些意外，因为在我的印象里，从我九岁开始她就不再认真练琴了，我已经不记得她乏善可陈的琴声了。

      “你把它们吓走了。”

      “码头上更多，你上那儿看去。”她的语气满不在乎。

      “你在开玩笑吗？他会杀了我的。”

      莉迪亚耸耸肩，我不确定我是否看见她抬起了她的嘴角，阳光穿过她卷曲的发丝让它们看起来像码头鱼贩摊前冰死鱼的鱼鳞。

      “是啊，真可惜。”然后她转过身往舷梯的方向走去，阳光再一次直直朝我射来。我这才意识到她为什么会在这个时候出现在甲板上。

      “你要去哪？”她没有回答我。

      “记得在下午两点半前回来，你知道的。”我也许看见她往船下走的身影顿了一下，但阳光和她茂密的金发实在太晃眼，我什么都看不清。

      莉迪亚直到晚饭前才再次出现。


      03

      我是莉扎。敲水桶的女孩突然对我说。

      我感到有些莫名其妙，直到我反应过来我在她面前站了多久，手里还拎着琴盒。

      鼓声已经停了下来，坐在地上的女孩抬头看着我。您想要一起吗？她问。

      什么？我耳边像是蒙了一层纱，什么都听不清，这让我很不安。

      我看到您带着琴盒在这跟前站了有一会了，所以我想……

      噢不，我不想。我连忙拒绝。

      好吧。莉扎好奇地朝我眨了眨眼，又埋下头敲起了她的鼓。

      真奇怪，我怎么会把琴带出来呢？

      音乐是靠不住的东西，这一点在我五年前第一次在比赛中拿到第一名的时候就知道了。

      我一路上都在看着那金光闪闪的奖杯，仿佛它是那颗引起纷争的金苹果。我迫切地想要向所有人展示它：看那系在杯耳上的飘带，还有修长优雅的杯身，还有最重要的，杯底用飘逸的花体刻着我的名字——真蠢。

      那天甚至没有人来看我的比赛，我是自己走路回家的，一直到晚饭的末尾妈妈才问起我的比赛结果。

      是第一名。我低头喝着奶油汤，下午时的欣喜已经变成了一阵恶心黏在我的软腭上。尽管如此，我还是偷偷屏住了呼吸用眼睛的余光去瞥父亲的反应。

      塞巴斯蒂安在我身边恭喜我，尽管他的手腕被打到勺子都不大拿得稳。遗憾的是，父亲并没有说什么，他只是发出一声意义不明的哼声，像是从来没有听到过我说的话。随即他问我奖金有多少。我愣住了，但还是磕磕绊绊地回答他这个比赛似乎没有设置奖金。

      但我有一个奖杯。我做贼似的补充道。

      我看见他的胡子抖动了两下，这就是这个话题的结束了。于是我便知道了什么才是重要的，而音乐从来都是靠不住的东西。就像那个廉价的镀金奖杯，这么多年过去，它已经开始发黑了。

      我看着敲水桶的莉扎，突然想起不久前和塞巴斯蒂安的一次对话。话题的起源已经记不清了，但那时他问我为什么那么在乎钱，我说因为钱是不会背叛我的东西。

      音乐也不会——他几乎是立刻这样说。我被他的话逗笑了，问他最近手腕还好吗？他没有正面回答我，只是说这不是一件事。

      他怎么还能说出这样的话？我脑海里不断地回放着那天他说话时的神情。他怎么能用那样的眼神、那样的语气说这种话呢？他怎么能仍然这样幼稚单纯？他怎么能不怨恨这一切？他怎么能仍然忠于这一切、在它们给他带来苦难之后呢？他怎么能这样？他怎么能？

      我怒火中烧，不知不觉间我好像听到了海鸟振翅的声音。我想象管家发现甲板上的鸟屎时的神情，与此同时它们黑色的翅尖在风的托举下直指烈日、胸部的绒羽因着气流的扰动而微微发颤、喉咙深处发出的啸叫和海水的轰鸣搅在一起。这样想着，我手下的动作越发张狂了起来——等下，我什么时候拿出了琴？

      我回过神来发现我正在毫无章法地拉着不知名的曲调，我和莉扎的周围已经站满了人。

      “你棒极了。”结束后，莉扎一边灵巧地和我分着路人投的钱一边说。

      “什么？”我悉数接过她递来的皱巴或锈蚀的散币，仔细地清点着。

      “你棒极了。”她重复说。在我感到心里升腾起一股陌生的满足感的同时，我注意到她少给了我一枚一元硬币。

      “哇哦，”她从装钱的铁盒里拎出来一枚抛到我手上，“真是令我刮目相看。我还以为像你这种有钱人家的小姐不那么会算账呢。”

      我笑了。有钱，这是我十几年来发现的待在这个家里唯一的好处。尽管吝啬的父亲从来不肯给我们过多的零花钱，但总有一天这钱会到我们手上的，不是吗？我检查过那枚硬币的真伪，合上琴盖，往游艇的方向走去。

      回见——我想我们还会再见面的吧？莉扎在我身后喊道。

      回见，伊莉扎维塔*。我转过身，朝她挥了挥手。

      不是伊莉扎维塔，就只是莉扎。

      好吧，那么回见，莉扎。

      -

      “好吧，我不想让你觉得我打算干涉你自己的生活，但是莉迪亚，你今天下午上哪儿去了？”晚上洗漱完后，塞巴斯蒂安在我房间里问我。

      我摸到自己藏在枕套里被零散的钱币塞得鼓鼓囊囊的钱包，答非所问地问：“有人注意到我的行动了吗？”尽管我知道这个问题有多荒谬。如果真的有人注意到了、或真的有人在意的话，我不会安然无恙地待到现在的，鉴于我所目睹的父亲对塞巴斯蒂安做过的那些事情。

      我的余光瞟到他正用一种混合了不满与羞愤的眼神死死地盯着我，真奇怪，那表情和他刚被父亲抽过手腕时一样。“我真高兴，”他走到房间门口，最后回过头看了我一眼，“你有了一个幸福的秘密。”

      “你知道，”我站起身来，感到热血上脑，“你可以来找我。”但那时他已经合上了我房间的门，我也明白这个苍白的提议的可行度不超过千分之一。

      我倒希望他能再问问我。

      我久久地凝视着那扇静默的木门，徒劳地想要抹平攥在手心里那张旧纸币上的皱痕。

      -

      *一般来说，莉扎是伊莉扎维塔的昵称

      04

      夏至的日子一天天逼近了。这也意味着我们马上就要离开了。

      这一段时间以来，我每天都在正午时跑去看在甲板上休憩的海鸥。那老管家有几次因为留在上面的绒絮和污迹而对所有人摆了一下午的脸色，而莉迪亚和我的午间秘密行动没有任何人察觉——尽管我认为莉迪亚做得一点都不隐蔽。但也许这就是不受家里人关注的好处吧。我不清楚她每天具体在做些什么，但我听到过街边传来的小提琴声，我从来没有听过那样的琴声，但我确信那就是莉迪亚的琴声。

      紧接着，我的身体朝着完全使我意想不到的方向发展去了。我的呼吸突然变得急促、一种我无法直视的情感在我体内横冲直撞——就在这个时候，大雨瓢泼而下。

      莉迪亚和她的小提琴该被淋惨了。我默默地看着雨点打在甲板上，察觉到正从心底幽幽攀起的幸灾乐祸。

      本来停在栏杆上的海鸥好像预料到这场大雨的到来，在闭上眼前就拖着步子把自己挪到了高大的遮蔽下，因此本来就在遮蔽下的我也离它们更近了。我放轻了呼吸，开始数它们安静的羽毛。

      我这才发现那些羽毛有多像弓毛，这让我开始想象莉迪亚淋湿了的小提琴的样子——软塌塌的弓毛几乎要被琴弦隔断了才擦出几点疲软的动静，从被泡得发胀了的木头撑得开裂了的漆里能闻到淡淡的朽味，锈蚀的琴弦和走得不成样子的音……莉迪亚全身也被淋湿了，湿透了的头发重重地坠在脑后，然后她在这副样子下拉出滑稽的曲调来逗我开心……

      这些都没有发生过，虽然我总是在下雨的时候幻想这样的画面。不过这种想象总是不知道该将结尾落在哪里，我想象不出莉迪亚被父亲打死的画面，尽管我知道结局一定会是这样。

      雨已经下了十分钟了，而我想象中莉迪亚狼狈跑回游艇的身影还是没有出现。也许她需要一把伞，也许她需要我去给她送一把伞。这样想着，我抓上手边的一把伞就往船下走。直到雨水几乎要刺穿伞面的声音将我的理智重新拉回大脑。

      也许比起莉迪亚和她的小提琴，我更应该担心父亲发现我擅自跑到船下会对我做什么。也许他早就发现莉迪亚这几天来“不体面”的举动了，而他什么都没做，这也许说明不管我先前在担心什么都不会发生。
      莉迪亚不会去拉淋湿了的小提琴，更不会把她自己和小提琴弄湿。

      我深吸一口气，下定某种决心般转过身往屋里走去，却在通往船舱的玻璃门前看见了眉毛压着眼睛的父亲和满脸忧愁的妈妈。

      “塞巴斯蒂安，”我站在雨中听见他叫我，却几乎没看见他唇上笔直的胡子有任何抖动，“你撑着伞是打算上哪儿去？”

      我承认我犹豫了一秒钟是否要告诉父亲有关莉迪亚的小秘密的事情，但那只是一秒钟，我觉得我还是可以在那天晚上向莉迪亚夸耀这件事情，并以此作为把柄让她为我做一些事。

      “我哪也没打算去，父亲。我只是想听一听雨的声音。”

      我走进遮雨棚下，在父亲挑剔的目光下仔细地收拾好雨伞和不断往下淌的雨水。他轻哼一声，罕见地没有对此再多说什么，扭头扔下一句“十五分钟后带着你的琴到琴房找我”便走回了室内。

      -

      那天下午的雨像是下了一整个夏天。

      起初一切都很正常，普通的乐理考察、普通的日常练习——直到我听见海鸥扑腾翅膀的声音。可是这没有道理，琴房装着厚厚的隔音棉，海鸥也不会在这样大的风雨天里起飞。但我就是听见一阵强得毫无道理的扇动声，在那阵声墙的最里面隐约传来莉迪亚和着敲击水桶声的琴音，紧接着我摁错了一根弦。

      那天晚上我给莉迪亚展示我手腕上崭新的伤口和它的来历。“在琴房里怎么可能听到外面的声音？”她皱起眉。我耸耸肩，不停地思索怎么编排语言才能最大化莉迪亚的愧疚感——让她为我做事。好吧，做不做事的大概也没那么重要，我只是想让她为我愧疚而已。

      但她没给我这个机会。“嘿，后天的极昼，你晚上没有安排的话来看看吧。”说着，她往我怀里扔了一枚脏兮兮的纪念币。

      “这是什么？”

      莉迪亚不耐烦地抱起胳膊：“别装得好像你不知道我这几天在忙什么一样。对着纪念币上的人像找到这个酒吧，晚上十二点开始，当然你也可以早点来看我们排练，或者干脆不来，随你的便。”说完她便扭头离开了，像是在忍耐地狱之火的灼烧一样急不可耐。我盯着那枚纪念币，努力用手帕擦掉覆盖在它表面的污渍，突然想起来我还没有问莉迪亚她的小提琴有没有被淋湿。


      05

      塞巴斯蒂安走下码头的那一刻便知道手中那枚纪念币是多余的了。他闭上眼，从花岗岩铺就的石板路传来的低沉鼓声震得他双脚发痒。他顺着燥热中氤氲着的琴声拐过五六个弯朝一个看起来黑漆漆的酒吧走去。

      他仔细比对着纪念币上边缘已经有些模糊了的人像和门头挂着的摇摇晃晃的招牌，倒不是因为他在确认这是不是正确的地址，他只是想找到一点证据来说服自己这不是他将要推开的门——尽管它是，这毋庸置疑，他已经听见了单薄的木门里传来的莉迪亚的笑声。

      人是怎么在第一次听见她这样笑的时候就知道这是她在笑的？如果他从来没见过这样的莉迪亚，那他是怎么知道这是“莉迪亚”的？莉迪亚是谁？塞巴斯蒂安是谁？

      乱糟糟的问题好像又无可救药地粗暴地跨进了哲学的沼泽，莉扎打开门时迎面撞上的就是这样的塞巴斯蒂安。她先是愣了一会，反应过来后欢快地吹了个口哨，扭头朝昏暗的屋子里喊道：“莉达，我想你弟弟在我们门口迷路了。”

      “他迷路了？这不可能，”房间深处传来莉迪亚的脚步声，过了一会她便出现在莉扎身后，“我相信这房子四处漏风的可怜墙壁不会拦得住我们的动静的。说真的，冬天时你们怎么办？”

      “冬天？那就等风雪把它全压垮了后再重新建一个。”莉扎大笑了几声，亲热地拍了拍摇摇欲坠的门框，朝还站在门外的塞巴斯蒂安招了招手把他往室内领。

      酒吧里面比他预想的要宽敞整洁一些，也许是因为时间还早，这里还没被买醉的人灌满。塞巴斯蒂安和莉迪亚跟在莉扎后面，他们正要绕到后门的小储藏室去，那里是女孩们的排练场所。

      “你从来不让别人叫你‘莉达’。”他斜着眼睛看不知为何动作有些僵硬的莉迪亚，努力不让这句话听起来和他心里所感受到的一样别扭。

      “她叫莉扎，至少莉达和莉扎听起来很相配，不是吗？”不管莉迪亚说这话时看起来有多心不在焉，她是认真的。

      “好吧，那你们是怎么认识的？”

      “她在大街上敲鼓，我听见了，就是这样。”莉迪亚耸了耸肩，看着显然还有话要说的塞巴斯蒂安和他一起停在了排练室门口，而塞巴斯蒂安却只是带着一种莫名的情绪盯着地板。“塞巴斯蒂安，”莉迪亚有些疲惫地叹了口气，“如果我前天的语气让你觉得我在逼你过来的话，我很抱歉。”

      “什么？不，莉迪亚，我很高兴你邀请了我——”

      “坦诚得让我惊讶，”莉迪亚翘起一边嘴角习惯性地嘲讽道，“不管怎样，我得去排练了，不过你想去哪都可以，在这儿随便逛逛，或者回游艇上去，或者，去屋里看我们排练——但我向你保证这会很无聊。”
      他便在那扇门外等了一个多小时，也因此听见了门内的那场对话。

      “如果你不想他来，”在几声心烦意乱的琴声之后，他听见里面传来这样的声音，“你为什么要邀请他呢，莉达？”那个叫莉扎的女孩说，塞巴斯蒂安很难不在心里默默评判她的无礼——难道她不知道谈论别人的家事是冒犯的吗？

      “我当然想要他来，”莉迪亚又发泄般的拉了两下，随后木板轻触桌面的声音响起，塞巴斯蒂安想象莉迪亚将她的琴放了下来，“只是我太久没在他面前拉过琴了。我甚至已经很久没这样练过琴了。”

      他背靠着薄薄的门板，感到一种莫名的满足感和快感，这种来得太过于病态以至于他为此感到愧疚的情感直到他在稀松的人群中看见舞台上的莉迪亚时才彻底消失。

      不论在排练时莉迪亚对她的琴声有多不满，她不会将这样的演奏带上舞台——即便这个所谓的舞台只是几个简陋的木箱加起来的台子。即便她并不喜欢音乐，她也不能否定古斯塔夫和这个家给她带来的教导已经根深蒂固。从她高抬起下巴将提琴架到肩上的那一刻开始，塞巴斯蒂安便感到身体里流过了一股奇异的细流，将他遥遥和莉迪亚连接在了一起，尽管他从来没有来过这样的地方，他却觉得这一刻如此熟悉，就像他最喜欢的那条毛毯。而他相信莉迪亚和他有一样的感受。

      随着鼓槌有节奏的敲动，莉迪亚也拉动琴弓，在低斜的浅金色阳光下，琴弦上她轻快地跳动着的手指和随着韵律摆动的肩肘像活泼的海鸟是不是抖擞的羽毛。他入神地看着她，暗自祈祷这段乐章永远不会结束。

      -

      “也许我希望这一切不会结束。”太阳带着它从不收敛的光和热笨重地绕着这片土地转过了一圈，简陋的演奏会结束时，莉迪亚很快地收拾好她的琴盒，头也不回地径直朝码头的方向走去。快步跟在她身后的塞巴斯蒂安听见她这样低声说。

      “莉迪亚。”他突然说——整整一个晚上他都不肯叫她莉达，就像不管他的名字有多拗口也从来没有人叫他“塞巴斯”一样。

      他埋着头落在她身后一点，莉迪亚回过头去，便看见白金色的阳光洒在他头顶有些被汗湿了的金发上，有些像晴朗的天空下海面的波光。“什么？”她站定，一动不动地看着他，语气里有些她自己也没发现的隐隐的期待。

      “没什么，我只是想说，”塞巴斯蒂安轻快地吐出口气，顺着胸部的动作抬起头来，“你刚刚棒极了。”

      莉迪亚似乎被那句话吓住了，塞巴斯蒂安看见她原本半睁的眼睛突然回过神一样猛然间睁大。在他还在仔细分辨那眼神中究竟有没有欣喜的时候，她便不管不顾地转过身，加快了走向游艇的脚步。

      等他们来到码头上时，太阳已经沉沉升到与游艇同高的位置了，浓橘色的阳光径直打在钢筋造的游艇背部，反射出的光线晃得两人一时间睁不开眼睛。但在那之前，塞巴斯蒂安已经先莉迪亚一步见到了古斯塔夫雕塑一般矗立在舷梯口前的身影。尽管这在他的意料之内，他还是不由自主地提起了一口气，手腕上还没完全愈合的伤口还在隐隐发痛。

      “莉迪亚，莉达。”不知怎的，他低声叫住机械地不断往前走的莉迪亚，对方却像听不见一样没有任何反应。他上前一步拉住莉迪亚提在手里的琴盒，她转过身来，冰蓝色的眼睛出离的平静，仿佛几分钟前在酒馆里随性演奏的是另一个人。她用这样的眼神无声地问塞巴斯蒂安“怎么了”。

      塞巴斯蒂安半张开嘴，踌躇着用舌头不断地顶着牙尖。当他意识到自己为什么要在这时叫住莉迪亚时，连他自己也有些被接下来打算要说的话吓到了，他想说“我们一起逃吧”，如果莉迪亚问他“我们要逃到哪里去？”，他就说“跟着迁徙的鸟一起逃，它们会喜欢我们的音乐”。

      但他没有这个机会了。莉迪亚张开嘴又合上，最后喃喃着吐出一句“不要叫我莉达”，然后他眼前的便又成了往日那个傲慢尖刻的莉迪亚，向这样的莉迪亚提出离家出走的邀请显然是不合时宜的。

      然后古斯塔夫踩着缓慢但绝不含糊的步子走下舷梯，出现在他们面前，塞巴斯蒂安注意到他手中握着那把熟悉的戒尺。他用力干咳了两声，用不容置喙的语气说：“看来你们都忘了礼节了，是吗？”

      “是的父亲。”莉迪亚飞快地将一缕碎发别到耳朵后，低下头来用有些发颤的声音说。塞巴斯蒂安也微微低下头去，他悄悄挑起上目线，看见他的父亲嘴角露出了一抹满意的笑。然后那把戒尺承着不断往上攀的太阳发出的光被古斯塔夫高高举了起来——与此同时，他的视线与莉迪亚的相遇了，她的肩膀松懈下来，像是了却了一件折磨她许久的怨事，但她看向他的眼神却依然空洞。

      半刻后清脆的抽打声响起，满街的海鸥受惊而飞向天际。
