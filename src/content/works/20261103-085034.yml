title: 交谊舞
author: /
cp:
  - 伞霙
updated: 2025-10-07
chapters:
  - body: |-
      “啊——”
      “啊，海绵……”
      “买错了吗？”
      “啊，买错了呢。”
      “老师上节课明明说了尺寸的吧？说要有20cm长的那种海绵啦。”
      “哎？但是我记得老师也说了是家里用的百洁布那种啊？”
      “老师只是说和那个材质一样啦，没有说尺寸也要一样啊。”
      “哎？那怎么办……”

      铠冢霙抬头望向那个熟悉的声音的源头，伞木希美正和她周围的一圈女孩们大声说笑着。注意到来自角落里的视线，伞木希美堪堪从人群的缝隙中歪出一点眼神，回望过去。
      但是这对视并没有持续很久。伞木的目光像学校里的流浪猫一样，在铠冢身上蹭了一圈便看着颇为清高地打着转离去了，只留下铠冢仍然朝那个方向凝视着。
      距离上体育课还有一段时间，铠冢调整了一下坐姿，把脸埋进手臂里，想起学期初刚走进这个教室时的情景。

      具体是怎么被分到上交谊舞课程的她已经没什么印象了，只记得一开始她是想像之前一样跟着夏纪去球类课的。不过对她来说也没什么太大的区别就是了，只是——
      “霙。”希美的脸少见地出现在除了社团活动室之外的地方，让她愣在了原地。“罪魁祸首”却仍语气轻快地喋喋不休着：“原来霙这学期体育课报了交谊舞啊。夏纪呢？你们两个没有在一起吗？”
      铠冢被她的脚步带领着，不知不觉就走进了舞蹈教室的中心，期间只有余力用点头和小声的“嗯”来回应希美连珠炮似的提问。
      她感觉自己正跟着现身而不自知的精灵，昏昏乎乎地跳着不知名的舞步走进了仙境。
      或者她是自知的吗？她对身后默默地跟随着自己的女孩知道多少呢？
      她感觉自己的大脑被分成了两半，一半止不住地想着那两个问题，另一半则彻底瘫痪。所以当身边的人突然停下脚步和雀跃的说话声时，她一下没反应过来，撞上了从希美高高绑起的马尾辫上垂下的发尾。
      “希美？发生什么事了吗？”她探过头去，想看清面前正低着头的人的表情。
      她没有抬头，脸侧的刘海让身边的人看不到她此时的神情。
      “霙你找到舞伴了吗？”
      铠冢霙摇摇头。
      “如果没有的话，不如做我的partner吧。”希美抬起头，笑着问她。

      “霙，”铠冢从臂弯中抬起头，意料之中地看见刚才记忆中微笑着做出邀请的人站在她面前，“刚刚打上课铃了哦，老师叫大家去集合了。”
      铠冢点点头，跟上前去。
      “啊对了，”身前的人突然转过身来，有些抱歉地说，“那个，真的对不起，那个海绵，我好像买错了。”
      “没关系。”
      “说的也是呢，毕竟老师也没说清楚海绵是用来干什么的，没准尺寸不影响使用呢，是吧？”
      铠冢先是点了点头，继而注意到伞木已经转过身继续向前走了，于是她加紧两步跟上前去，囫囵出一个模糊的鼻音作为应答。

      “我说啊……”教室里爆发出一阵笑声，体育老师面露无奈地缓缓说，“我上节课是有说过海绵块的尺寸的吧……”
      铠冢抬起头，伞木希美站在她前面，背在身后的手里攥着那块巴掌大的百洁布。她的视线缓缓往上移，从手腕到胳膊肘，再到肩胛骨，肩胛骨再往上是悉悉簌簌的发尾。
      她是刚剪了头发吗？铠冢记得之前马尾辫的发尾是差不多和肩颈齐高的，有时她走路的幅度太大了还会让那些发丝随着身体的摆动悉数垂进有些松垮的后衣领中。
      此刻希美的发丝也在摆动着，还有她的脖颈、肩膀、手臂……也许是老师又讲了什么有意思的话，逗得大家都笑成一团。希美的笑声和周围的各种笑声混在一起，落到铠冢耳边时却又像晴朗的夜晚里的月亮一样清明。
      铠冢想起上节课结束后中川夏纪问她感觉怎样。她不知道该怎么回答，绕在指尖上的头发紧几圈又松几圈，想了半天才憋出一句“希美也在”。这不是一个答其所问的回答，铠冢也明白，但除了伞木希美，其他的一切都只是普通。所以除了希美，她也不知道还能说些什么。

      “好了，单独练习时间结束！”体育老师拍了拍手，说，“现在，站在第一排跳女步的同学们向后转，面向你们的舞伴。”
      “拿好你们的海绵，摆好架势。然后，把海绵放到你们身体之间的缝隙里夹好。”
      伞木转过身，举起那块巴掌大小的百洁布海绵，露出一个无奈又有点不好意思的笑，说：“这节课先凑合用用吧。真的很抱歉啊，让霙和我一起辛苦。”
      铠冢摇摇头，接过伞木手中的海绵，把它轻贴在自己的腰腹上，抬头看向面前仍愣在原地的人。伞木像才回过神来一样，忙向前走了两步，从另一面轻轻贴上那块海绵，然后牵着铠冢的手举到空中，按照老师教的动作摆好架势。
      “总感觉……”伞木的话语和鼻息尽数落在铠冢的肩上，铠冢偏了偏头，等着她的后半句话，老师数拍子的声音和音乐声却在这时不合时宜地响了起来，淹没了她未出口的那半句话。

      铠冢觉得交谊舞是一个有意思的活动。她习惯了平时用眼神占据希美的种种，可当她的舞伴是希美时，她的视线里却不再有她了。取而代之的是她剩余的全部的感官——希美发丝上的味道，希美呼出的气息，希美搭在她臂膀上的手……希美。她好像张开了全身的羽翼，用每一寸肌肤如饥似渴地感受着伞木希美，就像长久走在黑夜里的人遇见一束月光一样，恨不得把全身都剖开，让每一寸肌理都沐浴在月光下。
      铠冢深吸一口气，再轻轻地把气吐出。即便如此，她还是察觉到希美脖颈处的几缕碎发正被那阵气息拂动。她时常很欣喜能够捕捉到这些希美身上正在诞生的细小变化的时刻——比如因害怕舞步出错而有些僵硬的指尖，和捡起掉落的海绵块后变得有些凌乱的衣服下摆……
      她沉浸于此，连音乐是什么时候结束的、自由练习时间是什么时候开始的都没意识到。
      伞木后退一步，扭头环视了一圈，若有所思地说：“不知道为什么，我们跳完总是在教室前面呢。明明按道理来说应该是在原地才对。”
      “是我向前走的步子太大了吗？抱歉，我总是担心夹不住……”
      “没有啦，与其说是霙的问题，不如说，是我的问题才对，是我向前的时候步子不够大，”伞木一边低头把玩手里的海绵一边说，“啊说起来，关于这种海绵……”
      说着，她拿起那块海绵，用较为粗糙的绿色面和衣服摩擦，然后松手——
      “看，这样它就能自己吸在衣服上了，很厉害吧？这样我们就不用那么紧张地贴在一起了。其实这个小海绵还是有点好处的吧。”伞木露出有些得意的神情，看着衣服上的海绵左转转又右转转。
      “我说啊，希美你们那样根本不行吧？很容易就掉下来了啊。”旁边的同学见状，和她互呛打闹起来。
      铠冢就近选了个方便的空地坐下，仰头撑着脸，重新让伞木希美占据她的所有视线。这时她才注意到自己的左手*手心附上了一层薄薄的水渍。她抬起干燥的右手，用食指的指腹一遍遍地、漫无目的地在左手手心上划着圈，像在黑夜里缓缓搅动街道上浅浅的水坑。等到下课铃响起的时候，左手上的那一点汗早已干了，铠冢回过神来，发现自己正在写“の”*。

      从体育教室走回班级的走廊上，伞木毫无征兆地顿住脚跟，停下，转身说：“霙，下次上体育课我会带上正确的海绵的。”
      总感觉，这样还是太近了吧。
      铠冢盯着面前突然郑重转身的人，点了点头，“嗯”了一声作为应答，安静地目送她转身走进班里。

      如果是正确的海绵的话，想要夹住，两个人就必须紧紧地贴在一起了吧？


      *交谊舞中，跳男步的舞者左手握跳女步的舞者的右手
      *“希美”的假名写法为 のぞみ
